      "source": "«But I hope you will get over it, and live to see many young men of four thousand a year come into the neighbourhood». «It will be no use to us, if twenty such should come, since you will not visit them». «Depend upon it, my dear, that when there are twenty, I will visit them all». Mr. Bennet was so odd a mixture of quick parts, sarcastic humour, reserve, and caprice, that the experience of three and twenty years had been insufficient to make his wife understand his character. Her mind was less difficult to develope. She was a woman of mean understanding, little information, and uncertain temper. When she was discontented she fancied herself nervous. The business of her life was to get her daughters married; its solace was visiting and news.",

let index=0,frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=id=>document.getElementById(id);
function draw(){const p=book.panels[index];el('count').textContent=`${index+1} / ${book.panels.length}`;el('title').textContent=p.title;el('progress').value=index+1;el('prev').disabled=index===0;el('next').disabled=index===book.panels.length-1;el('prompt').textContent=p.prompt;el('ascii').textContent=p.frames[0];el('ascii').setAttribute('aria-label',p.title+' — ASCII scene');el('script').replaceChildren();for(const t of p.scored.split(/(\$\$.*?\$\$|\[[^\]]*\])/g)){const s=document.createElement('span');s.textContent=t;if(t.startsWith('$$')||t.startsWith('['))s.className='cue';el('script').append(s)}el('sketch').hidden=true;el('placeholder').hidden=false;el('sketch').alt='Sketch for '+p.title;el('sketch').src=`panel${String(p.id).padStart(2,'0')}.jpg`;frame=0}
el('sketch').onload=()=>{el('sketch').hidden=false;el('placeholder').hidden=true};el('sketch').onerror=()=>{el('sketch').hidden=true;el('placeholder').hidden=false};
el('prev').onclick=()=>{if(index>0){index--;draw()}};el('next').onclick=()=>{if(index<book.panels.length-1){index++;draw()}};
function motion(){el('motion').textContent=playing?'Pause Motion':'Play Motion';el('motion').setAttribute('aria-pressed',String(playing))}el('motion').onclick=()=>{playing=!playing;motion()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('prev').click()});
setInterval(()=>{if(playing){const p=book.panels[index];frame=(frame+1)%p.frames.length;el('ascii').textContent=p.frames[frame]}},200);el('note').textContent=book.source_note;draw();motion();
</script></body></html>
