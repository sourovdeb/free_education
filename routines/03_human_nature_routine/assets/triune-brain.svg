<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="0" y="0" width="420" height="300" fill="#f5f0fa"/>

  <ellipse cx="210" cy="160" rx="150" ry="120" fill="#d7c6f0" stroke="#1b1b1b" stroke-width="3"/>
  <text x="210" y="55" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">NEOCORTEX</text>
  <text x="210" y="70" font-size="10.5" text-anchor="middle" fill="#333">reasoning, language, planning</text>
  <text x="210" y="83" font-size="10.5" text-anchor="middle" fill="#333">(the newest tenant — a few 100,000 yrs)</text>

  <ellipse cx="210" cy="175" rx="105" ry="82" fill="#f0a8b4" stroke="#1b1b1b" stroke-width="3"/>
  <text x="210" y="120" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">LIMBIC (mammal) BRAIN</text>
  <text x="210" y="134" font-size="10.5" text-anchor="middle" fill="#333">emotion, bonding, memory, fear</text>

  <ellipse cx="210" cy="195" rx="55" ry="42" fill="#f3d67e" stroke="#1b1b1b" stroke-width="3"/>
  <text x="210" y="192" font-size="12.5" text-anchor="middle" fill="#1b1b1b" font-weight="bold">REPTILIAN CORE</text>
  <text x="210" y="206" font-size="10" text-anchor="middle" fill="#333">survival: fight, flight, freeze, feed</text>

  <text x="210" y="285" font-size="11.5" text-anchor="middle" fill="#555" font-style="italic">Three brains stacked, oldest still running — the newest doesn't always win the argument</text>
</svg>
