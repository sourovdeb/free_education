<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="0" y="0" width="420" height="320" fill="#eaf6fb"/>
  <rect x="0" y="150" width="420" height="170" fill="#bfe3f0"/>
  <line x1="0" y1="150" x2="420" y2="150" stroke="#3a6ea5" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="10" y="140" font-size="13" fill="#3a6ea5">waterline</text>

  <!-- tip of iceberg -->
  <polygon points="210,40 165,150 255,150" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="210" y="100" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">CONSCIOUS</text>
  <text x="210" y="120" font-size="11" text-anchor="middle" fill="#333">what you notice</text>
  <text x="210" y="135" font-size="11" text-anchor="middle" fill="#333">right now</text>

  <!-- underwater mass -->
  <polygon points="165,150 255,150 340,300 80,300" fill="#dff0f7" stroke="#1b1b1b" stroke-width="3"/>
  <text x="210" y="200" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PRECONSCIOUS</text>
  <text x="210" y="216" font-size="11" text-anchor="middle" fill="#333">things you could recall</text>
  <text x="210" y="255" font-size="14" text-anchor="middle" fill="#1b1b1b" font-weight="bold">UNCONSCIOUS</text>
  <text x="210" y="271" font-size="11" text-anchor="middle" fill="#333">drives, old wounds, defenses,</text>
  <text x="210" y="286" font-size="11" text-anchor="middle" fill="#333">the stuff steering you anyway</text>

  <text x="210" y="315" font-size="12" text-anchor="middle" fill="#555" font-style="italic">Freud's iceberg — most of "you" is under the surface</text>
</svg>
