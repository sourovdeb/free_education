    <circle cx="330" cy="95" r="4"/><circle cx="350" cy="95" r="4"/><circle cx="370" cy="95" r="4"/><circle cx="390" cy="95" r="4"/><circle cx="410" cy="95" r="4"/><circle cx="430" cy="95" r="4"/>
    <circle cx="330" cy="115" r="4"/><circle cx="350" cy="115" r="4"/><circle cx="370" cy="115" r="4"/><circle cx="390" cy="115" r="4"/><circle cx="410" cy="115" r="4"/><circle cx="430" cy="115" r="4"/>
