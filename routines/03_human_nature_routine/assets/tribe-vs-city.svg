    <circle cx="330" cy="175" r="4"/><circle cx="350" cy="175" r="4"/><circle cx="370" cy="175" r="4"/><circle cx="390" cy="175" r="4"/><circle cx="410" cy="175" r="4"/><circle cx="430" cy="175" r="4"/>
