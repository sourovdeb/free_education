  <rect x="0" y="0" width="460" height="260" fill="#fdf3f0"/>

  <!-- left: tribe circle -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#c0745a" stroke-width="2" stroke-dasharray="4,3"/>
  <g fill="#c0745a">
    <circle cx="120" cy="45" r="7"/><circle cx="160" cy="55" r="7"/><circle cx="190" cy="80" r="7"/>
