<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="0" y="0" width="420" height="260" fill="#fff8ec"/>

  <!-- shadow figure behind -->
  <ellipse cx="230" cy="140" rx="70" ry="95" fill="#2b2b2b" opacity="0.85"/>
  <text x="230" y="240" font-size="13" text-anchor="middle" fill="#2b2b2b" font-weight="bold">SHADOW</text>
  <text x="230" y="255" font-size="10.5" text-anchor="middle" fill="#555">the parts you deny owning</text>

  <!-- persona figure (mask) in front -->
  <circle cx="180" cy="90" r="34" fill="#ffe9b3" stroke="#1b1b1b" stroke-width="3"/>
  <circle cx="168" cy="85" r="4" fill="#1b1b1b"/>
  <circle cx="192" cy="85" r="4" fill="#1b1b1b"/>
  <path d="M165 102 Q180 112 195 102" stroke="#1b1b1b" stroke-width="2.5" fill="none"/>
  <rect x="145" y="120" width="70" height="90" rx="18" fill="#ffe9b3" stroke="#1b1b1b" stroke-width="3"/>
  <text x="180" y="20" font-size="13" text-anchor="middle" fill="#1b1b1b" font-weight="bold">PERSONA</text>
  <text x="180" y="36" font-size="10.5" text-anchor="middle" fill="#555">the mask you show the world</text>

  <text x="90" y="252" font-size="11.5" fill="#555" font-style="italic">Jung: the brighter your mask, the darker the shadow it casts</text>
</svg>
