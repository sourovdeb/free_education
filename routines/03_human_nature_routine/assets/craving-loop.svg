<svg viewBox="0 0 420 340" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, sans-serif">
  <rect x="0" y="0" width="420" height="340" fill="#eafaf1"/>

  <circle cx="120" cy="90" r="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="120" y="85" font-size="12.5" text-anchor="middle" font-weight="bold">WANT</text>
  <text x="120" y="100" font-size="10" text-anchor="middle">"I need that"</text>

  <circle cx="300" cy="90" r="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="300" y="85" font-size="12.5" text-anchor="middle" font-weight="bold">GET</text>
  <text x="300" y="100" font-size="10" text-anchor="middle">chase &amp; obtain</text>

  <circle cx="300" cy="240" r="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="300" y="230" font-size="12.5" text-anchor="middle" font-weight="bold">BRIEF</text>
  <text x="300" y="245" font-size="12.5" text-anchor="middle" font-weight="bold">RELIEF</text>
  <text x="300" y="260" font-size="10" text-anchor="middle">the high fades fast</text>

  <circle cx="120" cy="240" r="50" fill="#ffffff" stroke="#1b1b1b" stroke-width="3"/>
  <text x="120" y="235" font-size="12.5" text-anchor="middle" font-weight="bold">WANT</text>
  <text x="120" y="250" font-size="12.5" text-anchor="middle" font-weight="bold">AGAIN</text>

  <path d="M170 90 L250 90" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M300 140 L300 190" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M250 240 L170 240" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M120 190 L120 140" stroke="#1b1b1b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1b1b1b"/>
    </marker>
  </defs>

  <text x="210" y="315" font-size="12" text-anchor="middle" fill="#555" font-style="italic">Buddha's tanha (craving) loop — the itch that scratching never quite ends</text>
</svg>
