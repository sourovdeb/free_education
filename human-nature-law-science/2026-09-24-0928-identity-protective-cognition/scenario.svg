<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="1600" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <text x="80" y="95" font-size="48" font-weight="700">Concrete Scenario</text>
    <text x="80" y="145" font-size="28">A fictional homicide inquiry</text>

    <rect x="250" y="220" width="700" height="120" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
    <text x="600" y="270" text-anchor="middle" font-size="30" font-weight="700">Early suspect emerges</text>
    <text x="600" y="310" text-anchor="middle" font-size="24">The team forms a theory</text>

    <line x1="600" y1="340" x2="600" y2="430" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="250" y="450" width="700" height="120" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="600" y="500" text-anchor="middle" font-size="30" font-weight="700">The theory gains status</text>
    <text x="600" y="540" text-anchor="middle" font-size="24">Agreement signals team alignment</text>

    <line x1="600" y1="570" x2="600" y2="650" stroke="#111" stroke-width="4"/>
    <line x1="600" y1="650" x2="320" y2="650" stroke="#111" stroke-width="4"/>
    <line x1="600" y1="650" x2="880" y2="650" stroke="#111" stroke-width="4"/>
    <line x1="320" y1="650" x2="320" y2="710" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="880" y1="650" x2="880" y2="710" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="80" y="730" width="480" height="170" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
    <text x="320" y="780" text-anchor="middle" font-size="29" font-weight="700">Supportive clue</text>
    <text x="320" y="825" text-anchor="middle" font-size="24">It fits the theory</text>
    <text x="320" y="860" text-anchor="middle" font-size="24">It spreads quickly</text>

    <rect x="640" y="730" width="480" height="170" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="880" y="780" text-anchor="middle" font-size="29" font-weight="700">Contrary clue</text>
    <text x="880" y="825" text-anchor="middle" font-size="24">It challenges the theory</text>
    <text x="880" y="860" text-anchor="middle" font-size="24">It feels disruptive</text>

    <line x1="320" y1="900" x2="320" y2="1010" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="880" y1="900" x2="880" y2="1010" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="80" y="1030" width="480" height="220" fill="#111" stroke="#111" stroke-width="3"/>
    <text x="320" y="1085" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">Identity loop</text>
    <text x="320" y="1130" text-anchor="middle" font-size="24" fill="#fff">Support gets amplified</text>
    <text x="320" y="1170" text-anchor="middle" font-size="24" fill="#fff">Dissent gets discounted</text>
    <text x="320" y="1210" text-anchor="middle" font-size="24" fill="#fff">Confidence rises</text>

    <rect x="640" y="1030" width="480" height="220" fill="#f4f4f4" stroke="#111" stroke-width="3"/>
    <text x="880" y="1085" text-anchor="middle" font-size="29" font-weight="700">Safeguard loop</text>
    <text x="880" y="1130" text-anchor="middle" font-size="24">Log contrary evidence</text>
    <text x="880" y="1170" text-anchor="middle" font-size="24">Assign independent review</text>
    <text x="880" y="1210" text-anchor="middle" font-size="24">Retest the hypothesis</text>

    <line x1="320" y1="1250" x2="320" y2="1360" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="880" y1="1250" x2="880" y2="1360" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="80" y="1380" width="480" height="110" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="320" y="1425" text-anchor="middle" font-size="28" font-weight="700">Risk</text>
    <text x="320" y="1465" text-anchor="middle" font-size="24">Case theory hardens</text>

    <rect x="640" y="1380" width="480" height="110" fill="#fff" stroke="#111" stroke-width="3"/>
    <text x="880" y="1425" text-anchor="middle" font-size="28" font-weight="700">Better path</text>
    <text x="880" y="1465" text-anchor="middle" font-size="24">Evidence can redirect</text>

    <text x="80" y="1550" font-size="23" font-weight="700">Identity conflict never proves guilt.</text>
    <text x="680" y="1550" font-size="23">Independent evidence must decide.</text>
  </g>
</svg>