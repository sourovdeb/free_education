<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Mechanism flow for pluralistic ignorance</title><desc id="desc">A four-stage loop shows private doubt, public compliance, misreading others, and self-censorship, returning to private doubt.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="10" dy="12" stdDeviation="6" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1d1a17"/></marker></defs>
<rect width="1280" height="720" fill="#c9b991"/>
<rect x="30" y="30" width="1220" height="660" rx="4" fill="#e8dfc8" stroke="#1d1a17" stroke-width="3" filter="url(#shadow)"/>
<text x="70" y="88" font-family="monospace" font-size="34" font-weight="700">MECHANISM FLOW</text>
<text x="70" y="120" font-family="monospace" font-size="18">Pluralistic ignorance</text>
<g font-family="monospace" font-size="20" text-anchor="middle">
<g filter="url(#shadow)"><rect x="80" y="210" width="220" height="120" fill="#f4ecd6" stroke="#111"/><text x="190" y="255">PRIVATE DOUBT</text><text x="190" y="290" font-size="16">“I dislike this.”</text></g>
<g filter="url(#shadow)"><rect x="380" y="210" width="220" height="120" fill="#ded2b5" stroke="#111"/><text x="490" y="255">PUBLIC COMPLIANCE</text><text x="490" y="290" font-size="16">“I stay quiet.”</text></g>
<g filter="url(#shadow)"><rect x="680" y="210" width="220" height="120" fill="#f4ecd6" stroke="#111"/><text x="790" y="255">MISREAD OTHERS</text><text x="790" y="290" font-size="16">“They approve.”</text></g>
<g filter="url(#shadow)"><rect x="980" y="210" width="220" height="120" fill="#ded2b5" stroke="#111"/><text x="1090" y="255">SELF-CENSOR</text><text x="1090" y="290" font-size="16">“I am alone.”</text></g>
</g>
<g stroke="#1d1a17" stroke-width="5" marker-end="url(#arrow)"><line x1="300" y1="270" x2="370" y2="270"/><line x1="600" y1="270" x2="670" y2="270"/><line x1="900" y1="270" x2="970" y2="270"/></g>
<path d="M1090 340 C1090 520 190 520 190 340" fill="none" stroke="#8a1818" stroke-width="7" marker-end="url(#arrow)"/>
<text x="640" y="565" text-anchor="middle" font-family="monospace" font-size="24" fill="#8a1818">THE LOOP REINFORCES ITSELF</text>
<rect x="930" y="610" width="220" height="34" fill="#111"/><text x="1040" y="635" text-anchor="middle" font-family="monospace" font-size="18" fill="#e8dfc8">CONSENSUS: REDACTED</text>
</svg>