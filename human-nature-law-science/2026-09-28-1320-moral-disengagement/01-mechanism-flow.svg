<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Moral disengagement mechanism flow</title><desc id="d">Flow from moral tension through reframing and reduced self-sanction to action and normalization.</desc><rect width="1200" height="800" fill="#d7cfb8"/><text x="60" y="70" font-family="monospace" font-size="36" font-weight="bold">MECHANISM FLOW</text><g font-family="monospace" text-anchor="middle"><g fill="#f2eddc" stroke="#111" stroke-width="3"><rect x="70" y="190" width="190" height="150"/><rect x="310" y="150" width="230" height="230"/><rect x="590" y="190" width="210" height="150"/><rect x="850" y="190" width="150" height="150"/></g><g font-size="23"><text x="165" y="245">MORAL TENSION</text><text x="425" y="205">REFRAMING</text><text x="695" y="245">SELF-SANCTION</text><text x="695" y="280">WEAKENS</text><text x="925" y="260">ACTION</text></g></g><text x="600" y="680" font-family="monospace" font-size="22" text-anchor="middle">Influence changes probability. Agency remains.</text></svg>