<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">Law versus science comparison</title><desc id="d">Law asks responsibility. Science asks influence. Both can coexist.</desc><rect width="1200" height="800" fill="#d7cfb8"/><text x="600" y="70" font-family="monospace" font-size="36" text-anchor="middle" font-weight="bold">LAW ↔ SCIENCE</text><rect x="70" y="140" width="430" height="500" fill="#f3eedf" stroke="#111" stroke-width="3"/><rect x="700" y="140" width="430" height="500" fill="#eee7d2" stroke="#111" stroke-width="3"/><text x="285" y="205" font-family="monospace" font-size="32" text-anchor="middle">LAW</text><text x="915" y="205" font-family="monospace" font-size="32" text-anchor="middle">SCIENCE</text><text x="120" y="270" font-family="monospace" font-size="25">Was conduct voluntary?</text><text x="120" y="325" font-family="monospace" font-size="25">Was intent present?</text><text x="120" y="380" font-family="monospace" font-size="25">Was knowledge present?</text><text x="120" y="435" font-family="monospace" font-size="25">Was choice possible?</text><text x="750" y="270" font-family="monospace" font-size="25">What changed salience?</text><text x="750" y="325" font-family="monospace" font-size="25">Who framed the act?</text><text x="750" y="380" font-family="monospace" font-size="25">Was agency diffused?</text><text x="750" y="435" font-family="monospace" font-size="25">Were harms minimized?</text><rect x="420" y="560" width="360" height="150" fill="#faf6e9" stroke="#8d1b1b" stroke-width="5"/><text x="600" y="615" font-family="monospace" font-size="28" text-anchor="middle">BOTH CAN BE TRUE</text><text x="600" y="655" font-family="monospace" font-size="23" text-anchor="middle">Context influences choice.</text><text x="600" y="690" font-family="monospace" font-size="23" text-anchor="middle">Agency still matters.</text></svg>