<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Investigation scenario timeline</title>
<desc id="desc">A hypothetical homicide investigation showing how an early suspect theory can become the default, then gain unwarranted legitimacy unless independent review resets the inquiry.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
  </marker>
</defs>
<rect width="1200" height="820" fill="#fff"/>
<text x="60" y="70" font-family="Arial" font-size="36" font-weight="700">CONCRETE SCENARIO</text>
<text x="60" y="110" font-family="Arial" font-size="20">Hypothetical homicide inquiry.</text>

<line x1="120" y1="360" x2="1080" y2="360" stroke="#111" stroke-width="4"/>

<circle cx="150" cy="360" r="14" fill="#111"/>
<rect x="70" y="180" width="190" height="120" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="165" y="220" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">First suspect</text>
<text x="165" y="255" text-anchor="middle" font-family="Arial" font-size="18">Early evidence points.</text>

<circle cx="380" cy="360" r="14" fill="#111"/>
<rect x="285" y="420" width="190" height="120" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="380" y="460" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Theory repeats</text>
<text x="380" y="495" text-anchor="middle" font-family="Arial" font-size="18">Meetings reinforce it.</text>

<circle cx="610" cy="360" r="14" fill="#111"/>
<rect x="515" y="180" width="190" height="120" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="610" y="220" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Default forms</text>
<text x="610" y="255" text-anchor="middle" font-family="Arial" font-size="18">It feels established.</text>

<circle cx="840" cy="360" r="14" fill="#111"/>
<rect x="745" y="420" width="190" height="120" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="840" y="460" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Conflict arrives</text>
<text x="840" y="495" text-anchor="middle" font-family="Arial" font-size="18">New evidence disagrees.</text>

<circle cx="1050" cy="360" r="14" fill="#111"/>
<rect x="955" y="180" width="190" height="120" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="1050" y="220" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Independent review</text>
<text x="1050" y="255" text-anchor="middle" font-family="Arial" font-size="18">Reset both hypotheses.</text>

<line x1="260" y1="300" x2="350" y2="345" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="475" y1="440" x2="580" y2="375" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="705" y1="300" x2="810" y2="345" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="935" y1="440" x2="1020" y2="375" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="240" y="650" width="720" height="90" fill="#f4f4f4" stroke="#111" stroke-width="2"/>
<text x="600" y="687" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700">Documented risk: tunnel vision.</text>
<text x="600" y="720" text-anchor="middle" font-family="Arial" font-size="18">Status moralization remains inferential.</text>
</svg>