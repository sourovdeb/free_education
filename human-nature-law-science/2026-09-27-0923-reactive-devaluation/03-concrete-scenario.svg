<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#fff"/>
<text x="55" y="65" font-family="Arial" font-size="36" font-weight="700">Concrete Scenario</text>
<text x="55" y="105" font-family="Arial" font-size="19">Same offer. Different label.</text>
<rect x="70" y="180" width="230" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="100" y="225" font-family="Arial" font-size="22" font-weight="700">Step 1</text>
<text x="100" y="265" font-family="Arial" font-size="18">Proposal arrives.</text>
<rect x="360" y="180" width="230" height="120" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="390" y="225" font-family="Arial" font-size="22" font-weight="700">Step 2</text>
<text x="390" y="265" font-family="Arial" font-size="18">Source gets revealed.</text>
<rect x="650" y="180" width="230" height="120" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="680" y="225" font-family="Arial" font-size="22" font-weight="700">Step 3</text>
<text x="680" y="265" font-family="Arial" font-size="18">Value rating shifts.</text>
<rect x="940" y="180" width="190" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="970" y="225" font-family="Arial" font-size="22" font-weight="700">Step 4</text>
<text x="970" y="265" font-family="Arial" font-size="18">Blind recheck.</text>
<rect x="160" y="430" width="380" height="160" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
<text x="200" y="475" font-family="Arial" font-size="22" font-weight="700">Source-first review</text>
<text x="200" y="520" font-family="Arial" font-size="18">Trust drives judgment.</text>
<text x="200" y="555" font-family="Arial" font-size="18">Terms get discounted.</text>
<rect x="660" y="430" width="380" height="160" fill="#fff" stroke="#111" stroke-width="2"/>
<text x="700" y="475" font-family="Arial" font-size="22" font-weight="700">Content-first review</text>
<text x="700" y="520" font-family="Arial" font-size="18">Terms get scored.</text>
<text x="700" y="555" font-family="Arial" font-size="18">Source gets added.</text>
</svg>