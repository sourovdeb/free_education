<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Law versus science comparison for omission bias</title>
<desc id="desc">A comparison showing psychological omission bias beside criminal-law requirements for omission liability.</desc>
<style>
  .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#111;stroke-width:2}.band{fill:#e9e9e6}.ink{fill:#111;font-family:Arial,Helvetica,sans-serif}.h1{font-size:42px;font-weight:700}.h2{font-size:26px;font-weight:700}.t{font-size:19px}.small{font-size:15px}.line{stroke:#111;stroke-width:2.5;fill:none}
</style>
<rect class="bg" width="1200" height="900"/>
<text class="ink h1" x="70" y="78">LAW vs SCIENCE</text>
<text class="ink t" x="70" y="114">Omission bias creates friction.</text>

<rect class="panel" x="70" y="155" width="500" height="590"/>
<rect class="band" x="70" y="155" width="500" height="75"/>
<text class="ink h2" x="98" y="202">BEHAVIORAL SCIENCE</text>

<text class="ink h2" x="98" y="278">Question</text>
<text class="ink t" x="98" y="315">How does blame shift?</text>

<text class="ink h2" x="98" y="374">Common pattern</text>
<text class="ink t" x="98" y="411">Action draws more blame.</text>
<text class="ink t" x="98" y="445">Omission draws less blame.</text>
<text class="ink t" x="98" y="479">Causation feels weaker.</text>

<text class="ink h2" x="98" y="538">Key limits</text>
<text class="ink t" x="98" y="575">Duties can reverse effects.</text>
<text class="ink t" x="98" y="609">Norms can dominate effects.</text>
<text class="ink t" x="98" y="643">Intent changes judgments.</text>
<text class="ink t" x="98" y="677">Results vary by scenario.</text>

<rect class="panel" x="630" y="155" width="500" height="590"/>
<rect class="band" x="630" y="155" width="500" height="75"/>
<text class="ink h2" x="658" y="202">CRIMINAL LAW</text>

<text class="ink h2" x="658" y="278">Question</text>
<text class="ink t" x="658" y="315">Does liability legally attach?</text>

<text class="ink h2" x="658" y="374">Typical requirements</text>
<text class="ink t" x="658" y="411">A legal duty exists.</text>
<text class="ink t" x="658" y="445">Action was physically possible.</text>
<text class="ink t" x="658" y="479">Causation must be proven.</text>
<text class="ink t" x="658" y="513">Mens rea still matters.</text>

<text class="ink h2" x="658" y="572">Possible duty sources</text>
<text class="ink t" x="658" y="609">Statute or contract.</text>
<text class="ink t" x="658" y="643">Special relationships.</text>
<text class="ink t" x="658" y="677">Assumed care.</text>
<text class="ink t" x="658" y="711">Created risk.</text>

<path class="line" d="M570 450 H630"/>
<path d="M620 440 l18 10 -18 10 z" fill="#111"/>
<path d="M580 440 l-18 10 18 10 z" fill="#111"/>

<rect class="panel" x="70" y="780" width="1060" height="75"/>
<text class="ink h2" x="98" y="818">Conflict</text>
<text class="ink small" x="235" y="818">Intuition asks “Who acted?” Law asks “Who had duty, capacity, causation, and intent?”</text>
</svg>