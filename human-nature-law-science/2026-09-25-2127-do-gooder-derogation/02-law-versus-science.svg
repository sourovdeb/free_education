<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Law versus science comparison</title>
<desc id="desc">Comparison panels showing psychology's focus on hidden social processes and law's focus on provable conduct, intent, and causation.</desc>
<defs><style>.panel{fill:#fff;stroke:#111;stroke-width:2}.shade{fill:#f2f2f2;stroke:#111;stroke-width:2}.h{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#111}.t{font-family:Arial,sans-serif;font-size:24px;font-weight:700;fill:#111}.s{font-family:Arial,sans-serif;font-size:20px;fill:#111}.mid{font-family:Arial,sans-serif;font-size:22px;font-weight:700;fill:#111}</style></defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="60" y="65" class="h">Law Versus Science</text><text x="60" y="102" class="s">Both matter. Neither replaces the other.</text>
<rect x="60" y="150" width="500" height="460" rx="6" class="shade"/>
<text x="95" y="200" class="t">Behavioral science asks</text><text x="95" y="250" class="s">Did comparison threaten self-image?</text><text x="95" y="300" class="s">Was moral reproach expected?</text><text x="95" y="350" class="s">Did group norms shape judgment?</text><text x="95" y="400" class="s">Did hostility suppress reporting?</text><text x="95" y="470" class="mid">Possible finding</text><text x="95" y="510" class="s">Backlash can emerge quietly.</text><text x="95" y="550" class="s">No explicit plot is required.</text>
<rect x="640" y="150" width="500" height="460" rx="6" class="panel"/>
<text x="675" y="200" class="t">Law asks</text><text x="675" y="250" class="s">Was protected conduct involved?</text><text x="675" y="300" class="s">Was harmful action taken?</text><text x="675" y="350" class="s">Was retaliation intended?</text><text x="675" y="400" class="s">Can causation be proven?</text><text x="675" y="470" class="mid">Possible finding</text><text x="675" y="510" class="s">Dislike alone may be lawful.</text><text x="675" y="550" class="s">Evidence must satisfy doctrine.</text>
<rect x="270" y="655" width="660" height="95" rx="6" class="panel"/><text x="310" y="695" class="mid">Conflict zone</text><text x="310" y="728" class="s">Psychology can detect pressure before law detects retaliation.</text>
</svg>