<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Do-gooder derogation mechanism flow</title>
<desc id="desc">A conditional flow from principled action to moral comparison, anticipated reproach, self-image threat, and possible derogation, with an alternate admiration branch.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
  <style>.box{fill:#fff;stroke:#111;stroke-width:2}.shade{fill:#f2f2f2;stroke:#111;stroke-width:2}.t{font-family:Arial,sans-serif;font-size:24px;fill:#111}.s{font-family:Arial,sans-serif;font-size:19px;fill:#111}.h{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#111}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="60" y="65" class="h">Mechanism Flow</text>
<text x="60" y="100" class="s">Backlash is possible. It is not inevitable.</text>
<rect x="60" y="150" width="220" height="110" rx="6" class="box"/>
<text x="88" y="195" class="t">Principled action</text><text x="88" y="230" class="s">Someone refuses norms.</text>
<rect x="350" y="150" width="220" height="110" rx="6" class="box"/>
<text x="375" y="195" class="t">Moral comparison</text><text x="375" y="230" class="s">Choices become visible.</text>
<rect x="640" y="150" width="220" height="110" rx="6" class="shade"/>
<text x="665" y="195" class="t">Expected reproach</text><text x="665" y="230" class="s">They judge me.</text>
<rect x="930" y="150" width="210" height="110" rx="6" class="shade"/>
<text x="950" y="195" class="t">Self-image threat</text><text x="950" y="230" class="s">Moral identity stings.</text>
<path d="M280 205 L350 205" class="line"/><path d="M570 205 L640 205" class="line"/><path d="M860 205 L930 205" class="line"/>
<rect x="790" y="365" width="300" height="125" rx="6" class="shade"/>
<text x="825" y="410" class="t">Derogation branch</text><text x="825" y="445" class="s">Sanctimonious. Disloyal.</text><text x="825" y="475" class="s">Exclusion can follow.</text>
<path d="M1035 260 L1035 365" class="line"/>
<rect x="210" y="365" width="300" height="125" rx="6" class="box"/>
<text x="255" y="410" class="t">Admiration branch</text><text x="255" y="445" class="s">They did better.</text><text x="255" y="475" class="s">Learning can follow.</text>
<path d="M1035 260 C900 315 620 320 510 390" class="line"/>
<rect x="95" y="590" width="1010" height="130" rx="6" class="box"/>
<text x="130" y="630" class="t">Boundary conditions</text><text x="130" y="670" class="s">Implicated actors show more backlash. Outsiders can admire.</text><text x="130" y="705" class="s">Norms, trust, status, and context change outcomes.</text>
</svg>