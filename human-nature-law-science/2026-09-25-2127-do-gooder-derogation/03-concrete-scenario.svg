<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Concrete investigation scenario</title>
<desc id="desc">Timeline showing a group member reporting wrongdoing, peers reacting with hostility, and an investigator separating hostility from credibility while corroborating evidence.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker><style>.box{fill:#fff;stroke:#111;stroke-width:2}.shade{fill:#f2f2f2;stroke:#111;stroke-width:2}.h{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#111}.t{font-family:Arial,sans-serif;font-size:21px;font-weight:700;fill:#111}.s{font-family:Arial,sans-serif;font-size:18px;fill:#111}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="800" fill="#fff"/><text x="60" y="65" class="h">Concrete Scenario</text><text x="60" y="100" class="s">Peer hostility is not credibility evidence.</text>
<rect x="55" y="170" width="190" height="135" rx="6" class="box"/><text x="80" y="210" class="t">1. Group norm</text><text x="80" y="245" class="s">Silence is expected.</text><text x="80" y="275" class="s">Loyalty carries status.</text>
<rect x="285" y="170" width="190" height="135" rx="6" class="box"/><text x="310" y="210" class="t">2. Report</text><text x="310" y="245" class="s">One member speaks.</text><text x="310" y="275" class="s">Authorities receive facts.</text>
<rect x="515" y="170" width="190" height="135" rx="6" class="shade"/><text x="540" y="210" class="t">3. Backlash</text><text x="540" y="245" class="s">Peers feel exposed.</text><text x="540" y="275" class="s">Disloyal labels spread.</text>
<rect x="745" y="170" width="190" height="135" rx="6" class="box"/><text x="770" y="210" class="t">4. Investigation</text><text x="770" y="245" class="s">Corroborate the report.</text><text x="770" y="275" class="s">Document pressure separately.</text>
<rect x="975" y="170" width="170" height="135" rx="6" class="box"/><text x="995" y="210" class="t">5. Outcome</text><text x="995" y="245" class="s">Evidence decides.</text><text x="995" y="275" class="s">Not group popularity.</text>
<path d="M245 238 L285 238" class="line"/><path d="M475 238 L515 238" class="line"/><path d="M705 238 L745 238" class="line"/><path d="M935 238 L975 238" class="line"/>
<rect x="110" y="430" width="980" height="240" rx="6" class="shade"/><text x="150" y="475" class="t">Investigator controls</text><text x="150" y="520" class="s">Check records. Check timelines. Check independent witnesses.</text><text x="150" y="560" class="s">Record threats. Reduce contact pressure. Protect reporting channels.</text><text x="150" y="600" class="s">Do not reward moral status. Do not punish social rejection.</text><text x="150" y="640" class="s">Truth needs corroboration. Safety needs protection.</text>
</svg>