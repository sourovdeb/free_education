<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Nature Dossier</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="top"><div class="eyebrow">Human Nature Dossier · Offline Viewer</div><h1 id="title"></h1><p id="question" class="question"></p></header><section class="panel" aria-live="polite"><div class="chapter-head"><h2 id="chapterTitle"></h2><span id="chapterLabel" class="label"></span></div><p id="chapterBody" class="body"></p><img id="visual" class="visual" alt=""><div class="triad"><div><strong>Evidence</strong><span id="evidence"></span></div><div><strong>Interpretation</strong><span id="interpretation"></span></div><div><strong>Uncertainty</strong><span id="uncertainty"></span></div></div></section><div class="controls" aria-label="Lesson controls"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button></div><div class="progress" aria-label="Progress"><div id="bar"></div></div><section class="sources"><h2>Sources</h2><ol id="sources"></ol></section><p class="footer">Offline. No analytics. No network calls.</p></main><script src="lesson-data.js"></script><script>const d=window.LESSON_DATA;let i=0,timer=null;const visualMap=['01-mechanism-flow.svg','01-mechanism-flow.svg','03-concrete-scenario.svg','03-concrete-scenario.svg','02-law-versus-science.svg','02-law-versus-science.svg'];function render(){const c=d.chapters[i];title.textContent=d.title;question.textContent=d.question;chapterTitle.textContent=c.title;chapterLabel.textContent=c.label;chapterBody.textContent=c.body;evidence.textContent=c.evidence;interpretation.textContent=c.interpretation;uncertainty.textContent=c.uncertainty;visual.src=visualMap[i];visual.alt=c.title+' explanatory diagram';bar.style.width=((i+1)/d.chapters.length*100)+'%';play.textContent=timer?'Pause':'Play'}function move(n){i=(i+n+d.chapters.length)%d.chapters.length;render()}prev.onclick=()=>move(-1);next.onclick=()=>move(1);play.onclick=()=>{if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>move(1),12000)}render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();play.click()}});d.sources.forEach(s=>{const li=document.createElement('li'),a=document.createElement('a');a.href=s.url;a.textContent=s.short;a.target='_blank';a.rel='noopener';li.appendChild(a);sources.appendChild(li)});render();</script></body></html>
