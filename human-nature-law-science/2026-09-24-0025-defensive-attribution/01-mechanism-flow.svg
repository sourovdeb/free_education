<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Defensive attribution mechanism flow</title>
  <desc id="desc">A flowchart showing harmful outcome, vulnerability, self comparison, blame allocation, restored control, and possible bias.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#111"/>
    </marker>
    <style>
      .bg{fill:#fafafa}.box{fill:#fff;stroke:#111;stroke-width:3}.note{fill:#f1f1f1;stroke:#555;stroke-width:2;stroke-dasharray:8 8}.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:48px;font-weight:700}.s{font-size:26px}.m{font-size:31px;font-weight:700}.small{font-size:23px}.line{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="1500"/>
  <text class="t h" x="90" y="85">Defensive Attribution</text>
  <text class="t s" x="90" y="130">How threat can reshape blame</text>

  <rect class="box" x="160" y="200" rx="16" width="880" height="135"/>
  <text class="t m" x="600" y="255" text-anchor="middle">1. Harm occurs</text>
  <text class="t s" x="600" y="300" text-anchor="middle">Severity becomes visible</text>

  <path class="line" d="M600 335 L600 420"/>

  <rect class="box" x="160" y="420" rx="16" width="880" height="135"/>
  <text class="t m" x="600" y="475" text-anchor="middle">2. Vulnerability rises</text>
  <text class="t s" x="600" y="520" text-anchor="middle">“Could this happen?”</text>

  <path class="line" d="M600 555 L600 640"/>

  <rect class="box" x="160" y="640" rx="16" width="880" height="145"/>
  <text class="t m" x="600" y="695" text-anchor="middle">3. Self-comparison starts</text>
  <text class="t s" x="600" y="740" text-anchor="middle">Similarity changes threat</text>

  <path class="line" d="M600 785 L600 870"/>

  <rect class="box" x="160" y="870" rx="16" width="880" height="145"/>
  <text class="t m" x="600" y="925" text-anchor="middle">4. Causes get judged</text>
  <text class="t s" x="600" y="970" text-anchor="middle">Blame becomes protective</text>

  <path class="line" d="M600 1015 L600 1100"/>

  <rect class="box" x="160" y="1100" rx="16" width="880" height="145"/>
  <text class="t m" x="600" y="1155" text-anchor="middle">5. Control feels restored</text>
  <text class="t s" x="600" y="1200" text-anchor="middle">“I would avoid that”</text>

  <path class="line" d="M600 1245 L600 1330"/>

  <rect class="box" x="160" y="1330" rx="16" width="880" height="110"/>
  <text class="t m" x="600" y="1395" text-anchor="middle">6. Judgment can drift</text>

  <rect class="note" x="825" y="560" rx="12" width="300" height="205"/>
  <text class="t small" x="850" y="605">Evidence strength</text>
  <text class="t small" x="850" y="650">Severity: stronger</text>
  <text class="t small" x="850" y="695">Similarity: mixed</text>
  <text class="t small" x="850" y="740">Context matters</text>
</svg>