<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Moral disengagement mechanism flow</title>
  <desc id="desc">A five-stage diagram showing how harmful conduct can be reframed, responsibility diluted, victims distanced, and self-condemnation reduced.</desc>
  <rect width="1200" height="1600" fill="#f6f6f2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="80" y="100" font-size="50" font-weight="700">Moral disengagement</text>
    <text x="80" y="150" font-size="28">How self-censure gets muted</text>

    <rect x="100" y="240" width="1000" height="170" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="150" y="305" font-size="36" font-weight="700">1. Harm appears</text>
    <text x="150" y="355" font-size="28">A person faces conflict.</text>

    <line x1="600" y1="410" x2="600" y2="495" stroke="#171717" stroke-width="5"/>
    <polygon points="600,525 582,490 618,490" fill="#171717"/>

    <rect x="100" y="535" width="1000" height="220" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="150" y="600" font-size="36" font-weight="700">2. Harm gets reframed</text>
    <text x="150" y="650" font-size="27">“Necessary.” “Duty.” “Protection.”</text>
    <text x="150" y="700" font-size="27">Language changes meaning.</text>

    <line x1="600" y1="755" x2="600" y2="840" stroke="#171717" stroke-width="5"/>
    <polygon points="600,870 582,835 618,835" fill="#171717"/>

    <rect x="100" y="880" width="1000" height="220" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="150" y="945" font-size="36" font-weight="700">3. Agency gets diluted</text>
    <text x="150" y="995" font-size="27">“I followed orders.”</text>
    <text x="150" y="1045" font-size="27">“Everyone did it.”</text>

    <line x1="600" y1="1100" x2="600" y2="1185" stroke="#171717" stroke-width="5"/>
    <polygon points="600,1215 582,1180 618,1180" fill="#171717"/>

    <rect x="100" y="1225" width="1000" height="220" rx="18" fill="#e9e9e2" stroke="#171717" stroke-width="4"/>
    <text x="150" y="1290" font-size="36" font-weight="700">4. Victim gets distanced</text>
    <text x="150" y="1340" font-size="27">Harm feels abstract.</text>
    <text x="150" y="1390" font-size="27">Blame shifts outward.</text>

    <text x="80" y="1520" font-size="27" font-weight="700">Result: guilt can weaken.</text>
    <text x="80" y="1560" font-size="24">This does not erase choice.</text>
  </g>
</svg>