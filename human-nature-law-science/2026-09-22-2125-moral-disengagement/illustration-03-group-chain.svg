<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Group chain scenario</title>
  <desc id="desc">A schematic scenario showing how authority, task splitting, euphemistic language, and distance from consequences can spread responsibility across several people.</desc>
  <rect width="1200" height="1600" fill="#f6f6f2"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#171717">
    <text x="80" y="100" font-size="50" font-weight="700">A group chain</text>
    <text x="80" y="150" font-size="28">Responsibility gets distributed</text>

    <rect x="110" y="250" width="980" height="160" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="160" y="315" font-size="36" font-weight="700">Authority</text>
    <text x="160" y="365" font-size="28">“Complete the operation.”</text>

    <line x1="600" y1="410" x2="600" y2="495" stroke="#171717" stroke-width="5"/>
    <polygon points="600,525 582,490 618,490" fill="#171717"/>

    <rect x="110" y="535" width="980" height="170" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="160" y="600" font-size="36" font-weight="700">Planner</text>
    <text x="160" y="655" font-size="28">Sees schedules and targets.</text>

    <line x1="600" y1="705" x2="600" y2="790" stroke="#171717" stroke-width="5"/>
    <polygon points="600,820 582,785 618,785" fill="#171717"/>

    <rect x="110" y="830" width="980" height="170" rx="18" fill="#ffffff" stroke="#171717" stroke-width="4"/>
    <text x="160" y="895" font-size="36" font-weight="700">Operator</text>
    <text x="160" y="950" font-size="28">Sees one assigned task.</text>

    <line x1="600" y1="1000" x2="600" y2="1085" stroke="#171717" stroke-width="5"/>
    <polygon points="600,1115 582,1080 618,1080" fill="#171717"/>

    <rect x="110" y="1125" width="980" height="200" rx="18" fill="#e9e9e2" stroke="#171717" stroke-width="4"/>
    <text x="160" y="1190" font-size="36" font-weight="700">Victim consequence</text>
    <text x="160" y="1245" font-size="28">Full harm becomes visible.</text>
    <text x="160" y="1295" font-size="28">Earlier roles saw less.</text>

    <text x="120" y="1425" font-size="28" font-weight="700">Investigation question:</text>
    <text x="120" y="1475" font-size="27">Who knew what, when?</text>
    <text x="120" y="1525" font-size="24">A schematic only.</text>
  </g>
</svg>