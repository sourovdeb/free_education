<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Envy-driven sabotage mechanism flow</title>
  <desc id="desc">A flow diagram showing upward comparison, appraisal, envy, and two possible paths: self-improvement or rival-reduction.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
    <style>
      .title{font:700 46px Arial,sans-serif;fill:#111}
      .subtitle{font:400 25px Arial,sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:3;rx:10}
      .soft{fill:#f3f3f3;stroke:#111;stroke-width:2;rx:10}
      .label{font:700 28px Arial,sans-serif;fill:#111;text-anchor:middle}
      .small{font:400 22px Arial,sans-serif;fill:#222;text-anchor:middle}
      .note{font:400 20px Arial,sans-serif;fill:#333}
      .arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#444;stroke-width:3;stroke-dasharray:10 10;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="1600" fill="#fafafa"/>
  <text x="80" y="90" class="title">ENVY-DRIVEN SABOTAGE</text>
  <text x="80" y="135" class="subtitle">One emotion. Different routes.</text>

  <rect x="310" y="205" width="580" height="120" class="box"/>
  <text x="600" y="255" class="label">1. UPWARD COMPARISON</text>
  <text x="600" y="295" class="small">“They have more.”</text>

  <path d="M600 325 L600 390" class="arrow"/>

  <rect x="230" y="390" width="740" height="185" class="soft"/>
  <text x="600" y="438" class="label">2. APPRAISAL</text>
  <text x="390" y="495" class="small">Is it relevant?</text>
  <text x="600" y="495" class="small">Is it deserved?</text>
  <text x="810" y="495" class="small">Can I change?</text>
  <text x="600" y="540" class="small">How close is the rival?</text>

  <path d="M600 575 L600 640" class="arrow"/>

  <rect x="350" y="640" width="500" height="125" class="box"/>
  <text x="600" y="695" class="label">3. ENVY MAY EMERGE</text>
  <text x="600" y="735" class="small">Pain from another’s advantage</text>

  <path d="M600 765 L600 835" class="arrow"/>

  <rect x="165" y="835" width="870" height="130" class="soft"/>
  <text x="600" y="885" class="label">4. CONTEXT SHAPES RESPONSE</text>
  <text x="600" y="928" class="small">fairness • norms • identity • control • opportunity</text>

  <path d="M470 965 C430 1020 350 1040 315 1085" class="arrow"/>
  <path d="M730 965 C770 1020 850 1040 885 1085" class="arrow"/>

  <rect x="90" y="1085" width="450" height="265" class="box"/>
  <text x="315" y="1140" class="label">ROUTE A</text>
  <text x="315" y="1182" class="small">Raise self</text>
  <text x="315" y="1230" class="small">Work harder</text>
  <text x="315" y="1270" class="small">Learn skills</text>
  <text x="315" y="1310" class="small">Seek opportunity</text>

  <rect x="660" y="1085" width="450" height="265" class="box"/>
  <text x="885" y="1140" class="label">ROUTE B</text>
  <text x="885" y="1182" class="small">Lower rival</text>
  <text x="885" y="1230" class="small">Withhold information</text>
  <text x="885" y="1270" class="small">Damage reputation</text>
  <text x="885" y="1310" class="small">Preserve dependence</text>

  <path d="M885 1350 L885 1420" class="dash"/>
  <rect x="705" y="1420" width="360" height="95" class="soft"/>
  <text x="885" y="1460" class="label">SABOTAGE</text>
  <text x="885" y="1492" class="small">Possible, not inevitable</text>

  <text x="80" y="1560" class="note">Research supports pathways, not destiny.</text>
</svg>
