<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f4f4ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<text x="70" y="105" font-size="52" font-weight="700">Page 5 — The Confession Snowball</text>
<text x="70" y="160" font-size="28">One statement can spread.</text>

<circle cx="600" cy="330" r="120" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="470" y="320" font-size="34" font-weight="700">CONFESSION</text>
<text x="480" y="365" font-size="26">True or false.</text>

<line x1="600" y1="450" x2="600" y2="550" stroke="#111" stroke-width="5"/>
<polygon points="600,585 580,545 620,545" fill="#111"/>

<rect x="120" y="600" width="960" height="170" rx="20" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="170" y="665" font-size="36" font-weight="700">Investigators change course</text>
<text x="170" y="720" font-size="28">Alternative leads may shrink.</text>

<line x1="600" y1="770" x2="600" y2="850" stroke="#111" stroke-width="5"/>
<polygon points="600,885 580,845 620,845" fill="#111"/>

<rect x="120" y="900" width="960" height="220" rx="20" fill="#e8e8e2" stroke="#111" stroke-width="4"/>
<text x="170" y="965" font-size="36" font-weight="700">Other evidence gets exposed</text>
<text x="170" y="1020" font-size="28">Witnesses hear confession details.</text>
<text x="170" y="1065" font-size="28">Examiners learn guilt theories.</text>

<line x1="600" y1="1120" x2="600" y2="1200" stroke="#111" stroke-width="5"/>
<polygon points="600,1235 580,1195 620,1195" fill="#111"/>

<rect x="120" y="1250" width="960" height="210" rx="20" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="170" y="1315" font-size="36" font-weight="700">Corroboration may look independent</text>
<text x="170" y="1370" font-size="28">But sources may share contamination.</text>
<text x="170" y="1415" font-size="28">Independence must be tested.</text>

<text x="70" y="1530" font-size="25">Based on confession-corruption research.</text>
</g>
</svg>