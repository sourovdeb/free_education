<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f4f4ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<text x="70" y="105" font-size="52" font-weight="700">Page 4 — Law vs Science</text>
<text x="70" y="160" font-size="28">Same confession. Different questions.</text>

<rect x="70" y="240" width="500" height="1050" rx="24" fill="#fff" stroke="#111" stroke-width="4"/>
<rect x="630" y="240" width="500" height="1050" rx="24" fill="#fff" stroke="#111" stroke-width="4"/>

<text x="245" y="315" font-size="44" font-weight="700">LAW</text>
<text x="730" y="315" font-size="44" font-weight="700">SCIENCE</text>

<text x="120" y="420" font-size="30">Was police coercion used?</text>
<text x="120" y="500" font-size="30">Was waiver valid?</text>
<text x="120" y="580" font-size="30">Is evidence admissible?</text>
<text x="120" y="660" font-size="30">Can jurors weigh it?</text>

<text x="680" y="420" font-size="30">What changed decisions?</text>
<text x="680" y="500" font-size="30">What raised compliance?</text>
<text x="680" y="580" font-size="30">Was memory contaminated?</text>
<text x="680" y="660" font-size="30">How reliable is it?</text>

<line x1="570" y1="770" x2="630" y2="770" stroke="#111" stroke-width="8"/>
<polygon points="630,770 600,748 600,792" fill="#111"/>
<polygon points="570,770 600,748 600,792" fill="#111"/>

<rect x="170" y="850" width="860" height="270" rx="22" fill="#e8e8e2" stroke="#111" stroke-width="4"/>
<text x="235" y="920" font-size="40" font-weight="700">The conflict zone</text>
<text x="235" y="985" font-size="30">Voluntary can still mislead.</text>
<text x="235" y="1040" font-size="30">Reliable can still be pressured.</text>
<text x="235" y="1095" font-size="30">One rule cannot answer both.</text>

<rect x="170" y="1180" width="860" height="180" rx="22" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="235" y="1245" font-size="32" font-weight="700">Brown v. Mississippi:</text>
<text x="235" y="1295" font-size="28">Violent coercion violated due process.</text>
<text x="235" y="1340" font-size="32" font-weight="700">Colorado v. Connelly:</text>
<text x="620" y="1340" font-size="28">Police coercion became central.</text>

<text x="70" y="1515" font-size="25">Legal rules vary by jurisdiction.</text>
</g>
</svg>