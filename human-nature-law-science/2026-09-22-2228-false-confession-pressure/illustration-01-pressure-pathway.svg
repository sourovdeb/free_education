<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f4f4ef"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#111">
<text x="70" y="105" font-size="52" font-weight="700">Page 3 — Pressure Pathway</text>
<text x="70" y="160" font-size="28">How innocence can fail.</text>

<rect x="130" y="250" width="940" height="150" rx="20" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="180" y="315" font-size="38" font-weight="700">1. Innocent suspect</text>
<text x="180" y="365" font-size="28">“Truth will protect me.”</text>

<line x1="600" y1="400" x2="600" y2="485" stroke="#111" stroke-width="5"/>
<polygon points="600,520 580,480 620,480" fill="#111"/>

<rect x="130" y="530" width="940" height="190" rx="20" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="180" y="595" font-size="38" font-weight="700">2. Pressure builds</text>
<text x="180" y="645" font-size="28">Accusation. Isolation. Fatigue.</text>
<text x="180" y="690" font-size="28">False evidence may appear.</text>

<line x1="600" y1="720" x2="600" y2="805" stroke="#111" stroke-width="5"/>
<polygon points="600,840 580,800 620,800" fill="#111"/>

<rect x="130" y="850" width="940" height="190" rx="20" fill="#e8e8e2" stroke="#111" stroke-width="4"/>
<text x="180" y="915" font-size="38" font-weight="700">3. Time horizon shrinks</text>
<text x="180" y="965" font-size="28">Escape matters now.</text>
<text x="180" y="1010" font-size="28">Future risk feels distant.</text>

<line x1="600" y1="1040" x2="600" y2="1125" stroke="#111" stroke-width="5"/>
<polygon points="600,1160 580,1120 620,1120" fill="#111"/>

<rect x="130" y="1170" width="940" height="230" rx="20" fill="#fff" stroke="#111" stroke-width="4"/>
<text x="180" y="1235" font-size="38" font-weight="700">4. Confession becomes escape</text>
<text x="180" y="1290" font-size="28">The statement can be false.</text>
<text x="180" y="1335" font-size="28">Relief arrives first.</text>
<text x="180" y="1380" font-size="28">Consequences arrive later.</text>

<text x="70" y="1515" font-size="25">Schematic. Not diagnostic.</text>
</g>
</svg>