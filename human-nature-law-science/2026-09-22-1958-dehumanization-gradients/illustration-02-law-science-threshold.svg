<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Law and science threshold comparison</title>
<desc id="desc">Science treats dehumanization as a gradient while law asks threshold questions about conduct, intent, protected speech, bias motive, and incitement.</desc>
<rect width="1200" height="1600" fill="#f6f5f1"/>
<g font-family="Arial, sans-serif" fill="#161616">
<text x="80" y="110" font-size="54" font-weight="700">PAGE 4 — LAW / SCIENCE</text>
<text x="80" y="170" font-size="28">Same behavior. Different questions.</text>

<rect x="70" y="260" width="500" height="1050" rx="22" fill="#ffffff" stroke="#161616" stroke-width="4"/>
<rect x="630" y="260" width="500" height="1050" rx="22" fill="#ffffff" stroke="#161616" stroke-width="4"/>

<text x="210" y="340" font-size="42" font-weight="700">SCIENCE</text>
<text x="790" y="340" font-size="42" font-weight="700">LAW</text>

<text x="120" y="440" font-size="30">Measures gradients.</text>
<text x="120" y="510" font-size="30">Measures associations.</text>
<text x="120" y="580" font-size="30">Tests causal pathways.</text>
<text x="120" y="650" font-size="30">Accepts uncertainty.</text>
<text x="120" y="720" font-size="30">Studies groups.</text>

<text x="680" y="440" font-size="30">Needs defined conduct.</text>
<text x="680" y="510" font-size="30">Needs proven intent.</text>
<text x="680" y="580" font-size="30">Protects some speech.</text>
<text x="680" y="650" font-size="30">Uses legal thresholds.</text>
<text x="680" y="720" font-size="30">Decides one case.</text>

<line x1="570" y1="820" x2="630" y2="820" stroke="#161616" stroke-width="8"/>
<polygon points="630,820 595,798 595,842" fill="#161616"/>
<polygon points="570,820 605,798 605,842" fill="#161616"/>

<text x="325" y="920" font-size="40" font-weight="700">THE CONFLICT</text>
<text x="160" y="995" font-size="30">Science can flag risk.</text>
<text x="160" y="1055" font-size="30">Law cannot punish risk.</text>
<text x="160" y="1115" font-size="30">Science sees continua.</text>
<text x="160" y="1175" font-size="30">Law needs boundaries.</text>

<rect x="120" y="1360" width="960" height="130" rx="18" fill="#e5e3dc"/>
<text x="170" y="1420" font-size="30" font-weight="700">Example legal question:</text>
<text x="170" y="1465" font-size="28">Was speech direct incitement?</text>
</g>
</svg>