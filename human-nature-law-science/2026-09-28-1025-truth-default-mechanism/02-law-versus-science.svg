<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Law versus science</title>
<desc id="desc">A comparison of courtroom credibility practice and deception research.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#151515"/></marker></defs>
<rect width="1280" height="720" fill="#c9b58f"/>
<rect x="30" y="30" width="1220" height="660" rx="6" fill="#e6dcc7" stroke="#151515" stroke-width="3"/>
<text x="70" y="90" font-family="monospace" font-size="34" font-weight="bold" fill="#151515">LAW VERSUS SCIENCE</text>
<rect x="80" y="150" width="500" height="400" fill="#eee7d8" stroke="#151515" stroke-width="3"/>
<text x="100" y="188" font-family="monospace" font-size="24" font-weight="bold" fill="#151515">LAW</text>
<text x="100" y="226" font-family="monospace" font-size="19" fill="#151515">Live testimony matters.</text>
<text x="100" y="256" font-family="monospace" font-size="19" fill="#151515">Demeanor may inform.</text>
<text x="100" y="286" font-family="monospace" font-size="19" fill="#151515">Tone may inform.</text>
<text x="100" y="316" font-family="monospace" font-size="19" fill="#151515">Cross-examination tests.</text>
<text x="100" y="346" font-family="monospace" font-size="19" fill="#151515">Documents can contradict.</text>
<rect x="700" y="150" width="500" height="400" fill="#eee7d8" stroke="#151515" stroke-width="3"/>
<text x="720" y="188" font-family="monospace" font-size="24" font-weight="bold" fill="#8f1d1d">SCIENCE</text>
<text x="720" y="226" font-family="monospace" font-size="19" fill="#151515">Unaided accuracy: 54%.</text>
<text x="720" y="256" font-family="monospace" font-size="19" fill="#151515">Truths: about 61%.</text>
<text x="720" y="286" font-family="monospace" font-size="19" fill="#151515">Lies: about 47%.</text>
<text x="720" y="316" font-family="monospace" font-size="19" fill="#151515">Nonverbal cues weaken.</text>
<text x="720" y="346" font-family="monospace" font-size="19" fill="#151515">Verification improves decisions.</text>
<line x1="580" y1="350" x2="688" y2="350" stroke="#151515" stroke-width="5" marker-end="url(#arrow)"/>
<text x="640" y="600" font-family="monospace" font-size="28" font-weight="bold" fill="#8f1d1d" text-anchor="middle">TENSION</text>
<text x="640" y="640" font-family="monospace" font-size="22" fill="#151515" text-anchor="middle">Demeanor informs. It cannot prove.</text>
</svg>