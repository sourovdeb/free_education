<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>Claim checking scenario</title><desc>One claim follows two decision paths.</desc><rect width="1280" height="720" fill="#c9b58f"/><rect x="40" y="40" width="1200" height="640" fill="#e6dcc7" stroke="#151515" stroke-width="3"/><text x="80" y="100" font-family="monospace" font-size="34">ONE CLAIM, TWO PATHS</text><rect x="490" y="140" width="300" height="90" fill="#eee7d8" stroke="#151515" stroke-width="3"/><text x="560" y="195" font-family="monospace" font-size="26">CLAIM ARRIVES</text><line x1="640" y1="230" x2="360" y2="330" stroke="#151515" stroke-width="5"/><line x1="640" y1="230" x2="920" y2="330" stroke="#151515" stroke-width="5"/><rect x="120" y="330" width="420" height="260" fill="#eee7d8" stroke="#151515" stroke-width="3"/><text x="170" y="390" font-family="monospace" font-size="28" fill="#8f1d1d">PATH A: ACCEPT</text><text x="170" y="450" font-family="monospace" font-size="22">Feels plausible.</text><text x="170" y="490" font-family="monospace" font-size="22">Checking stops.</text><rect x="740" y="330" width="420" height="260" fill="#eee7d8" stroke="#151515" stroke-width="3"/><text x="790" y="390" font-family="monospace" font-size="28">PATH B: CHECK</text><text x="790" y="450" font-family="monospace" font-size="22">Seek records.</text><text x="790" y="490" font-family="monospace" font-size="22">Test alternatives.</text><text x="640" y="650" text-anchor="middle" font-family="monospace" font-size="28" fill="#8f1d1d">Plausibility is not proof.</text></svg>