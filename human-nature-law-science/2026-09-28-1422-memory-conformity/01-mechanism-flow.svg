<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
<title id="t">Memory conformity mechanism</title><desc id="d">Two witnesses discuss an event. A detail transfers through compliance or source confusion into later recall.</desc><style>
  .bg{fill:#d8c8aa}.paper{fill:#f2ead9;stroke:#1b1b1b;stroke-width:3}.ink{fill:#111}.red{fill:#8b1e1e}.line{stroke:#111;stroke-width:4;fill:none}.dash{stroke:#111;stroke-width:3;stroke-dasharray:9 8;fill:none}.small{font:20px monospace;fill:#111}.med{font:28px monospace;fill:#111}.big{font:bold 44px monospace;fill:#111}.tiny{font:16px monospace;fill:#111}.label{font:bold 22px monospace;fill:#f2ead9}
</style><rect class="bg" width="1200" height="800"/>
<text x="55" y="70" class="big">MEMORY CONFORMITY — FLOW</text>
<rect x="60" y="130" width="250" height="135" class="paper"/><text x="90" y="180" class="med">WITNESS A</text><text x="90" y="220" class="small">sees detail X</text>
<rect x="60" y="480" width="250" height="135" class="paper"/><text x="90" y="530" class="med">WITNESS B</text><text x="90" y="570" class="small">misses detail X</text>
<path d="M315 195 C430 195 430 315 500 315" class="line"/><path d="M315 545 C430 545 430 385 500 385" class="line"/>
<rect x="500" y="270" width="250" height="160" class="paper"/><text x="540" y="325" class="med">DISCUSSION</text><text x="540" y="365" class="small">A states X</text><text x="540" y="398" class="small">confidence adds weight</text>
<path d="M750 350 L880 350" class="line"/><polygon points="880,350 850,335 850,365" class="ink"/>
<rect x="880" y="260" width="250" height="180" class="paper"/><text x="915" y="315" class="med">LATER RECALL</text><text x="915" y="355" class="small">B reports X</text><text x="915" y="390" class="small">source feels internal</text>
<rect x="465" y="530" width="330" height="135" class="paper"/><text x="500" y="580" class="med">TWO PATHS</text><text x="500" y="620" class="small">compliance / source confusion</text>
<path d="M625 430 L625 530" class="dash"/>
<rect x="890" y="625" width="220" height="48" class="red"/><text x="905" y="658" class="label">AGREEMENT ≠ ORIGIN</text>
</svg>