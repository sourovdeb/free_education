<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Sexual jealousy escalation mechanism</title>
  <desc id="desc">A flow diagram showing threat appraisal, monitoring, control, escalation, risk multipliers, and exit paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill:#111; }
      .h1 { font-size:34px; font-weight:700; }
      .h2 { font-size:21px; font-weight:700; }
      .body { font-size:18px; }
      .small { font-size:15px; }
      .box { fill:#fff; stroke:#222; stroke-width:2; rx:14; }
      .risk { fill:#fff4e8; stroke:#8a4b08; stroke-width:2; rx:14; }
      .safe { fill:#eef8f1; stroke:#256b3f; stroke-width:2; rx:14; }
      .line { stroke:#222; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#666; stroke-width:2; fill:none; stroke-dasharray:8 7; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#fafafa"/>
  <text x="60" y="62" class="h1">Sexual Jealousy Escalation</text>
  <text x="60" y="94" class="body">A risk pathway.</text>
  <text x="60" y="120" class="small">Not a destiny.</text>

  <rect x="60" y="170" width="180" height="110" class="box"/>
  <text x="150" y="205" text-anchor="middle" class="h2">Threat cue</text>
  <text x="150" y="235" text-anchor="middle" class="body">Real or suspected</text>
  <text x="150" y="262" text-anchor="middle" class="small">Bond feels threatened</text>

  <rect x="300" y="170" width="180" height="110" class="box"/>
  <text x="390" y="205" text-anchor="middle" class="h2">Threat appraisal</text>
  <text x="390" y="235" text-anchor="middle" class="body">Attention narrows</text>
  <text x="390" y="262" text-anchor="middle" class="small">Ambiguity gains meaning</text>

  <rect x="540" y="170" width="180" height="110" class="box"/>
  <text x="630" y="205" text-anchor="middle" class="h2">Monitoring</text>
  <text x="630" y="235" text-anchor="middle" class="body">Checking increases</text>
  <text x="630" y="262" text-anchor="middle" class="small">More cues appear</text>

  <rect x="780" y="170" width="180" height="110" class="risk"/>
  <text x="870" y="205" text-anchor="middle" class="h2">Control</text>
  <text x="870" y="235" text-anchor="middle" class="body">Restrictions increase</text>
  <text x="870" y="262" text-anchor="middle" class="small">Isolation may follow</text>

  <rect x="1000" y="170" width="150" height="110" class="risk"/>
  <text x="1075" y="205" text-anchor="middle" class="h2">Escalation</text>
  <text x="1075" y="235" text-anchor="middle" class="body">Conflict intensifies</text>
  <text x="1075" y="262" text-anchor="middle" class="small">Risk compounds</text>

  <path d="M240 225 L300 225" class="line"/>
  <path d="M480 225 L540 225" class="line"/>
  <path d="M720 225 L780 225" class="line"/>
  <path d="M960 225 L1000 225" class="line"/>

  <text x="60" y="355" class="h2">Risk multipliers</text>

  <rect x="60" y="390" width="190" height="80" class="risk"/>
  <text x="155" y="420" text-anchor="middle" class="body">Recent separation</text>
  <text x="155" y="446" text-anchor="middle" class="small">Estrangement matters</text>

  <rect x="280" y="390" width="190" height="80" class="risk"/>
  <text x="375" y="420" text-anchor="middle" class="body">Prior threats</text>
  <text x="375" y="446" text-anchor="middle" class="small">Pattern matters</text>

  <rect x="500" y="390" width="190" height="80" class="risk"/>
  <text x="595" y="420" text-anchor="middle" class="body">Stalking behavior</text>
  <text x="595" y="446" text-anchor="middle" class="small">Persistence matters</text>

  <rect x="720" y="390" width="190" height="80" class="risk"/>
  <text x="815" y="420" text-anchor="middle" class="body">Weapon access</text>
  <text x="815" y="446" text-anchor="middle" class="small">Risk rises</text>

  <rect x="940" y="390" width="190" height="80" class="risk"/>
  <text x="1035" y="420" text-anchor="middle" class="body">Coercive control</text>
  <text x="1035" y="446" text-anchor="middle" class="small">Pattern precedes crisis</text>

  <path d="M155 390 C230 330, 970 330, 1070 280" class="dash"/>
  <path d="M375 390 C450 340, 960 330, 1070 280" class="dash"/>
  <path d="M595 390 C650 350, 960 330, 1070 280" class="dash"/>
  <path d="M815 390 C850 350, 990 330, 1070 280" class="dash"/>
  <path d="M1035 390 L1070 280" class="dash"/>

  <text x="60" y="550" class="h2">Exit paths</text>

  <rect x="60" y="585" width="240" height="110" class="safe"/>
  <text x="180" y="620" text-anchor="middle" class="h2">Pause</text>
  <text x="180" y="650" text-anchor="middle" class="body">Reduce surveillance</text>
  <text x="180" y="677" text-anchor="middle" class="small">Delay confrontation</text>

  <rect x="350" y="585" width="240" height="110" class="safe"/>
  <text x="470" y="620" text-anchor="middle" class="h2">Reality check</text>
  <text x="470" y="650" text-anchor="middle" class="body">Test assumptions</text>
  <text x="470" y="677" text-anchor="middle" class="small">Seek neutral evidence</text>

  <rect x="640" y="585" width="240" height="110" class="safe"/>
  <text x="760" y="620" text-anchor="middle" class="h2">Boundary setting</text>
  <text x="760" y="650" text-anchor="middle" class="body">Reject coercive control</text>
  <text x="760" y="677" text-anchor="middle" class="small">Protect autonomy</text>

  <rect x="930" y="585" width="220" height="110" class="safe"/>
  <text x="1040" y="620" text-anchor="middle" class="h2">Safety response</text>
  <text x="1040" y="650" text-anchor="middle" class="body">Assess compound risks</text>
  <text x="1040" y="677" text-anchor="middle" class="small">Use structured tools</text>

  <path d="M630 280 C630 520, 180 500, 180 585" class="dash"/>
  <path d="M870 280 C870 500, 470 500, 470 585" class="dash"/>
  <path d="M870 280 C900 500, 760 500, 760 585" class="dash"/>
  <path d="M1075 280 L1040 585" class="dash"/>

  <text x="60" y="770" class="small">Research supports risk patterns.</text>
  <text x="60" y="795" class="small">No stage guarantees escalation.</text>
</svg>