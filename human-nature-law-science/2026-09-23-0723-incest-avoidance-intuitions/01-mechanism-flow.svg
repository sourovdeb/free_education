<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .title{font-size:42px;font-weight:700}
      .sub{font-size:24px}
      .box{fill:#fff;stroke:#111;stroke-width:3}
      .soft{fill:#f2f2f2;stroke:#111;stroke-width:2}
      .label{font-size:25px;font-weight:700}
      .small{font-size:21px}
      .arrow{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="80" y="80" class="title">Incest avoidance intuition — mechanism flow</text>
  <text x="80" y="125" class="sub">A probability model, not destiny.</text>

  <rect x="90" y="220" width="260" height="130" rx="6" class="box"/>
  <text x="220" y="265" text-anchor="middle" class="label">Early cues</text>
  <text x="220" y="305" text-anchor="middle" class="small">Co-residence</text>
  <text x="220" y="335" text-anchor="middle" class="small">Maternal association</text>

  <rect x="455" y="220" width="280" height="130" rx="6" class="box"/>
  <text x="595" y="265" text-anchor="middle" class="label">Kin estimate</text>
  <text x="595" y="305" text-anchor="middle" class="small">Implicit inference</text>
  <text x="595" y="335" text-anchor="middle" class="small">Cue-based, imperfect</text>

  <rect x="840" y="220" width="280" height="130" rx="6" class="box"/>
  <text x="980" y="265" text-anchor="middle" class="label">Aversion response</text>
  <text x="980" y="305" text-anchor="middle" class="small">Sexual avoidance</text>
  <text x="980" y="335" text-anchor="middle" class="small">Disgust can rise</text>

  <rect x="1225" y="220" width="285" height="130" rx="6" class="box"/>
  <text x="1368" y="265" text-anchor="middle" class="label">Moral judgment</text>
  <text x="1368" y="305" text-anchor="middle" class="small">Wrongness ratings</text>
  <text x="1368" y="335" text-anchor="middle" class="small">Taboo support</text>

  <path d="M350 285 L455 285" class="arrow"/>
  <path d="M735 285 L840 285" class="arrow"/>
  <path d="M1120 285 L1225 285" class="arrow"/>

  <rect x="190" y="500" width="1220" height="270" rx="8" class="soft"/>
  <text x="800" y="550" text-anchor="middle" class="label">Modifiers change every step</text>

  <rect x="245" y="600" width="210" height="100" class="box"/>
  <text x="350" y="640" text-anchor="middle" class="small">Culture</text>
  <text x="350" y="675" text-anchor="middle" class="small">Social rules</text>

  <rect x="520" y="600" width="245" height="100" class="box"/>
  <text x="643" y="640" text-anchor="middle" class="small">Separation</text>
  <text x="643" y="675" text-anchor="middle" class="small">Co-residence length</text>

  <rect x="830" y="600" width="245" height="100" class="box"/>
  <text x="953" y="640" text-anchor="middle" class="small">Attraction pattern</text>
  <text x="953" y="675" text-anchor="middle" class="small">Sexual orientation</text>

  <rect x="1140" y="600" width="210" height="100" class="box"/>
  <text x="1245" y="640" text-anchor="middle" class="small">Family labels</text>
  <text x="1245" y="675" text-anchor="middle" class="small">Legal status</text>

  <text x="800" y="850" text-anchor="middle" class="label">Key point</text>
  <text x="800" y="895" text-anchor="middle" class="sub">A felt taboo can emerge before explicit reasoning.</text>
  <text x="800" y="935" text-anchor="middle" class="sub">That does not make it universal.</text>
</svg>