<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .title{font-size:42px;font-weight:700}
      .head{font-size:30px;font-weight:700}
      .small{font-size:23px}
      .box{fill:#fff;stroke:#111;stroke-width:3}
      .soft{fill:#f2f2f2;stroke:#111;stroke-width:2}
      .mid{fill:#e6e6e6;stroke:#111;stroke-width:3}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="80" y="80" class="title">Law versus science — incest avoidance</text>

  <rect x="90" y="150" width="620" height="620" class="box"/>
  <text x="400" y="205" text-anchor="middle" class="head">Science asks</text>

  <rect x="150" y="260" width="500" height="85" class="soft"/>
  <text x="400" y="310" text-anchor="middle" class="small">Which kin cues existed?</text>

  <rect x="150" y="380" width="500" height="85" class="soft"/>
  <text x="400" y="430" text-anchor="middle" class="small">How long was co-residence?</text>

  <rect x="150" y="500" width="500" height="85" class="soft"/>
  <text x="400" y="550" text-anchor="middle" class="small">What changes aversion?</text>

  <rect x="150" y="620" width="500" height="85" class="soft"/>
  <text x="400" y="670" text-anchor="middle" class="small">How uncertain is prediction?</text>

  <rect x="890" y="150" width="620" height="620" class="box"/>
  <text x="1200" y="205" text-anchor="middle" class="head">Law asks</text>

  <rect x="950" y="260" width="500" height="85" class="soft"/>
  <text x="1200" y="310" text-anchor="middle" class="small">What relationship exists?</text>

  <rect x="950" y="380" width="500" height="85" class="soft"/>
  <text x="1200" y="430" text-anchor="middle" class="small">Was consent legally valid?</text>

  <rect x="950" y="500" width="500" height="85" class="soft"/>
  <text x="1200" y="550" text-anchor="middle" class="small">Were age limits crossed?</text>

  <rect x="950" y="620" width="500" height="85" class="soft"/>
  <text x="1200" y="670" text-anchor="middle" class="small">Which rule applies?</text>

  <rect x="610" y="355" width="380" height="210" class="mid"/>
  <text x="800" y="405" text-anchor="middle" class="head">Core conflict</text>
  <text x="800" y="455" text-anchor="middle" class="small">Cue-based psychology</text>
  <text x="800" y="495" text-anchor="middle" class="small">meets category-based law</text>

  <rect x="260" y="825" width="1080" height="120" class="soft"/>
  <text x="800" y="865" text-anchor="middle" class="head">Stübing v. Germany</text>
  <text x="800" y="905" text-anchor="middle" class="small">Biological siblings met later. The Court upheld conviction.</text>
  <text x="800" y="935" text-anchor="middle" class="small">The courts also noted age and dependency concerns.</text>
</svg>