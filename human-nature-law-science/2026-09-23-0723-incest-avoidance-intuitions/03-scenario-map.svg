<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}
      .title{font-size:42px;font-weight:700}
      .head{font-size:30px;font-weight:700}
      .small{font-size:22px}
      .tiny{font-size:19px}
      .box{fill:#fff;stroke:#111;stroke-width:3}
      .soft{fill:#f2f2f2;stroke:#111;stroke-width:2}
      .line{stroke:#111;stroke-width:4}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#fff"/>
  <text x="80" y="80" class="title">Scenario map — cues can diverge</text>
  <text x="80" y="120" class="small">Fictional examples only.</text>

  <rect x="90" y="180" width="680" height="500" class="box"/>
  <text x="430" y="230" text-anchor="middle" class="head">Pair A</text>
  <text x="430" y="270" text-anchor="middle" class="small">Unrelated children</text>

  <circle cx="300" cy="365" r="45" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="560" cy="365" r="45" fill="#fff" stroke="#111" stroke-width="3"/>
  <line x1="345" y1="365" x2="515" y2="365" class="line"/>
  <text x="430" y="340" text-anchor="middle" class="tiny">Raised together</text>
  <text x="430" y="470" text-anchor="middle" class="small">Long co-residence exists.</text>
  <text x="430" y="515" text-anchor="middle" class="small">Kin cues may strengthen.</text>
  <text x="430" y="560" text-anchor="middle" class="small">Aversion may increase.</text>
  <text x="430" y="605" text-anchor="middle" class="small">Law may allow marriage.</text>

  <rect x="830" y="180" width="680" height="500" class="box"/>
  <text x="1170" y="230" text-anchor="middle" class="head">Pair B</text>
  <text x="1170" y="270" text-anchor="middle" class="small">Biological siblings</text>

  <circle cx="1040" cy="365" r="45" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="1300" cy="365" r="45" fill="#fff" stroke="#111" stroke-width="3"/>
  <line x1="1085" y1="365" x2="1255" y2="365" class="line" stroke-dasharray="12,12"/>
  <text x="1170" y="340" text-anchor="middle" class="tiny">Separated early</text>
  <text x="1170" y="470" text-anchor="middle" class="small">Little co-residence exists.</text>
  <text x="1170" y="515" text-anchor="middle" class="small">Some cues may weaken.</text>
  <text x="1170" y="560" text-anchor="middle" class="small">Prediction stays uncertain.</text>
  <text x="1170" y="605" text-anchor="middle" class="small">Law may prohibit sex.</text>

  <rect x="190" y="760" width="1220" height="165" class="soft"/>
  <text x="800" y="810" text-anchor="middle" class="head">Investigation lesson</text>
  <text x="800" y="855" text-anchor="middle" class="small">Taboo does not prove impossibility.</text>
  <text x="800" y="895" text-anchor="middle" class="small">Use evidence, open questions, and recorded interviews.</text>
</svg>