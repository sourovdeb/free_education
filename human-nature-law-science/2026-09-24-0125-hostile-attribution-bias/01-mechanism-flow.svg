<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hostile attribution bias mechanism flow</title>
  <desc id="desc">A flow diagram showing how an ambiguous cue can become a hostile interpretation, anger, retaliation, and self-confirmation, with intervention points.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .bg{fill:#fff}.box{fill:#f7f7f7;stroke:#111;stroke-width:2}.break{fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}.loop{stroke:#555;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font:700 34px Arial,sans-serif;fill:#111}.sub{font:18px Arial,sans-serif;fill:#333}.h{font:700 22px Arial,sans-serif;fill:#111}.t{font:18px Arial,sans-serif;fill:#111}.small{font:16px Arial,sans-serif;fill:#333}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="60" y="60">Hostile Attribution Bias</text>
  <text class="sub" x="60" y="94">Ambiguity can become attack.</text>

  <rect class="box" x="60" y="150" rx="10" width="210" height="110"/>
  <text class="h" x="165" y="190" text-anchor="middle">Ambiguous cue</text>
  <text class="t" x="165" y="222" text-anchor="middle">Intent stays unclear</text>

  <rect class="box" x="350" y="150" rx="10" width="220" height="110"/>
  <text class="h" x="460" y="188" text-anchor="middle">Threat filter</text>
  <text class="t" x="460" y="220" text-anchor="middle">History shapes meaning</text>

  <rect class="box" x="650" y="150" rx="10" width="230" height="110"/>
  <text class="h" x="765" y="188" text-anchor="middle">Hostile inference</text>
  <text class="t" x="765" y="220" text-anchor="middle">"They meant harm"</text>

  <rect class="box" x="960" y="150" rx="10" width="180" height="110"/>
  <text class="h" x="1050" y="188" text-anchor="middle">Anger</text>
  <text class="t" x="1050" y="220" text-anchor="middle">Action narrows</text>

  <path class="line" d="M270 205 H340"/>
  <path class="line" d="M570 205 H640"/>
  <path class="line" d="M880 205 H950"/>

  <rect class="box" x="960" y="360" rx="10" width="180" height="110"/>
  <text class="h" x="1050" y="400" text-anchor="middle">Retaliation</text>
  <text class="t" x="1050" y="432" text-anchor="middle">Sharp response</text>

  <rect class="box" x="650" y="360" rx="10" width="230" height="110"/>
  <text class="h" x="765" y="400" text-anchor="middle">Other reacts</text>
  <text class="t" x="765" y="432" text-anchor="middle">Conflict becomes real</text>

  <rect class="box" x="350" y="360" rx="10" width="220" height="110"/>
  <text class="h" x="460" y="400" text-anchor="middle">Belief confirms</text>
  <text class="t" x="460" y="432" text-anchor="middle">"I knew it"</text>

  <path class="line" d="M1050 260 V350"/>
  <path class="line" d="M960 415 H890"/>
  <path class="line" d="M650 415 H580"/>
  <path class="loop" d="M350 415 C210 415 210 300 350 230"/>

  <rect class="break" x="80" y="590" rx="10" width="300" height="120"/>
  <text class="h" x="230" y="630" text-anchor="middle">Break point one</text>
  <text class="t" x="230" y="662" text-anchor="middle">Name only the cue</text>
  <text class="small" x="230" y="690" text-anchor="middle">Delay motive language</text>

  <rect class="break" x="450" y="590" rx="10" width="300" height="120"/>
  <text class="h" x="600" y="630" text-anchor="middle">Break point two</text>
  <text class="t" x="600" y="662" text-anchor="middle">Generate alternatives</text>
  <text class="small" x="600" y="690" text-anchor="middle">Seek missing context</text>

  <rect class="break" x="820" y="590" rx="10" width="300" height="120"/>
  <text class="h" x="970" y="630" text-anchor="middle">Break point three</text>
  <text class="t" x="970" y="662" text-anchor="middle">Require corroboration</text>
  <text class="small" x="970" y="690" text-anchor="middle">Recheck first impressions</text>
</svg>