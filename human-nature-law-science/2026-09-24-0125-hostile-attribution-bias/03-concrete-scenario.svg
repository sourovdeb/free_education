<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Concrete hostile attribution scenario</title>
  <desc id="desc">A two-path hallway collision scenario. One path assumes hostility and escalates. The other checks context and discovers an accident.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
    <style>
      .bg{fill:#fff}.box{fill:#f7f7f7;stroke:#111;stroke-width:2}.alt{fill:#fff;stroke:#555;stroke-width:2;stroke-dasharray:8 6}.line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}.title{font:700 34px Arial,sans-serif;fill:#111}.head{font:700 24px Arial,sans-serif;fill:#111}.t{font:18px Arial,sans-serif;fill:#111}.small{font:16px Arial,sans-serif;fill:#333}
    </style>
  </defs>
  <rect class="bg" width="1200" height="800"/>
  <text class="title" x="60" y="60">One Cue, Two Stories</text>
  <text class="small" x="60" y="92">The collision stays ambiguous.</text>

  <rect class="box" x="410" y="130" rx="10" width="380" height="110"/>
  <text class="head" x="600" y="170" text-anchor="middle">Hallway collision</text>
  <text class="t" x="600" y="204" text-anchor="middle">No apology is heard</text>

  <path class="line" d="M520 240 C430 300 330 300 270 350"/>
  <path class="line" d="M680 240 C770 300 870 300 930 350"/>

  <rect class="box" x="80" y="350" rx="10" width="380" height="120"/>
  <text class="head" x="270" y="390" text-anchor="middle">Path A</text>
  <text class="t" x="270" y="424" text-anchor="middle">"That was deliberate"</text>
  <text class="small" x="270" y="450" text-anchor="middle">Hostile intent inferred</text>

  <rect class="alt" x="740" y="350" rx="10" width="380" height="120"/>
  <text class="head" x="930" y="390" text-anchor="middle">Path B</text>
  <text class="t" x="930" y="424" text-anchor="middle">"Maybe it was accidental"</text>
  <text class="small" x="930" y="450" text-anchor="middle">Context gets checked</text>

  <rect class="box" x="80" y="560" rx="10" width="380" height="130"/>
  <text class="head" x="270" y="600" text-anchor="middle">Escalation</text>
  <text class="t" x="270" y="634" text-anchor="middle">Sharp reply follows</text>
  <text class="t" x="270" y="666" text-anchor="middle">Other person reacts</text>

  <rect class="alt" x="740" y="560" rx="10" width="380" height="130"/>
  <text class="head" x="930" y="600" text-anchor="middle">Context</text>
  <text class="t" x="930" y="634" text-anchor="middle">Noise hid the apology</text>
  <text class="t" x="930" y="666" text-anchor="middle">The collision was accidental</text>

  <path class="line" d="M270 470 V550"/>
  <path class="line" d="M930 470 V550"/>

  <text class="small" x="270" y="730" text-anchor="middle">Belief gains confirmation.</text>
  <text class="small" x="930" y="730" text-anchor="middle">Conflict never forms.</text>
</svg>