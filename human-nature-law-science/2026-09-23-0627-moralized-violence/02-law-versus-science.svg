<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Law versus science comparison</title>
  <desc id="desc">A two-column comparison showing how law evaluates responsibility while behavioral science studies mechanisms and probabilities in moralized violence.</desc>
  <defs>
    <style>
      .bg{fill:#f7f7f5}.panel{fill:#fff;stroke:#111;stroke-width:3}.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:54px;font-weight:700}.sh{font-size:34px;font-weight:700}.b{font-size:29px;font-weight:700}.n{font-size:25px}.rule{stroke:#111;stroke-width:3}.note{fill:#ece6e1;stroke:#111;stroke-width:3}
    </style>
  </defs>
  <rect class="bg" width="1200" height="1600"/>
  <text class="t h" x="80" y="95">Law versus Science</text>
  <text class="t n" x="80" y="140">Same event. Different questions.</text>

  <rect class="panel" x="70" y="210" width="500" height="1180" rx="8"/>
  <rect class="panel" x="630" y="210" width="500" height="1180" rx="8"/>

  <text class="t sh" x="120" y="280">LAW</text>
  <text class="t sh" x="680" y="280">SCIENCE</text>
  <line class="rule" x1="100" y1="310" x2="540" y2="310"/>
  <line class="rule" x1="660" y1="310" x2="1100" y2="310"/>

  <text class="t b" x="120" y="380">Main question</text>
  <text class="t n" x="120" y="425">What was done?</text>
  <text class="t n" x="120" y="460">Was it lawful?</text>

  <text class="t b" x="680" y="380">Main question</text>
  <text class="t n" x="680" y="425">Why did it happen?</text>
  <text class="t n" x="680" y="460">What raised risk?</text>

  <text class="t b" x="120" y="550">Focus</text>
  <text class="t n" x="120" y="595">Evidence</text>
  <text class="t n" x="120" y="630">Intent</text>
  <text class="t n" x="120" y="665">Causation</text>
  <text class="t n" x="120" y="700">Defenses</text>
  <text class="t n" x="120" y="735">Procedure</text>

  <text class="t b" x="680" y="550">Focus</text>
  <text class="t n" x="680" y="595">Moral conviction</text>
  <text class="t n" x="680" y="630">Threat</text>
  <text class="t n" x="680" y="665">Group norms</text>
  <text class="t n" x="680" y="700">Sacred values</text>
  <text class="t n" x="680" y="735">Grievance pathways</text>

  <text class="t b" x="120" y="835">Possible output</text>
  <text class="t n" x="120" y="880">Guilty</text>
  <text class="t n" x="120" y="915">Not guilty</text>
  <text class="t n" x="120" y="950">Justified</text>
  <text class="t n" x="120" y="985">Not justified</text>

  <text class="t b" x="680" y="835">Possible output</text>
  <text class="t n" x="680" y="880">Risk estimate</text>
  <text class="t n" x="680" y="915">Mechanism model</text>
  <text class="t n" x="680" y="950">Population pattern</text>
  <text class="t n" x="680" y="985">Uncertainty range</text>

  <text class="t b" x="120" y="1085">Key safeguard</text>
  <text class="t n" x="120" y="1130">Due process</text>
  <text class="t n" x="120" y="1165">Proof standards</text>

  <text class="t b" x="680" y="1085">Key safeguard</text>
  <text class="t n" x="680" y="1130">Replication</text>
  <text class="t n" x="680" y="1165">Alternative causes</text>

  <rect class="note" x="110" y="1260" width="980" height="220" rx="8"/>
  <text class="t b" x="150" y="1320">Conflict point</text>
  <text class="t n" x="150" y="1365">Moral certainty feels immediate.</text>
  <text class="t n" x="150" y="1400">Law demands procedure.</text>
  <text class="t n" x="150" y="1435">Science explains pressure.</text>
  <text class="t n" x="150" y="1470">Explanation is not excuse.</text>
</svg>