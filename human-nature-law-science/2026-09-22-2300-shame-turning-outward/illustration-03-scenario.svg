<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">One humiliation, three behavioral outcomes</title>
<desc id="desc">A scenario diagram showing a public correction followed by three possible responses: repair, withdrawal, and externalized blame leading toward retaliation.</desc>
<rect width="1200" height="1600" fill="#f7f7f4"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#151515">
<text x="70" y="95" font-size="52" font-weight="700">Page 5 — One Event</text>
<text x="70" y="145" font-size="26">Three possible reactions.</text>

<rect x="120" y="220" width="960" height="170" rx="22" fill="#ffffff" stroke="#222" stroke-width="4"/>
<text x="180" y="285" font-size="38" font-weight="700">Public correction</text>
<text x="180" y="335" font-size="29">Others witness the mistake.</text>

<line x1="600" y1="390" x2="600" y2="485" stroke="#222" stroke-width="5"/>
<polygon points="600,510 584,477 616,477" fill="#222"/>

<rect x="180" y="520" width="840" height="150" rx="20" fill="#ecece7" stroke="#222" stroke-width="4"/>
<text x="230" y="585" font-size="36" font-weight="700">Internal appraisal</text>
<text x="230" y="635" font-size="28">“My standing dropped.”</text>

<line x1="600" y1="670" x2="600" y2="750" stroke="#222" stroke-width="5"/>
<polygon points="600,775 584,742 616,742" fill="#222"/>

<text x="70" y="830" font-size="30" font-weight="700">The path now splits</text>

<rect x="60" y="890" width="330" height="350" rx="18" fill="#ffffff" stroke="#222" stroke-width="4"/>
<text x="105" y="955" font-size="34" font-weight="700">Route A</text>
<text x="105" y="1010" font-size="28">Accept mistake.</text>
<text x="105" y="1055" font-size="28">Repair the damage.</text>
<text x="105" y="1100" font-size="28">Status slowly returns.</text>
<text x="105" y="1170" font-size="23">No aggression.</text>

<rect x="435" y="890" width="330" height="350" rx="18" fill="#ffffff" stroke="#222" stroke-width="4"/>
<text x="480" y="955" font-size="34" font-weight="700">Route B</text>
<text x="480" y="1010" font-size="28">Avoid the group.</text>
<text x="480" y="1055" font-size="28">Hide the mistake.</text>
<text x="480" y="1100" font-size="28">Pain turns inward.</text>
<text x="480" y="1170" font-size="23">Still nonviolent.</text>

<rect x="810" y="890" width="330" height="350" rx="18" fill="#ecece7" stroke="#222" stroke-width="4"/>
<text x="855" y="955" font-size="34" font-weight="700">Route C</text>
<text x="855" y="1010" font-size="28">Blame the critic.</text>
<text x="855" y="1055" font-size="28">Anger masks shame.</text>
<text x="855" y="1100" font-size="28">Retaliation seems fair.</text>
<text x="855" y="1170" font-size="23">Risk can rise.</text>

<rect x="150" y="1310" width="900" height="170" rx="20" fill="#ffffff" stroke="#222" stroke-width="4"/>
<text x="210" y="1375" font-size="34" font-weight="700">Investigator’s rule</text>
<text x="210" y="1430" font-size="28">Reconstruct sequence first.</text>
<text x="210" y="1470" font-size="28">Emotion proves nothing.</text>

<text x="70" y="1540" font-size="24" fill="#444">Same trigger. Different outcomes.</text>
</g>
</svg>