<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="36" font-weight="700">Moral hypocrisy: mechanism flow</text><text x="60" y="110" font-family="Arial" font-size="20">A moral standard meets self-interest.</text><g font-family="Arial" font-size="22"><rect x="70" y="180" width="230" height="100" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="105" y="225">1. Moral rule</text><text x="105" y="255">Be fair.</text><rect x="390" y="180" width="230" height="100" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="425" y="225">2. Cost appears</text><text x="425" y="255">Fairness hurts.</text><rect x="710" y="180" width="230" height="100" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="745" y="225">3. Self-interest</text><text x="745" y="255">gains weight.</text><line x1="300" y1="230" x2="390" y2="230" stroke="#111" stroke-width="3" marker-end="url(#a)"/><line x1="620" y1="230" x2="710" y2="230" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="230" y="390" width="300" height="110" fill="#fafafa" stroke="#111" stroke-width="2"/><text x="270" y="435">4. Fairness ritual</text><text x="270" y="470">looks acceptable.</text><rect x="670" y="390" width="300" height="110" fill="#fafafa" stroke="#111" stroke-width="2"/><text x="710" y="435">5. Standard bends</text><text x="710" y="470">toward self.</text><line x1="825" y1="280" x2="825" y2="390" stroke="#111" stroke-width="3" marker-end="url(#a)"/><line x1="670" y1="445" x2="530" y2="445" stroke="#111" stroke-width="3" marker-end="url(#a)"/><rect x="430" y="610" width="340" height="110" fill="#ededed" stroke="#111" stroke-width="3"/><text x="475" y="655">6. Self-image survives</text><text x="475" y="690">I am still fair.</text><line x1="380" y1="500" x2="530" y2="610" stroke="#111" stroke-width="3" marker-end="url(#a)"/><line x1="820" y1="500" x2="670" y2="610" stroke="#111" stroke-width="3" marker-end="url(#a)"/></g><text x="60" y="770" font-family="Arial" font-size="18">Evidence supports the pattern. It does not prove intent.</text></svg>