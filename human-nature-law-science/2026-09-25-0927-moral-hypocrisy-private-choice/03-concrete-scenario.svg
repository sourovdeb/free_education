<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs><rect width="1200" height="800" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="36" font-weight="700">Concrete scenario: homicide inquiry</text><text x="60" y="110" font-family="Arial" font-size="20">Illustrative only. Not a real case.</text><line x1="120" y1="250" x2="1080" y2="250" stroke="#111" stroke-width="4" marker-end="url(#b)"/><g font-family="Arial" font-size="20"><circle cx="180" cy="250" r="16" fill="#111"/><text x="120" y="205">Initial suspect</text><text x="125" y="300">looks plausible.</text><circle cx="420" cy="250" r="16" fill="#111"/><text x="350" y="205">Witness points</text><text x="350" y="300">toward suspect.</text><circle cx="660" cy="250" r="16" fill="#111"/><text x="610" y="205">Alibi appears</text><text x="590" y="300">with weak detail.</text><circle cx="900" cy="250" r="16" fill="#111"/><text x="825" y="205">Team must choose</text><text x="810" y="300">what to test next.</text><rect x="110" y="390" width="450" height="220" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="145" y="430" font-weight="700">Risky path</text><text x="145" y="475">Witness weakness: excused.</text><text x="145" y="515">Alibi weakness: emphasized.</text><text x="145" y="555">More guilt tests chosen.</text><text x="145" y="595">Fair self-image remains.</text><rect x="640" y="390" width="450" height="220" fill="#ededed" stroke="#111" stroke-width="3"/><text x="675" y="430" font-weight="700">Safeguarded path</text><text x="675" y="475">Apply one evidence standard.</text><text x="675" y="515">Test alternate scenarios.</text><text x="675" y="555">Blind forensic review.</text><text x="675" y="595">Log contrary evidence.</text></g><text x="160" y="690" font-family="Arial" font-size="20">Research supports tunnel vision.</text><text x="160" y="725" font-family="Arial" font-size="20">It does not prove hypocrisy.</text><text x="700" y="690" font-family="Arial" font-size="20">Procedures test the process.</text><text x="700" y="725" font-family="Arial" font-size="20">They avoid mind-reading.</text></svg>