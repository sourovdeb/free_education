<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#fff"/><text x="60" y="70" font-family="Arial" font-size="36" font-weight="700">Law versus science</text><line x1="600" y1="130" x2="600" y2="700" stroke="#111" stroke-width="3"/><text x="160" y="145" font-family="Arial" font-size="28" font-weight="700">LAW</text><text x="760" y="145" font-family="Arial" font-size="28" font-weight="700">SCIENCE</text><g font-family="Arial" font-size="22"><rect x="80" y="190" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="115" y="230">Stable standards</text><text x="115" y="265">should guide conduct.</text><rect x="690" y="190" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="725" y="230">Standards can shift</text><text x="725" y="265">under self-interest.</text><rect x="80" y="335" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="115" y="375">Brady duties require</text><text x="115" y="410">exculpatory disclosure.</text><rect x="690" y="335" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="725" y="375">Good self-image</text><text x="725" y="410">does not ensure neutrality.</text><rect x="80" y="480" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="115" y="520">Intent can matter</text><text x="115" y="555">for legal liability.</text><rect x="690" y="480" width="430" height="105" fill="#f5f5f5" stroke="#111" stroke-width="2"/><text x="725" y="520">Bias may operate</text><text x="725" y="555">without conscious intent.</text><rect x="345" y="640" width="510" height="95" fill="#ededed" stroke="#111" stroke-width="3"/><text x="400" y="680">Bridge: procedural safeguards</text><text x="400" y="715">record, blind, review, disclose</text></g></svg>