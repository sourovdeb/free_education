<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Concrete side-effect scenario</title><desc id="d">A manager chooses a profit program. Harmful and helpful versions produce different intent judgments.</desc><rect width="1200" height="675" fill="#e6ddc6"/><text x="60" y="75" font-family="monospace" font-size="32" font-weight="700">SCENARIO: SAME CHOICE, DIFFERENT VALENCE</text><g stroke="#111" stroke-width="3"><rect x="55" y="125" width="330" height="430" fill="#f7f1e2"/><rect x="435" y="125" width="330" height="430" fill="#f7f1e2"/><rect x="815" y="125" width="330" height="430" fill="#f7f1e2"/></g><g font-family="monospace" fill="#111"><text x="90" y="175" font-size="25">1. CHOICE</text><text x="90" y="225" font-size="21">PROFIT PROGRAM</text><text x="90" y="275" font-size="21">SIDE EFFECT KNOWN</text><text x="90" y="325" font-size="21">ACTOR: INDIFFERENT</text><text x="470" y="175" font-size="25">2. OUTCOME</text><text x="470" y="245" font-size="21">VERSION A: HARM</text><text x="470" y="305" font-size="21">VERSION B: HELP</text><text x="470" y="370" font-size="21">OTHER FACTS MATCH</text><text x="850" y="175" font-size="25">3. JUDGMENT</text><text x="850" y="245" font-size="21">HARM → MORE INTENT</text><text x="850" y="305" font-size="21">HELP → LESS INTENT</text><text x="850" y="370" font-size="21">WHY?</text></g><path d="M385 340 H435" stroke="#a51212" stroke-width="7"/><polygon points="435,340 415,328 415,352" fill="#a51212"/><path d="M765 340 H815" stroke="#a51212" stroke-width="7"/><polygon points="815,340 795,328 795,352" fill="#a51212"/><text x="435" y="610" font-family="monospace" font-size="22" fill="#a51212">MORAL VALENCE ENTERS ATTRIBUTION</text></svg>