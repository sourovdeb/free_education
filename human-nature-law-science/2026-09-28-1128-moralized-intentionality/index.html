<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Human Nature Dossier — Moralized Intentionality</title><style>:root{--paper:#e8dfc5;--sheet:#f6f0e2;--ink:#171717;--red:#a31515}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-monospace,monospace}.desk{min-height:100vh;padding:20px}.file{max-width:1100px;margin:auto;background:var(--sheet);border:2px solid;box-shadow:14px 14px 0 #0002;padding:24px}.card{min-height:420px}.tag{display:inline-block;background:var(--ink);color:var(--sheet);padding:5px 9px}.body{font-family:system-ui,sans-serif;line-height:1.65;max-width:72ch;font-size:18px}.triptych{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.triptych div{border:2px solid;padding:12px}.triptych b{display:block;color:var(--red)}.controls{display:flex;gap:10px;border-top:2px solid;padding-top:16px}.controls button{font:inherit;padding:10px 15px;background:var(--sheet);border:2px solid}.progress{margin-left:auto}.sources{margin-top:22px;border-top:2px dashed;padding-top:15px}@media(max-width:760px){.triptych{grid-template-columns:1fr}}</style></head><body><main class="desk"><article class="file"><h1>Moralized Intentionality</h1><p>Blame can reshape perceived intent.</p><section id="cards"></section><div class="controls"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button><span class="progress" id="progress"></span></div><section class="sources"><h2>Sources</h2><ol id="sources"></ol></section></article></main><script>let data=null,index=0,timer=null;const cardsEl=document.querySelector('#cards');function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function render(){const c=data.cards[index];cardsEl.innerHTML='<article class="card"><h2>'+esc(c.title)+'</h2><span class="tag">'+esc(c.tag)+'</span><p class="body">'+esc(c.body)+'</p><div class="triptych"><div><b>Evidence</b>'+esc(c.evidence)+'</div><div><b>Interpretation</b>'+esc(c.interpretation)+'</div><div><b>Uncertainty</b>'+esc(c.uncertainty)+'</div></div></article>';document.querySelector('#progress').textContent=(index+1)+' / '+data.cards.length}function next(){index=(index+1)%data.cards.length;render()}function prev(){index=(index-1+data.cards.length)%data.cards.length;render()}function toggle(){const b=document.querySelector('#play');if(timer){clearInterval(timer);timer=null;b.textContent='Play'}else{timer=setInterval(next,8000);b.textContent='Pause'}}fetch('lesson-data.json').then(r=>r.json()).then(d=>{data=d;render();document.querySelector('#sources').innerHTML=d.sources.map(s=>'<li><a href="'+s.url+'">'+esc(s.name)+'</a> — '+esc(s.kind)+'</li>').join('')});document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#play').onclick=toggle;</script></body></html>
