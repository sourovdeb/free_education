<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hypothetical jury-room scenario</title>
  <desc id="desc">A five-step jury-room scenario showing how private doubts can remain hidden and create apparent consensus.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700">Concrete Scenario</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20">Hypothetical jury room</text>

  <rect x="70" y="175" width="190" height="180" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="165" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">1. Private doubt</text>
  <text x="165" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Several jurors</text>
  <text x="165" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">doubt testimony.</text>

  <rect x="295" y="175" width="190" height="180" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="390" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">2. One voice</text>
  <text x="390" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">One juror</text>
  <text x="390" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">sounds certain.</text>

  <rect x="520" y="175" width="190" height="180" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="615" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">3. Silence</text>
  <text x="615" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Doubters wait.</text>
  <text x="615" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Nobody starts.</text>

  <rect x="745" y="175" width="190" height="180" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="840" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">4. Misread</text>
  <text x="840" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Silence looks</text>
  <text x="840" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">like agreement.</text>

  <rect x="970" y="175" width="160" height="180" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="1050" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">5. Hardening</text>
  <text x="1050" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Apparent consensus</text>
  <text x="1050" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">gains weight.</text>

  <line x1="260" y1="265" x2="295" y2="265" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="485" y1="265" x2="520" y2="265" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="710" y1="265" x2="745" y2="265" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="935" y1="265" x2="970" y2="265" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="115" y="450" width="970" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="160" y="500" font-family="Arial, sans-serif" font-size="24" font-weight="700">What investigators should notice</text>
  <text x="160" y="550" font-family="Arial, sans-serif" font-size="20">• Silence gives weak evidence.</text>
  <text x="160" y="590" font-family="Arial, sans-serif" font-size="20">• Confidence can spread socially.</text>
  <text x="160" y="630" font-family="Arial, sans-serif" font-size="20">• Private views need eliciting.</text>

  <text x="60" y="745" font-family="Arial, sans-serif" font-size="17">Hypothetical illustration. Not prevalence data.</text>
</svg>