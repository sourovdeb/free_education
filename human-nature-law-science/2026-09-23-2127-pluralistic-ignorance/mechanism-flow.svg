<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pluralistic ignorance mechanism flow</title>
  <desc id="desc">A circular flow from private doubt to public conformity, misread agreement, and a strengthened false norm.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700">Pluralistic Ignorance</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20">Mechanism flow</text>

  <rect x="80" y="210" width="220" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="190" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Private doubt</text>
  <text x="190" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">“I may disagree.”</text>

  <rect x="380" y="120" width="240" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="500" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Social cost</text>
  <text x="500" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Embarrassment. Status.</text>

  <rect x="720" y="210" width="240" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="840" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Public conformity</text>
  <text x="840" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Silence. Compliance.</text>

  <rect x="720" y="470" width="240" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="840" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Others observe</text>
  <text x="840" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">Behavior becomes evidence.</text>

  <rect x="380" y="560" width="240" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="500" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">Agreement inferred</text>
  <text x="500" y="640" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">“They must support it.”</text>

  <rect x="80" y="470" width="220" height="120" rx="6" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="190" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700">False norm</text>
  <text x="190" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="18">The loop strengthens.</text>

  <line x1="300" y1="240" x2="380" y2="190" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="190" x2="720" y2="240" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="840" y1="330" x2="840" y2="470" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="720" y1="550" x2="620" y2="610" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="380" y1="610" x2="300" y2="550" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="190" y1="470" x2="190" y2="330" stroke="#111" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1020" y="230" width="130" height="330" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1085" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700">Core error</text>
  <line x1="1040" y1="295" x2="1130" y2="295" stroke="#111"/>
  <text x="1085" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Visible</text>
  <text x="1085" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">behavior</text>
  <text x="1085" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">≠</text>
  <text x="1085" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">Private</text>
  <text x="1085" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="17">belief</text>

  <text x="60" y="750" font-family="Arial, sans-serif" font-size="17">Original explanatory graphic.</text>
</svg>