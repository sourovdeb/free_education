<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Law versus science comparison</title>
  <desc id="desc">Comparison between common legal or moral inferences and social-science cautions about pluralistic ignorance.</desc>
  <rect width="1200" height="800" fill="#fff"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700">Law Versus Science</text>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="20">Pluralistic ignorance</text>

  <rect x="70" y="160" width="480" height="500" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <rect x="650" y="160" width="480" height="500" fill="#f7f7f7" stroke="#111" stroke-width="2"/>

  <text x="310" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">Common inference</text>
  <text x="890" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700">Scientific caution</text>

  <text x="110" y="285" font-family="Arial, sans-serif" font-size="22" font-weight="700">Silence</text>
  <text x="300" y="285" font-family="Arial, sans-serif" font-size="20">means acceptance.</text>
  <text x="690" y="285" font-family="Arial, sans-serif" font-size="22" font-weight="700">Silence</text>
  <text x="880" y="285" font-family="Arial, sans-serif" font-size="20">may hide dissent.</text>

  <line x1="100" y1="320" x2="520" y2="320" stroke="#bbb"/>
  <line x1="680" y1="320" x2="1100" y2="320" stroke="#bbb"/>

  <text x="110" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="700">Calmness</text>
  <text x="300" y="375" font-family="Arial, sans-serif" font-size="20">signals certainty.</text>
  <text x="690" y="375" font-family="Arial, sans-serif" font-size="22" font-weight="700">Calmness</text>
  <text x="880" y="375" font-family="Arial, sans-serif" font-size="20">may be copied.</text>

  <line x1="100" y1="410" x2="520" y2="410" stroke="#bbb"/>
  <line x1="680" y1="410" x2="1100" y2="410" stroke="#bbb"/>

  <text x="110" y="465" font-family="Arial, sans-serif" font-size="22" font-weight="700">Compliance</text>
  <text x="300" y="465" font-family="Arial, sans-serif" font-size="20">means support.</text>
  <text x="690" y="465" font-family="Arial, sans-serif" font-size="22" font-weight="700">Compliance</text>
  <text x="880" y="465" font-family="Arial, sans-serif" font-size="20">may hide fear.</text>

  <line x1="100" y1="500" x2="520" y2="500" stroke="#bbb"/>
  <line x1="680" y1="500" x2="1100" y2="500" stroke="#bbb"/>

  <text x="110" y="555" font-family="Arial, sans-serif" font-size="22" font-weight="700">Consensus</text>
  <text x="300" y="555" font-family="Arial, sans-serif" font-size="20">reflects belief.</text>
  <text x="690" y="555" font-family="Arial, sans-serif" font-size="22" font-weight="700">Consensus</text>
  <text x="880" y="555" font-family="Arial, sans-serif" font-size="20">may be false.</text>

  <rect x="350" y="690" width="500" height="70" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="600" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">Observed behavior ≠ private belief</text>
</svg>