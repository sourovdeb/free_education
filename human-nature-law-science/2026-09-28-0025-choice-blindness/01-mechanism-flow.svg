<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Choice blindness mechanism flow</title><desc id="desc">A six-stage flow shows original choice, hidden substitution, unnoticed mismatch, explanation, confidence, and a preserved audit trail.</desc>
<rect width="1280" height="720" fill="#c7b58f"/>
<text x="64" y="70" font-family="monospace" font-size="34" font-weight="700">CHOICE BLINDNESS / MECHANISM</text>
<rect x="65" y="130" width="180" height="120" fill="#eee5ce" stroke="#111" stroke-width="3"/><text x="90" y="177" font-family="monospace" font-size="22">1. CHOOSE</text><text x="90" y="210" font-family="monospace" font-size="22">Option A</text>
<rect x="285" y="130" width="180" height="120" fill="#e3dccb" stroke="#111" stroke-width="3"/><text x="307" y="177" font-family="monospace" font-size="22">2. SWAP</text><text x="307" y="210" font-family="monospace" font-size="22">Show B</text>
<rect x="505" y="130" width="190" height="120" fill="#eee5ce" stroke="#111" stroke-width="3"/><text x="526" y="177" font-family="monospace" font-size="22">3. MISS</text><text x="526" y="210" font-family="monospace" font-size="22">Mismatch</text>
<rect x="735" y="130" width="200" height="120" fill="#e3dccb" stroke="#111" stroke-width="3"/><text x="754" y="177" font-family="monospace" font-size="22">4. EXPLAIN</text><text x="754" y="210" font-family="monospace" font-size="22">Reason B</text>
<rect x="975" y="130" width="220" height="120" fill="#eee5ce" stroke="#111" stroke-width="3"/><text x="995" y="177" font-family="monospace" font-size="22">5. BELIEVE</text><text x="995" y="210" font-family="monospace" font-size="22">Story fits</text>
<rect x="115" y="340" width="1050" height="250" fill="#ddd5c2" stroke="#111" stroke-width="3"/>
<text x="150" y="390" font-family="monospace" font-size="28" font-weight="700">SAFER PROCEDURE</text>
<text x="150" y="440" font-family="monospace" font-size="24">Record choice → confidence → prevent feedback</text>
<text x="150" y="485" font-family="monospace" font-size="24">Keep timestamps → compare changes → preserve origin</text>
<rect x="150" y="520" width="360" height="46" fill="#8c1d18"/><text x="168" y="551" fill="#fff" font-family="monospace" font-size="22">COHERENCE ≠ ORIGIN</text>
</svg>