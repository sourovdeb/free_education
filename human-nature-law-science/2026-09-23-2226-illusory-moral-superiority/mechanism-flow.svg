<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Illusory moral superiority mechanism flow</title>
<desc id="desc">A flow diagram showing how moral self-image, flexible definitions, private intentions, outside behavior, unequal comparison, and reduced self-scrutiny can reinforce moral superiority.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#20242a"/>
  </marker>
  <style>
    .bg{fill:#f7f5ef}
    .box{fill:#ffffff;stroke:#20242a;stroke-width:2}
    .accent{fill:#ece9df;stroke:#20242a;stroke-width:2}
    .brake{fill:#e5eef0;stroke:#20242a;stroke-width:2}
    .title{font:700 34px Arial,sans-serif;fill:#111}
    .sub{font:400 18px Arial,sans-serif;fill:#444}
    .label{font:700 22px Arial,sans-serif;fill:#111}
    .small{font:400 18px Arial,sans-serif;fill:#222}
    .arrow{stroke:#20242a;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#20242a;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1200" height="900"/>
<text class="title" x="70" y="70">ILLUSORY MORAL SUPERIORITY</text>
<text class="sub" x="70" y="105">Mechanism flow</text>

<rect class="box" x="90" y="170" width="260" height="110" rx="8"/>
<text class="label" x="220" y="212" text-anchor="middle">Moral self-image</text>
<text class="small" x="220" y="244" text-anchor="middle">“I am decent.”</text>

<rect class="box" x="470" y="170" width="260" height="110" rx="8"/>
<text class="label" x="600" y="212" text-anchor="middle">Flexible definitions</text>
<text class="small" x="600" y="244" text-anchor="middle">Virtue stays broad.</text>

<rect class="box" x="850" y="170" width="260" height="110" rx="8"/>
<text class="label" x="980" y="212" text-anchor="middle">Private intentions</text>
<text class="small" x="980" y="244" text-anchor="middle">Context feels visible.</text>

<rect class="accent" x="850" y="390" width="260" height="120" rx="8"/>
<text class="label" x="980" y="432" text-anchor="middle">Others’ behavior</text>
<text class="small" x="980" y="464" text-anchor="middle">Intent stays hidden.</text>

<rect class="accent" x="470" y="390" width="260" height="120" rx="8"/>
<text class="label" x="600" y="432" text-anchor="middle">Unequal comparison</text>
<text class="small" x="600" y="464" text-anchor="middle">Intent versus action.</text>

<rect class="accent" x="90" y="390" width="260" height="120" rx="8"/>
<text class="label" x="220" y="432" text-anchor="middle">Superiority belief</text>
<text class="small" x="220" y="464" text-anchor="middle">“I judge better.”</text>

<rect class="box" x="90" y="610" width="260" height="120" rx="8"/>
<text class="label" x="220" y="652" text-anchor="middle">Less self-scrutiny</text>
<text class="small" x="220" y="684" text-anchor="middle">Confidence feels earned.</text>

<path class="arrow" d="M350 225 H470"/>
<path class="arrow" d="M730 225 H850"/>
<path class="arrow" d="M980 280 V390"/>
<path class="arrow" d="M850 450 H730"/>
<path class="arrow" d="M470 450 H350"/>
<path class="arrow" d="M220 510 V610"/>
<path class="dash" d="M220 610 C220 560 50 560 50 225 C50 150 90 150 90 200"/>

<rect class="brake" x="430" y="650" width="700" height="150" rx="8"/>
<text class="label" x="780" y="690" text-anchor="middle">Calibration brakes</text>
<text class="small" x="520" y="735">• Compare actual behavior.</text>
<text class="small" x="770" y="735">• Use population baselines.</text>
<text class="small" x="1010" y="735" text-anchor="middle">• Invite outside review.</text>
<text class="small" x="780" y="775" text-anchor="middle">Confidence becomes testable.</text>

<path class="dash" d="M350 670 H430"/>
</svg>