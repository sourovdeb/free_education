<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Coalition loyalty mechanism</title><desc id="d">Flow diagram showing group identity altering interpretation and punishment.</desc><rect width="1200" height="1600" fill="#f6f6f2"/><g font-family="Arial, sans-serif" fill="#111"><text x="80" y="100" font-size="52" font-weight="700">Page 3 — Loyalty Mechanism</text><text x="80" y="155" font-size="28">Same act. Different group.</text><rect x="130" y="240" width="940" height="150" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="180" y="315" font-size="38" font-weight="700">1. Group identity activates</text><text x="180" y="360" font-size="28">“One of us?”</text><line x1="600" y1="390" x2="600" y2="500" stroke="#111" stroke-width="6"/><polygon points="600,530 580,490 620,490" fill="#111"/><rect x="130" y="540" width="940" height="180" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="180" y="615" font-size="38" font-weight="700">2. Interpretation changes</text><text x="180" y="665" font-size="28">Insider: explain context.</text><text x="680" y="665" font-size="28">Outsider: judge action.</text><line x1="600" y1="720" x2="600" y2="830" stroke="#111" stroke-width="6"/><polygon points="600,860 580,820 620,820" fill="#111"/><rect x="130" y="870" width="940" height="220" rx="20" fill="#e9e9e4" stroke="#111" stroke-width="4"/><text x="180" y="945" font-size="38" font-weight="700">3. Punishment can split</text><text x="180" y="1000" font-size="28">Path A: insider leniency.</text><text x="180" y="1050" font-size="28">Path B: insider expulsion.</text><line x1="600" y1="1090" x2="600" y2="1200" stroke="#111" stroke-width="6"/><polygon points="600,1230 580,1190 620,1190" fill="#111"/><rect x="130" y="1240" width="940" height="190" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="180" y="1315" font-size="38" font-weight="700">4. Group image survives</text><text x="180" y="1365" font-size="28">Fairness may shift.</text><text x="80" y="1510" font-size="26">Research shows both paths.</text></g></svg>