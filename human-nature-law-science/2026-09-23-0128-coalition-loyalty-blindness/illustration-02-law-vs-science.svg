<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Law versus science</title><desc id="d">Comparison panel showing legal impartiality standards and identity effects found by psychology.</desc><rect width="1200" height="1600" fill="#f6f6f2"/><g font-family="Arial, sans-serif" fill="#111"><text x="80" y="100" font-size="52" font-weight="700">Page 4 — Law vs Science</text><text x="80" y="155" font-size="28">The standard meets behavior.</text><rect x="70" y="235" width="500" height="1050" rx="24" fill="#fff" stroke="#111" stroke-width="4"/><rect x="630" y="235" width="500" height="1050" rx="24" fill="#fff" stroke="#111" stroke-width="4"/><text x="235" y="315" font-size="42" font-weight="700">LAW</text><text x="745" y="315" font-size="42" font-weight="700">SCIENCE</text><text x="120" y="410" font-size="30">Impartial juries required.</text><text x="120" y="485" font-size="30">Evidence should control.</text><text x="120" y="560" font-size="30">Witness duties apply.</text><text x="120" y="635" font-size="30">Rules target misconduct.</text><text x="680" y="410" font-size="30">Identity can bias judgment.</text><text x="680" y="485" font-size="30">Groups alter punishment.</text><text x="680" y="560" font-size="30">Loyalty can shape silence.</text><text x="680" y="635" font-size="30">Context shifts outcomes.</text><line x1="570" y1="770" x2="630" y2="770" stroke="#111" stroke-width="8"/><polygon points="630,770 600,750 600,790" fill="#111"/><polygon points="570,770 600,750 600,790" fill="#111"/><text x="325" y="865" font-size="38" font-weight="700">Conflict zone</text><text x="160" y="930" font-size="30">Law sets standards.</text><text x="160" y="985" font-size="30">Psychology finds drift.</text><text x="160" y="1040" font-size="30">Bias can stay hidden.</text><text x="160" y="1095" font-size="30">Intent may feel fair.</text><rect x="120" y="1335" width="960" height="140" rx="20" fill="#e9e9e4"/><text x="160" y="1395" font-size="30" font-weight="700">Central tension:</text><text x="160" y="1445" font-size="30">People can feel impartial.</text><text x="80" y="1530" font-size="24">Feeling fair is insufficient.</text></g></svg>