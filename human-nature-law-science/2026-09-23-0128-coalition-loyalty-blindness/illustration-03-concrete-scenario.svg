<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="t d"><title id="t">Concrete coalition scenario</title><desc id="d">Scenario showing the same rule violation judged differently by group members.</desc><rect width="1200" height="1600" fill="#f6f6f2"/><g font-family="Arial, sans-serif" fill="#111"><text x="80" y="100" font-size="52" font-weight="700">Page 5 — Same Violation</text><text x="80" y="155" font-size="28">Membership changes reactions.</text><rect x="130" y="240" width="940" height="170" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="180" y="315" font-size="36" font-weight="700">A rule gets broken.</text><text x="180" y="365" font-size="28">Evidence stays identical.</text><line x1="600" y1="410" x2="600" y2="515" stroke="#111" stroke-width="6"/><polygon points="600,545 580,505 620,505" fill="#111"/><rect x="95" y="560" width="450" height="310" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><rect x="655" y="560" width="450" height="310" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="150" y="630" font-size="34" font-weight="700">Ingroup lens</text><text x="150" y="690" font-size="28">“Maybe context matters.”</text><text x="150" y="745" font-size="28">“Protect our member.”</text><text x="150" y="800" font-size="28">Possible result: leniency.</text><text x="710" y="630" font-size="34" font-weight="700">Outgroup lens</text><text x="710" y="690" font-size="28">“The act defines them.”</text><text x="710" y="745" font-size="28">“Punishment seems clearer.”</text><text x="710" y="800" font-size="28">Possible result: severity.</text><line x1="320" y1="870" x2="320" y2="1000" stroke="#111" stroke-width="6"/><line x1="880" y1="870" x2="880" y2="1000" stroke="#111" stroke-width="6"/><polygon points="320,1030 300,990 340,990" fill="#111"/><polygon points="880,1030 860,990 900,990" fill="#111"/><rect x="150" y="1045" width="900" height="250" rx="20" fill="#e9e9e4" stroke="#111" stroke-width="4"/><text x="210" y="1120" font-size="34" font-weight="700">But the pattern can flip.</text><text x="210" y="1180" font-size="28">Deviant insiders threaten identity.</text><text x="210" y="1230" font-size="28">Then insiders get punished.</text><text x="210" y="1280" font-size="28">Group cohesion drives both.</text><rect x="150" y="1360" width="900" height="120" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="205" y="1430" font-size="30">Question: whose norm survives?</text><text x="80" y="1540" font-size="24">This is a schematic.</text></g></svg>