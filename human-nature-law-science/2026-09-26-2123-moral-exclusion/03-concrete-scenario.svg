<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker><style>.h{font:700 34px Arial}.t{font:700 21px Arial}.s{font:18px Arial}.b{fill:#fff;stroke:#111;stroke-width:2}.g{fill:#f2f2f2;stroke:#111;stroke-width:2}.l{stroke:#111;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="800" fill="#fff"/><text x="55" y="62" class="h">Concrete Scenario: Homicide Triage</text><text x="55" y="100" class="s">Illustrative only. Not empirical proof.</text><rect x="50" y="170" width="200" height="125" rx="6" class="b"/><text x="78" y="210" class="t">1. Two victims</text><text x="78" y="247" class="s">One feels familiar.</text><text x="78" y="276" class="s">One feels distant.</text><rect x="300" y="170" width="200" height="125" rx="6" class="g"/><text x="328" y="210" class="t">2. Attention shifts</text><text x="328" y="247" class="s">Urgency differs.</text><text x="328" y="276" class="s">Empathy differs.</text><rect x="550" y="170" width="200" height="125" rx="6" class="g"/><text x="578" y="210" class="t">3. Leads diverge</text><text x="578" y="247" class="s">One gets context.</text><text x="578" y="276" class="s">One gets blame.</text><rect x="800" y="170" width="200" height="125" rx="6" class="g"/><text x="828" y="210" class="t">4. Case quality</text><text x="828" y="247" class="s">Evidence testing differs.</text><path d="M250 232 L300 232" class="l"/><path d="M500 232 L550 232" class="l"/><path d="M750 232 L800 232" class="l"/><rect x="110" y="410" width="430" height="205" rx="6" class="g"/><text x="145" y="452" class="t">Unsafe path</text><text x="145" y="495" class="s">Victim worth guides effort.</text><text x="145" y="535" class="s">Weak leads stay untested.</text><text x="145" y="575" class="s">Distance becomes evidence.</text><rect x="660" y="410" width="430" height="205" rx="6" class="b"/><text x="695" y="452" class="t">Safeguarded path</text><text x="695" y="495" class="s">Use fixed triage rules.</text><text x="695" y="535" class="s">Audit neglected leads.</text><text x="695" y="575" class="s">Review victim-neutral metrics.</text><rect x="245" y="675" width="710" height="70" rx="6" class="b"/><text x="292" y="718" class="t">Investigate evidence. Never moral worth.</text></svg>