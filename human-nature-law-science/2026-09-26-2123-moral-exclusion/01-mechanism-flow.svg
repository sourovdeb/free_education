<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker><style>.h{font:700 34px Arial}.t{font:700 22px Arial}.s{font:18px Arial}.b{fill:#fff;stroke:#111;stroke-width:2}.g{fill:#f2f2f2;stroke:#111;stroke-width:2}.l{stroke:#111;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="800" fill="#fff"/><text x="55" y="62" class="h">Moral Exclusion: Mechanism Flow</text><text x="55" y="100" class="s">The boundary moves before treatment changes.</text><rect x="50" y="170" width="205" height="120" rx="6" class="b"/><text x="78" y="212" class="t">Threat or distance</text><text x="78" y="248" class="s">They feel remote.</text><text x="78" y="276" class="s">They feel risky.</text><rect x="305" y="170" width="205" height="120" rx="6" class="g"/><text x="333" y="212" class="t">Circle narrows</text><text x="333" y="248" class="s">Fewer people count.</text><rect x="560" y="170" width="205" height="120" rx="6" class="g"/><text x="588" y="212" class="t">Concern weakens</text><text x="588" y="248" class="s">Fairness feels optional.</text><rect x="815" y="170" width="205" height="120" rx="6" class="g"/><text x="843" y="212" class="t">Standards shift</text><text x="843" y="248" class="s">Less context.</text><text x="843" y="276" class="s">More blame.</text><path d="M255 230 L305 230" class="l"/><path d="M510 230 L560 230" class="l"/><path d="M765 230 L815 230" class="l"/><rect x="815" y="420" width="300" height="135" rx="6" class="g"/><text x="850" y="465" class="t">Unequal treatment</text><text x="850" y="502" class="s">Rights narrow.</text><text x="850" y="532" class="s">Harm feels deserved.</text><path d="M918 290 L918 420" class="l"/><rect x="150" y="420" width="430" height="135" rx="6" class="b"/><text x="185" y="465" class="t">Safeguard branch</text><text x="185" y="502" class="s">Fixed rules. Independent review.</text><text x="185" y="532" class="s">Victim-neutral evidence standards.</text><path d="M662 290 C650 360 550 390 500 420" class="l"/><rect x="150" y="625" width="965" height="105" rx="6" class="b"/><text x="185" y="668" class="t">Key warning</text><text x="185" y="704" class="s">Moral exclusion can occur without denying humanity.</text></svg>