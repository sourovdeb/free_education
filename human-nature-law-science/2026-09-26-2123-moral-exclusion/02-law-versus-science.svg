<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><style>.h{font:700 34px Arial}.t{font:700 23px Arial}.s{font:19px Arial}.b{fill:#fff;stroke:#111;stroke-width:2}.g{fill:#f2f2f2;stroke:#111;stroke-width:2}</style></defs><rect width="1200" height="800" fill="#fff"/><text x="55" y="62" class="h">Law Versus Science</text><text x="55" y="100" class="s">One demands equal rules. One predicts shifting concern.</text><rect x="55" y="155" width="510" height="470" rx="6" class="b"/><text x="92" y="205" class="t">LAW</text><text x="92" y="252" class="s">Equal protection applies.</text><text x="92" y="300" class="s">Selective enforcement can fail.</text><text x="92" y="348" class="s">Intent often needs proof.</text><text x="92" y="396" class="s">Comparison cases matter.</text><text x="92" y="470" class="t">Legal question</text><text x="92" y="512" class="s">Was unequal treatment unlawful?</text><text x="92" y="558" class="s">Can causation be shown?</text><rect x="635" y="155" width="510" height="470" rx="6" class="g"/><text x="672" y="205" class="t">SCIENCE</text><text x="672" y="252" class="s">Moral concern can narrow.</text><text x="672" y="300" class="s">Threat can change boundaries.</text><text x="672" y="348" class="s">Deservingness can justify harm.</text><text x="672" y="396" class="s">Bias may stay unspoken.</text><text x="672" y="470" class="t">Scientific question</text><text x="672" y="512" class="s">Did group boundaries shift?</text><text x="672" y="558" class="s">Did standards become unequal?</text><rect x="220" y="670" width="760" height="82" rx="6" class="b"/><text x="258" y="718" class="t">Bridge: fixed procedures reduce mind-reading.</text></svg>