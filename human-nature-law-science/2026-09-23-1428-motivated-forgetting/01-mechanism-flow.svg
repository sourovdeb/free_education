<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
<title id="title">Motivated forgetting mechanism flow</title>
<desc id="desc">Flowchart showing how a reminder can trigger retrieval, deliberate suppression can interrupt retrieval, repeated suppression can reduce later accessibility, and why this does not mean erasure.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
  </marker>
  <style>
    .h1{font:700 54px Arial,sans-serif;fill:#111}.h2{font:700 30px Arial,sans-serif;fill:#111}.body{font:26px Arial,sans-serif;fill:#222}.small{font:22px Arial,sans-serif;fill:#333}.box{fill:#f7f7f7;stroke:#222;stroke-width:3;rx:18}.warn{fill:#fff4d6;stroke:#9b6b00;stroke-width:3;rx:18}.note{fill:#eef4ff;stroke:#34558b;stroke-width:3;rx:18}.line{stroke:#222;stroke-width:5;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1200" height="1600" fill="#fff"/>
<text x="80" y="95" class="h1">Motivated Forgetting</text>
<text x="80" y="145" class="h2">A retrieval-suppression pathway</text>

<rect x="160" y="220" width="880" height="150" class="box"/>
<text x="600" y="275" text-anchor="middle" class="h2">1. Reminder appears</text>
<text x="600" y="325" text-anchor="middle" class="body">A cue activates memory.</text>

<path d="M600 370 L600 445" class="line"/>
<rect x="160" y="460" width="880" height="160" class="box"/>
<text x="600" y="515" text-anchor="middle" class="h2">2. Retrieval starts</text>
<text x="600" y="565" text-anchor="middle" class="body">The memory approaches awareness.</text>

<path d="M600 620 L600 695" class="line"/>
<rect x="160" y="710" width="880" height="185" class="warn"/>
<text x="600" y="765" text-anchor="middle" class="h2">3. Retrieval gets blocked</text>
<text x="600" y="815" text-anchor="middle" class="body">The person suppresses retrieval.</text>
<text x="600" y="858" text-anchor="middle" class="small">This can require control.</text>

<path d="M600 895 L600 970" class="line"/>
<rect x="160" y="985" width="880" height="185" class="box"/>
<text x="600" y="1040" text-anchor="middle" class="h2">4. Suppression repeats</text>
<text x="600" y="1090" text-anchor="middle" class="body">The cue gets practiced.</text>
<text x="600" y="1132" text-anchor="middle" class="small">Retrieval remains interrupted.</text>

<path d="M600 1170 L600 1245" class="line"/>
<rect x="160" y="1260" width="880" height="180" class="note"/>
<text x="600" y="1315" text-anchor="middle" class="h2">5. Later access weakens</text>
<text x="600" y="1365" text-anchor="middle" class="body">Recall becomes less likely.</text>
<text x="600" y="1407" text-anchor="middle" class="small">Meta-analysis: modest effects.</text>

<text x="80" y="1510" class="h2">Important boundary</text>
<text x="80" y="1555" class="body">Reduced access ≠ erased memory.</text>
</svg>