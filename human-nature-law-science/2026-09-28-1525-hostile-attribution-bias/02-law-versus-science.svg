<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Law versus science comparison</title><desc id="d">Law tests reasonable belief, imminence, and proportionality. Science shows that hostile intent is inferred and can be misread.</desc><style>.paper{fill:#f2ead9;stroke:#111;stroke-width:4}.ink{stroke:#111;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.txt{font-family:monospace;fill:#111}.small{font-size:24px}.mid{font-size:34px;font-weight:700}.big{font-size:48px;font-weight:700}</style><rect width="1280" height="720" fill="#c9b894"/><rect x="45" y="35" width="1190" height="650" class="paper"/><text x="80" y="95" class="txt big">LAW VERSUS SCIENCE</text><line x1="640" y1="140" x2="640" y2="630" class="ink"/><text x="180" y="170" class="txt mid">LAW</text><text x="790" y="170" class="txt mid">SCIENCE</text><rect x="100" y="210" width="430" height="110" class="paper"/><text x="135" y="255" class="txt mid">REASONABLE BELIEF</text><text x="135" y="295" class="txt small">Was force necessary?</text><rect x="100" y="360" width="430" height="110" class="paper"/><text x="135" y="405" class="txt mid">IMMINENCE</text><text x="135" y="445" class="txt small">Was threat immediate?</text><rect x="100" y="510" width="430" height="110" class="paper"/><text x="135" y="555" class="txt mid">PROPORTION</text><text x="135" y="595" class="txt small">Did force match?</text><rect x="750" y="210" width="430" height="110" class="paper"/><text x="785" y="255" class="txt mid">INTENT IS INFERRED</text><text x="785" y="295" class="txt small">Ambiguity matters.</text><rect x="750" y="360" width="430" height="110" class="paper"/><text x="785" y="405" class="txt mid">FEAR CAN BE SINCERE</text><text x="785" y="445" class="txt small">Perception can err.</text><rect x="750" y="510" width="430" height="110" class="paper"/><text x="785" y="555" class="txt mid">EXPLANATION ≠ EXCUSE</text><text x="785" y="595" class="txt small">Accountability remains.</text></svg>