<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">One event, two interpretations</title><desc id="d">The same unclear social event can be read as accidental or intentional. The response can change.</desc><rect width="1280" height="720" fill="#c9b894"/><rect x="45" y="35" width="1190" height="650" fill="#f2ead9" stroke="#111" stroke-width="4"/><text x="80" y="95" font-family="monospace" font-size="48" font-weight="700">ONE EVENT. TWO STORIES.</text><rect x="110" y="160" width="1060" height="130" fill="#fffaf0" stroke="#111" stroke-width="4"/><text x="360" y="235" font-family="monospace" font-size="34">UNCLEAR SOCIAL CUE</text><path d="M640 300 L350 410 M640 300 L930 410" stroke="#111" stroke-width="6"/><rect x="100" y="420" width="460" height="170" fill="#fffaf0" stroke="#111" stroke-width="4"/><text x="160" y="480" font-family="monospace" font-size="34">STORY A</text><text x="160" y="535" font-family="monospace" font-size="28">Accident</text><rect x="720" y="420" width="460" height="170" fill="#fffaf0" stroke="#111" stroke-width="4"/><text x="780" y="480" font-family="monospace" font-size="34">STORY B</text><text x="780" y="535" font-family="monospace" font-size="28">Intentional</text></svg>