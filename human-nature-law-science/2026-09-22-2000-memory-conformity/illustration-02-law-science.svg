<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f7f7f4"/>
<text x="80" y="110" font-size="52" font-family="Arial" font-weight="700">Page 4 — Law Meets Science</text>
<g font-family="Arial">
<rect x="70" y="230" width="500" height="1040" rx="24" fill="#fff" stroke="#222" stroke-width="4"/>
<rect x="630" y="230" width="500" height="1040" rx="24" fill="#fff" stroke="#222" stroke-width="4"/>
<text x="220" y="310" font-size="42" font-weight="700">LAW</text>
<text x="750" y="310" font-size="42" font-weight="700">SCIENCE</text>
<text x="120" y="410" font-size="30">Was testimony admissible?</text>
<text x="120" y="500" font-size="30">Was police conduct suggestive?</text>
<text x="120" y="590" font-size="30">Does the witness seem credible?</text>
<text x="120" y="680" font-size="30">Can jurors evaluate it?</text>
<text x="680" y="410" font-size="30">What altered encoding?</text>
<text x="680" y="500" font-size="30">What changed retrieval?</text>
<text x="680" y="590" font-size="30">Which source added details?</text>
<text x="680" y="680" font-size="30">When did confidence change?</text>
<line x1="570" y1="770" x2="630" y2="770" stroke="#222" stroke-width="8"/>
<polygon points="630,770 600,750 600,790" fill="#222"/>
<polygon points="570,770 600,750 600,790" fill="#222"/>
<text x="330" y="870" font-size="38" font-weight="700">Conflict zone</text>
<text x="170" y="940" font-size="30">Law needs thresholds.</text>
<text x="170" y="995" font-size="30">Science gives probabilities.</text>
<text x="170" y="1050" font-size="30">Law decides one case.</text>
<text x="170" y="1105" font-size="30">Science studies populations.</text>
<rect x="120" y="1330" width="960" height="140" rx="18" fill="#ecece7"/>
<text x="160" y="1390" font-size="30" font-weight="700">Key question:</text>
<text x="160" y="1440" font-size="30">Can honest testimony still mislead?</text>
