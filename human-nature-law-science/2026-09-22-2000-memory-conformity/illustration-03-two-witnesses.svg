<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<rect width="1200" height="1600" fill="#f7f7f4"/>
<text x="80" y="110" font-size="52" font-family="Arial" font-weight="700">Page 5 — Two Witnesses</text>
<g font-family="Arial">
<circle cx="260" cy="330" r="90" fill="#fff" stroke="#222" stroke-width="4"/>
<circle cx="940" cy="330" r="90" fill="#fff" stroke="#222" stroke-width="4"/>
<text x="190" y="460" font-size="34" font-weight="700">Witness A</text>
<text x="870" y="460" font-size="34" font-weight="700">Witness B</text>
<rect x="110" y="520" width="360" height="170" rx="18" fill="#fff" stroke="#222" stroke-width="4"/>
<rect x="730" y="520" width="360" height="170" rx="18" fill="#fff" stroke="#222" stroke-width="4"/>
<text x="150" y="590" font-size="28">Saw red backpack.</text>
<text x="770" y="590" font-size="28">Did not see it.</text>
<line x1="470" y1="605" x2="730" y2="605" stroke="#222" stroke-width="6"/>
<polygon points="730,605 695,585 695,625" fill="#222"/>
<text x="505" y="565" font-size="24">discussion</text>
<rect x="170" y="820" width="860" height="190" rx="18" fill="#ecece7" stroke="#222" stroke-width="4"/>
<text x="230" y="890" font-size="34" font-weight="700">Later testimony</text>
<text x="230" y="950" font-size="30">A: “I saw red.”</text>
<text x="620" y="950" font-size="30">B: “I saw red.”</text>
<line x1="600" y1="1010" x2="600" y2="1110" stroke="#222" stroke-width="5"/>
<polygon points="600,1140 585,1105 615,1105" fill="#222"/>
<rect x="170" y="1150" width="860" height="230" rx="18" fill="#fff" stroke="#222" stroke-width="4"/>
<text x="230" y="1225" font-size="34" font-weight="700">Court sees two reports.</text>
<text x="230" y="1290" font-size="30">But one source existed.</text>
<text x="230" y="1340" font-size="30">Agreement lost independence.</text>
<text x="80" y="1500" font-size="26" fill="#444">This is a schematic example.</text>
</g></svg>