<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Outgroup threat inflation mechanism flow</title>
<desc id="desc">Flow diagram showing uncertainty, group cue, stereotype activation, threat appraisal, narrowed attention, harsher response, and feedback.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
  </marker>
  <style>
    .box{fill:#fff;stroke:#222;stroke-width:3;rx:18}
    .soft{fill:#f3f3f3;stroke:#222;stroke-width:3;rx:18}
    .risk{fill:#e7e7e7;stroke:#111;stroke-width:4;rx:18}
    .txt{font: 30px Arial, sans-serif;fill:#111;text-anchor:middle}
    .small{font: 22px Arial, sans-serif;fill:#222;text-anchor:middle}
    .title{font:700 42px Arial, sans-serif;fill:#111}
    .arrow{stroke:#222;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .dash{stroke:#555;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#arrow)}
  </style>
</defs>

<rect width="1200" height="800" fill="#fafafa"/>
<text x="70" y="70" class="title">Mechanism flow</text>
<text x="70" y="108" font-family="Arial" font-size="22" fill="#444">Threat can grow before evidence does.</text>

<rect x="70" y="170" width="250" height="120" class="box"/>
<text x="195" y="218" class="txt">Uncertainty</text>
<text x="195" y="255" class="small">low information</text>

<rect x="475" y="170" width="250" height="120" class="box"/>
<text x="600" y="218" class="txt">Group cue</text>
<text x="600" y="255" class="small">“us” versus “them”</text>

<rect x="880" y="170" width="250" height="120" class="box"/>
<text x="1005" y="218" class="txt">Stereotype</text>
<text x="1005" y="255" class="small">expectation activates</text>

<path d="M320 230 L465 230" class="arrow"/>
<path d="M725 230 L870 230" class="arrow"/>

<rect x="880" y="390" width="250" height="120" class="risk"/>
<text x="1005" y="438" class="txt">Threat appraisal</text>
<text x="1005" y="475" class="small">ambiguity feels risky</text>

<rect x="475" y="390" width="250" height="120" class="soft"/>
<text x="600" y="438" class="txt">Narrowed attention</text>
<text x="600" y="475" class="small">confirming cues win</text>

<rect x="70" y="390" width="250" height="120" class="soft"/>
<text x="195" y="438" class="txt">Harsher response</text>
<text x="195" y="475" class="small">restriction feels safer</text>

<path d="M1005 290 L1005 380" class="arrow"/>
<path d="M880 450 L735 450" class="arrow"/>
<path d="M475 450 L330 450" class="arrow"/>

<path d="M195 510 C190 650, 790 680, 995 520" class="dash"/>
<text x="600" y="655" class="small">Response can reinforce fear.</text>

<rect x="335" y="690" width="530" height="70" class="box"/>
<text x="600" y="733" class="small">Safeguard: slow down, individuate, corroborate.</text>
</svg>