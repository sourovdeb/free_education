<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Hypothetical investigation scenario</title>
<desc id="desc">Timeline showing how an ambiguous observation can become group-based threat inference, then how safeguards can interrupt the chain.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
    <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
  </marker>
  <style>
    .node{fill:#fff;stroke:#222;stroke-width:3;rx:18}
    .warn{fill:#ececec;stroke:#111;stroke-width:4;rx:18}
    .safe{fill:#f7f7f7;stroke:#222;stroke-width:3;rx:18}
    .h{font:700 40px Arial,sans-serif;fill:#111}
    .t{font:24px Arial,sans-serif;fill:#111;text-anchor:middle}
    .s{font:21px Arial,sans-serif;fill:#333;text-anchor:middle}
    .a{stroke:#222;stroke-width:4;fill:none;marker-end:url(#arrow)}
    .cut{stroke:#111;stroke-width:4;stroke-dasharray:10 8}
  </style>
</defs>

<rect width="1200" height="800" fill="#fafafa"/>
<text x="70" y="70" class="h">Concrete scenario</text>
<text x="70" y="108" font-family="Arial" font-size="22" fill="#444">Hypothetical. No guilt implied.</text>

<rect x="60" y="180" width="200" height="120" class="node"/>
<text x="160" y="225" class="t">Alarm sounds</text>
<text x="160" y="262" class="s">information stays thin</text>

<rect x="300" y="180" width="200" height="120" class="node"/>
<text x="400" y="225" class="t">Stranger appears</text>
<text x="400" y="262" class="s">group cue noticed</text>

<rect x="540" y="180" width="200" height="120" class="warn"/>
<text x="640" y="225" class="t">Object seems risky</text>
<text x="640" y="262" class="s">tool or weapon?</text>

<rect x="780" y="180" width="200" height="120" class="warn"/>
<text x="880" y="225" class="t">Peer says “danger”</text>
<text x="880" y="262" class="s">social cue arrives</text>

<path d="M260 240 L290 240" class="a"/>
<path d="M500 240 L530 240" class="a"/>
<path d="M740 240 L770 240" class="a"/>

<path d="M1000 160 L1000 340" class="cut"/>
<text x="1060" y="220" class="s">STOP</text>
<text x="1060" y="250" class="s">SAFEGUARDS</text>

<rect x="160" y="430" width="260" height="120" class="safe"/>
<text x="290" y="474" class="t">First account saved</text>
<text x="290" y="512" class="s">before group discussion</text>

<rect x="470" y="430" width="260" height="120" class="safe"/>
<text x="600" y="474" class="t">Actions separated</text>
<text x="600" y="512" class="s">from danger labels</text>

<rect x="780" y="430" width="260" height="120" class="safe"/>
<text x="910" y="474" class="t">Evidence corroborated</text>
<text x="910" y="512" class="s">independent sources checked</text>

<path d="M420 490 L460 490" class="a"/>
<path d="M730 490 L770 490" class="a"/>

<rect x="280" y="640" width="640" height="90" class="node"/>
<text x="600" y="680" class="t">Goal: separate perception</text>
<text x="600" y="715" class="s">from group-based inference.</text>
</svg>