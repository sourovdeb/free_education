<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Concrete investigation scenario</title><desc>Two reviewers see identical earlier evidence. One sees the later outcome first. The other remains outcome-blind.</desc><rect width="1400" height="900" fill="#f4f1e9"/><text x="70" y="90" font-family="monospace" font-size="44">CONCRETE SCENARIO</text><rect x="90" y="160" width="1220" height="120" fill="#fff" stroke="#111" stroke-width="3"/><text x="130" y="220" font-family="sans-serif" font-size="24">SAME EARLIER FILE: vague threat, missed call, no prior violence.</text><rect x="90" y="350" width="520" height="380" fill="#fff" stroke="#111" stroke-width="3"/><rect x="790" y="350" width="520" height="380" fill="#fff" stroke="#111" stroke-width="3"/><text x="130" y="410" font-family="sans-serif" font-size="30">REVIEWER A</text><text x="830" y="410" font-family="sans-serif" font-size="30">REVIEWER B</text><text x="130" y="480" font-family="sans-serif" font-size="23">Outcome revealed first.</text><text x="130" y="540" font-family="sans-serif" font-size="23">Clues feel predictive.</text><text x="130" y="600" font-family="sans-serif" font-size="23">Risk feels obvious.</text><text x="830" y="480" font-family="sans-serif" font-size="23">Outcome stays hidden.</text><text x="830" y="540" font-family="sans-serif" font-size="23">Clues stay ambiguous.</text><text x="830" y="600" font-family="sans-serif" font-size="23">Several paths remain.</text><rect x="320" y="780" width="760" height="70" fill="#111"/><text x="380" y="825" font-family="monospace" font-size="23" fill="#fff">TEST THE SEQUENCE. NOT THE STORY.</text></svg>