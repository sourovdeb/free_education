<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Law versus science comparison</title><desc>Law asks what was foreseeable before harm. Research shows outcomes can change later estimates.</desc><rect width="1400" height="900" fill="#f4f1e9"/><text x="70" y="90" font-family="monospace" font-size="44">LAW VERSUS SCIENCE</text><rect x="80" y="170" width="540" height="520" fill="#fff" stroke="#111" stroke-width="3"/><rect x="780" y="170" width="540" height="520" fill="#fff" stroke="#111" stroke-width="3"/><text x="120" y="235" font-family="sans-serif" font-size="32">LAW</text><text x="820" y="235" font-family="sans-serif" font-size="32">SCIENCE</text><text x="120" y="310" font-family="sans-serif" font-size="24">What was knowable then?</text><text x="120" y="370" font-family="sans-serif" font-size="24">Foreseeability stays ex-ante.</text><text x="820" y="310" font-family="sans-serif" font-size="24">Outcomes reshape estimates.</text><text x="820" y="370" font-family="sans-serif" font-size="24">Effects vary by task.</text><rect x="190" y="740" width="1020" height="90" fill="#dedbd3" stroke="#111" stroke-width="3"/><text x="230" y="795" font-family="monospace" font-size="22">COUNTERPOINT: Some judges changed estimates, not rulings.</text></svg>