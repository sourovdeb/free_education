<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img"><title>Hindsight bias mechanism flow</title><desc>Outcome knowledge can reduce remembered uncertainty.</desc><rect width="1400" height="900" fill="#f4f1e9"/><text x="70" y="90" font-family="monospace" font-size="44">HINDSIGHT BIAS</text><text x="70" y="180" font-family="sans-serif" font-size="24">BEFORE → OUTCOME → REBUILD → INEVITABLE → JUDGE</text><rect x="100" y="260" width="1200" height="320" fill="#fff" stroke="#111" stroke-width="3"/><text x="150" y="340" font-family="sans-serif" font-size="25">Many paths exist.</text><text x="150" y="400" font-family="sans-serif" font-size="25">One outcome becomes known.</text><text x="150" y="460" font-family="sans-serif" font-size="25">Memory and estimates can shift.</text><text x="150" y="520" font-family="sans-serif" font-size="25">The past can feel inevitable.</text><rect x="100" y="650" width="1200" height="120" fill="#dedbd3" stroke="#111" stroke-width="3"/><text x="150" y="720" font-family="monospace" font-size="24">CHECK: timestamp forecasts; preserve alternatives; separate later facts.</text></svg>