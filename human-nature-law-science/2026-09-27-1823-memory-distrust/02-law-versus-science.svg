<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Law versus science comparison</title><desc id="d">Two columns compare legal voluntariness questions with scientific reliability questions, joined by a shared verification zone.</desc><rect width="1200" height="720" fill="white"/><g stroke="black" fill="none" stroke-width="4"><rect x="70" y="130" width="470" height="460" rx="20"/><rect x="660" y="130" width="470" height="460" rx="20"/><circle cx="600" cy="360" r="88"/><path d="M540 360 H660"/></g><g font-family="DejaVu Sans, sans-serif" fill="black"><text x="305" y="100" font-size="42" text-anchor="middle">LAW</text><text x="895" y="100" font-size="42" text-anchor="middle">SCIENCE</text><text x="110" y="190" font-size="27">Was coercion used?</text><text x="110" y="250" font-size="27">Were rights waived?</text><text x="110" y="310" font-size="27">Was admission voluntary?</text><text x="110" y="370" font-size="27">Is evidence admissible?</text><text x="700" y="190" font-size="27">Was memory stable?</text><text x="700" y="250" font-size="27">Was suggestion present?</text><text x="700" y="310" font-size="27">Was fatigue present?</text><text x="700" y="370" font-size="27">Is evidence reliable?</text><text x="600" y="342" font-size="24" text-anchor="middle">VERIFY</text><text x="600" y="375" font-size="20" text-anchor="middle">independent facts</text><text x="600" y="650" font-size="26" text-anchor="middle">Admissibility and reliability differ.</text></g></svg>