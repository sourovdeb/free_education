<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Concrete interview scenario</title><desc id="d">A timeline shows an innocent suspect moving from denial through fatigue and false evidence toward a signed statement, followed by independent verification.</desc><rect width="1200" height="720" fill="white"/><g fill="none" stroke="black" stroke-width="4" stroke-linecap="round"><path d="M90 430 H1110"/><path d="M1110 430 l-18 -12 M1110 430 l-18 12"/><circle cx="150" cy="430" r="12" fill="white"/><circle cx="350" cy="430" r="12" fill="white"/><circle cx="550" cy="430" r="12" fill="white"/><circle cx="750" cy="430" r="12" fill="white"/><circle cx="950" cy="430" r="12" fill="white"/><path d="M150 418 V260 M350 418 V320 M550 418 V220 M750 418 V300 M950 418 V200"/><path d="M520 170 q30 -35 60 0 q30 35 60 0"/><path d="M720 260 q30 -35 60 0 q30 35 60 0"/></g><g font-family="DejaVu Sans, sans-serif" fill="black" text-anchor="middle"><text x="600" y="75" font-size="40">A confession needs testing</text><text x="150" y="235" font-size="27">DENIAL</text><text x="150" y="470" font-size="20">0:00</text><text x="350" y="295" font-size="27">FATIGUE</text><text x="350" y="470" font-size="20">2:00</text><text x="550" y="195" font-size="27">FALSE EVIDENCE</text><text x="550" y="470" font-size="20">3:00</text><text x="750" y="275" font-size="27">SIGNATURE</text><text x="750" y="470" font-size="20">4:00</text><text x="950" y="175" font-size="27">VERIFY</text><text x="950" y="470" font-size="20">NEXT</text><text x="950" y="535" font-size="22">Check hidden facts.</text><text x="950" y="568" font-size="22">Check physical evidence.</text><text x="950" y="601" font-size="22">Revisit alternatives.</text></g></svg>