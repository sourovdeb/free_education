<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Revenge reward loop</title><desc id="desc">Flow diagram showing grievance, anger, revenge opportunity, reward signal, brief relief, rumination, and renewed anger.</desc><rect width="1200" height="1600" fill="#f4f1e8"/><g font-family="Arial, Helvetica, sans-serif" fill="#111"><text x="80" y="110" font-size="54" font-weight="700">Page 3 — Revenge Loop</text><text x="80" y="165" font-size="28">A mechanism, not destiny.</text></g><g font-family="Arial, Helvetica, sans-serif"><rect x="120" y="250" width="960" height="150" rx="16" fill="#fff" stroke="#111" stroke-width="4"/><text x="170" y="315" font-size="38" font-weight="700">1. Perceived wrong</text><text x="170" y="365" font-size="28">A grievance gets encoded.</text><line x1="600" y1="400" x2="600" y2="485" stroke="#111" stroke-width="6"/><polygon points="600,520 580,480 620,480" fill="#111"/><rect x="120" y="530" width="960" height="150" rx="16" fill="#fff" stroke="#111" stroke-width="4"/><text x="170" y="595" font-size="38" font-weight="700">2. Anger approaches</text><text x="170" y="645" font-size="28">The offender gains salience.</text><line x1="600" y1="680" x2="600" y2="765" stroke="#111" stroke-width="6"/><polygon points="600,800 580,760 620,760" fill="#111"/><rect x="120" y="810" width="960" height="170" rx="16" fill="#fff" stroke="#111" stroke-width="4"/><text x="170" y="875" font-size="38" font-weight="700">3. Revenge opportunity</text><text x="170" y="925" font-size="28">Reward processing can rise.</text><text x="170" y="960" font-size="24">Lab evidence shows this.</text><line x1="600" y1="980" x2="600" y2="1065" stroke="#111" stroke-width="6"/><polygon points="600,1100 580,1060 620,1060" fill="#111"/><rect x="120" y="1110" width="960" height="150" rx="16" fill="#e7e2d8" stroke="#111" stroke-width="4"/><text x="170" y="1175" font-size="38" font-weight="700">4. Brief relief</text><text x="170" y="1225" font-size="28">Positive affect may rise.</text><line x1="600" y1="1260" x2="600" y2="1345" stroke="#111" stroke-width="6"/><polygon points="600,1380 580,1340 620,1340" fill="#111"/><rect x="120" y="1390" width="960" height="130" rx="16" fill="#fff" stroke="#111" stroke-width="4"/><text x="170" y="1450" font-size="36" font-weight="700">5. Rumination continues</text><text x="170" y="1495" font-size="26">Anger may restart.</text><path d="M110 1450 C25 1450,25 330,110 330" fill="none" stroke="#111" stroke-width="5" stroke-dasharray="14 12"/><polygon points="110,330 72,310 72,350" fill="#111"/></g></svg>