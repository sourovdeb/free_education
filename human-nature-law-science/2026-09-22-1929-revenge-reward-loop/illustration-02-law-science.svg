<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Law versus science on revenge</title><desc id="desc">Comparison diagram showing legal categories of cooling time and culpability against scientific findings on rumination, planning, and reward.</desc><rect width="1200" height="1600" fill="#f4f1e8"/><g font-family="Arial, Helvetica, sans-serif" fill="#111"><text x="80" y="110" font-size="54" font-weight="700">Page 4 — Law / Science</text><text x="80" y="165" font-size="28">Same act. Different questions.</text></g><g font-family="Arial, Helvetica, sans-serif"><rect x="70" y="245" width="500" height="1120" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><rect x="630" y="245" width="500" height="1120" rx="20" fill="#fff" stroke="#111" stroke-width="4"/><text x="240" y="325" font-size="44" font-weight="700">LAW</text><text x="760" y="325" font-size="44" font-weight="700">SCIENCE</text><text x="115" y="415" font-size="30" font-weight="700">Question</text><text x="115" y="465" font-size="27">Was passion sudden?</text><text x="115" y="510" font-size="27">Was cooling possible?</text><text x="115" y="555" font-size="27">Was revenge planned?</text><text x="115" y="650" font-size="30" font-weight="700">Legal split</text><text x="115" y="700" font-size="27">Hot passion mitigates.</text><text x="115" y="745" font-size="27">Cool revenge aggravates.</text><text x="115" y="790" font-size="27">Rules need thresholds.</text><text x="115" y="885" font-size="30" font-weight="700">Case example</text><text x="115" y="935" font-size="27">State v. Soto.</text><text x="115" y="980" font-size="27">Planning mattered there.</text><text x="115" y="1025" font-size="27">Revenge stayed distinct.</text><text x="675" y="415" font-size="30" font-weight="700">Question</text><text x="675" y="465" font-size="27">What maintains anger?</text><text x="675" y="510" font-size="27">What rewards retaliation?</text><text x="675" y="555" font-size="27">What changes decisions?</text><text x="675" y="650" font-size="30" font-weight="700">Observed overlap</text><text x="675" y="700" font-size="27">Planning can stay emotional.</text><text x="675" y="745" font-size="27">Rumination can preserve anger.</text><text x="675" y="790" font-size="27">Reward can reinforce action.</text><text x="675" y="885" font-size="30" font-weight="700">Scientific limit</text><text x="675" y="935" font-size="27">Groups are studied.</text><text x="675" y="980" font-size="27">Individuals still vary.</text><text x="675" y="1025" font-size="27">Science cannot assign guilt.</text><line x1="570" y1="1120" x2="630" y2="1120" stroke="#111" stroke-width="8"/><polygon points="630,1120 596,1100 596,1140" fill="#111"/><polygon points="570,1120 604,1100 604,1140" fill="#111"/><rect x="170" y="1200" width="860" height="250" rx="18" fill="#e7e2d8" stroke="#111" stroke-width="4"/><text x="220" y="1270" font-size="36" font-weight="700">Conflict zone</text><text x="220" y="1330" font-size="28">Law needs categories.</text><text x="220" y="1375" font-size="28">Science sees mixtures.</text><text x="220" y="1420" font-size="28">Neither replaces the other.</text></g></svg>