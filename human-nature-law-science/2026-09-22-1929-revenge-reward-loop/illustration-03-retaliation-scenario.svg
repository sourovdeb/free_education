<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc"><title id="title">Retaliation scenario</title><desc id="desc">Scenario diagram showing an insult, anger, revenge planning, target substitution, and conflict spread.</desc><rect width="1200" height="1600" fill="#f4f1e8"/><g font-family="Arial, Helvetica, sans-serif" fill="#111"><text x="80" y="110" font-size="54" font-weight="700">Page 5 — Retaliation</text><text x="80" y="165" font-size="28">One grievance can spread.</text></g><g font-family="Arial, Helvetica, sans-serif"><circle cx="220" cy="350" r="90" fill="#fff" stroke="#111" stroke-width="4"/><text x="178" y="360" font-size="34" font-weight="700">A</text><circle cx="980" cy="350" r="90" fill="#fff" stroke="#111" stroke-width="4"/><text x="938" y="360" font-size="34" font-weight="700">B</text><line x1="310" y1="350" x2="890" y2="350" stroke="#111" stroke-width="6"/><polygon points="890,350 850,330 850,370" fill="#111"/><text x="470" y="315" font-size="30" font-weight="700">public insult</text><rect x="130" y="530" width="940" height="170" rx="16" fill="#fff" stroke="#111" stroke-width="4"/><text x="180" y="595" font-size="36" font-weight="700">Anger begins</text><text x="180" y="645" font-size="28">Revenge becomes salient.</text><line x1="600" y1="700" x2="600" y2="790" stroke="#111" stroke-width="6"/><polygon points="600,825 580,785 620,785" fill="#111"/><rect x="130" y="835" width="940" height="200" rx="16" fill="#e7e2d8" stroke="#111" stroke-width="4"/><text x="180" y="900" font-size="36" font-weight="700">Revenge planning</text><text x="180" y="950" font-size="28">Rumination maintains focus.</text><text x="180" y="995" font-size="28">Planning can stay emotional.</text><line x1="600" y1="1035" x2="600" y2="1125" stroke="#111" stroke-width="6"/><polygon points="600,1160 580,1120 620,1120" fill="#111"/><circle cx="330" cy="1290" r="80" fill="#fff" stroke="#111" stroke-width="4"/><text x="300" y="1300" font-size="32" font-weight="700">B</text><circle cx="870" cy="1290" r="80" fill="#fff" stroke="#111" stroke-width="4"/><text x="840" y="1300" font-size="32" font-weight="700">C</text><line x1="410" y1="1290" x2="790" y2="1290" stroke="#111" stroke-width="6" stroke-dasharray="12 10"/><polygon points="790,1290 750,1270 750,1310" fill="#111"/><text x="485" y="1245" font-size="30" font-weight="700">wrong target</text><text x="170" y="1425" font-size="30" font-weight="700">Possible result:</text><text x="170" y="1475" font-size="28">Conflict spreads outward.</text><text x="170" y="1520" font-size="24">Anger, uncertainty, pressure.</text></g></svg>