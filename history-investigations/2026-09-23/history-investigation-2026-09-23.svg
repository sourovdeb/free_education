<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Evidence ladder for History Investigation, 23 September 2026</title><desc id="desc">A dated timeline for Haiti, Berlin, Partition, Iran and Project Paperclip. It leads to three evidence layers and a behavior mechanism for reputation tracking.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#10202b}.small{font-size:17px}.label{font-weight:700;font-size:20px}.date{font-weight:700;font-size:22px}.box{fill:#f4f7f8;stroke:#10202b;stroke-width:2}.record{fill:#d9edf7}.interpret{fill:#fff0c9}.unknown{fill:#f4dce0}.line{stroke:#0b4f6c;stroke-width:4}.arrow{fill:none;stroke:#0b4f6c;stroke-width:4;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b4f6c"/></marker></defs>
  <rect width="1200" height="760" fill="#fffdf8"/><text x="55" y="55" class="label">History Investigation: evidence before explanation</text><text x="55" y="82" class="small">Five cases are dated; claims descend through record, interpretation, and uncertainty.</text>
  <line x1="95" y1="160" x2="1100" y2="160" class="line"/>
  <g><circle cx="145" cy="160" r="12" fill="#0b4f6c"/><text x="92" y="124" class="date">1825</text><text x="65" y="205" class="small">Haiti debt demand</text></g>
  <g><circle cx="360" cy="160" r="12" fill="#0b4f6c"/><text x="308" y="124" class="date">1885</text><text x="278" y="205" class="small">Berlin Act</text></g>
  <g><circle cx="575" cy="160" r="12" fill="#0b4f6c"/><text x="523" y="124" class="date">1945–59</text><text x="500" y="205" class="small">Paperclip</text></g>
  <g><circle cx="790" cy="160" r="12" fill="#0b4f6c"/><text x="738" y="124" class="date">1947</text><text x="705" y="205" class="small">Partition timing</text></g>
  <g><circle cx="1005" cy="160" r="12" fill="#0b4f6c"/><text x="953" y="124" class="date">1953</text><text x="929" y="205" class="small">Iran coup</text></g>
  <rect x="55" y="260" width="330" height="92" rx="0" class="box record"/><text x="75" y="292" class="label">1. Documented record</text><text x="75" y="322" class="small">Orders, plans, treaties, dates.</text>
  <rect x="435" y="260" width="330" height="92" rx="0" class="box interpret"/><text x="455" y="292" class="label">2. Interpretation</text><text x="455" y="322" class="small">How scholars weigh incentives.</text>
  <rect x="815" y="260" width="330" height="92" rx="0" class="box unknown"/><text x="835" y="292" class="label">3. Uncertainty</text><text x="835" y="322" class="small">What sources cannot establish.</text>
  <path d="M385 306 L430 306 M765 306 L810 306" class="arrow"/>
  <text x="55" y="430" class="label">Primitive Echo: reputation under repeated interaction</text>
  <rect x="55" y="470" width="225" height="85" class="box"/><text x="78" y="505" class="label">Repeated contact</text><text x="78" y="533" class="small">small-group stakes</text>
  <rect x="360" y="470" width="225" height="85" class="box"/><text x="386" y="505" class="label">Reputation tracking</text><text x="386" y="533" class="small">gossip and memory</text>
  <rect x="665" y="470" width="225" height="85" class="box"/><text x="705" y="505" class="label">Cooperation</text><text x="705" y="533" class="small">trust and exchange</text>
  <rect x="970" y="470" width="175" height="85" class="box unknown"/><text x="995" y="505" class="label">Possible harm</text><text x="1000" y="533" class="small">exclusion</text>
  <path d="M280 512 L355 512 M585 512 L660 512 M890 512 L965 512" class="arrow"/>
  <text x="55" y="650" class="small">Inference boundary: evolved pressures may shape attention to reputation. They do not excuse mistreatment, prove a fixed instinct, or replace cultural explanation.</text>
  <text x="55" y="705" class="small">Original SVG — text and geometry only; no copyrighted imagery.</text>
</svg>
