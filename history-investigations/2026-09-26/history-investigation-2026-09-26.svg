<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">From arbitrary label to in-group favoritism—and ways to interrupt it</title>
  <desc id="desc">A behavior-mechanism diagram. An arbitrary visible label can be read as a coalition cue, which shapes expectations of reciprocity and can produce in-group favoritism. Cross-cutting identities, shared goals, repeated contact, and fair institutions can weaken the boundary. The diagram distinguishes experimental evidence from evolutionary interpretation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#172b4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8fd3ff"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" fill="#fff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Primitive Echo: when a badge becomes “us”</text>
  <text x="70" y="112" fill="#bbd4ef" font-family="system-ui, sans-serif" font-size="18">Experimental result, evolutionary interpretation, and practical counterweights</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <rect x="70" y="180" width="255" height="170" rx="22" fill="#173e63" stroke="#6dc5f5" stroke-width="2"/>
    <circle cx="135" cy="235" r="26" fill="#ffca5c"/>
    <rect x="186" y="209" width="52" height="52" rx="10" fill="#ff7e79"/>
    <text x="95" y="297" fill="#fff" font-size="23" font-weight="700">1. Arbitrary label</text>
    <text x="95" y="326" fill="#cfe9fb" font-size="16">color, team, icon, category</text>

    <rect x="472" y="180" width="255" height="170" rx="22" fill="#173e63" stroke="#6dc5f5" stroke-width="2"/>
    <path d="M522 245 C555 205, 605 205, 638 245 M535 257 C562 230, 598 230, 625 257" fill="none" stroke="#ffca5c" stroke-width="8" stroke-linecap="round"/>
    <text x="497" y="297" fill="#fff" font-size="23" font-weight="700">2. Coalition cue</text>
    <text x="497" y="326" fill="#cfe9fb" font-size="16">“who is likely to act with whom?”</text>

    <rect x="874" y="180" width="255" height="170" rx="22" fill="#173e63" stroke="#6dc5f5" stroke-width="2"/>
    <path d="M930 254 h54 l16 -24 16 24 h56" fill="none" stroke="#ff7e79" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="899" y="297" fill="#fff" font-size="23" font-weight="700">3. Favoritism risk</text>
    <text x="899" y="326" fill="#cfe9fb" font-size="16">more trust, rewards, cooperation</text>
  </g>

  <path d="M335 265 H457" stroke="#8fd3ff" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M737 265 H859" stroke="#8fd3ff" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="70" y="406" width="1059" height="218" rx="24" fill="#f4f8fc"/>
  <text x="104" y="454" fill="#143552" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Counterweights: make the old boundary less predictive</text>
  <g font-family="system-ui, sans-serif" font-size="18">
    <rect x="104" y="487" width="224" height="88" rx="16" fill="#d9f2e6"/>
    <text x="126" y="523" fill="#143552" font-weight="700">Cross-cutting identities</text>
    <text x="126" y="550" fill="#31536c">several overlapping “us” groups</text>
    <rect x="352" y="487" width="224" height="88" rx="16" fill="#e6e3fb"/>
    <text x="374" y="523" fill="#143552" font-weight="700">Shared goals</text>
    <text x="374" y="550" fill="#31536c">cooperation across the badge</text>
    <rect x="600" y="487" width="224" height="88" rx="16" fill="#ffe8cf"/>
    <text x="622" y="523" fill="#143552" font-weight="700">Repeated contact</text>
    <text x="622" y="550" fill="#31536c">new evidence about individuals</text>
    <rect x="848" y="487" width="247" height="88" rx="16" fill="#d9edf8"/>
    <text x="870" y="523" fill="#143552" font-weight="700">Fair institutions</text>
    <text x="870" y="550" fill="#31536c">rules that constrain partiality</text>
  </g>
  <text x="70" y="672" fill="#bbd4ef" font-family="system-ui, sans-serif" font-size="16">Evidence: minimal-group experiments and meta-analysis. Interpretation: alliance tracking as an evolved, flexible system—not a fixed destiny.</text>
</svg>
