<body><div class="app"><aside><div class="brand">HISTORY INVESTIGATION</div><h1>Bargains, systems,<br>and punishment</h1><ol class="chapters" id="chapters"></ol></aside>
<main><div class="meta" id="meta"></div><h2 id="title"></h2><p class="summary" id="summary"></p><div class="mechanism" id="mechanism" aria-label="Mechanism steps"></div>
<div class="grid"><section class="panel"><h3>DOCUMENTED FACT</h3><p id="fact"></p></section><section class="panel"><h3>INTERPRETATION</h3><p id="interpretation"></p></section><section class="panel"><h3>UNCERTAINTY</h3><p id="uncertainty"></p></section></div>

<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Bargains, systems, and punishment", "edition_date": "2026-09-27", "edition_time": "16:00", "timezone": "Indian/Reunion", "slug": "bargains-systems-and-punishment", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive doodle"}, "chapters": [{"number": 1, "title": "Partition: bargaining collapsed before borders appeared", "short_title": "A failed bargain", "summary": "Partition followed competing projects, failed safeguards, and a rushed transfer. One leader’s ambition cannot explain it.", "documented_fact": "Britain’s Cabinet Mission proposed federation in 1946. Provinces would enter three groups. Congress and the Muslim League initially accepted parts. Their interpretations soon diverged. Congress resisted compulsory grouping. Jinnah’s League later withdrew acceptance. It demanded Pakistan again. Communal violence then widened. Mountbatten advanced British withdrawal. Independence came in August 1947. Boundary awards arrived afterward. Millions crossed new borders. Catastrophic violence accompanied migration.", "scholarly_interpretation": "Power mattered for every leadership. Yet a single power-grab story fails. Congress favored a stronger center. The League sought enforceable Muslim safeguards. British officials wanted rapid exit. Provincial interests complicated both positions. Violence narrowed political options. The final settlement emerged through interaction. Bargaining failure amplified distrust. Imperial haste multiplied human costs.", "uncertainty": "Motives cannot be measured exactly. Jinnah’s preferred endpoint remains debated. Some historians emphasize bargaining leverage. Others stress sincere nationhood. Cabinet Mission success was never assured. Later memoirs protect reputations. Counterfactual unity cannot be proven. Responsibility was distributed unevenly. It was never singular.", "sources": [{"title": "India Statement by the Cabinet Mission — UK Parliament", "url": "https://api.parliament.uk/historic-hansard/lords/1946/may/16/india-statement-by-the-cabinet-mission"}, {"title": "Partition of India — Partition Museum", "url": "https://www.partitionmuseum.org/partition-of-india"}, {"title": "Jinnah on Partition, 4 May 1947 — UK National Archives", "url": "https://www.nationalarchives.gov.uk/education/resources/indian-independence/jinnah-partition/"}, {"title": "U.S. Assessment of Partition, 1947 — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1947v03/d91"}], "visual": {"icon": "boundary", "steps": ["A federation is proposed", "Safeguards remain disputed", "Violence narrows choices", "A hurried border follows"], "caption": "Failed bargaining became mass displacement."}}, {"number": 2, "title": "Berlin Airlift: currency reform preceded blockade", "short_title": "Coercion meets logistics", "summary": "The Soviet blockade was coercive. Western currency reform formed its immediate setting.", "documented_fact": "Germany remained under four-power occupation. Berlin also had four sectors. Western zones moved toward economic merger. They introduced a new currency. Western authorities extended it into West Berlin. Soviet authorities objected. They blocked land access in June 1948. Electricity was also restricted. Western aircraft supplied the city. Flights delivered food and coal. They continued for eleven months. The Soviet Union lifted restrictions. The airlift ended afterward.", "scholarly_interpretation": "Currency reform was an immediate trigger. It was not moral equivalence. The blockade targeted civilian supply. Stalin sought political leverage. Western leaders answered without armed convoys. Logistics became strategic communication. Every landing signaled endurance. The crisis also hardened division. Two German states soon emerged.", "uncertainty": "Intentions remain partly inferred. Soviet records reveal security fears. Western integration was already advancing. Neither side desired general war. Exact causal weights remain disputed. The airlift served propaganda too. Humanitarian benefit was still real. Context explains coercion. It does not excuse it.", "sources": [{"title": "The Berlin Airlift, 1948–1949 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1945-1952/berlin-airlift"}, {"title": "The Berlin Airlift 1948/49 — Allied Museum", "url": "https://www.alliiertenmuseum.de/en/thema/the-berlin-airlift-1948-49/"}, {"title": "Report on the Berlin Blockade — UK National Archives", "url": "https://www.nationalarchives.gov.uk/education/resources/cold-war-on-file/report-on-blockade-ordered/"}], "visual": {"icon": "plane", "steps": ["Western currency changes", "Soviets close land routes", "Aircraft sustain Berlin", "Division hardens"], "caption": "A logistical answer avoided armed passage."}}, {"number": 3, "title": "Bhopal: catastrophe came through a system", "short_title": "Layers failed together", "summary": "Water triggered a lethal reaction. Disabled safeguards and weak preparedness magnified it.", "documented_fact": "Water entered a methyl-isocyanate tank. A runaway reaction followed. Toxic gas escaped overnight. It reached nearby settlements. Thousands died immediately or soon. Many more developed lasting illness. Refrigeration was not operating. Other safeguards proved inadequate. Public warnings failed. Emergency information was poor. The plant stored large MIC quantities. Maintenance and staffing had declined.", "scholarly_interpretation": "The disaster resists one-part explanations. A chemical trigger mattered. So did organizational decisions. Cost pressures weakened safety margins. Urban proximity increased exposure. Neighborhood poverty increased vulnerability. Medical uncertainty delayed treatment. Regulation and emergency planning failed. Corporate structure complicated accountability. This was a sociotechnical catastrophe. Hazards became disaster through institutions.", "uncertainty": "Entry of water is accepted. How it entered remains disputed. Union Carbide alleged sabotage. Many analyses emphasize maintenance failures. Reliable proof of sabotage remains contested. The gas cloud’s composition is debated. Death totals vary substantially. Long-term exposure estimates differ. Uncertainty should not erase established failures.", "sources": [{"title": "The Bhopal Disaster and Its Aftermath — Environmental Health", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC1142333/"}, {"title": "Mental Health of Bhopal Survivors — Indian Journal of Psychiatry", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC4361985/"}, {"title": "Bhopal Health Effects Review — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/12641179/"}, {"title": "What Caused the Bhopal Gas Tragedy? — Philosophy of Science", "url": "https://www.cambridge.org/core/services/aop-cambridge-core/content/view/B0D7836EA17B49296DD5E92DD9FFD698/S0031824800018122a.pdf/what-caused-the-bhopal-gas-tragedy-the-philosophical-importance-of-causal-and-pragmatic-details.pdf"}], "visual": {"icon": "tank", "steps": ["Water reaches stored MIC", "Heat and pressure rise", "Safeguards prove inadequate", "Communities receive little warning"], "caption": "A trigger met weakened defenses."}}, {"number": 4, "title": "Rwanda: genocide was organized, not ancient", "short_title": "Mobilized mass violence", "summary": "Extremist leaders used institutions, media, militias, and local authority to direct killing.", "documented_fact": "The genocide began in April 1994. Extremist leaders targeted Tutsi civilians. Moderate Hutu were also murdered. Officials distributed weapons and orders. Militias operated roadblocks. Local leaders mobilized neighbors. RTLM broadcasts promoted persecution. Some broadcasts directly incited killing. UN peacekeepers lacked capacity. The Security Council reduced the force. The Rwandan Patriotic Front ended the genocide. Its forces also committed abuses.", "scholarly_interpretation": "Calling this ancient tribal hatred misleads. Colonial rule had hardened identities. Postcolonial politics deepened exclusion. Yet organized choices activated violence. Administrative reach accelerated participation. Propaganda identified enemies and permission. International retreat reduced deterrence. Structure mattered. Perpetrators still retained agency.", "uncertainty": "Planning unfolded at several levels. Scholars debate its timing and centralization. Participation motives varied. Fear, coercion, gain, and ideology mixed. Victim totals are estimates. RPF violations require investigation. They do not negate genocide findings. International action might have saved lives. Exact counterfactual numbers remain unknowable.", "sources": [{"title": "The Rwanda Genocide — U.S. Holocaust Memorial Museum", "url": "https://encyclopedia.ushmm.org/content/en/article/the-rwanda-genocide"}, {"title": "Three Media Leaders Convicted — UN International Criminal Tribunal for Rwanda", "url": "https://unictr.irmct.org/en/news/three-media-leaders-convicted-genocide"}, {"title": "Independent Inquiry into UN Actions — UN Digital Library", "url": "https://digitallibrary.un.org/record/405039?v=pdf"}, {"title": "UNAMIR Background — United Nations Peacekeeping", "url": "https://peacekeeping.un.org/sites/default/files/past/unamirFT.htm"}], "visual": {"icon": "radio", "steps": ["Leaders define an enemy", "Media spreads permission", "Officials mobilize locally", "International protection recedes"], "caption": "Institutions converted ideology into killing."}}, {"number": 5, "title": "The NPT: restraint rests on an unequal bargain", "short_title": "An unequal bargain", "summary": "Most states renounced nuclear weapons. Nuclear powers promised peaceful access and disarmament pursuit.", "documented_fact": "The treaty opened in 1968. It entered force in 1970. Five states received nuclear-weapon status. The cutoff was January 1967. Other parties promised non-acquisition. Safeguards verify peaceful commitments. Article IV protects peaceful nuclear cooperation. Article VI requires disarmament negotiations. Most countries joined. India, Israel, and Pakistan did not. North Korea announced withdrawal in 2003.", "scholarly_interpretation": "The NPT is not simple prohibition. It embeds a political exchange. Non-nuclear states accept unequal status. In return, they claim technology access. They also expect disarmament progress. Verification raises detection costs. Security alliances also influence restraint. The treaty reinforces a broader system. Its inequality supports and strains compliance.", "uncertainty": "Causation is hard to isolate. Some states lacked weapons ambitions. Others relied on allies. Enforcement has been selective. Article VI has no deadline. Disarmament progress remains disputed. Peaceful technology can create dual-use capacity. The treaty reduced risks. It never eliminated them.", "sources": [{"title": "Text of the Nuclear Non-Proliferation Treaty — United Nations", "url": "https://www.un.org/en/conf/npt/2015/pdf/text%20of%20the%20treaty.pdf"}, {"title": "Treaty on the Non-Proliferation of Nuclear Weapons — IAEA", "url": "https://www.iaea.org/publications/documents/treaties/npt"}, {"title": "Nuclear Non-Proliferation Treaty — UN Office for Disarmament Affairs", "url": "https://disarmament.unoda.org/en/our-work/weapons-mass-destruction/nuclear-weapons/treaty-non-proliferation-nuclear-weapons"}], "visual": {"icon": "atom", "steps": ["Most states renounce bombs", "Safeguards verify materials", "Peaceful access continues", "Nuclear powers owe disarmament"], "caption": "Restraint depends on reciprocal legitimacy."}}, {"number": 6, "title": "Primitive Echo: why punishment feels worth paying", "short_title": "Costly punishment", "summary": "People sometimes pay to punish unfairness. That response may support cooperation, but culture strongly tunes it.", "documented_fact": "Experiments create shared-money dilemmas. Participants can punish free riders. Punishment costs the punisher. Many still choose it. Cooperation often rises afterward. Fifteen-population studies found punishment everywhere. Its strength varied greatly. Larger societies showed more third-party punishment. Antisocial punishment also occurs. People sometimes punish cooperators.", "scholarly_interpretation": "Costly punishment may stabilize norms. Groups benefit when cheating carries costs. Reputation can reward enforcers. Institutions can replace personal retaliation. Evolution likely shaped flexible tendencies. Culture supplies targets and limits. Modern outrage uses similar machinery. The same impulse supports boycotts. It also fuels pile-ons. Online punishment is unusually cheap. Visibility multiplies reputational rewards.", "uncertainty": "Laboratory games simplify life. Small stakes distort choices. Samples differ across societies. Punishment can destroy welfare. It may enforce harmful norms. Evolutionary pathways remain debated. Group selection is not settled. Cooperation has multiple mechanisms. Reciprocity and reputation also matter. Feeling punitive proves no guilt.", "sources": [{"title": "Reciprocity, Culture and Human Cooperation — Philosophical Transactions B", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2689715/"}, {"title": "More ‘Altruistic’ Punishment in Larger Societies — Proceedings B", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC2596817/"}, {"title": "The Origins and Psychology of Human Cooperation — Annual Review of Psychology", "url": "https://www.annualreviews.org/doi/10.1146/annurev-psych-081920-042106"}, {"title": "Costly Punishment Across Human Societies — Science", "url": "https://www.science.org/doi/10.1126/science.1127333"}], "visual": {"icon": "gavel", "steps": ["A member free rides", "Observers feel unfairness", "Punishers pay a cost", "Norms may strengthen"], "caption": "Punishment can cooperate or corrode."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
</script></body></html>
