<body><div class="app"><aside><div class="brand">HISTORY INVESTIGATION</div><h1>Lines, war,<br>and disgust</h1><ol class="chapters" id="chapters"></ol></aside>

<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Lines, war, and disgust", "edition_date": "2026-09-27", "edition_time": "15:00", "timezone": "Indian/Reunion", "slug": "lines-war-and-disgust", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive doodle"}, "chapters": [{"number": 1, "title": "Greenwich: zero longitude was negotiated", "short_title": "A political zero", "summary": "The prime meridian is conventional. British navigational dominance strengthened Greenwich’s candidacy.", "documented_fact": "Longitude needs an agreed starting line. Nature supplies none. Different states once used different meridians. Forty-one delegates met in Washington. They represented twenty-five nations. The conference opened in October 1884. Delegates recommended one global meridian. Greenwich won twenty-two votes. France and Brazil abstained. San Domingo voted against. British charts were already widespread. Much commercial shipping used Greenwich. The resolution simplified navigation and mapping.", "scholarly_interpretation": "Greenwich converted existing power into standards. British maritime reach created network effects. More users made switching cheaper. Agreement also served many states. Shared coordinates reduced practical confusion. The choice was therefore political and useful. It was not scientifically inevitable. Standards often hide negotiated history.", "uncertainty": "The conference only recommended adoption. National transitions happened gradually. France retained Paris time conventions longer. Greenwich itself later shifted geodetically. Modern zero longitude differs slightly. British dominance did not force every vote. Delegates weighed technical concerns. One cause cannot explain consensus. The line remains conventional. Its utility remains real.", "sources": [{"title": "Prime Meridian Line — Royal Museums Greenwich", "url": "https://www.rmg.co.uk/royal-observatory/attractions/stand-on-prime-meridian-line"}, {"title": "Adoption of a Prime Meridian — Royal Observatory Greenwich", "url": "https://www.royalobservatorygreenwich.org/articles.php?article=1240"}, {"title": "International Meridian Conference (1884) — Greenwich Meridian", "url": "https://www.thegreenwichmeridian.org/tgm/articles.php?article=10"}], "visual": {"icon": "gear", "steps": ["Many zero lines compete", "Shipping favors Greenwich", "Delegates vote", "A standard spreads"], "caption": "Useful standards can encode power."}}, {"number": 2, "title": "Napoleon in Egypt: scholarship served invasion", "short_title": "Science inside conquest", "summary": "The expedition advanced knowledge. It also catalogued Egypt during military occupation.", "documented_fact": "Napoleon invaded Egypt in 1798. He brought more than 160 scholars. Engineers and artists joined them. They formed the Institut d’Égypte. Their work covered antiquities and nature. It also covered towns and industry. French soldiers found the Rosetta Stone. The military campaign ultimately failed. Britain acquired the Stone in 1801. French research later filled the Description de l’Égypte. Publication began in 1809.", "scholarly_interpretation": "Science and conquest reinforced each other. Surveying produced valuable knowledge. Knowledge helped administration and prestige. The Description expanded Egyptology. It also framed Egypt for European audiences. Calling the scholars mere looters oversimplifies. Calling them detached researchers also fails. Their extraordinary work depended on invasion. Modern expertise grew inside imperial structures.", "uncertainty": "Individual motives varied widely. Some pursued genuine discovery. Egyptian scholars retained their own knowledge traditions. European accounts often marginalized them. The expedition did not create Egyptian history. Nor did one artifact decode everything. Champollion worked decades later. British possession followed French defeat. Present ownership debates remain unresolved.", "sources": [{"title": "Description of Egypt — Library of Congress", "url": "https://www.loc.gov/item/2021666110/"}, {"title": "Description de l’Égypte — Metropolitan Museum of Art", "url": "https://www.metmuseum.org/art/collection/search/591846"}, {"title": "Rosetta Stone Collection Record — British Museum", "url": "https://www.britishmuseum.org/collection/object/Y_EA24"}], "visual": {"icon": "scroll", "steps": ["An army invades", "Scholars survey", "Knowledge becomes volumes", "Empires claim artifacts"], "caption": "Discovery occurred inside occupation."}}, {"number": 3, "title": "Kellogg–Briand: failed peace, durable law", "short_title": "A treaty outlived failure", "summary": "The pact failed to stop war. Its outlawry principle still shaped later prosecutions.", "documented_fact": "Fifteen states signed in 1928. More joined afterward. They renounced war as policy. They promised peaceful dispute settlement. The pact created no enforcement machinery. Self-defense remained available. Japan invaded Manchuria in 1931. Italy invaded Ethiopia in 1935. Germany invaded Poland in 1939. The pact plainly failed prevention. Nuremberg prosecutors later cited it. They treated aggressive war as illegal.", "scholarly_interpretation": "The treaty was not simply naïve paper. It changed legal vocabulary. Conquest lost accepted legitimacy. Later institutions developed that shift. Nuremberg prosecuted crimes against peace. The UN Charter restricted force further. Yet causal claims remain contested. Law followed power as well. Great powers applied norms selectively. Failure and influence can coexist.", "uncertainty": "The pact did not cause postwar peace. Nuclear deterrence also mattered. Decolonization changed borders. American power shaped enforcement. Some scholars credit outlawry heavily. Others see retrospective importance. Nuremberg’s legality was disputed. Aggression remains difficult to prosecute. A norm can constrain behavior unevenly. It cannot explain every decline in conquest.", "sources": [{"title": "Kellogg–Briand Pact, 1928 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1921-1936/kellogg"}, {"title": "Nuremberg Judgment on the Pact — Yale Avalon Project", "url": "https://avalon.law.yale.edu/imt/judlawch.asp"}, {"title": "Why Have We Criminalized Aggressive War? — Yale Law Journal", "url": "https://yalelawjournal.org/article/why-have-we-criminalized-aggressive-war"}], "visual": {"icon": "scroll", "steps": ["States renounce war", "Aggressors ignore them", "Nuremberg cites the pact", "Outlawry survives"], "caption": "Immediate failure can leave law."}}, {"number": 4, "title": "Chile 1973: destabilization is documented", "short_title": "Pressure before the coup", "summary": "Washington undermined Allende. Direct control of the final coup remains unproven.", "documented_fact": "Salvador Allende won election in 1970. Nixon ordered covert opposition. CIA programs influenced media and politics. Track II sought to block inauguration. Coup plotting then involved Chilean officers. General Schneider was killed. After Track II failed, covert pressure continued. Economic and diplomatic hostility persisted. Chile’s military overthrew Allende on 11 September 1973. Pinochet’s dictatorship followed.", "scholarly_interpretation": "Declassified records establish American destabilization. Cold War strategy drove it. Nationalization and corporate interests also mattered. Washington helped weaken democratic legitimacy. Chilean actors still made decisive choices. Polarization, inflation, strikes, and institutional conflict mattered. The best account combines external intervention and domestic crisis. Neither cancels the other.", "uncertainty": "No released document proves Washington commanded the final operation. CIA reporting anticipated coup activity. Knowledge is not operational control. Missing records may remain. Absence cannot prove innocence. Broad claims need precise dates. The 1970 conspiracy differs from 1973. Pinochet’s later crimes remain his regime’s responsibility. American complicity should not erase Chilean agency.", "sources": [{"title": "Documents on Chile, 1969–1973 — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1969-76ve16"}, {"title": "Chile Declassified Documents — National Security Archive", "url": "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB8/nsaebb8i.htm"}, {"title": "Covert Action in Chile, 1963–1973 — U.S. National Archives", "url": "https://www.archives.gov/files/declassification/iscap/pdf/2010-009-doc17.pdf"}], "visual": {"icon": "newspaper", "steps": ["An election alarms Washington", "Covert pressure expands", "Domestic crisis deepens", "Chilean officers seize power"], "caption": "Intervention shaped conditions, not puppets."}}, {"number": 5, "title": "Smallpox: eradication required finding cases", "short_title": "Search beat blanket coverage", "summary": "Vaccination was essential. Surveillance and rapid containment made scarce doses decisive.", "documented_fact": "WHO launched eradication efforts in 1959. Progress was initially uneven. An intensified program began in 1967. Vaccination remained fundamental. Teams also searched for cases. They isolated patients when possible. Contacts received targeted vaccination. Rewards encouraged reporting. House-to-house searches found hidden outbreaks. This strategy became surveillance-containment. The last natural case appeared in 1977. WHO certified eradication in 1980.", "scholarly_interpretation": "The overlooked technology was information. Vaccines worked only when delivered. Case detection revealed transmission chains. Targeting conserved limited supply. Local workers made global coordination operational. Flexible strategy mattered more than slogans. Eradication joined biology with management. It was neither vaccine-only nor surveillance-only. Their combination broke spread.", "uncertainty": "Mass vaccination still mattered greatly. Country strategies differed. Surveillance-containment was not invented once. Several teams refined it. Reported cases could be missed. Political cooperation varied. Laboratory stocks remain today. Eradication does not mean zero future risk. Smallpox’s biology also helped. Humans were its only reservoir. Visible symptoms aided detection.", "sources": [{"title": "History of Smallpox Vaccination — World Health Organization", "url": "https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-smallpox-vaccination"}, {"title": "Mass Vaccination and Surveillance-Containment — American Journal of Epidemiology", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7120753/"}, {"title": "Global Smallpox Eradication — U.S. CDC", "url": "https://stacks.cdc.gov/view/cdc/27929/cdc_27929_DS1.pdf"}], "visual": {"icon": "umbrella", "steps": ["Teams search for cases", "Contacts become visible", "Vaccination rings the outbreak", "Transmission stops"], "caption": "Information multiplied vaccine impact."}}, {"number": 6, "title": "Primitive Echo: when disgust becomes morality", "short_title": "Contamination becomes condemnation", "summary": "Disease avoidance may shape disgust. Its spillover into moral severity is smaller and disputed.", "documented_fact": "Disgust promotes contaminant avoidance. Many triggers predict infection risk. Researchers call this behavioral immunity. Moral violations can also evoke disgust language. Early experiments induced incidental disgust. Participants sometimes judged acts more harshly. Later replications produced mixed results. A fifty-study meta-analysis found tiny effects. Publication-bias adjustment erased them. Newer reviews preserve the debate.", "scholarly_interpretation": "A protective emotion may be reused socially. Purity metaphors turn wrongdoing into contamination. That can intensify exclusion. Culture teaches which acts feel polluting. Biology supplies no complete moral code. Modern rhetoric exploits bodily language. Describing groups as dirty can make avoidance feel righteous. This mechanism is plausible, not universal.", "uncertainty": "Pathogen disgust has stronger evidence. Moral spillover has weaker evidence. Correlation does not prove causation. Political attitudes have many causes. Context and personality matter. Some laboratory findings did not replicate. Evolutionary accounts remain inferential. Disgust can follow moral judgment. It need not cause it. Treat visceral certainty as a signal, not a verdict.", "sources": [{"title": "Disgust as Disease Avoidance — Philosophical Transactions B", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3013466/"}, {"title": "Incidental Disgust Meta-analysis — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/26177951/"}, {"title": "What Does Disgust Have to Do With Moral Judgment? — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/41047371/"}], "visual": {"icon": "chatbot", "steps": ["Contamination triggers disgust", "Culture maps purity", "Wrongdoing feels polluting", "Condemnation may intensify"], "caption": "A feeling can masquerade as proof."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
</script></body></html>
