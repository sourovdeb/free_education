<body><div class="app"><aside><div class="brand">HISTORY INVESTIGATION</div><h1>Files, fear,<br>and persistence</h1><ol class="chapters" id="chapters"></ol></aside>

<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Files, fear, and persistence", "edition_date": "2026-09-27", "edition_time": "17:00", "timezone": "Indian/Reunion", "slug": "files-fear-and-persistence", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive doodle"}, "chapters": [{"number": 1, "title": "Dreyfus: institutional honor displaced evidence", "short_title": "A secret file", "summary": "Antisemitism enabled the injustice. Military self-protection prolonged it through secrecy and forgery.", "documented_fact": "France convicted Captain Alfred Dreyfus in 1894. He was a Jewish officer. Treason evidence centered on handwriting. Judges also received secret material. The defense could not inspect it. Lieutenant Colonel Picquart later found evidence implicating Esterhazy. Senior officers resisted reopening the case. Major Henry forged supporting evidence. His forgery was exposed. Dreyfus faced another conviction in 1899. A presidential pardon followed. France’s highest court fully exonerated him in 1906.", "scholarly_interpretation": "Antisemitism made Dreyfus a plausible target. Institutional loyalty sustained the error. Leaders feared military disgrace. Secrecy protected their earlier judgment. Each defense raised reversal costs. Zola’s intervention widened public scrutiny. The affair became a constitutional struggle. Republican justice confronted nationalist authority.", "uncertainty": "No single motive explains every actor. Some officers likely believed guilt. Others knowingly concealed contrary evidence. Public camps also changed. The affair influenced Zionist debate. It did not alone create Zionism. Exact effects on French politics remain debated. Exoneration establishes innocence. It cannot reveal every private motive.", "sources": [{"title": "Dreyfus Military Justice File — French Ministry of Defence", "url": "https://www.memoiredeshommes.defense.gouv.fr/recrutement-parcours-individuels/des-hommes-des-vies/dossier-de-justice-militaire-dalfred-dreyfus-dit-dossier-secret"}, {"title": "Recognition of Alfred Dreyfus’s Innocence — Cour de cassation", "url": "https://www.courdecassation.fr/toutes-les-actualites/2026/07/12/journee-de-commemoration-nationale-de-la-reconnaissance-de"}, {"title": "The Dreyfus Affair — National Library of Israel", "url": "https://www.nli.org.il/en/discover/judaism/jewish-history/dreyfus-affair"}, {"title": "Dreyfus: Engagement and Propaganda — Museum of Jewish Art and History", "url": "https://histoiredesarts.culture.gouv.fr/Toutes-les-ressources/Musee-d-Art-et-d-Histoire-du-judaisme/L-affaire-Dreyfus.-Engagement-et-propagande-annexes"}], "visual": {"icon": "file", "steps": ["Handwriting suggests guilt", "Secret evidence bypasses defense", "Contrary evidence appears", "The institution resists reversal"], "caption": "Protecting authority prolonged injustice."}}, {"number": 2, "title": "Iran 1953: foreign action met domestic conflict", "short_title": "A coup had partners", "summary": "British and American intervention is documented. Iranian actors and institutional conflict still mattered.", "documented_fact": "Prime Minister Mohammad Mosaddeq nationalized oil. Britain resisted losing control. Its officials proposed regime change. The Eisenhower administration approved covert action. CIA and British intelligence supported Zahedi. They funded propaganda and political organization. An initial move failed. Mosaddeq remained temporarily secure. Demonstrations and military action then shifted power. The Shah returned. Eisenhower privately noted American help. Mosaddeq was arrested and tried.", "scholarly_interpretation": "Oil shaped British incentives. Cold War fears shaped Washington. The operation exploited Iranian divisions. Clerics, royalists, officers, crowds, and politicians had agency. Foreign intervention was decisive support. It was not remote mind-control. Domestic conflict made leverage possible. The coup later damaged American legitimacy. It strengthened the Shah’s rule.", "uncertainty": "Many operational files remain missing. Some were destroyed. Historians debate crowd spontaneity. They also debate constitutional authority. Mosaddeq had accumulated emergency powers. That context does not erase intervention. Precise causal shares remain unknowable. The coup’s contribution to 1979 is plausible. It was not sufficient alone.", "sources": [{"title": "British Coup Proposal, November 1952 — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1951-54IranEd2/d148"}, {"title": "CIA Retrospective on the Coup — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1951-54Iran/d306"}, {"title": "Eisenhower Diary on U.S. Help — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1951-54Iran/d328"}, {"title": "Iran: Mosaddeq Overthrow, 1953 — National Security Archive", "url": "https://nsarchive.gwu.edu/events/iran-mosaddeq-overthrow-1953"}], "visual": {"icon": "oil", "steps": ["Iran nationalizes oil", "Britain seeks reversal", "Covert action exploits divisions", "The Shah returns"], "caption": "External power worked through local conflict."}}, {"number": 3, "title": "Great Leap famine: false success became extraction", "short_title": "Numbers became hunger", "summary": "Inflated harvest reports helped create procurement demands that stripped villages of scarce grain.", "documented_fact": "China launched the Great Leap in 1958. Communes reorganized rural life. Labor shifted toward industrial campaigns. Officials announced extraordinary harvests. Many reports were inflated. Procurement targets followed reported output. Actual production then declined. State collection continued. Rural food availability collapsed. Famine spread widely. Policy adjustments came slowly. Millions died before recovery. Exact totals remain disputed.", "scholarly_interpretation": "Information failure became coercive extraction. Local cadres faced promotion pressure. Bad news invited punishment. Inflated numbers moved upward. Grain obligations moved downward. Collective dining and labor diversion also mattered. Weather caused some losses. Policy transformed shortage into catastrophe. Political fear blocked correction. Central ambition and local enforcement interacted.", "uncertainty": "Chinese archives remain unevenly accessible. Demographic methods produce different totals. Regional experiences varied greatly. Officials sometimes concealed grain. Others protected residents. Natural shocks contributed unevenly. They do not explain the scale alone. Intent to industrialize is documented. Intent to cause mass death is not established. Responsibility still follows foreseeable policy effects.", "sources": [{"title": "China’s Great Leap Forward, 1958–1961 — Wilson Center Digital Archive", "url": "https://digitalarchive.umd.edu/topics/chinas-great-leap-forward-1958-1961"}, {"title": "Grain Procurements During the Great Leap Forward — The China Quarterly", "url": "https://www.jstor.org/stable/657456"}, {"title": "Great Famine Through Documentary Evidence — University of Essex Repository", "url": "https://repository.essex.ac.uk/17572/"}, {"title": "U.S. Intelligence Assessment, 1961 — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1961-63v22/d17"}], "visual": {"icon": "chart", "steps": ["Targets reward optimism", "Harvests get inflated", "Procurement follows fiction", "Villages lose real grain"], "caption": "Bad metrics became lethal policy."}}, {"number": 4, "title": "Paperclip: expertise outranked clean accountability", "short_title": "Knowledge over justice", "summary": "The United States recruited German specialists while security competition weakened exclusion rules.", "documented_fact": "American forces captured German technical records. Project Paperclip recruited specialists. The program expanded after 1945. Officials sought military knowledge. They also denied expertise to rivals. Hundreds entered the United States. Many had Nazi Party ties. Personnel dossiers recorded backgrounds. Some recruits worked around V-2 production. Prisoners had endured lethal forced labor there. Screening and immigration created recurring disputes.", "scholarly_interpretation": "Paperclip exposed competing postwar priorities. Punishment confronted strategic advantage. The coming Soviet rivalry accelerated recruitment. Bureaucracies separated technical value from complicity. That division often obscured victims. Yet recruits’ histories differed. Membership, knowledge, and direct crimes were not identical. Individual assessment remains necessary. Collective absolution remains indefensible.", "uncertainty": "Party membership alone proves limited conduct. Coercion sometimes shaped affiliation. Dossiers may omit crimes. Later accounts can sensationalize. Estimates of implicated recruits vary. Scientific contributions also vary. Rocket development had many sources. Paperclip did not single-handedly create NASA. Soviet recruitment followed parallel incentives. Moral compromise is documented. Its boundaries require case files.", "sources": [{"title": "Project Paperclip Personnel Dossiers — U.S. National Archives", "url": "https://www.archives.gov/iwg/declassified-records/rg-330-defense-secretary"}, {"title": "Paperclip Expansion, 1946 — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1946v05/d446"}, {"title": "Nazi War Crimes Disclosure Interim Report — U.S. National Archives", "url": "https://www.archives.gov/iwg/reports/nazi-war-crimes-interim-report-october-1999"}, {"title": "Mittelbau-Dora and Rocket Production — U.S. Holocaust Memorial Museum", "url": "https://encyclopedia.ushmm.org/content/en/article/mittelbau-main-camp-in-depth"}], "visual": {"icon": "rocket", "steps": ["Germany’s research is captured", "Rivalry raises its value", "Background rules bend", "Expertise enters U.S. programs"], "caption": "Strategic urgency displaced accountability."}}, {"number": 5, "title": "Helsinki 1975: recognition created an accountability tool", "short_title": "A bargain outgrew itself", "summary": "Soviet leaders gained border recognition. Dissidents gained shared language for monitoring state promises.", "documented_fact": "Thirty-five states signed Helsinki’s Final Act. It was politically binding. It was not a treaty. Signatories affirmed European frontiers. They also accepted human-rights principles. Travel and information appeared too. Western critics feared legitimizing Soviet gains. Soviet leaders valued border stability. Activists later formed Helsinki monitoring groups. They documented violations against signed commitments. Governments raised these records internationally.", "scholarly_interpretation": "The bargain carried asymmetric hopes. Moscow emphasized security recognition. Western governments emphasized cooperation and rights. Dissidents exploited the whole text. Public commitments lowered coordination costs. Shared standards connected local abuses internationally. The document did not cause communism’s collapse. It widened political space. Diplomacy supplied activists with leverage.", "uncertainty": "States violated many provisions. Monitors faced prison and exile. Strategic pressure mattered alongside norms. Economic stagnation also mattered. Leadership changes mattered later. Counterfactual influence cannot be measured exactly. Some governments used rights selectively. Helsinki’s effect was gradual. Its unintended consequences remain an interpretation. Activist use is documented.", "sources": [{"title": "Helsinki Final Act — OSCE", "url": "https://projects.osce.org/helsinki-final-act"}, {"title": "Helsinki Final Act, 1975 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1969-1976/helsinki"}, {"title": "Our History: The Helsinki Process — OSCE", "url": "https://www.osce.org/history"}, {"title": "Helsinki Final Act Text — University of Minnesota Human Rights Library", "url": "https://hrlibrary.umn.edu/osce/new/FINALACT.htm"}], "visual": {"icon": "accord", "steps": ["States recognize frontiers", "They affirm human rights", "Dissidents monitor promises", "Violations gain shared language"], "caption": "A diplomatic bargain enabled scrutiny."}}, {"number": 6, "title": "Primitive Echo: why quitting feels like wasting", "short_title": "Past cost traps choice", "summary": "Prior effort can make persistence feel necessary, even when future costs should decide.", "documented_fact": "Sunk costs cannot be recovered. Rational choice ignores them. Experiments show frequent persistence. People continue after prior investment. Money can trigger it. Time and effort can too. Meta-analysis finds a real effect. Its size varies by design. Mice and rats also persist. Cross-species tasks show parallels. Other animal findings remain inconsistent.", "scholarly_interpretation": "Persistence usually serves survival. Abandoning every difficult pursuit would waste learning. Effort can signal future value. Modern environments sometimes break that link. Past investment then distorts forecasts. Self-justification adds pressure. Reputation adds another. Organizations escalate failing projects. Individuals keep unused subscriptions. The ancient rule becomes misapplied.", "uncertainty": "No single evolutionary account prevails. Animal tasks may measure waiting. Human scenarios may measure reputation. Loss aversion offers another mechanism. Learned persistence may suffice. Culture changes self-justification. Not every continuation is irrational. New information can favor staying. Ask one clean question: which future option now pays better?", "sources": [{"title": "Sunk-Cost Effect Across Species — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/27151560/"}, {"title": "Sunk-Cost Effect Meta-analysis — Business Research", "url": "https://link.springer.com/article/10.1007/s40685-014-0014-8"}, {"title": "Sensitivity to Sunk Costs in Mice, Rats, and Humans — Science", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC6377599/"}, {"title": "Sunk Cost in Pigeons and Humans — Journal of the Experimental Analysis of Behavior", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC1193697/"}], "visual": {"icon": "path", "steps": ["Effort accumulates", "Quitting feels wasteful", "Forecasts inherit past costs", "Persistence can deepen loss"], "caption": "Past sacrifice should not own tomorrow."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
</script></body></html>
