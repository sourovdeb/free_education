<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="t d"><title id="t">Rules and choices: a papercut evidence diagram</title><desc id="d">Four layered paper panels. Pressure creates negotiation. Negotiation produces rules. Rules change choices. A final strip says causation requires records and limits.</desc><defs><filter id="shadow"><feDropShadow dx="8" dy="9" stdDeviation="3" flood-color="#102b3a" flood-opacity=".28"/></filter></defs><rect width="1280" height="720" fill="#f9efdc"/><path d="M0 95Q240 40 470 96T960 80T1280 120V0H0Z" fill="#94c9bd"/><text x="60" y="135" font-family="DejaVu Sans,sans-serif" font-size="50" font-weight="bold" fill="#152532">Rules reshape choices</text><text x="60" y="173" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#152532">A mechanism across six investigations</text><g filter="url(#shadow)"><path d="M58 265l245 -8 13 17 -4 255 -242 5 -12 -18z" fill="#eb6d50" stroke="#152532" stroke-width="4"/><path d="M77 285l215 -6 3 216 -213 8z" fill="#fff9e9" opacity=".37"/></g><text x="83" y="352" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#152532">PRESSURE</text><text x="83" y="390" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#152532">War, damage, uncertainty</text><path d="M315 440l-13 -16v9h-20v14h20v9z" fill="#152532"/><g filter="url(#shadow)"><path d="M363 265l245 -8 13 17 -4 255 -242 5 -12 -18z" fill="#f5ba5b" stroke="#152532" stroke-width="4"/><path d="M382 285l215 -6 3 216 -213 8z" fill="#fff9e9" opacity=".37"/></g><text x="388" y="352" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#152532">NEGOTIATION</text><text x="388" y="390" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#152532">States bargain over costs</text><path d="M620 440l-13 -16v9h-20v14h20v9z" fill="#152532"/><g filter="url(#shadow)"><path d="M668 265l245 -8 13 17 -4 255 -242 5 -12 -18z" fill="#6aaab0" stroke="#152532" stroke-width="4"/><path d="M687 285l215 -6 3 216 -213 8z" fill="#fff9e9" opacity=".37"/></g><text x="693" y="352" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#152532">RULE</text><text x="693" y="390" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#152532">Treaties and institutions</text><path d="M925 440l-13 -16v9h-20v14h20v9z" fill="#152532"/><g filter="url(#shadow)"><path d="M973 265l245 -8 13 17 -4 255 -242 5 -12 -18z" fill="#8171ad" stroke="#152532" stroke-width="4"/><path d="M992 285l215 -6 3 216 -213 8z" fill="#fff9e9" opacity=".37"/></g><text x="998" y="352" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold" fill="#152532">CHOICE</text><text x="998" y="390" font-family="DejaVu Sans,sans-serif" font-size="16" fill="#152532">People respond and adapt</text><path d="M55 593l1164 -3 0 83 -1162 5z" fill="#152532"/><text x="85" y="642" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#fff9e9">Evidence rule: trace decisions. Mark limits. Avoid single causes.</text></svg>