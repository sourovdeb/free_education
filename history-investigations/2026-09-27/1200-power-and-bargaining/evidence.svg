<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d"><title id="t">Evidence across five histories</title><desc id="d">Five dated rows distinguish events from their mechanisms. Bengal: 1757 to 1765; Haiti: 1804 to 1862; emancipation: 1863 to 1865; Suez: 1956; Cuba: 1962 to 1963. Rows are not a proportional time scale.</desc><rect width="1100" height="680" fill="white"/><g font-family="sans-serif" fill="black"><text x="40" y="50" font-size="30">Power and bargaining</text><text x="40" y="83" font-size="18">Dated sequences • not a proportional scale</text><text x="40" y="135" font-size="22">1757–1765</text><text x="230" y="135" font-size="22">Bengal: commerce becomes government</text><text x="230" y="167" font-size="18">Tax collection financed Company power.</text><path d="M40 187 H1060" stroke="black"/><text x="40" y="240" font-size="22">1804–1862</text><text x="230" y="240" font-size="22">Haiti: independence without recognition</text><text x="230" y="272" font-size="18">Recognition lagged behind independence.</text><path d="M40 292 H1060" stroke="black"/><text x="40" y="345" font-size="22">1863–1865</text><text x="230" y="345" font-size="22">Emancipation: freedom through wartime authority</text><text x="230" y="377" font-size="18">The proclamation had jurisdictional limits.</text><path d="M40 397 H1060" stroke="black"/><text x="40" y="450" font-size="22">1956</text><text x="230" y="450" font-size="22">Suez: intervention planned before justification</text><text x="230" y="482" font-size="18">Coordination preceded the stated justification.</text><path d="M40 502 H1060" stroke="black"/><text x="40" y="555" font-size="22">1962–1963</text><text x="230" y="555" font-size="22">Cuba: bargaining behind the confrontation</text><text x="230" y="587" font-size="18">The settlement included concealed bargaining.</text><path d="M40 607 H1060" stroke="black"/></g></svg>