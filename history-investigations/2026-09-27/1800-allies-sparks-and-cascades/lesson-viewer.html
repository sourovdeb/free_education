<style>

.grid{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid #111}.panel{padding:1.2rem;border-right:1px solid #111}.panel:last-child{border:0}.panel h3{font:800 .75rem ui-monospace,monospace;letter-spacing:.1em}

<body><div class="app"><aside><div class="brand">HISTORY INVESTIGATION</div><h1>Allies, sparks,<br>and cascades</h1><ol class="chapters" id="chapters"></ol></aside>
<main><div class="meta" id="meta"></div><h2 id="title"></h2><p class="summary" id="summary"></p><div class="mechanism" id="mechanism" aria-label="Mechanism steps"></div>
<div class="grid"><section class="panel"><h3>DOCUMENTED FACT</h3><p id="fact"></p></section><section class="panel"><h3>INTERPRETATION</h3><p id="interpretation"></p></section><section class="panel"><h3>UNCERTAINTY</h3><p id="uncertainty"></p></section></div>

<div class="controls"><button id="prev">← Previous</button><button id="play">Play</button><button id="next">Next →</button><span id="count"></span><div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div></div>
<video controls muted playsinline preload="metadata"><source src="history-investigation.mp4" type="video/mp4">Your browser cannot play the silent summary.</video></main></div>
<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Allies, sparks, and cascades", "edition_date": "2026-09-27", "edition_time": "18:00", "timezone": "Indian/Reunion", "slug": "allies-sparks-and-cascades", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive hand-sketched doodle"}, "chapters": [{"number": 1, "title": "Tenochtitlan: conquest depended on Indigenous allies", "short_title": "An invasion found allies", "summary": "Cortés commanded Spaniards. Far larger Indigenous forces, disease, and siege conditions enabled victory.", "documented_fact": "Cortés entered Mexico in 1519. His Spanish force was small. Translators enabled negotiation. Tlaxcalans first fought the newcomers. They later became crucial allies. Other Indigenous communities joined too. Many opposed Mexica demands. Smallpox spread during 1520. It killed residents and leaders. A coalition besieged Tenochtitlan in 1521. Brigantines controlled lake movement. Causeways restricted supplies. The city fell after brutal fighting.", "scholarly_interpretation": "The conquest was not Spaniards alone. It became an Indigenous civil war. Spaniards supplied leadership and technology. Local rivalries supplied mass forces. Disease weakened every defense. Coalition partners pursued their own goals. They did not foresee colonial rule. Agency and exploitation coexisted.", "uncertainty": "Numbers vary sharply. Spanish accounts justified conquerors. Later Indigenous records had colonial constraints. Alliance motives differed by town. Disease was crucial, not sufficient. Weapons offered advantages, not inevitability. Mexica political dominance created enemies. That does not legitimize invasion. No single factor explains collapse.", "sources": [{"title": "Mexican America: Conquest and Indigenous Allies — Smithsonian", "url": "https://www.si.edu/spotlight/mexican-america/history"}, {"title": "The Fall of Tenochtitlan — Origins, Ohio State University", "url": "https://origins.osu.edu/milestones/fall-tenochtitlan"}, {"title": "Narrative Letter by Hernán Cortés — Library of Congress", "url": "https://www.loc.gov/item/2021666768/"}, {"title": "Florentine Codex as a Primary Source — American Historical Association", "url": "https://www.historians.org/resource/primary-sources-used-in-this-project/"}], "visual": {"icon": "alliance", "steps": ["Spaniards enter Mexico", "Local enemies join them", "Smallpox weakens Tenochtitlan", "A coalition completes siege"], "caption": "Conquest required local power."}}, {"number": 2, "title": "India 1857: cartridges ignited accumulated grievances", "short_title": "A spark found fuel", "summary": "Greased-cartridge fears triggered mutiny. Annexation, military inequality, land pressure, and religious anxiety widened revolt.", "documented_fact": "Indian soldiers served Company armies. New rifle cartridges required biting. Rumors alleged cow and pig grease. These threatened Hindu and Muslim practice. Company changes came too late. Soldiers mutinied at Meerut. Rebels entered Delhi in May 1857. Some rulers and civilians joined. Fighting spread unevenly across northern India. Other regions stayed quiet. Many Indian troops remained loyal. Britain suppressed the uprising violently. Crown rule replaced Company government.", "scholarly_interpretation": "Cartridges acted as a spark. Older grievances supplied fuel. Annexations displaced ruling families. Revenue demands disrupted landholders. Service rules offended soldiers. Missionary activity increased religious fears. Rebels pursued different futures. Shared opposition did not create one program. Calling it only mutiny narrows history. Calling it one national war also simplifies.", "uncertainty": "Motives varied by region. British sources often racialized rebels. Nationalist accounts can impose later unity. Atrocity occurred on both sides. Colonial reprisals were extensive. Precise deaths remain uncertain. Religious rumor carried political meaning. Cartridge composition mattered less than distrust. Counterfactual reforms might not have prevented revolt.", "sources": [{"title": "Why Did the Indian Rebellion Happen? — National Army Museum", "url": "https://www.nam.ac.uk/explore/why-did-indian-mutiny-happen"}, {"title": "India 1857 — UK National Archives", "url": "https://www.nationalarchives.gov.uk/education/teachers/professional-development/project-resources/roehampton-ma-resources/india-1857/"}, {"title": "Why Did Indian People Rebel? — UK National Archives", "url": "https://cdn.nationalarchives.gov.uk/documents/education/india1857.pdf"}, {"title": "Decisive Events of 1857 — National Army Museum", "url": "https://www.nam.ac.uk/explore/decisive-events-indian-mutiny"}], "visual": {"icon": "cartridge", "steps": ["Cartridge rumors spread", "Religious trust collapses", "Older grievances connect", "Revolt expands unevenly"], "caption": "A symbol concentrated many fears."}}, {"number": 3, "title": "Abolition 1807: morality needed organization and power", "short_title": "Morality gained machinery", "summary": "Black testimony and mass campaigning changed politics. War and naval power shaped passage and enforcement.", "documented_fact": "Britain dominated slave trafficking earlier. Abolitionists organized nationally. Black writers exposed enslavement directly. Olaudah Equiano became influential. Petitioning reached Parliament repeatedly. Consumers boycotted slave-grown sugar. Earlier abolition motions failed. Parliament banned British trafficking in 1807. Enslavement inside colonies continued. Emancipation came only in 1833. Enslavers received compensation. Enslaved people received none. Naval patrols later intercepted some ships.", "scholarly_interpretation": "Moral mobilization mattered enormously. Organization converted feeling into votes. Black abolitionists shaped public knowledge. Quaker networks sustained campaigning. Wartime politics altered commercial interests. Naval dominance enabled enforcement. Britain also gained diplomatic leverage. Humanitarian and strategic incentives coexisted. Self-interest does not erase activism. Activism alone cannot explain timing.", "uncertainty": "Historians debate economic decline’s role. Profitability varied by trade. Enforcement remained incomplete. Illegal trafficking continued. Naval patrols sometimes caused deaths. Abolition did not end coerced labor. British commemoration can hide prior leadership in trafficking. It can also ignore African resistance. Causal weights remain contested. The legislative sequence is clear.", "sources": [{"title": "Parliament and the British Slave Trade — UK Parliament", "url": "https://www.parliament.uk/slavetrade/"}, {"title": "Parliament Abolishes the Slave Trade — UK Parliament", "url": "https://www.parliament.uk/about/living-heritage/transformingsociety/tradeindustry/slavetrade/overview/parliament-abolishes-the-slave-trade/"}, {"title": "Abolition Campaign Arguments — UK Parliament", "url": "https://www.parliament.uk/about/living-heritage/transformingsociety/tradeindustry/slavetrade/overview/abolition-campaign-the-arguements/"}, {"title": "Slave-Trade Abolition Bill Debate, 1807 — Hansard", "url": "https://api.parliament.uk/historic-hansard/commons/1807/feb/27/slave-trade-abolition-bill"}], "visual": {"icon": "petition", "steps": ["Witnesses expose brutality", "Campaigners organize petitions", "Parliament finally legislates", "Naval power enforces unevenly"], "caption": "Conviction required political machinery."}}, {"number": 4, "title": "Haber–Bosch: fertilizer and explosives shared chemistry", "short_title": "One reaction, two futures", "summary": "Synthetic ammonia expanded food production. The same nitrogen supply sustained German munitions during war.", "documented_fact": "Plants need usable nitrogen. Natural nitrate supplies were limited. Fritz Haber synthesized ammonia from gases. Carl Bosch scaled the reaction industrially. BASF opened production in 1913. Ammonia enabled artificial fertilizer. It also enabled nitric acid. That acid supplied explosives. Wartime blockade cut Chilean nitrate imports. German factories replaced them synthetically. Haber also led poison-gas work. Bosch later questioned wartime outcomes.", "scholarly_interpretation": "The process transformed global agriculture. Higher nitrogen inputs expanded yields. It also separated warfare from nitrate geography. Industrial chemistry served food and state power. Calling the invention good or evil misses infrastructure. Uses depended on institutions. Haber's personal military role adds another layer. Scientific achievement and moral responsibility can coexist.", "uncertainty": "Claims that fertilizer feeds half humanity use models. Exact shares change over time. Synthetic nitrogen also damages ecosystems. It contributes greenhouse emissions. Germany’s war duration had many causes. Ammonia was important, not sufficient. Haber and Bosch held different responsibilities. Innovation cannot predict every later use. It still creates foreseeable choices.", "sources": [{"title": "Fritz Haber Biography — Nobel Prize", "url": "https://www.nobelprize.org/prizes/chemistry/1918/haber/biographical/"}, {"title": "Carl Bosch Facts — Nobel Prize", "url": "https://www.nobelprize.org/prizes/chemistry/1931/bosch/facts/"}, {"title": "Fritz Haber — Science History Institute", "url": "https://www.sciencehistory.org/education/scientific-biographies/fritz-haber/"}, {"title": "Carl Bosch and Industrial Ammonia — Max Planck Society", "url": "https://www.mpg.de/8241495/carl-bosch"}], "visual": {"icon": "flask", "steps": ["Air supplies nitrogen", "Pressure creates ammonia", "Fertilizer raises harvests", "Nitrates also feed explosives"], "caption": "One process widened opposite capacities."}}, {"number": 5, "title": "Berlin Wall: a mistaken answer triggered a cascade", "short_title": "An answer opened gates", "summary": "Long protest and political retreat weakened the regime. A confused announcement converted pressure into immediate crowds.", "documented_fact": "East Germans demanded freer travel. Many exited through neighboring countries. Mass demonstrations expanded during 1989. Soviet leaders rejected military rescue. East German officials drafted new travel rules. Günter Schabowski briefed reporters on 9 November. He lacked full implementation details. Asked when rules began, he said immediately. Television spread that answer. Crowds reached Berlin checkpoints. Guards lacked clear orders. At Bornholmer Strasse, they opened barriers. Other crossings followed.", "scholarly_interpretation": "The announcement was a trigger. It was not the whole cause. Protest eroded regime authority. Emigration exposed policy failure. Soviet restraint changed coercive expectations. Live media synchronized citizens. Crowds created an operational dilemma. Guards chose de-escalation. A planned reform became an uncontrolled opening. Political weakness became visible instantly.", "uncertainty": "Schabowski’s exact understanding remains debated. Officials intended liberalization, not that evening’s opening. No single guard toppled the regime. Violence remained possible. Several checkpoints made separate choices. Western pressure mattered indirectly. Eastern European reforms mattered too. German reunification was not predetermined. The Wall’s opening accelerated it.", "sources": [{"title": "9 November 1989 — German Federal Government", "url": "https://www.bundesregierung.de/breg-en/service/archive/archive/9-november-a-historically-signficant-date-411370"}, {"title": "Fall of the Berlin Wall Documents — National Security Archive", "url": "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB490/"}, {"title": "The Berlin Wall, 1961–1989 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1961-1968/berlin-wall"}], "visual": {"icon": "gate", "steps": ["Protests weaken authority", "Travel reform is drafted", "Television says immediately", "Crowds make closure untenable"], "caption": "A mistake synchronized mass action."}}, {"number": 6, "title": "Primitive Echo: why crowds can delay helping", "short_title": "Everyone watches everyone", "summary": "Other observers can dilute responsibility and make emergencies look less certain. Clear danger can reverse the effect.", "documented_fact": "Classic experiments found less helping in groups. Responsibility appeared to diffuse. People also watched other observers. Calm faces reduced perceived urgency. This is pluralistic ignorance. Later meta-analysis confirmed an average effect. Context strongly changed it. Dangerous events reduced the inhibition. Some real violent incidents showed high intervention rates. Friends and coordinated groups help differently.", "scholarly_interpretation": "Watching others is normally efficient. Group cues help classify uncertainty. Shared vigilance once reduced false alarms. Modern strangers provide weaker signals. Everyone can mistake caution for knowledge. Responsibility also becomes ambiguous. The result is collective hesitation. Clear assignments interrupt it. Naming one helper restores ownership.", "uncertainty": "Evolutionary explanations remain inferential. Laboratory emergencies are artificial. Camera studies miss private decisions. Intervention can increase risk. Group presence sometimes helps. Dangerous clarity can mobilize people. Relationship strength matters. Culture and training matter too. The popular Genovese story was oversimplified. The effect remains conditional, not universal.", "sources": [{"title": "Bystander-Effect Meta-analysis — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/21534650/"}, {"title": "Public Violence and Bystander Intervention — PubMed", "url": "https://pubmed.ncbi.nlm.nih.gov/31359450/"}, {"title": "A Century of Pluralistic Ignorance — Frontiers in Social Psychology", "url": "https://www.frontiersin.org/journals/social-psychology/articles/10.3389/frsps.2023.1260896/full"}, {"title": "Bystander Intervention Guidance — American Psychological Association", "url": "https://www.apa.org/pi/health-equity/bystander-intervention"}], "visual": {"icon": "crowd", "steps": ["An event looks ambiguous", "Observers scan each other", "Calmness appears informative", "Responsibility diffuses"], "caption": "Social information can become paralysis."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
</script></body></html>
