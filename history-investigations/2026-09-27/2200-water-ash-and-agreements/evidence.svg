<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1100 675" role="img" aria-labelledby="t d"><title id="t">Six cause-and-evidence paths</title><desc id="d">Six coloured, source-linked rows connect pump water and cases; eruption and cooling; drainage and mosquito control; quotas and influence; chemical controls and ozone recovery; and observed contributions and cooperation.</desc><rect width="1100" height="675" fill="#f5ebd6"/><text x="45" y="51" font-family="DejaVu Sans" font-size="32" font-weight="bold" fill="#24333d">Water, ash, and agreements</text><g font-family="DejaVu Sans"><a href="https://wellcomecollection.org/works/uxgfjt62" target="_blank"><rect x="46" y="85" width="1000" height="65" rx="2" fill="#459fb2" opacity=".92"/><text x="68" y="111" font-size="21" font-weight="bold" fill="#172730">1854  The pump handle was evidence, not magic</text><text x="68" y="137" font-size="17" fill="#172730">Pump water → cases · Click for evidence</text></a><a href="https://volcano.si.edu/volcano.cfm?vn=264040" target="_blank"><rect x="46" y="173" width="1000" height="65" rx="2" fill="#ce6558" opacity=".92"/><text x="68" y="199" font-size="21" font-weight="bold" fill="#172730">1815–1816  An eruption crossed oceans</text><text x="68" y="225" font-size="17" fill="#172730">Eruption → cooling · Click for evidence</text></a><a href="https://wwwnc.cdc.gov/eid/article/27/8/ac-2708_article" target="_blank"><rect x="46" y="261" width="1000" height="65" rx="2" fill="#769d79" opacity=".92"/><text x="68" y="287" font-size="21" font-weight="bold" fill="#172730">1904–1914  A canal needed mosquito control</text><text x="68" y="313" font-size="17" fill="#172730">Drainage → fewer vectors · Click for evidence</text></a><a href="https://www.worldbank.org/en/archive/history/exhibits/Bretton-Woods-and-the-Birth-of-the-World-Bank" target="_blank"><rect x="46" y="349" width="1000" height="65" rx="2" fill="#e3b64f" opacity=".92"/><text x="68" y="375" font-size="21" font-weight="bold" fill="#172730">1944  The monetary bargain had unequal weight</text><text x="68" y="401" font-size="17" fill="#172730">Quotas → influence · Click for evidence</text></a><a href="https://www.bas.ac.uk/about/history/ozone-hole-discovery/" target="_blank"><rect x="46" y="437" width="1000" height="65" rx="2" fill="#776c9b" opacity=".92"/><text x="68" y="463" font-size="21" font-weight="bold" fill="#172730">1985–2022  An ozone treaty changed production</text><text x="68" y="489" font-size="17" fill="#172730">Controls → recovery · Click for evidence</text></a><a href="https://www.pnas.org/doi/10.1073/pnas.1509740113" target="_blank"><rect x="46" y="525" width="1000" height="65" rx="2" fill="#459fb2" opacity=".92"/><text x="68" y="551" font-size="21" font-weight="bold" fill="#172730">Behavior today  Primitive Echo: watching others cooperate</text><text x="68" y="577" font-size="17" fill="#172730">Examples → choices · Click for evidence</text></a></g><text x="46" y="655" font-family="DejaVu Sans" font-size="15" fill="#24333d">Original schematic. Each row links to one source. Claims and limits appear in the edition.</text></svg>