<script id="lesson" type="application/json">{"cards": [{"id": "snow", "title": "The pump handle was evidence, not magic", "year": "1854", "setting": "Broad Street, Soho, London", "question": "How did one pump become suspect?", "objects": ["pump", "water bucket", "residents", "case marks", "handle"], "actions": ["Residents draw water.", "Cases accumulate around the pump.", "Snow plots households and interviews drinkers.", "Officials remove the handle."], "captions": ["Residents collect pump water.", "Cases cluster nearby.", "Snow tests drinking histories.", "Officials remove the handle.", "The decline had already begun."], "body": "Documented fact: In 1854, cholera struck the Broad Street area of London. John Snow collected addresses and drinking histories. His map located many deaths near one public pump. He also investigated exceptions. Some distant victims drank its water. Some nearby residents used another source. Officials removed the pump handle. The surviving parish report records the local inquiry. Scholarly interpretation: Snow's strength was combining geography with exposure histories. A cluster alone could not establish transmission. His evidence challenged the prevailing belief that foul air carried cholera. The pump became a model for investigating outbreaks through linked observations. Uncertainty: The familiar story often gives the handle sole credit for ending the outbreak. The epidemic was already declining. Many residents had fled. The timing therefore cannot prove the removal alone stopped transmission. Later microbiology established the waterborne mechanism. The 1854 intervention mattered as a precaution and a test of the explanation, even without a clean before-and-after experiment.", "sources": [["Wellcome: parish inquiry and Snow map", "https://wellcomecollection.org/works/uxgfjt62"], ["CDC: John Snow and pump handle", "https://www.cdc.gov/mmwr/preview/mmwrhtml/mm5334a1.htm"], ["CDC: epidemiology lesson", "https://archive.cdc.gov/www_cdc_gov/csels/dsepd/ss1978/lesson1/section2.html"]]}, {"id": "tambora", "title": "An eruption crossed oceans", "year": "1815–1816", "setting": "Sumbawa, atmosphere, and farms", "question": "How did Sumbawa affect harvests abroad?", "objects": ["volcano", "ash plume", "sun", "cloud belt", "crops"], "actions": ["Tambora erupts.", "Aerosols spread high above oceans.", "Less sunlight reaches farms.", "Cold and rain damage crops."], "captions": ["Tambora erupts in April 1815.", "Aerosols spread through the stratosphere.", "Sunlight weakens at the surface.", "Cold, rain, and frost hit fields.", "Regional effects differed."], "body": "Documented fact: Tambora erupted on Sumbawa in April 1815. Smithsonian records identify it as the largest explosive eruption in recorded history. The eruption sent material high into the atmosphere. In 1816, parts of Europe and North America saw unusual cold, rain, and frost. Historical accounts report crop failures and food shortages. Scholarly interpretation: Sulfur gases formed stratospheric aerosols. Those particles scattered sunlight. This supplied a physical route from an Indonesian eruption to distant cooling. Weather systems then shaped where the consequences became severe. The event shows why a local disaster can travel through a shared atmosphere. Uncertainty: Not every failed harvest came from Tambora alone. Regional weather, farming conditions, trade, and poverty also affected suffering. The phrase ‘year without a summer’ is a useful label, but it can flatten uneven conditions. The eruption is a strong contributor to 1816 cooling; any specific famine needs its own local evidence.", "sources": [["Smithsonian: Global Volcanism Program, Tambora", "https://volcano.si.edu/volcano.cfm?vn=264040"], ["Smithsonian: When Volcanoes Erupt", "https://naturalhistory.si.edu/education/teaching-resources/earth-science/when-volcanoes-erupt"], ["NOAA: Tambora and the year without summer", "https://www.nesdis.noaa.gov/news/day-history-mount-tambora-explosively-erupts-1815"]]}, {"id": "panama", "title": "A canal needed mosquito control", "year": "1904–1914", "setting": "Panama Canal work site", "question": "What made excavation possible?", "objects": ["rain barrel", "mosquito", "workers", "drain crew", "rail cart"], "actions": ["Mosquitoes breed in standing water.", "Workers face fever risk.", "Crews drain and cover water.", "Excavation continues with fewer infections."], "captions": ["Standing water breeds mosquitoes.", "Disease strikes the work force.", "Crews drain and cover water.", "Transmission falls.", "Workers still bore unequal risks."], "body": "Documented fact: Mosquito-borne yellow fever and malaria disrupted canal work in Panama. U.S. sanitation officials began organized mosquito control after 1904. Crews drained or treated standing water, screened buildings, and attacked breeding sites. The Smithsonian's canal materials show how water containers could sustain yellow-fever vectors. CDC history links vector control to the eventual completion of the canal in 1914. Scholarly interpretation: The engineering project depended on public-health labor. Excavators could not work safely at scale without changing mosquito habitat. Carlos Finlay's earlier mosquito hypothesis and subsequent research informed the intervention; credit belongs to more than one official. Uncertainty: Disease control did not remove the project's human cost. Historians document unequal health protections and severe risks for Caribbean contract workers. Also, sanitation was one condition among finance, machines, labor, and politics. Saying one doctor ‘built the canal’ hides those dependencies and the workers who carried them.", "sources": [["CDC: Special Wonders of the Canal", "https://wwwnc.cdc.gov/eid/article/27/8/ac-2708_article"], ["Smithsonian Libraries: Bug war", "https://www.sil.si.edu/exhibitions/make-the-dirt-fly/bugwar.html"], ["AMA Journal of Ethics: race and tropical medicine", "https://journalofethics.ama-assn.org/article/how-racism-and-tropical-medicine-built-panama-canal/2024-02"]]}, {"id": "bretton", "title": "The monetary bargain had unequal weight", "year": "1944", "setting": "Bretton Woods conference room", "question": "Who shaped the postwar rules?", "objects": ["delegates", "currency plans", "fund ledger", "quota weights", "bank charter"], "actions": ["Delegates lay out rival plans.", "Negotiators combine and reject terms.", "Quota weights determine voting.", "Delegates sign institutional charters."], "captions": ["Forty-four delegations meet.", "Keynes and White propose plans.", "Quotas allocate money and votes.", "IMF and bank charters emerge.", "Many decisions remain open."], "body": "Documented fact: Delegates from 44 nations met at Bretton Woods in July 1944. They signed a Final Act containing charters for the International Monetary Fund and the International Bank for Reconstruction and Development. The World Bank archive notes that many operating decisions still remained. IMF histories record intense bargaining over quotas, contributions, credit, and voting. Scholarly interpretation: The agreement was shaped by the power gap between wartime partners. Harry Dexter White's U.S. plan differed from John Maynard Keynes's British proposal. Quotas linked finance with influence. A table full of flags did not mean every delegation held equal leverage. Uncertainty: It is too simple to call the outcome one man's design. Plans changed through preparatory meetings and conference negotiations. The system also evolved after 1944, including the end of dollar-gold convertibility decades later. The original papers show a negotiated starting point, not a permanent, fully finished monetary order.", "sources": [["World Bank Archives: Bretton Woods", "https://www.worldbank.org/en/archive/history/exhibits/Bretton-Woods-and-the-Birth-of-the-World-Bank"], ["IMF History: Bretton Woods chapter", "https://www.elibrary.imf.org/display/book/9798400276132/ch005.xml"], ["IMF: Why White, Not Keynes?", "https://www.imf.org/external/pubs/ft/wp/2002/wp0252.pdf"]]}, {"id": "ozone", "title": "An ozone treaty changed production", "year": "1985–2022", "setting": "Antarctic sky, factory, treaty table", "question": "How did measurements change factories?", "objects": ["measurement sheet", "CFC canister", "chlorine", "ozone shield", "factory valve", "treaty"], "actions": ["Scientists detect ozone loss.", "CFC emissions damage stratospheric ozone.", "States agree controls.", "Factories change chemicals; recovery begins."], "captions": ["Antarctic measurements reveal ozone loss.", "CFCs release destructive chlorine.", "States sign the 1987 protocol.", "Production shifts away from CFCs.", "Recovery takes decades."], "body": "Documented fact: British Antarctic Survey researchers reported a severe Antarctic ozone decline in 1985. Governments signed the Montreal Protocol in 1987. UNEP states that the agreement controls production and consumption of ozone-depleting substances. Later amendments strengthened the controls. The 2022 scientific assessment reports declining atmospheric levels of controlled substances and a recovering ozone layer. Scholarly interpretation: This was an institutional chain. Measurements made a diffuse atmospheric problem visible. Chemical research explained a mechanism. Governments then changed industrial incentives. Manufacturers altered products and processes. The familiar image of a hole is only the first part of the story; enforcement and substitution mattered. Uncertainty: The original treaty did not instantly ban every CFC. Recovery is slow because chemicals persist. Forecast dates depend on compliance and future emissions. Replacement chemicals can introduce different climate costs. The observed improvement supports the treaty's effect, while continuing measurements remain necessary.", "sources": [["British Antarctic Survey: ozone discovery", "https://www.bas.ac.uk/about/history/ozone-hole-discovery/"], ["UNEP: Montreal Protocol overview", "https://www.unep.org/ozonaction/who-we-are/about-montreal-protocol"], ["WMO: 2022 ozone assessment summary", "https://public.wmo.int/sites/default/files/2023-03/Scientific-Assessment-of-Ozone-Depletion-2022-Executive-Summary.pdf"]]}, {"id": "echo", "title": "Primitive Echo: watching others cooperate", "year": "Behavior today", "setting": "Shared water point, illustrative experiment", "question": "Why do contributions follow others?", "objects": ["neighbors", "shared basin", "contribution tokens", "observation window"], "actions": ["One person contributes.", "Others see the contribution.", "Some match it; others hold back.", "A changed example shifts later contributions."], "captions": ["One person fills the basin.", "Neighbors observe the gift.", "Some match; some withhold.", "Expectations alter cooperation.", "Motive remains disputed."], "body": "Documented fact: In public-goods experiments, many participants change their contributions after learning what others contribute. Some appear to match group behavior. Cross-cultural studies also find substantial variation. This resembles daily choices around shared work, queues, and community resources. Scholarly interpretation: Watching others may help people avoid exploitation while keeping mutual help possible. Social learning and group pressures could have favored such flexible responses over always giving or always withholding. That is a plausible evolutionary account, not a direct reading of prehistoric minds. Uncertainty: Laboratory tokens are not real villages. Researchers dispute why matching occurs. One study argues that confusion about the game can mimic conditional cooperation. Other experiments find cooperation survives clearer instructions. Culture, incentives, trust, and comprehension all matter. The safe conclusion is narrower: observed contributions often affect later contributions. A single ancient instinct cannot explain every act of generosity or restraint.", "sources": [["PNAS: conditional cooperation and confusion", "https://www.pnas.org/doi/10.1073/pnas.1509740113"], ["PNAS: confusion cannot explain cooperation", "https://www.pnas.org/doi/10.1073/pnas.2310109121"], ["Royal Society: culture and cooperation", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2936171/"]]}], "hotspots": {"snow": [[0.46, 0.43, "Pump: drinking exposure"], [0.13, 0.29, "Map: case locations"], [0.69, 0.65, "Handle: precaution"]], "tambora": [[0.41, 0.44, "Tambora: eruption"], [0.77, 0.27, "Atmosphere: aerosols"], [0.78, 0.69, "Fields: harvest effects"]], "panama": [[0.29, 0.61, "Standing water: breeding"], [0.51, 0.46, "Mosquito: disease vector"], [0.78, 0.68, "Rail cart: construction"]], "bretton": [[0.35, 0.55, "Proposals: rival plans"], [0.5, 0.68, "Fund: contributions"], [0.78, 0.6, "Quotas: voting weight"]], "ozone": [[0.26, 0.54, "Factory: emissions"], [0.54, 0.43, "Ozone: atmospheric shield"], [0.72, 0.59, "Treaty: production controls"]], "echo": [[0.14, 0.55, "First contributor"], [0.5, 0.66, "Shared basin"], [0.88, 0.55, "Later contributor"]]}, "chapter_seconds": 30}</script><script>
const data=JSON.parse(document.querySelector('#lesson').textContent),v=document.querySelector('#film'),seek=document.querySelector('#seek'),facts=document.querySelector('#facts');
const sec=data.chapter_seconds;let current=-1;
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function links(c){return '<ul>'+c.sources.map(([title,url])=>`<li><a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a></li>`).join('')+'</ul>'}
function show(c,detail=''){facts.innerHTML=`<h2>${esc(c.title)}</h2><p><strong>${esc(detail||c.question)}</strong></p><p>${esc(c.body)}</p><h3>Sources</h3>${links(c)}`}
function update(){let s=v.currentTime||0,i=Math.min(5,Math.floor(s/sec));seek.value=s;document.querySelector('#time').textContent=`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;if(i!==current){current=i;const c=data.cards[i];show(c);let box=document.querySelector('#hotspots');box.innerHTML='';data.hotspots[c.id].forEach(([x,y,label])=>{let b=document.createElement('button');b.className='hot';b.style.left=(x*100)+'%';b.style.top=(y*100)+'%';b.textContent='i';b.setAttribute('aria-label',label);b.title=label;b.onclick=()=>{v.pause();show(c,label)};box.append(b)})}}
v.addEventListener('timeupdate',update);v.addEventListener('loadedmetadata',update);seek.oninput=()=>{v.currentTime=+seek.value;update()};
document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();document.querySelector('#step').onclick=()=>{v.pause();v.currentTime=Math.min(180,v.currentTime+1);update()};document.querySelector('#replay').onclick=()=>{v.currentTime=Math.floor(v.currentTime/sec)*sec;v.play()};
document.querySelector('#reduced').onchange=e=>{document.body.classList.toggle('reduced',e.target.checked);v.pause();show(data.cards[Math.min(5,Math.floor(v.currentTime/sec))])};
const bar=document.querySelector('#chapters'),trans=document.querySelector('#transcript');data.cards.forEach((c,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${c.title}`;b.onclick=()=>{v.pause();v.currentTime=i*sec;update();show(c)};bar.append(b);let section=document.createElement('section');section.innerHTML=`<h2>${i+1}. ${esc(c.title)}</h2><p>${esc(c.body)}</p><ol>${c.actions.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>${links(c)}`;trans.append(section)});update();
</script></html>
