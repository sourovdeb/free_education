<body><div class="app"><aside><div class="brand">HISTORY INVESTIGATION</div><h1>Debt, borders,<br>and ownership</h1><ol class="chapters" id="chapters"></ol></aside>

<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Debt, borders, and ownership", "edition_date": "2026-09-27", "edition_time": "19:00", "timezone": "Indian/Reunion", "slug": "debt-borders-and-ownership", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive hand-sketched doodle"}, "chapters": [{"number": 1, "title": "Louisiana Purchase: Haiti changed Napoleon’s calculation", "short_title": "Haiti changed the bargain", "summary": "Jefferson sought New Orleans. Haitian resistance, French losses, and renewed European war helped make Napoleon sell everything.", "documented_fact": "Jefferson wanted secure Mississippi access. France controlled Louisiana again. Napoleon also sought Caribbean empire. Saint-Domingue was its center. France sent a major expedition. Haitian forces resisted fiercely. Disease devastated French troops. France lost the colony. War with Britain resumed. Louisiana became harder to defend. Napoleon offered the entire territory. American envoys exceeded instructions. They accepted for $15 million.", "scholarly_interpretation": "The purchase was not inevitable. Haitian victory altered French strategy. It weakened Napoleon’s American project. European war raised cash needs. British naval power increased risk. American credit enabled quick agreement. Jefferson’s diplomacy still mattered. So did Indigenous dispossession afterward. A celebrated bargain had wider makers.", "uncertainty": "Napoleon left no single motive. Historians weigh several pressures. Haiti was crucial, not solitary. British threats mattered too. So did financial calculation. American negotiators were genuinely surprised. The treaty did not settle sovereignty. Indigenous nations never broadly consented. Later expansion exceeded the purchase itself.", "sources": [{"title": "The United States and the Haitian Revolution — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1784-1800/haitian-rev"}, {"title": "Napoleonic Wars and the United States — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1801-1829/napoleonic-wars"}, {"title": "Louisiana Purchase, 1803 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1801-1829/louisiana-purchase"}, {"title": "Louisiana Purchase Treaty — U.S. National Archives", "url": "https://www.archives.gov/milestone-documents/louisiana-purchase-treaty"}], "visual": {"icon": "boundary", "steps": ["Haiti defeats French forces", "European war resumes", "Louisiana loses strategic value", "Envoys accept a larger sale"], "caption": "A distant revolution reshaped expansion."}}, {"number": 2, "title": "French Revolution: hunger activated a fiscal crisis", "short_title": "Bread exposed a state crisis", "summary": "Bread prices intensified anger. Debt, unequal taxation, institutional deadlock, and political expectation made scarcity revolutionary.", "documented_fact": "France carried heavy war debts. Debt service consumed royal revenue. Privileged groups resisted broader taxation. Regional courts blocked reforms. Louis XVI summoned the Estates-General. That opened representation disputes. Meanwhile, the 1788 harvest failed. Grain prices rose sharply. Bread dominated ordinary diets. Crowds attacked suppliers and officials. The Bastille fell during July 1789. Rural uprisings followed that summer.", "scholarly_interpretation": "Hunger explains urgency, not everything. Fiscal weakness constrained relief. Tax privilege damaged legitimacy. Institutional deadlock politicized finance. Enlightenment arguments widened expectations. The Estates-General created collective opportunity. Environmental stress activated existing conflict. Food markets linked households and government. Material and political crises reinforced each other.", "uncertainty": "No variable caused revolution alone. France had survived earlier shortages. Drought effects varied regionally. Bread riots were not automatically republican. Elite conflict preceded mass revolt. Popular action then changed outcomes. The famous cake quotation lacks evidence. It distracts from institutions. Causal emphasis still divides historians.", "sources": [{"title": "The Long and Short Reasons for Revolution — Swansea University", "url": "https://www.swansea.ac.uk/history/history-study-guides/the-long-and-short-reasons-for-why-revolution-broke-out-in-france-in-1789/"}, {"title": "Social Causes of Revolution — George Mason University", "url": "https://revolution.chnm.org/exhibits/show/liberty--equality--fraternity/social-causes-of-revolution"}, {"title": "Drought, Peasant Uprisings, and Demand — Journal of Economic Growth", "url": "https://link.springer.com/article/10.1007/s10887-023-09230-y"}], "visual": {"icon": "chart", "steps": ["War debt strains revenue", "Privileges block taxation", "Harvest failure raises bread", "Political authority fractures"], "caption": "Scarcity struck a brittle state."}}, {"number": 3, "title": "Panama 1903: independence and canal power intertwined", "short_title": "A canal reshaped independence", "summary": "Panamanian separatists had local aims. U.S. warships and canal interests made Colombia’s response far harder.", "documented_fact": "Panama belonged to Colombia. Separatist movements already existed. A canal promised major revenue. Colombia rejected a canal treaty. Panamanian conspirators sought American support. U.S. warships deterred Colombian movement. Panama declared independence in November 1903. Washington recognized it quickly. Philippe Bunau-Varilla represented Panama abroad. He was French, not Panamanian. His treaty granted extensive American control. Panama received payment and protection.", "scholarly_interpretation": "Independence had genuine local support. American power changed its feasibility. Roosevelt wanted rapid canal construction. Investors also protected concessions. Bunau-Varilla’s role compressed Panamanian bargaining. The treaty resembled unequal sovereignty. Yet describing Panama as invented erases local agency. Strategic coercion and separatism coexisted.", "uncertainty": "Support levels are hard measuring. Colombian forces faced logistics too. U.S. intervention was still decisive. Separatists held varied motives. Later Panamanian ratification gave legality. It did not erase imbalance. Panamanians repeatedly challenged the arrangement. The 1977 treaties eventually transferred control.", "sources": [{"title": "Building the Panama Canal, 1903–1914 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1899-1913/panama-canal"}, {"title": "Hay–Bunau-Varilla Treaty Text — U.S. Foreign Relations", "url": "https://history.state.gov/historicaldocuments/frus1904/d542"}, {"title": "Panama Canal and Torrijos–Carter Treaties — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1977-1980/panama-canal"}], "visual": {"icon": "gate", "steps": ["Colombia rejects a treaty", "Separatists mobilize locally", "Warships deter response", "A broad canal zone follows"], "caption": "Local agency met external power."}}, {"number": 4, "title": "Mau Mau files: archives changed public accountability", "short_title": "Hidden files changed liability", "summary": "Survivor testimony met thousands of retained colonial files. Britain later acknowledged torture and settled claims.", "documented_fact": "Britain declared Kenya’s Emergency in 1952. Colonial forces detained many Kenyans. Screening sought Mau Mau supporters. Survivors later alleged torture. Litigation forced deeper archive searches. Officials located migrated colonial records. They had been retained in Britain. National Archives series FCO 141 documents them. A 2012 ruling allowed claims forward. Britain settled in 2013. It recognized torture and ill-treatment. Compensation covered 5,228 claimants. A memorial also followed.", "scholarly_interpretation": "Archives altered the power balance. Survivor testimony already carried evidence. Retained files strengthened corroboration. Bureaucratic records exposed institutional knowledge. Litigation made preservation politically consequential. The case challenged tidy decolonization narratives. It also showed delayed disclosure costs. Accountability came through testimony, archives, and law together.", "uncertainty": "Settlement admitted abuses broadly. It was not full adjudication. Liability questions remained contested. Records are incomplete and colonial. Many victims never claimed. Mau Mau violence also occurred. That does not excuse state torture. Archive discovery cannot recover every experience. Exact detention and death totals vary.", "sources": [{"title": "Mau Mau Claims Settlement — UK Parliament", "url": "https://hansard.parliament.uk/commons/2013-06-06/debates/13060646000005/MauMauClaims%28Settlement%29"}, {"title": "Settlement Statement — GOV.UK", "url": "https://www.gov.uk/government/news/statement-to-parliament-on-settlement-of-mau-mau-claims"}, {"title": "Mau Mau Screening Record, FCO 141 — UK National Archives", "url": "https://discovery.nationalarchives.gov.uk/details/r/C13298973"}, {"title": "Colonies and Dependencies Records — UK National Archives", "url": "https://www.nationalarchives.gov.uk/help-with-your-research/research-guides/colonies-dependencies-further-research"}], "visual": {"icon": "file", "steps": ["Survivors provide testimony", "Litigation demands records", "Migrated files emerge", "Government settles claims"], "caption": "Preserved records shifted accountability."}}, {"number": 5, "title": "1973 oil shock: embargo met existing vulnerability", "short_title": "Embargo met a tight market", "summary": "The Arab embargo mattered. Declining spare capacity, rising demand, dollar problems, and policy responses amplified it.", "documented_fact": "Arab producers acted during war. OAPEC embargoed selected supporters. Production cuts also followed. Oil prices rose dramatically. American gasoline lines became visible. The embargo ended during March 1974. Yet energy strain preceded October. American production had peaked earlier. Import dependence was growing. Global demand was strong. Inflation already troubled policymakers. Price controls distorted domestic allocation. The shock deepened recession and inflation.", "scholarly_interpretation": "The embargo was a catalyst. Market tightening increased producer leverage. National pricing systems shaped shortages. Dollar devaluation affected oil income. Political signaling influenced expectations. Later institutions addressed vulnerability. Strategic reserves expanded. Energy efficiency gained support. Consumer coordination became permanent. Geopolitics and market structure interacted.", "uncertainty": "Economists dispute recession channels. Monetary policy also mattered. So did wage dynamics. Quantifying each contribution remains difficult. The embargo did not remove all imports. Global fungibility weakened targeting. Price increases outlasted restrictions. Calling everything an embargo effect oversimplifies. Denying its importance also misleads.", "sources": [{"title": "Oil Embargo, 1973–1974 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1969-1976/oil-embargo"}, {"title": "Oil Shock of 1973–74 — Federal Reserve History", "url": "https://www.federalreservehistory.org/essays/oil-shock-of-1973-74"}, {"title": "Historical Oil Shocks — NBER", "url": "https://www.nber.org/papers/w16790"}], "visual": {"icon": "oil", "steps": ["Demand tightens supply", "War triggers embargo", "Prices and queues jump", "Policy amplifies recession"], "caption": "A shock found existing vulnerability."}}, {"number": 6, "title": "Primitive Echo: ownership changes perceived value", "short_title": "Possession changes valuation", "summary": "People often demand more to surrender objects than they would pay to acquire them. Context and methods matter.", "documented_fact": "Classic experiments assigned simple objects. Owners demanded higher selling prices. Buyers offered less. Repeated markets did not erase gaps. Researchers called this endowment effect. Loss aversion became one explanation. Later experiments changed instructions carefully. Some valuation gaps then disappeared. Other studies still found asymmetries. Choice uncertainty can also widen gaps. Familiar markets sometimes reduce them.", "scholarly_interpretation": "Possession creates a reference point. Giving up feels like loss. Earlier humans guarded scarce resources. Ownership signals may deter conflict. These evolutionary ideas remain hypotheses. Modern value also comes socially. Identity attaches to possessions. Memory strengthens attachment. Clear comparison and practice can weaken bias. Markets teach alternative reference points.", "uncertainty": "The effect is not universal. Procedures strongly affect results. Confusion can imitate loss aversion. Cultural variation needs more study. High-value choices differ from mugs. Evolutionary stories are difficult testing. Ownership rules are historically variable. The safest claim stays behavioral: possession often shifts valuation. Mechanisms remain contested.", "sources": [{"title": "Experimental Tests of the Endowment Effect — Journal of Political Economy", "url": "https://web.mit.edu/curhan/www/docs/Articles/15341_Readings/Behavioral_Decision_Theory/Kahneman_et_al_1990_Experimental_tests.pdf"}, {"title": "Endowment Effect, Loss Aversion, and Status Quo Bias — American Economic Association", "url": "https://www.aeaweb.org/articles?id=10.1257%2Fjep.5.1.193"}, {"title": "Valuation Gaps and Experimental Procedures — American Economic Association", "url": "https://pubs.aeaweb.org/doi/10.1257/0002828054201387"}, {"title": "Choice Uncertainty and the Endowment Effect — Scientific Reports", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC9200560/"}], "visual": {"icon": "table", "steps": ["An object becomes mine", "Loss becomes salient", "Selling price rises", "Experience may narrow gaps"], "caption": "Possession can redraw value."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
</script></body></html>
