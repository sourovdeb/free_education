<script>
const LESSON={"schema_version": 1, "title": "History Investigation: Rules, choice, and prestige", "edition_date": "2026-09-27", "edition_time": "14:00", "timezone": "Indian/Reunion", "slug": "rules-choice-and-prestige", "video": {"width": 1280, "height": 720, "fps": 25, "duration_seconds": 210, "audio": false, "style": "silent black-and-white progressive doodle"}, "chapters": [{"number": 1, "title": "Berlin 1884–85: rules enabled conquest", "short_title": "Rules for empire", "summary": "European powers framed commerce and humanitarianism. Their rules accelerated imperial claims.", "documented_fact": "Fourteen states met in Berlin. No African state participated. The conference ran from November 1884. It ended in February 1885. Its General Act promised free trade. It also invoked suppressing slavery. Articles 34 and 35 regulated claims. Powers had to notify rivals. Coastal authority needed effective protection. The meeting settled few later borders. Most partition followed afterward. Bilateral deals and conquest mattered.", "scholarly_interpretation": "Diplomacy reduced European friction. It made expansion more legible. Humanitarian language supplied legitimacy. Commercial access supplied incentives. The rules did not divide everything. They helped organize the scramble. African sovereignty was largely excluded. Resistance continued across the continent.", "uncertainty": "Causation should remain qualified. Imperial expansion already preceded Berlin. Technology and capital also mattered. Local alliances shaped outcomes. The conference was catalytic, not singular. Its border legacy is often overstated. Many boundaries emerged later. That correction does not absolve imperialism. It specifies the mechanism.", "sources": [{"title": "General Act of the Berlin West Africa Conference — German Federal Foreign Office", "url": "https://archiv.diplo.de/arc-en/the-political-archive/general-act-2684414"}, {"title": "General Act of the Conference at Berlin — WorldJPN, University of Tokyo", "url": "https://worldjpn.net/documents/texts/pw/18850226.T1E.html"}, {"title": "Endogenous Colonial Borders — American Political Science Review", "url": "https://www.cambridge.org/core/journals/american-political-science-review/article/endogenous-colonial-borders-precolonial-states-and-geography-in-the-partition-of-africa/132D6CBDE92946D14CCC64E59A94D3D2"}], "visual": {"icon": "scroll", "steps": ["European rivals meet", "Trade rules gain moral cover", "Claims become legible", "Conquest follows locally"], "caption": "Rules coordinated empire without drawing every border."}}, {"number": 2, "title": "Bandung 1955: solidarity without sameness", "short_title": "A diverse coalition", "summary": "Twenty-nine states opposed colonial domination. They never formed one ideological bloc.", "documented_fact": "Twenty-nine Asian and African governments met. Bandung hosted them in April 1955. Their communiqué condemned colonialism. It supported self-determination. It also promoted economic cooperation. Ten principles emphasized sovereignty and peace. Participants differed sharply. China was communist. Turkey belonged to NATO. Pakistan joined Western security pacts. India pursued nonalignment. Delegates disputed which imperialism counted. Consensus language accommodated those conflicts.", "scholarly_interpretation": "Bandung created political space. New states could bargain collectively. They rejected compulsory Cold War alignment. Yet nonalignment was not neutrality. Nor was it ideological uniformity. Anti-colonial solidarity enabled cooperation. National interests still structured positions. The coalition’s diversity was its achievement. It was also its constraint.", "uncertainty": "Bandung did not directly create everything. The Non-Aligned Movement arrived in 1961. Later leaders reworked its memory. State diplomacy also excluded many activists. Internal repression received limited scrutiny. Colonial legacies remained unequal. Bandung’s influence is therefore institutional and symbolic. Exact causal weight remains debated.", "sources": [{"title": "Final Communiqué of the Asian-African Conference — AALCO", "url": "https://www.aalco.int/Basicdocuments/FINAL%20COMMUNIQU%C3%89%20OF%20THE%20ASIAN-AFRICAN%20CONFERENCE.pdf"}, {"title": "Bandung Conference, 1955 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1953-1960/bandung-conf"}, {"title": "Afro-Asian Internationalisms in the Early Cold War — Leiden University", "url": "https://scholarlypublications.universiteitleiden.nl/access/item%3A2912516/view"}], "visual": {"icon": "table", "steps": ["Different governments gather", "Colonialism gets challenged", "Principles bridge divisions", "A new diplomatic voice forms"], "caption": "Coalition did not require sameness."}}, {"number": 3, "title": "Marshall Plan: aid served several interests", "short_title": "Recovery plus strategy", "summary": "European recovery was real. American security, trade, and integration goals accompanied it.", "documented_fact": "George Marshall proposed European assistance in 1947. Congress enacted it in 1948. About $13.3 billion followed. Funds supplied food and equipment. They also supported industrial recovery. The law sought stable conditions. It encouraged participating countries to cooperate. It promoted expanded foreign trade. Communist influence worried American officials. Soviet leaders rejected participation. Eastern European governments then stayed outside. Western European institutions coordinated requests.", "scholarly_interpretation": "The plan was generous. It was also strategic. Recovery could reduce political extremism. Prosperity could support American markets. Cooperation could integrate Western Europe. These aims reinforced each other. Charity and national interest need not conflict. Treating either as the sole motive loses evidence. Recipients also shaped implementation.", "uncertainty": "Europe was already recovering unevenly. Economists debate marginal impact. American money was important. Domestic reforms mattered too. The plan did not cause integration alone. Nor did it simply buy obedience. European governments bargained actively. Counterfactual outcomes remain unknowable. Success cannot reveal one private motive.", "sources": [{"title": "Marshall Plan (1948) — U.S. National Archives", "url": "https://www.archives.gov/milestone-documents/marshall-plan"}, {"title": "Marshall Plan, 1948 — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1945-1952/marshall-plan"}, {"title": "Foreign Assistance Act of 1948 — Marshall Foundation", "url": "https://www.marshallfoundation.org/the-marshall-plan/f-a-act-1948/"}], "visual": {"icon": "umbrella", "steps": ["European shortage persists", "American aid arrives", "Cooperation becomes conditional", "Recovery serves strategy"], "caption": "Aid can help others and donors."}}, {"number": 4, "title": "Korean armistice: prisoner choice delayed peace", "short_title": "Choice at the truce table", "summary": "Fighting continued while negotiators argued whether prisoners could refuse repatriation.", "documented_fact": "Armistice talks began in July 1951. Front lines soon stabilized. Prisoners became the central obstacle. Communist negotiators demanded general repatriation. The United Nations Command opposed forced return. Many Chinese and North Korean prisoners resisted repatriation. Screening occurred amid coercion and violence. South Korea released thousands unilaterally. The final 1953 agreement used neutral supervision. Prisoners could decline immediate return. The ceasefire followed on 27 July.", "scholarly_interpretation": "A humanitarian principle became strategic. Washington presented voluntary repatriation as individual freedom. It also offered propaganda value. Beijing and Pyongyang invoked treaty rules. They also feared mass defection’s symbolism. Prisoners themselves exercised agency. Camp factions constrained that agency. The dispute prolonged lethal fighting. Moral claims and power politics intertwined.", "uncertainty": "Individual choices were not fully free. Some prisoners feared punishment. Others faced anti-communist pressure. Screening records remain imperfect. Casualties attributable to negotiation delay vary. Neither side owned humanitarian consistency. The settlement solved no peace treaty. It stopped large-scale combat. Korea remains divided. Motives differed within every delegation.", "sources": [{"title": "Korean Armistice Agreement — U.S. National Archives", "url": "https://www.archives.gov/milestone-documents/armistice-agreement-restoration-south-korean-state"}, {"title": "Prisoner of War Issue and the Search for Peace — Truman Library", "url": "https://www.trumanlibrary.gov/library/online-collections/korea-prisoners"}, {"title": "Conflicts in Voluntary Repatriation — UC eScholarship", "url": "https://escholarship.org/uc/item/14d4n47s"}], "visual": {"icon": "table", "steps": ["Front stabilizes", "Prisoners face choices", "Negotiators weaponize principle", "Neutral supervision breaks deadlock"], "caption": "Human agency became a battlefield."}}, {"number": 5, "title": "Bangladesh 1971: warnings met strategic silence", "short_title": "Warnings versus alignment", "summary": "American diplomats documented atrocities. Nixon protected Pakistan’s strategic value.", "documented_fact": "Pakistan’s army attacked East Pakistan in March 1971. Diplomats in Dacca reported atrocities. Archer Blood transmitted a dissent cable. It condemned American silence. The cable used the term genocide. Washington nevertheless backed President Yahya Khan. Pakistan carried secret messages to China. Nixon valued that channel. India received millions of refugees. War followed in December. Bangladesh then became independent.", "scholarly_interpretation": "The record supports strategic complicity. Nixon and Kissinger prioritized Pakistan. They feared Soviet-backed India. They protected China diplomacy. Bureaucratic dissent shows alternatives existed. Policy was not mere ignorance. Officials received strong warnings. Strategic calculation overrode public condemnation. That conclusion does not assign equal knowledge everywhere. It concerns senior policy choices.", "uncertainty": "Death estimates vary widely. Legal genocide findings require careful scope. Scholars debate targeted groups and totals. India also pursued strategic interests. Bengali forces committed abuses too. Those facts do not erase Pakistan’s campaign. Nor do they excuse Washington’s choices. Evidence supports awareness and restraint failure. It cannot expose every private calculation.", "sources": [{"title": "Dissent Telegram from Dacca — Foreign Relations of the United States", "url": "https://history.state.gov/historicaldocuments/frus1969-76v11/d19"}, {"title": "The Tilt: U.S. and South Asia, 1971 — National Security Archive", "url": "https://nsarchive2.gwu.edu/NSAEBB/NSAEBB79/"}, {"title": "South Asia Crisis and Bangladesh — U.S. Office of the Historian", "url": "https://history.state.gov/milestones/1969-1976/south-asia"}], "visual": {"icon": "newspaper", "steps": ["Atrocities are reported", "Diplomats dissent", "Strategy protects an ally", "Public silence persists"], "caption": "Knowledge does not guarantee action."}}, {"number": 6, "title": "Primitive Echo: why prestige drives copying", "short_title": "Copying visible success", "summary": "People use social attention as a learning shortcut. Online metrics can hijack it.", "documented_fact": "Humans often learn socially. We cannot test everything ourselves. Prestige offers a shortcut. People observe who receives deference. They may then copy that person. Experiments have tested this pattern. Participants preferentially learned from popular models. Online groups also generated prestige cues. Success and attention sometimes aligned. They did not always align. Children and adults show contextual variation.", "scholarly_interpretation": "Cultural-evolution theory treats prestige bias as adaptive. Skilled models can reduce learning costs. Deference provides second-order information. Social platforms magnify those signals. Followers and likes become visible proxies. Influencers therefore attract imitation across domains. A beauty celebrity may sell nutrition. The ancient shortcut meets engineered metrics.", "uncertainty": "Prestige bias is not automatic. Evidence varies by task. Popularity differs from expertise. Algorithms shape exposure first. Advertising adds persuasion. Culture changes valued signals. Evolutionary explanations remain partly inferential. Online diffusion does not prove ancestral adaptation. Users also resist famous models. The safest lesson is modest: attention can cue learning, but cannot certify competence.", "sources": [{"title": "Prestige-biased social learning: current evidence — Humanities and Social Sciences Communications", "url": "https://www.nature.com/articles/s41599-019-0228-7"}, {"title": "Emergence and adaptive use of prestige online — Royal Society Open Science", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC7374563/"}, {"title": "Formalising prestige bias — Royal Society Open Science", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11058518/"}], "visual": {"icon": "chatbot", "steps": ["Attention signals status", "Status suggests competence", "People copy the model", "Metrics can mislead"], "caption": "Prestige is a cue, not proof."}}]};
let index=0, timer=null;
const $=id=>document.getElementById(id);
function renderNav(){$("chapters").innerHTML=LESSON.chapters.map((c,i)=>'<li><button data-i="'+i+'" aria-current="'+(i===index)+'">'+String(i+1).padStart(2,'0')+' · '+c.short_title+'</button></li>').join('');document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{index=+b.dataset.i;render();});}
function render(){const c=LESSON.chapters[index];$("meta").textContent='CARD '+String(c.number).padStart(2,'0')+' · '+LESSON.edition_date;$("title").textContent=c.title;$("summary").textContent=c.summary;$("fact").textContent=c.documented_fact;$("interpretation").textContent=c.scholarly_interpretation;$("uncertainty").textContent=c.uncertainty;$("mechanism").innerHTML=c.visual.steps.map(s=>'<div class="step">'+s+'</div>').join('');$("mechanism").setAttribute("aria-label",c.visual.caption);$("sources").innerHTML=c.sources.map(s=>'<li><a href="'+s.url+'">'+s.title+'</a></li>').join('');$("count").textContent=(index+1)+' / '+LESSON.chapters.length;$("fill").style.width=((index+1)/LESSON.chapters.length*100)+'%';renderNav();}
function move(d){index=(index+d+LESSON.chapters.length)%LESSON.chapters.length;render();}
function toggle(){if(timer){clearInterval(timer);timer=null;$("play").textContent='Play';}else{timer=setInterval(()=>move(1),12000);$("play").textContent='Pause';}}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("play").onclick=toggle;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key===" "){e.preventDefault();toggle();}});render();
