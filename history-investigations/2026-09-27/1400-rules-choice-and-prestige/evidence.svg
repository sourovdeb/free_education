<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">How diplomatic rules helped organize imperial expansion</title>
<desc id="desc">A black-and-white mechanism diagram. European imperial rivalry led to a Berlin meeting. Commercial access and anti-slavery language supplied public justification. Notification and effective protection rules made rival claims legible. Later bilateral deals and local conquest produced territorial control. A separate uncertainty box states that Berlin settled few final borders.</desc>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12z" fill="#111"/></marker>
<style>.t{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#111}.h{font-size:48px;font-weight:800}.s{font-size:22px}.n{font-size:28px;font-weight:800}.b{font-size:20px}.k{font-size:16px;font-weight:800;letter-spacing:2px}.box{fill:#fff;stroke:#111;stroke-width:4}.dash{fill:#fff;stroke:#111;stroke-width:3;stroke-dasharray:10 8}</style></defs>
<rect width="1280" height="760" fill="#fff"/>
<text x="64" y="76" class="t h">Rules organized a scramble</text>
<text x="64" y="112" class="t s">Berlin, 1884–85 · conference rules were catalytic, not singular</text>
<g>
<rect class="box" x="60" y="180" width="250" height="170" rx="8"/><text x="84" y="215" class="t k">INCENTIVE</text><text x="84" y="260" class="t n">Rival empires</text><text x="84" y="292" class="t b">Competition raised</text><text x="84" y="320" class="t b">conflict risks.</text>
<path d="M312 265H370" stroke="#111" stroke-width="6" marker-end="url(#a)"/>
<rect class="box" x="390" y="180" width="250" height="170" rx="8"/><text x="414" y="215" class="t k">LANGUAGE</text><text x="414" y="260" class="t n">Trade + slavery</text><text x="414" y="292" class="t b">Commerce and reform</text><text x="414" y="320" class="t b">supplied legitimacy.</text>
<path d="M642 265H700" stroke="#111" stroke-width="6" marker-end="url(#a)"/>
<rect class="box" x="720" y="180" width="250" height="170" rx="8"/><text x="744" y="215" class="t k">RULES</text><text x="744" y="260" class="t n">Claims notified</text><text x="744" y="292" class="t b">European rivals made</text><text x="744" y="320" class="t b">claims legible.</text>
<path d="M972 265H1030" stroke="#111" stroke-width="6" marker-end="url(#a)"/>
<rect class="box" x="1050" y="180" width="170" height="170" rx="8"/><text x="1074" y="215" class="t k">RESULT</text><text x="1074" y="260" class="t n">Conquest</text><text x="1074" y="292" class="t b">Control followed</text><text x="1074" y="320" class="t b">on the ground.</text>
</g>
<rect class="dash" x="60" y="420" width="1160" height="150" rx="8"/>
<text x="88" y="460" class="t k">UNCERTAINTY</text><text x="88" y="510" class="t n">Berlin settled few final borders.</text><text x="88" y="545" class="t b">Later treaties, wars, resistance, and local bargains shaped the map.</text>
<g transform="translate(60 630)"><rect width="1160" height="70" fill="#111"/><text x="28" y="44" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#fff">Evidence rule: distinguish coordination from complete causation.</text></g>
</svg>
