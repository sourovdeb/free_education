<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Standards, scale, and lock-in evidence ladder</title>
<desc id="desc">Six rows connect a standard, its scaling mechanism, evidence, and limits. Each case links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c35d4d"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#27333a}.white{fill:#f3e8cf}.small{font-size:16px}.arrow{stroke:#c35d4d;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f3e8cf"/><text x="40" y="64" style="font-size:42px">Standards, Scale, and Lock-In</text><text x="40" y="100" style="font-size:20px;font-weight:400">Standard → mechanism → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27333a" stroke-width="2"/>
    <a href="https://www.loc.gov/exhibits/bibles/the-gutenberg-bible.html"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">Gutenberg</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Type plus capital</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Books and lawsuit</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Asia came earlier</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27333a" stroke-width="2"/>
    <a href="https://www.sciencemuseum.org.uk/objects-and-stories/how-perseverance-laid-first-transatlantic-telegraph-cable"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">Cable</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Failure plus measurement</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Cable and instruments</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Credit distributed</text>
  </g>
  <g transform="translate(0,385)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27333a" stroke-width="2"/>
    <a href="https://americanhistory.si.edu/collections/object/nmah_856951"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">Barbed wire</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Cheap enclosure</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Patents and landscapes</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Wire not sufficient</text>
  </g>
  <g transform="translate(0,485)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27333a" stroke-width="2"/>
    <a href="https://americanhistory.si.edu/explore/exhibitions/america-on-the-move/online/transforming-waterfront"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">Containers</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Shared dimensions</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Ports and standards</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Other forces mattered</text>
  </g>
  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27333a" stroke-width="2"/>
    <a href="https://americanhistory.si.edu/collections/object/nmah_850542"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">QWERTY</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Training plus compatibility</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Machines and debate</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Inferiority disputed</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27333a" stroke-width="2"/>
    <a href="https://rzeckhauser.scholars.harvard.edu/publications/status-quo-bias-decision-making"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#317972"/><text x="155" y="7" text-anchor="middle" class="white">Defaults</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d4a13d" stroke="#27333a"/><text x="455" y="7" text-anchor="middle">Copying under uncertainty</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557ea0"/><text x="755" y="7" text-anchor="middle" class="white">Behavioral studies</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c35d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Adaptation unproven</text>
  </g>
</svg>