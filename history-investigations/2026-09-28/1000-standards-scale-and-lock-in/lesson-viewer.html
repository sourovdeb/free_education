<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standards, Scale, and Lock-In viewer</title><style>
body{margin:0;background:#27333a;color:#f3e8cf;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}canvas{width:100%;background:#f3e8cf;border:3px solid #f3e8cf}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:9px 13px;border:0;background:#d4a13d;color:#27333a}input{flex:1}.objects{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.objects button{background:#317972;color:white}.panel{border-left:5px solid #c35d4d;padding:8px 14px;background:#314048}.sources a{color:#f3cc70}.reduced canvas{display:none}.reduced .panel{font-size:18px}@media(prefers-reduced-motion:reduce){canvas{display:none}}</style></head><body><main class="wrap"><h1>Standards, Scale, and Lock-In</h1><canvas id="c" width="960" height="540" aria-label="Animated cut-paper causal scenes"></canvas><div class="controls"><button id="play">Pause</button><button id="back">Step back</button><button id="next">Step forward</button><button id="replay">Replay</button><input id="scrub" aria-label="Scene scrubber" type="range" min="0" max="180" step="0.04" value="0"><button id="motion">Reduced motion</button></div><div class="objects" id="objects"></div><article class="panel"><h2 id="title"></h2><p id="beat"></p><p id="fact"></p><p id="body"></p><div class="sources" id="sources"></div></article></main><script>const DATA={"title": "Standards, Scale, and Lock-In", "subtitle": "History Investigation — 28 September 2026, 10:00 Réunion", "palette": {"ink": "#27333a", "paper": "#f3e8cf", "teal": "#317972", "coral": "#c35d4d", "gold": "#d4a13d", "blue": "#557ea0", "green": "#728a59"}, "chapter_seconds": 30, "fps": 25, "cards": [{"id": "gutenberg-system-and-finance", "title": "Gutenberg needed capital", "question": "Did one inventor suffice?", "body": "**Documented fact.** Asian printers preceded Gutenberg. Korea used movable metal type. Gutenberg worked in fifteenth-century Mainz. His workshop combined several techniques. Metal punches shaped letters. Matrices enabled repeated casting. Oil-based ink held well. A press transferred impressions. Johann Fust financed development. He lent 1,550 gulden. Peter Schoeffer joined production. Their Bible appeared around 1455. Fust then sued Gutenberg. Fust gained workshop equipment. Fust and Schoeffer continued printing. **Scholarly interpretation.** Gutenberg integrated a production system. Financing enabled expensive experimentation. Repeatable type supported scale. European demand supported diffusion. **Benefits.** Books became more reproducible. Texts moved more quickly. Wider reading became possible. **Conflicts and harms.** Investors controlled productive assets. Printed polemics also spread rapidly. **Counterevidence and limits.** Gutenberg invented neither printing alone. Nor movable type globally. Exact workshop roles remain uncertain. His European contribution remains substantial. “First printed book” is inaccurate. “First major Western metal-type book” fits better.", "summary": "Capital joined type and presses.", "sources": [["Gutenberg Bible", "https://www.loc.gov/exhibits/bibles/the-gutenberg-bible.html"], ["Gutenberg Interactive", "https://www.loc.gov/exhibits/bibles/interactives/gutenberg/index.html"], ["Gutenberg Printer Guide", "https://guides.loc.gov/gutenberg/the-printer"], ["Alphabet Venture", "https://blogs.loc.gov/international-collections/2018/06/alphabet-venture/"]], "beats": ["Asian precedents already exist.", "Gutenberg casts repeatable type.", "Fust supplies costly capital.", "The Bible enters production.", "A lawsuit transfers equipment."], "setting": "Mainz metal shop and press", "objects": [{"kind": "typeblock", "label": "metal type", "fact": "Matrices enabled repeatable letters.", "track": [[85, 225], [120, 218], [155, 210], [190, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "press", "label": "printing press", "fact": "The workshop integrated many techniques.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "coin", "label": "Fust’s capital", "fact": "Fust lent 1,550 gulden.", "track": [[535, 115], [485, 125], [435, 138], [385, 152], [335, 168], [295, 184]], "from": 2}, {"kind": "book", "label": "Gutenberg Bible", "fact": "The Bible appeared around 1455.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "gavel", "label": "Fust lawsuit", "fact": "Fust gained workshop equipment.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 4}, {"kind": "cart", "label": "printed books", "fact": "Repeatable production expanded output.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 3}], "word_count": 146}, {"id": "atlantic-cable-repeated-failure", "title": "The cable failed forward", "question": "Did one cable connect?", "body": "**Documented fact.** Cyrus Field organized investors. Engineers built Atlantic cables. The 1858 cable briefly worked. Victoria messaged President Buchanan. Her message took hours. The cable soon failed. Excessive voltage damaged insulation. Another expedition sailed during 1865. Its cable snapped. Great Eastern carried huge coils. Crews returned during 1866. They laid a durable cable. They recovered 1865’s cable too. William Thomson supplied sensitive instruments. Lower currents protected signals. **Scholarly interpretation.** Failure generated practical knowledge. Capital absorbed repeated losses. Ship capacity solved handling. Measurement solved electrical weakness. **Benefits.** News crossed within minutes. Markets coordinated more quickly. Diplomacy gained faster contact. **Conflicts and harms.** Access remained expensive. Cable power favored institutions. Networks later supported empires. **Counterevidence and limits.** The 1858 cable was real. Calling 1866 the first erases it. Calling Field sole inventor also fails. Success joined finance, materials, instruments, ships, and crews.", "summary": "Failures taught the system.", "sources": [["First Atlantic Cable", "https://www.sciencemuseum.org.uk/objects-and-stories/how-perseverance-laid-first-transatlantic-telegraph-cable"], ["Atlantic Telegraph Broadsheet", "https://collection.sciencemuseumgroup.org.uk/objects/co8062899/the-atlantic-telegraph-broadsheet-1866-broadsheet"], ["Kelvin Galvanometer", "https://collection.sciencemuseumgroup.org.uk/objects/co6211/lord-kelvins-ironclad-marine-galvanometer-1865-1866"], ["Atlantic Cable History", "https://ewh.ieee.org/reg/7/diglib/library/hearts-content/provsite.html"]], "beats": ["Investors fund an ocean cable.", "The 1858 signal fades.", "The 1865 cable snaps.", "Great Eastern returns stronger.", "Sensitive instruments sustain contact."], "setting": "Atlantic cable-laying ship", "objects": [{"kind": "coin", "label": "investor capital", "fact": "Private capital absorbed repeated losses.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "ship", "label": "Great Eastern", "fact": "The ship carried immense cable coils.", "track": [[565, 225], [520, 218], [475, 210], [430, 202], [385, 195], [350, 188]], "from": 1}, {"kind": "cablespool", "label": "1858 cable", "fact": "The first cable failed quickly.", "track": [[530, 115], [480, 125], [430, 138], [380, 152], [330, 168], [290, 184]], "from": 1}, {"kind": "brokenline", "label": "1865 break", "fact": "The 1865 cable snapped offshore.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 2}, {"kind": "galvanometer", "label": "Kelvin instrument", "fact": "Sensitive instruments used lower currents.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 4}, {"kind": "station", "label": "connected shores", "fact": "Durable contact arrived during 1866.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 140}, {"id": "barbed-wire-enclosure", "title": "Cheap wire changed land", "question": "Can fencing reorganize society?", "body": "**Documented fact.** Plains fencing materials were scarce. Inventors patented many wire designs. Joseph Glidden improved one. His 1874 patent used barbs. Twisted strands held them. Glidden and Phineas Vaughan patented machinery. Factories then lowered prices. Settlers fenced homestead claims. Ranchers enclosed grazing land. The open range contracted. Fence cutting triggered conflicts. Cattle movements changed permanently. **Scholarly interpretation.** Cheap fencing made boundaries enforceable. Technology strengthened written property claims. Federal land policy supplied those claims. Railroads supported mass distribution. **Benefits.** Farmers protected crops. Ranchers controlled breeding. Boundaries reduced some disputes. **Conflicts and harms.** Small ranchers lost access. Animals suffered injuries. Enclosure intensified land conflict. Settler expansion already displaced Indigenous peoples. Wire reinforced that transformation. **Counterevidence and limits.** Wire alone ended nothing. Harsh winters also mattered. Homestead law mattered greatly. Markets changed ranching too. Many inventors preceded Glidden. His manufacturing system proved decisive.", "summary": "Cheap boundaries changed access.", "sources": [["Smithsonian Barbed Wire", "https://americanhistory.si.edu/collections/object/nmah_856951"], ["Glidden Patent Machine", "https://americanhistory.si.edu/collections/object/nmah_857480"], ["Grant-Kohrs Ranch Stories", "https://www.nps.gov/grko/learn/historyculture/stories.htm"], ["Open Range Ends", "https://www.nps.gov/grko/planyourvisit/text-only-park-brochure.htm"]], "beats": ["Open range crosses claims.", "Glidden twists sharp barbs.", "Machines lower fencing costs.", "Wire closes grazing routes.", "Land conflict intensifies."], "setting": "Great Plains range and farms", "objects": [{"kind": "cattle", "label": "open-range cattle", "fact": "Stock once grazed across huge ranges.", "track": [[85, 225], [120, 218], [155, 210], [190, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "wirewheel", "label": "barbed wire", "fact": "Glidden improved twisted-barb fencing.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "machine", "label": "wire machine", "fact": "Machinery reduced production costs.", "track": [[535, 115], [485, 125], [435, 138], [385, 152], [335, 168], [295, 184]], "from": 2}, {"kind": "fence", "label": "closed range", "fact": "Fences redirected cattle movements.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "farmer", "label": "homesteader", "fact": "Federal claims supported enclosure.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "cutters", "label": "fence cutters", "fact": "Enclosure triggered violent conflict.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 140}, {"id": "container-standardization", "title": "Containers needed common dimensions", "question": "Did one box transform trade?", "body": "**Documented fact.** Cargo once moved piecewise. Dock gangs handled each item. Malcolm McLean owned trucks. He tested sealed trailers. Ideal-X sailed during 1956. It carried fifty-eight units. Loading time fell sharply. Yet early container systems differed. Sizes and corner fittings conflicted. Ships, trucks, and cranes needed compatibility. ISO committees negotiated standards. Ports built specialized terminals. Railways adapted equipment. Shipping companies reordered fleets. **Scholarly interpretation.** McLean demonstrated commercial integration. Standardization created network value. Infrastructure made interchangeability useful. Labor agreements shaped adoption. **Benefits.** Handling costs dropped. Theft and breakage declined. Global supply chains expanded. **Conflicts and harms.** Dock employment contracted. Waterfront neighborhoods lost work. Larger ports displaced smaller ones. Capital costs increased concentration. **Counterevidence and limits.** McLean did not invent boxes. Earlier containers existed. ISO did not act alone. Firms and governments compromised. Cheap shipping also reflected larger ships, cheaper fuel, and trade policy.", "summary": "Shared dimensions created networks.", "sources": [["Transforming the Waterfront", "https://americanhistory.si.edu/explore/exhibitions/america-on-the-move/online/transforming-waterfront"], ["ISO: Standardization Made Containers", "https://www.iso.org/files/live/sites/isoorg/files/news/magazine/ISO%20Focus%20%282004-2009%29/2007/ISO%20Focus%2C%20October%202007.pdf"], ["Waterfront Oral History", "https://oralhistory.columbia.edu/2018-down-to-the-docks-the-longshoreman-speaks-up"]], "beats": ["Dockworkers lift loose cargo.", "Ideal-X carries sealed trailers.", "Incompatible boxes block transfers.", "ISO dimensions align equipment.", "Ports reorganize around cranes."], "setting": "Working waterfront and container port", "objects": [{"kind": "crates", "label": "loose cargo", "fact": "Dock gangs handled pieces individually.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "containership", "label": "Ideal-X", "fact": "Ideal-X carried fifty-eight units.", "track": [[565, 225], [520, 218], [475, 210], [430, 202], [385, 195], [350, 188]], "from": 1}, {"kind": "mismatch", "label": "incompatible boxes", "fact": "Early proprietary dimensions conflicted.", "track": [[535, 115], [485, 125], [435, 138], [385, 152], [335, 168], [295, 184]], "from": 2}, {"kind": "ruler", "label": "ISO dimensions", "fact": "Shared dimensions enabled interchange.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "crane", "label": "port crane", "fact": "Ports invested in specialized cranes.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 4}, {"kind": "worker", "label": "dockworker", "fact": "Containerization reduced dock labor.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 142}, {"id": "qwerty-path-dependence", "title": "QWERTY’s lock-in is disputed", "question": "Did an inferior layout win?", "body": "**Documented fact.** Christopher Sholes developed QWERTY. Carlos Glidden collaborated. Remington manufactured their typewriter. The 1878 model added capitals. Its commercial success mattered. Typists learned its arrangement. Offices bought matching machines. Manufacturers increasingly followed it. QWERTY later reached computers. **Scholarly interpretation.** One account emphasizes path dependence. Early adoption created switching costs. Trained typists reinforced demand. Network coordination favored sameness. Another account disputes market failure. Evidence for Dvorak superiority remains contested. **Benefits.** Shared layouts reduce retraining. Users transfer practiced movements. Standards coordinate workplaces. **Conflicts and harms.** Alternatives face adoption barriers. Historical choices constrain design. Language differences fit imperfectly. Procurement reinforced existing inventories. Vendor support reinforced them again. **Counterevidence and limits.** The origin story remains debated. Jam prevention may explain changes. “Designed to slow typists” overstates evidence. QWERTY may not be optimal. Inferiority is not established. Persistence alone proves no failure. Both engineering and markets mattered.", "summary": "Familiarity became infrastructure.", "sources": [["Sholes and Glidden Typewriter", "https://americanhistory.si.edu/collections/object/nmah_850542"], ["Remington Standard No. 2", "https://americanhistory.si.edu/collections/object/nmah_1414422"], ["Path Dependence Critique", "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1706450"], ["QWERTY Origins Debate", "https://www.smithsonianmag.com/history/the-qwerty-keyboard-will-never-die-where-did-the-150-year-old-design-come-from-49863249/"]], "beats": ["Sholes rearranges mechanical keys.", "Remington sells QWERTY machines.", "Typists learn shared movements.", "Offices demand familiar layouts.", "Alternatives face switching costs."], "setting": "Typewriter workshop and office", "objects": [{"kind": "typewriter", "label": "Sholes machine", "fact": "Sholes developed the enduring layout.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "factory", "label": "Remington", "fact": "Commercial success supported adoption.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "hands", "label": "trained typist", "fact": "Skills created switching costs.", "track": [[535, 115], [485, 125], [435, 138], [385, 152], [335, 168], [295, 184]], "from": 2}, {"kind": "office", "label": "QWERTY office", "fact": "Offices preferred compatible skills.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "keyboard", "label": "computer keyboard", "fact": "The layout migrated into computing.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 4}, {"kind": "question", "label": "inferiority disputed", "fact": "Dvorak superiority remains contested.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 143}, {"id": "primitive-echo-familiar-defaults", "title": "Primitive Echo: familiar defaults", "question": "Why keep familiar systems?", "body": "**Documented evidence.** Experiments reveal status-quo bias. Existing options attract choices. Switching feels like active risk. Defaults also shape enrollment. Social learning changes behavior. People often copy majorities. That tendency varies greatly. Payoff information can override it. Uncertainty can strengthen copying. **Evolutionary interpretation.** Individual trial carries costs. Observing others can save effort. Majority behavior may filter errors. Shared practices ease coordination. These are functional hypotheses. They do not prove adaptation. **Current echo.** Users keep familiar software. Workers resist new workflows. Communities preserve established standards. Switching costs reinforce preference. **Benefits.** Familiarity reduces mistakes. Shared conventions enable cooperation. Training investments retain value. **Harms.** Better alternatives may stall. Bad defaults can persist. Minorities bear compatibility costs. **Counterevidence and limits.** Persistence has many causes. Contracts can create lock-in. Monopoly power can matter. Learning costs may be rational. Conformity is not universal. Familiarity alone cannot explain standards.", "summary": "Copying can lower uncertainty.", "sources": [["Status Quo Bias", "https://rzeckhauser.scholars.harvard.edu/publications/status-quo-bias-decision-making"], ["Evolutionary Social Learning", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3248730/"], ["Conformity and Cultural Evolution", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3707918/"], ["Similarity-Biased Social Learning", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11859121/"]], "beats": ["A learner faces uncertainty.", "The majority uses one path.", "Copying lowers immediate risk.", "Shared habits reinforce standards.", "A better path stays uncertain."], "setting": "Forked paths and shared tools", "objects": [{"kind": "forkpath", "label": "uncertain choice", "fact": "Switching makes risk feel active.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "group", "label": "local majority", "fact": "People sometimes copy majorities.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "footprints", "label": "familiar path", "fact": "Copied behavior lowers exploration.", "track": [[535, 115], [485, 125], [435, 138], [385, 152], [335, 168], [295, 184]], "from": 2}, {"kind": "gear", "label": "shared standard", "fact": "Coordination reinforces conventions.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "default", "label": "default option", "fact": "Existing options attract choices.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "sprout", "label": "new alternative", "fact": "Better alternatives remain uncertain.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 141}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function person(){x.fillStyle=P.gold;x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,P.blue)}function draw(o,p){let[a,b]=interp(o.track,p);x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(o.kind==='ship'){x.fillStyle=P.coral;x.beginPath();x.moveTo(-55,0);x.lineTo(55,0);x.lineTo(38,28);x.lineTo(-38,28);x.closePath();x.fill();x.stroke();paper(-24,-34,48,34,P.paper);x.beginPath();x.moveTo(2,-65);x.lineTo(38,-42);x.lineTo(2,-25);x.closePath();x.fillStyle=P.gold;x.fill();x.stroke()}else if(o.kind==='missile'){x.beginPath();x.moveTo(0,-55);x.lineTo(16,-24);x.lineTo(16,34);x.lineTo(0,52);x.lineTo(-16,34);x.lineTo(-16,-24);x.closePath();x.fillStyle=P.coral;x.fill();x.stroke()}else if(o.kind==='rubber'){paper(-38,-18,76,44,P.gold);for(let i=-1;i<2;i++){x.beginPath();x.arc(i*22,-23,9,0,7);x.fillStyle=P.blue;x.fill();x.stroke()}}else if(o.kind==='group'){x.save();x.translate(-24,0);person();x.restore();x.save();x.translate(24,0);person();x.restore()}else if(['coin','seed','gift','return'].includes(o.kind)){x.beginPath();x.arc(0,0,20,0,7);x.fill();x.stroke()}else if(['portrait','scientist','worker','child','giver','receiver','patient'].includes(o.kind)){person()}else{paper(-34,-27,68,54,['foundation','company','factory','bank','agency','trust'].includes(o.kind)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,56);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2?'#e4dccf':'#dce6dd';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#body').textContent=reduced?c.body.replaceAll('**',''):'';document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>document.querySelector('#fact').textContent=c.objects[+b.dataset.i].fact);scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced;render()};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
