<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Pressure and systems evidence ladder</title><desc id="desc">Six rows trace how constraints, rules, and feedback changed outcomes in five historical systems and one modern behavior.</desc><rect width="900" height="640" fill="#f3e6c8"/><style>text{font-family:Arial,sans-serif;fill:#272735}.head{font-weight:700;font-size:34px}.label{font-weight:700;font-size:18px;fill:white}.small{font-size:17px}path{stroke:#272735;stroke-width:5;fill:none}rect{stroke:#272735;stroke-width:2}</style><text x="48" y="60" class="head">Pressure reveals system mechanics</text><text x="48" y="90" class="small">Follow constraint. Then test causation.</text><g><rect x="48" y="116" width="190" height="48" rx="3" fill="#cf5c4f"/><text x="60" y="147" class="label">Suez</text><path d="M250 140 H390"/><circle cx="410" cy="140" r="16" fill="#cf5c4f"/><path d="M430 140 H590"/><rect x="605" y="116" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="146" class="small">finance → ceasefire</text></g><g><rect x="48" y="194" width="190" height="48" rx="3" fill="#e0a83e"/><text x="60" y="225" class="label">Berlin</text><path d="M250 218 H390"/><circle cx="410" cy="218" r="16" fill="#e0a83e"/><path d="M430 218 H590"/><rect x="605" y="194" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="224" class="small">spacing → throughput</text></g><g><rect x="48" y="272" width="190" height="48" rx="3" fill="#2a7775"/><text x="60" y="303" class="label">Green Revolution</text><path d="M250 296 H390"/><circle cx="410" cy="296" r="16" fill="#2a7775"/><path d="M430 296 H590"/><rect x="605" y="272" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="302" class="small">inputs → harvest</text></g><g><rect x="48" y="350" width="190" height="48" rx="3" fill="#4b78a3"/><text x="60" y="381" class="label">Apollo chips</text><path d="M250 374 H390"/><circle cx="410" cy="374" r="16" fill="#4b78a3"/><path d="M430 374 H590"/><rect x="605" y="350" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="380" class="small">orders → reliability</text></g><g><rect x="48" y="428" width="190" height="48" rx="3" fill="#cf5c4f"/><text x="60" y="459" class="label">Ozone rules</text><path d="M250 452 H390"/><circle cx="410" cy="452" r="16" fill="#cf5c4f"/><path d="M430 452 H590"/><rect x="605" y="428" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="458" class="small">trade → substitutes</text></g><g><rect x="48" y="506" width="190" height="48" rx="3" fill="#6e8b67"/><text x="60" y="537" class="label">Scarcity cues</text><path d="M250 530 H390"/><circle cx="410" cy="530" r="16" fill="#6e8b67"/><path d="M430 530 H590"/><rect x="605" y="506" width="240" height="48" rx="3" fill="#f3e6c8"/><text x="620" y="536" class="small">cues → stockouts</text></g><text x="48" y="605" class="small">Direct sources appear inside the edition.</text></svg>