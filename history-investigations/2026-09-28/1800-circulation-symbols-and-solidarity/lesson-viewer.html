<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson viewer</title><style>body{margin:0;background:#272735;color:#f3e6c8;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}canvas{width:100%;background:#f3e6c8;border:3px solid #f3e6c8}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:9px 13px;border:0;background:#e0a83e;color:#272735}input{flex:1}.objects{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.objects button{background:#2a7775;color:white}.panel{border-left:5px solid #cf5c4f;padding:8px 14px;background:#353545}.sources a{color:#f2cb68}.reduced canvas{display:none}@media(prefers-reduced-motion:reduce){canvas{display:none}}</style></head><body><main class="wrap"><h1>Circulation, Symbols, and Solidarity</h1><canvas id="c" width="960" height="540" aria-label="Animated cut-paper causal scene"></canvas><div class="controls"><button id="play">Pause</button><button id="back">Step back</button><button id="next">Step forward</button><button id="replay">Replay</button><input id="scrub" type="range" min="0" max="180" step="0.04" value="0"><button id="motion">Reduced motion</button></div><div class="objects" id="objects"></div><article class="panel"><h2 id="title"></h2><p id="beat"></p><p id="fact"></p><div class="sources" id="sources"></div></article></main><script>const DATA={"title": "Circulation, Symbols, and Solidarity", "subtitle": "History Investigation — 28 September 2026, 18:00 Réunion", "palette": {"ink": "#272735", "paper": "#f3e6c8", "teal": "#2a7775", "coral": "#cf5c4f", "gold": "#e0a83e", "blue": "#4b78a3", "green": "#6e8b67"}, "chapter_seconds": 30, "fps": 25, "cards": [{"id": "dawes-circuit", "title": "The Dawes Plan built a circuit", "question": "Who financed German reparations?", "body": "**Documented fact.** Germany owed wartime reparations. Allied governments owed American debts. Payments stalled after 1922. France occupied the Ruhr. German resistance worsened inflation. The Dawes Committee reported during 1924. It reduced immediate installments. It reorganized German finances. A foreign loan followed. American capital then entered Germany. Germany paid Allied reparations. Allies serviced American debts. Industry recovered temporarily. Credit remained largely private. The total reparations bill stayed unsettled. **Scholarly interpretation.** The plan stabilized payments. It also created circulation. American loans supported German transfers. Those transfers supported Allied debt payments. Stabilization therefore depended externally. Political conflict became manageable. Financial dependence quietly increased. **Counterevidence and limits.** The circuit was incomplete. Money was not identical. Trade generated real income. German reforms also mattered. Recovery was not fictional. Reparations and war debts remained legally separate. Officials repeatedly stressed that distinction. The plan caused no Depression. Yet American lending reversed later. That reversal exposed fragility. The evidence supports dependence. It does not prove intentional entrapment.", "summary": "American credit entered Germany. Payments circled toward America.", "sources": [["The Dawes Plan — Office of the Historian", "https://history.state.gov/milestones/1921-1936/dawes"], ["Foreign Relations Papers, 1924", "https://history.state.gov/historicaldocuments/frus1924v02/d65"], ["U.S. Economy in the 1920s — EH.net", "https://eh.net/encyclopedia/the-u-s-economy-in-the-1920s/"], ["Foreign Relations Papers, 1923", "https://history.state.gov/historicaldocuments/frus1923v02/papers"]], "beats": ["Reparations stop flowing.", "American credit enters Germany.", "Germany pays Allied governments.", "Allies service American debts.", "A reversal exposes dependence."], "setting": "Banks linking New York, Berlin, and Allied treasuries", "objects": [{"kind": "dollarstack", "label": "American loans", "track": [[75, 115], [170, 120], [270, 140], [305, 165], [305, 165], [305, 165]], "from": 0}, {"kind": "bank", "label": "German banks", "track": [[320, 205], [320, 205], [320, 205], [320, 205], [320, 205], [320, 205]], "from": 0}, {"kind": "coin", "label": "reparations", "track": [[335, 160], [335, 160], [420, 145], [505, 135], [505, 135], [505, 135]], "from": 2}, {"kind": "currency", "label": "Allied debts", "track": [[555, 205], [555, 205], [555, 205], [500, 210], [420, 215], [360, 205]], "from": 3}, {"kind": "gate", "label": "payment rules", "track": [[445, 245], [445, 245], [445, 245], [445, 245], [445, 245], [445, 245]], "from": 1}, {"kind": "shutter", "label": "credit reversal", "track": [[590, 90], [590, 90], [590, 90], [590, 90], [500, 90], [390, 90]], "from": 4}], "word_count": 159}, {"id": "salt-march-symbol", "title": "Salt made empire tangible", "question": "Why choose salt?", "body": "**Documented fact.** British India taxed salt. Colonial law restricted production. Gandhi challenged that monopoly. He first warned Viceroy Irwin. His letter listed broader grievances. Land revenue appeared there. Military spending appeared there. Exchange policy appeared there. Salt became the chosen breach. Gandhi left Sabarmati during March 1930. Marchers reached Dandi during April. He lifted saline mud. Supporters then made salt. Authorities arrested thousands. Gandhi was arrested later. Other protests continued. **Scholarly interpretation.** Salt joined principle with daily life. Everyone needed it. Poor households felt taxation sharply. Making salt required simple action. That made participation visible. The march also created news. Its pacing built attention. The symbol translated constitutional claims. It did not replace them. **Counterevidence and limits.** Salt revenue was not Britain’s sole interest. Independence required more campaigns. Participation varied across regions. Women joined extensively, despite limited initial inclusion. Colonial repression also constrained outcomes. The march brought no immediate independence. Negotiations produced limited concessions. Its strongest effect was mobilization. Symbolic power cannot be measured precisely.", "summary": "A daily necessity became visible resistance.", "sources": [["Background to Salt Satyagraha — Gandhi Heritage Portal", "https://www.gandhiheritageportal.org/es/background-to-the-salt-satyagraha"], ["Letter to Lord Irwin — Mani Bhavan Gandhi Museum", "https://www.gandhi-manibhavan.org/educational-resources/letter-to-lord-irwin.html"], ["Dandi Heritage Site — Gandhi Heritage Portal", "https://gandhiheritageportal.org/ta/gandhi_heritage_site/writeup/MzY%3D"], ["Nehru Circular, 5 March 1930", "https://nehruarchive.in/documents/to-secretaries-p-c-cs-5-march-1930-x6go3"]], "beats": ["A monopoly reaches kitchens.", "Marchers cross the countryside.", "Salt becomes civil disobedience.", "Arrests spread the confrontation.", "Negotiation follows mobilization."], "setting": "Road from Sabarmati to Dandi’s shoreline", "objects": [{"kind": "crowd", "label": "marchers", "track": [[70, 215], [170, 210], [285, 205], [390, 200], [475, 195], [520, 195]], "from": 0}, {"kind": "grain", "label": "salt", "track": [[560, 230], [560, 230], [515, 215], [440, 205], [395, 195], [395, 195]], "from": 2}, {"kind": "gate", "label": "salt monopoly", "track": [[410, 120], [410, 120], [410, 120], [410, 155], [410, 190], [410, 190]], "from": 0}, {"kind": "gavel", "label": "arrests", "track": [[575, 95], [575, 95], [575, 95], [490, 110], [405, 135], [405, 135]], "from": 3}, {"kind": "newspaper", "label": "public attention", "track": [[80, 95], [155, 100], [245, 105], [330, 110], [420, 105], [500, 100]], "from": 1}, {"kind": "lawbook", "label": "negotiation", "track": [[575, 265], [575, 265], [575, 265], [575, 265], [505, 245], [440, 225]], "from": 4}], "word_count": 165}, {"id": "marshall-plan-incentives", "title": "Marshall aid served several aims", "question": "Was aid only generosity?", "body": "**Documented fact.** Europe faced severe postwar shortages. George Marshall proposed coordinated recovery. Congress passed legislation during 1948. More than twelve billion dollars followed. Participating governments planned jointly. Aid financed food. It financed fuel. It financed machinery. Counterpart funds supported local investment. Production recovered. Trade expanded. European cooperation deepened. The program excluded no country formally. Soviet leaders rejected participation. Eastern governments then withdrew. **Scholarly interpretation.** Relief served several aims. Recovery reduced suffering. It revived trading partners. It strengthened political stability. American officials also feared Communist expansion. Market institutions shaped the program. Integration supported a Western bloc. Those interests can coexist. Mutual benefit does not erase aid. **Counterevidence and limits.** Europe’s recovery had other causes. Domestic reforms mattered. Earlier rebounds had begun. German currency reform mattered. Global demand also helped. Marshall aid was smaller than total investment. Not every shipment came freely. Procurement rules favored available suppliers. Claims of total American control go too far. European governments negotiated priorities. The program accelerated recovery. Its exact contribution remains debated.", "summary": "Aid relieved shortages. It also built markets and alliances.", "sources": [["Marshall Plan Act — U.S. National Archives", "https://www.archives.gov/milestone-documents/marshall-plan"], ["Marshall Plan, 1948 — Office of the Historian", "https://history.state.gov/milestones/1945-1952/marshall-plan"], ["The Truman Doctrine and Marshall Plan", "https://history.state.gov/departmenthistory/short-history/truman"], ["Marshall Plan Records — National Archives", "https://www.archives.gov/publications/record/1998/09/marshall-plan.html"]], "beats": ["Shortages weaken postwar Europe.", "American aid crosses Atlantic.", "Food and machines restart production.", "Trade links deepen cooperation.", "Recovery anchors a Western bloc."], "setting": "Atlantic port, factory, and recovery office", "objects": [{"kind": "dollarstack", "label": "ERP funds", "track": [[70, 105], [160, 110], [250, 125], [315, 145], [315, 145], [315, 145]], "from": 0}, {"kind": "ship", "label": "aid cargo", "track": [[80, 245], [180, 235], [285, 225], [390, 215], [490, 205], [530, 205]], "from": 1}, {"kind": "goods", "label": "food and fuel", "track": [[150, 195], [245, 190], [335, 185], [430, 180], [505, 175], [505, 175]], "from": 1}, {"kind": "factoryline", "label": "European production", "track": [[520, 235], [520, 235], [520, 235], [520, 215], [520, 195], [520, 195]], "from": 2}, {"kind": "tradegate", "label": "trade cooperation", "track": [[395, 100], [395, 100], [395, 100], [425, 115], [470, 130], [500, 145]], "from": 3}, {"kind": "closuregate", "label": "Cold War divide", "track": [[585, 95], [585, 95], [585, 95], [585, 95], [540, 95], [480, 95]], "from": 4}], "word_count": 166}, {"id": "oil-shock-combination", "title": "The oil shock had two levers", "question": "Did the embargo quadruple prices?", "body": "**Documented fact.** Arab producers announced an embargo. The October 1973 war triggered it. Production cuts also followed. Targeted countries faced restrictions. Separately, OPEC producers raised posted prices. Persian Gulf members increased prices sharply. Prices later quadrupled overall. Importing economies suffered inflation. Recession followed in many places. Governments rationed fuel. They changed speed limits. They built strategic reserves. The IEA formed during 1974. **Scholarly interpretation.** The embargo became the public symbol. Price-setting power mattered separately. Tight supply strengthened bargaining. Dollar weakness also influenced producers. Existing demand growth reduced spare capacity. The shock combined geopolitics with market structure. **Counterevidence and limits.** The embargo was temporary. Its targets shifted. Global barrels were often rerouted. Some shortages reflected controls. Panic buying worsened queues. Inflation had begun earlier. Monetary policy also mattered. OPEC was not perfectly unified. Producers pursued different goals. The war explains timing. It does not explain every price. The evidence supports two levers: reduced supply and coordinated pricing. Their exact shares remain disputed.", "summary": "An embargo cut supply. Producer pricing multiplied the shock.", "sources": [["Oil Embargo, 1973–1974 — Office of the Historian", "https://history.state.gov/milestones/1969-1976/oil-embargo"], ["OPEC Price and Cutback Decisions — FRUS", "https://history.state.gov/historicaldocuments/frus1969-76v25/d200"], ["Economic Effects Memorandum — FRUS", "https://history.state.gov/historicaldocuments/frus1969-76v27/d49"], ["History of the IEA", "https://www.iea.org/about/mission/history-of-the-iea"]], "beats": ["War changes producer strategy.", "An embargo restricts tankers.", "OPEC raises posted prices.", "Import costs spread inflation.", "Reserves answer vulnerability."], "setting": "Oil terminal, tanker route, and importing economy", "objects": [{"kind": "oil", "label": "producer oil", "track": [[75, 210], [165, 205], [255, 200], [340, 195], [420, 190], [420, 190]], "from": 0}, {"kind": "ship", "label": "tanker", "track": [[115, 255], [215, 245], [315, 235], [400, 225], [480, 215], [520, 210]], "from": 1}, {"kind": "gate", "label": "embargo", "track": [[360, 215], [360, 215], [360, 205], [360, 190], [360, 175], [360, 175]], "from": 1}, {"kind": "dollarstack", "label": "posted price", "track": [[240, 110], [240, 110], [315, 105], [390, 95], [470, 85], [520, 80]], "from": 2}, {"kind": "factory", "label": "importing economy", "track": [[555, 230], [555, 230], [555, 230], [555, 215], [555, 200], [555, 200]], "from": 0}, {"kind": "reserve", "label": "strategic reserves", "track": [[575, 115], [575, 115], [575, 115], [575, 115], [505, 120], [445, 125]], "from": 4}], "word_count": 161}, {"id": "apartheid-sport-boycott", "title": "Sport made isolation visible", "question": "Could games pressure apartheid?", "body": "**Documented fact.** Apartheid segregated South African sport. Nonracial bodies challenged official teams. African states pressed international federations. South Africa missed Olympic competition. A planned 1968 return collapsed. Boycott threats mattered. During 1976, many African teams left Montreal. They protested New Zealand’s rugby contacts. The United Nations promoted sports isolation. It tracked contacts. A 1985 convention formalized pressure. South Africa returned during 1992. Apartheid laws were then being dismantled. **Scholarly interpretation.** Sport offered unusual leverage. White South Africans valued international competition. Exclusion made pariah status visible. Athletes became political messengers. Newly independent states gained collective influence. Boycotts also connected domestic activists with global institutions. **Counterevidence and limits.** Sport caused no transition alone. Internal resistance remained central. Economic sanctions also mattered. Regional conflict mattered. Diplomatic shifts mattered. Boycotts harmed some athletes. Enforcement stayed uneven. Professional contacts sometimes continued. The 1976 walkout targeted New Zealand, not South Africa directly. That distinction matters. Evidence supports symbolic and social pressure. It cannot isolate one decisive causal effect.", "summary": "Blocked competition turned segregation into public isolation.", "sources": [["International Boycott of Apartheid Sport — SAHO", "https://sahistory.org.za/article/international-boycott-apartheid-sport-mary-corrigall"], ["UN Declaration Against Apartheid in Sports", "https://digitallibrary.un.org/record/77020/files/183969-EN.pdf"], ["UN Sports-Boycott Resolution — Refworld", "https://www.refworld.org/legal/resolution/unga/1975/en/19116"], ["UN and Apartheid Timeline — SAHO", "https://sahistory.org.za/article/united-nations-and-apartheid-timeline-1946-1994"]], "beats": ["Segregation selects official teams.", "African states threaten withdrawal.", "A stadium gate closes.", "Isolation becomes globally visible.", "Readmission follows legal change."], "setting": "International stadium and federation chamber", "objects": [{"kind": "paradecrowd", "label": "segregated team", "track": [[75, 220], [175, 215], [280, 210], [340, 205], [340, 205], [340, 205]], "from": 0}, {"kind": "crowd", "label": "boycotting teams", "track": [[560, 240], [500, 235], [430, 230], [345, 225], [260, 220], [200, 215]], "from": 1}, {"kind": "closuregate", "label": "stadium exclusion", "track": [[365, 155], [365, 155], [365, 165], [365, 190], [365, 205], [365, 205]], "from": 2}, {"kind": "newspaper", "label": "global attention", "track": [[80, 95], [170, 95], [260, 95], [350, 95], [440, 95], [515, 95]], "from": 2}, {"kind": "lawbook", "label": "UN convention", "track": [[570, 145], [570, 145], [570, 145], [520, 145], [455, 150], [420, 155]], "from": 3}, {"kind": "tradegate", "label": "readmission", "track": [[575, 265], [575, 265], [575, 265], [575, 265], [515, 250], [445, 225]], "from": 4}], "word_count": 162}, {"id": "primitive-synchrony", "title": "Primitive Echo: moving together", "question": "Why do crowds move together?", "body": "**Documented evidence.** People synchronize during rituals. They clap together. They march together. They dance together. Experiments link synchrony with cooperation. Shared movement can increase affiliation. Large-group studies find similar effects. Dance studies also report bonding. Increased pain thresholds sometimes follow. Researchers use that as an indirect endorphin measure. **Scholarly interpretation.** Synchrony supplies coordination feedback. Each person predicts others. Successful matching signals commitment. Shared arousal strengthens salience. Groups may therefore cooperate faster. Such mechanisms could aid collective action. They may have supported ritual historically. Modern concerts reuse them. Military drill also does. Political rallies can too. **Counterevidence and limits.** Evolutionary function remains inferred. Laboratory tasks simplify culture. Pain thresholds are imperfect proxies. Effects differ across settings. Shared goals matter. Music matters. Prior identity matters. Synchrony can narrow sympathy. It may favor insiders. Reviews also flag conformity. Creativity can decline. Harmful obedience can increase. Moving together guarantees no virtue. The mechanism supports bonding. Culture directs that bond. Institutions shape its consequences.", "summary": "Shared rhythm can strengthen bonds. It can also narrow dissent.", "sources": [["Synchrony, Exertion, and Social Bonding", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4650190/"], ["Synchrony and Cooperation", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3737148/"], ["Large-Group Synchrony and Cooperation", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5760525/"], ["Cultural Trade-Offs of Synchrony", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7423264/"]], "beats": ["Individuals begin separately.", "A shared rhythm aligns movement.", "Alignment supplies social feedback.", "Cooperation becomes easier.", "Conformity can also rise."], "setting": "Ritual square with separate participants", "objects": [{"kind": "observer", "label": "participant A", "track": [[75, 220], [165, 205], [255, 190], [330, 180], [385, 180], [385, 180]], "from": 0}, {"kind": "observer", "label": "participant B", "track": [[570, 230], [500, 215], [430, 195], [365, 180], [385, 180], [385, 180]], "from": 0}, {"kind": "paradecrowd", "label": "shared rhythm", "track": [[320, 265], [320, 250], [320, 225], [320, 195], [320, 180], [320, 180]], "from": 1}, {"kind": "token", "label": "cooperation", "track": [[180, 115], [235, 120], [295, 130], [355, 145], [420, 155], [470, 160]], "from": 2}, {"kind": "namedhelper", "label": "costly help", "track": [[535, 205], [535, 205], [535, 205], [500, 195], [455, 185], [430, 180]], "from": 3}, {"kind": "ambiguousalarm", "label": "conformity risk", "track": [[580, 90], [580, 90], [580, 90], [580, 90], [500, 95], [420, 105]], "from": 4}], "word_count": 159}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function draw(o,p){let[a,b]=interp(o.track,p),k=o.kind;x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(['coin','drop','food','token'].includes(k)){x.beginPath();x.arc(0,0,k==='drop'?12:20,0,7);x.fill();x.stroke()}else if(['doctor','patient','runner','family','kin','stranger'].includes(k)){x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,k==='runner'?P.coral:P.blue)}else if(k==='dna'){x.strokeStyle=P.coral;for(let i=-35;i<35;i+=8){x.beginPath();x.moveTo(-18,i);x.lineTo(18,i+8);x.stroke()}}else{paper(-34,-27,68,54,['factory','pillfactory','pharmacy','foundation','who','network','trust'].includes(k)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,54);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2? '#ded8cf':'#dce5d8';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>{let o=c.objects[+b.dataset.i];document.querySelector('#fact').textContent=o.label+' participates here. Open sources for evidence.'});scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
