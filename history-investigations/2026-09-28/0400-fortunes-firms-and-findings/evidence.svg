<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Funding influence evidence ladder</title>
<desc id="desc">Six rows connect funding mechanisms, decisive evidence, and limits. Each first label links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c9604f"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#28343a}.white{fill:#f5ead0}.small{font-size:16px}.arrow{stroke:#c9604f;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f5ead0"/><text x="40" y="64" style="font-size:42px">Fortunes, Firms, and Findings</text><text x="40" y="100" style="font-size:20px;font-weight:400">Capital → mechanism → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28343a" stroke-width="2"/>
    <a href="https://wallenberg.com/en/history"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">Wallenberg</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Shares</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Peer review</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Influence ≠ capture</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#28343a" stroke-width="2"/>
    <a href="https://register-of-charities.charitycommission.gov.uk/charity-details/?regId=1159154&amp;subId=0"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">Leverhulme</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Endowment</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Annual grants</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Linkage ≠ command</text>
  </g>
  <g transform="translate(0,385)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28343a" stroke-width="2"/>
    <a href="https://jamanetwork.com/journals/jama/article-abstract/181773"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">Vioxx</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Trial control</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Litigation files</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Some papers differed</text>
  </g>
  <g transform="translate(0,485)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#28343a" stroke-width="2"/>
    <a href="https://www.bundestag.de/webarchiv/presse/hib/2018_03/548132-548132"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">EUGT</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Shared funding</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Rigged Beetle</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Responsibility disputed</text>
  </g>
  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28343a" stroke-width="2"/>
    <a href="https://www.sciencedirect.com/science/article/abs/pii/S0273230025002387"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">Glyphosate</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Hidden writing</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Retraction</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Toxicology unresolved</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#28343a" stroke-width="2"/>
    <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6238178/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2e7474"/><text x="155" y="7" text-anchor="middle" class="white">Coalitions</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a239" stroke="#28343a"/><text x="455" y="7" text-anchor="middle">Threat cues</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#587da0"/><text x="755" y="7" text-anchor="middle" class="white">Document checks</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c9604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Mechanism tentative</text>
  </g>
</svg>