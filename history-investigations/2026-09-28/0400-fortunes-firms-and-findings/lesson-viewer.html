itoring. Ghostwriting evidence covers identified papers. It proves no universal fabrication. Vioxx benefits were real. Its risk balance changed. Evidence governance failed materially.", "summary": "Company documents revealed drafting. Later trials changed safety judgments.", "sources": [["JAMA: Rofecoxib Ghostwriting", "https://jamanetwork.com/journals/jama/article-abstract/181773"], ["JAMA: Mortality Reporting", "https://jamanetwork.com/journals/jama/issue/299/15"], ["Merck Withdrawal Filing", "https://www.sec.gov/Archives/edgar/data/64978/000129993304000969/exhibit1.htm"], ["EMA Withdrawal Statement", "https://www.ema.europa.eu/en/news/european-medicines-agency-statement-following-withdrawal-vioxx-rofecoxib"]], "beats": ["Merck funds drug trials.", "Writers draft favorable papers.", "Academic names add authority.", "Longer trials reveal risk.", "Withdrawal changes the market."], "setting": "Drug company and clinic", "objects": [{"kind": "pillfactory", "label": "Merck", "fact": "Merck developed Vioxx.", "track": [[72, 220], [72, 220], [72, 220], [72, 220], [72, 220], [72, 220]], "from": 0}, {"kind": "script", "label": "draft article", "fact": "Company writers drafted manuscripts.", "track": [[125, 140], [215, 145], [295, 155], [295, 155], [295, 155], [295, 155]], "from": 1}, {"kind": "scientist", "label": "academic author", "fact": "Academic names added authority.", "track": [[335, 230], [335, 230], [400, 220], [450, 205], [450, 205], [450, 205]], "from": 2}, {"kind": "file", "label": "trial records", "fact": "Litigation opened company records.", "track": [[575, 105], [575, 105], [535, 120], [495, 145], [455, 165], [455, 165]], "from": 3}, {"kind": "warning", "label": "cardiac risk", "fact": "APPROVe showed thrombotic risk.", "track": [[575, 235], [575, 235], [540, 225], [505, 215], [470, 205], [470, 205]], "from": 3}, {"kind": "gate", "label": "withdrawal", "fact": "Merck withdrew Vioxx.", "track": [[300, 92], [300, 92], [300, 92], [300, 92], [375, 105], [435, 125]], "from": 4}], "word_count": 147}, {"id": "eugt-diesel-tests", "title": "Carmakers financed diesel experiments", "question": "What did sponsorship distort?", "body": "**Documented fact.** German carmakers funded EUGT. Bosch initially participated. EUGT commissioned emissions research. One study used monkeys. A Volkswagen Beetle supplied exhaust. The car contained cheating software. Monkeys watched cartoons inside chambers. Results were never published. Human nitrogen-dioxide studies also emerged. Germany condemned both programs. Volkswagen investigated internal conduct. Its audit found no labor breaches. **Benefits claimed.** Research could compare emissions. New diesel filters reduced particles. Exposure science can guide limits. **Scholarly interpretation.** Sponsorship framed diesel safety. The association resembled lobbying. Controlled tests masked road emissions. A rigged vehicle destroyed validity. **Harms.** Animals faced needless exposure. Public credibility collapsed. Corporate distance blurred responsibility. Unpublished results blocked scrutiny. **Counterevidence and limits.** Volkswagen called EUGT independent. Its audit cleared employees narrowly. That finding concerned labor rules. It did not validate science. BMW denied commissioning monkey tests. Records show shared funding. Responsibility levels remain disputed. Funding proves influence. It does not prove every result.", "summary": "Shared funding commissioned tests. A rigged vehicle undermined validity.", "sources": [["Bundestag: EUGT Experiments", "https://www.bundestag.de/webarchiv/presse/hib/2018_03/548132-548132"], ["Volkswagen Special Investigation", "https://www.volkswagen-group.com/en/press-releases/special-investigation-into-eugt-studies-concluded-16224"], ["Diesel Risk Interpretation History", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7588357/"], ["Real-World Diesel Emissions", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5630643/"]], "beats": ["Carmakers fund EUGT.", "A Beetle enters chamb search traced influence. The paper shaped discourse widely. **Benefits claimed.** Reviews can integrate evidence. Glyphosate supports weed control. Regulators assess many studies. **Scholarly interpretation.** Hidden authorship manufactured independence. Citation networks prolonged authority. Regulatory references amplified reach. **Harms.** Readers misjudged provenance. Omitted evidence narrowed assessment. Correction took twenty-five years. **Counterevidence and limits.** EPA says nothing changed. Its review used thousands. Cancer classifications still differ. Hazard differs from risk. Bayer disputes safety allegations. Retraction addresses this article. It does not prove carcinogenicity. Ghostwriting weakens trust. It cannot settle toxicology. Updated review remains necessary.", "summary": "Undisclosed writing triggered retraction. Toxicology remains separately contested.", "sources": [["Journal Retraction Notice", "https://www.sciencedirect.com/science/article/abs/pii/S0273230025002387"], ["Ghostwritten Paper Afterlife", "https://www.sciencedirect.com/science/article/pii/S1462901125001765"], ["EPA Glyphosate Assessment", "https://www.epa.gov/ingredients-used-pesticide-products/glyphosate"], ["Congressional Monsanto Records", "https://www.govinfo.gov/content/pkg/CHRG-115hhrg28933/pdf/CHRG-115hhrg28933.pdf"]], "beats": ["Monsanto supplies review material.", "Hidden writers shape prose.", "Academics carry authorship.", "Emails expose the process.", "Retraction removes authority."], "setting": "Agricultural lab and journal", "objects": [{"kind": "company", "label": "Monsanto", "fact": "Monsanto sold glyphosate products.", "track": [[72, 220], [72, 220], [72, 220], [72, 220], [72, 220], [72, 220]], "from": 0}, {"kind": "file", "label": "company studies", "fact": "The review used company studies.", "track": [[125, 140], [215, 145], [295, 155], [295, 155], [295, 155], [295, 155]], "from": 0}, {"kind": "review", "label": "2000 review", "fact": "The review defended safety.", "track": [[335, 230], [335, 230], [400, 220], [450, 205], [450, 205], [450, 205]], "from": 1}, {"kind": "scientist", "label": "named authors", "fact": "Academic authors carried authority.", "track": [[575, 235], [575, 235], [540, 225], [505, 215], [470, 205], [470, 205]], "from": 2}, {"kind": "email", "label": "internal emails", "fact": "Emails disclosed writing involvement.", "track": [[575, 105], [575, 105], [535, 120], [495, 145], [455, 165], [455, 165]], "from": 3}, {"kind": "warning", "label": "retraction", "fact": "Editors lost confidence during 2025.", "track": [[300, 92], [300, 92], [300, 92], [300, 92], [375, 105], [435, 125]], "from": 4}], "word_count": 141}, {"id": "primitive-coalition-vigilance", "title": "Primitive Echo: coalition vigilance", "question": "Why suspect coordinated groups?", "body": "**Documented evidence.** Humans track alliances. Group cues guide trust. Threat increases pattern seeking. Conspiracy beliefs center coalitions. Those coalitions appear coordinated. Reviews connect several mechanisms. Agency detection contributes. Threat management contributes. Alliance detection contributes. Experimental work tests signaling. Conspiracy statements can mark membership. **Evolutionary interpretation.** Ancestral coalitions created dangers. Missing coordination carried costs. False alarms carried costs. Vigilance balanced both errors. Modern institutions magnify cues. Shared donors resemble coalitions. Hidden emails confirm coordination sometimes. Networks alone prove nothing. **Benefits.** Suspicion can trigger audits. Proven collusion gets exposed. Funding trails guide questions. **Harms.** Pattern detection can overreach. Family names invite myths. Correlation becomes intention. Antisemitic stories exploit this. **Counterevidence and limits.** Adaptation claims remain tentative. Reviews support competing models. Culture shapes conspiracy beliefs. Experiments cannot recreate prehistory. Coalition detection explains susceptibility. It validates no specific claim. Evidence must test mechanisms. Proven links need documents. Suspicion should begin inquiry. It should never finish one.", "summary": "Coalition vigilance prompts inquiry. Networks alone prove nothing.", "sources": [["Evolved Functions and Mechanisms", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6238178/"], ["Intergroup Conspiracy Review", "https://www.nature.com/articles/s44159-022-00133-0"], ["Coalition Signaling Experiment", "https://pure.au.dk/portal/en/publications/do-conspiracy-theories-efficiently-signal-coalition-membership-an-experimental-test-using-the-who-said-what-design%28756402c7-4aa5-4f92-aa22-491f2dc226a0%29.html"]], "beats": ["People observe shared ties.", "Minds infer a coalition.", "Threat raises vigilance.", "Documents test coordination.", "Evidence limits belief."], "setting": "Village circle and archive", "objects": [{"kind": "portrait", "label": "observer", "fact": "Humans track alliances.", "track": [[82, 220], [82, 220], [82, 220], [82, 220], [82, 220], [82, 220]], "from": 0}, {"kind": "group", "label": "coalition", "fact": "Shared cues suggest coordination.", "track": [[575, 225], [535, 220], [500, 215], [465, 205], [465, 205], [465, 205]], "from": 0}, {"kind": "signal", "label": "shared cues", "fact": "Threat increases pattern seeking.", "track": [[575, 105], [575, 105], [535, 120], [495, 140], [455, 160], [455, 160]], "from": 1}, {"kind": "warning", "label": "suspicion", "fact": "Suspicion can trigger audits.", "track": [[305, 95], [305, 95], [305, 95], [365, 105], [420, 125], [440, 145]], "from": 2}, {"kind": "file", "label": "documents", "fact": "Documents test coordination.", "track": [[300, 245], [300, 245], [300, 245], [370, 230], [425, 215], [455, 205]], "from": 3}, {"kind": "balance", "label": "evidence", "fact": "Networks alone prove nothing.", "track": [[590, 245], [590, 245], [590, 245], [590, 245], [545, 225], [500, 205]], "from": 4}], "word_count": 152}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function person(){x.fillStyle=P.gold;x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,P.blue)}function draw(o,p){let[a,b]=interp(o.track,p);x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(o.kind==='car'){paper(-45,-18,90,28,P.coral);x.beginPath();x.arc(-28,13,12,0,7);x.arc(28,13,12,0,7);x.fill();x.stroke()}else if(o.kind==='monkey'){person();x.beginPath();x.arc(19,32,15,.2,5);x.stroke()}else if(o.kind==='chamber'){x.strokeRect(-42,-45,84,88);x.setLineDash([5,4]);x.strokeRect(-34,-37,68,72);x.setLineDash([])}else if(o.kind==='fumes'||o.kind==='signal'){for(let i=0;i<3;i++){x.beginPath();x.arc(i*14-14,i*5-5,18+i*4,2.8,5.8);x.stroke()}}else if(o.kind==='group'){x.save();x.translate(-24,0);person();x.restore();x.save();x.translate(24,0);person();x.restore()}else if(['coin','seed','gift','return'].includes(o.kind)){x.beginPath();x.arc(0,0,20,0,7);x.fill();x.stroke()}else if(['portrait','scientist','worker','child','giver','receiver'].includes(o.kind)){person()}else{paper(-34,-27,68,54,['foundation','company','factory','bank','agency','trust'].includes(o.kind)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,56);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2?'#e4dccf':'#dce6dd';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#body').textContent=reduced?c.body.replaceAll('**',''):'';document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>document.querySelector('#fact').textContent=c.objects[+b.dataset.i].fact);scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced;render()};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
