<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson viewer</title><style>body{margin:0;background:#272735;color:#f3e6c8;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}canvas{width:100%;background:#f3e6c8;border:3px solid #f3e6c8}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:9px 13px;border:0;background:#e0a83e;color:#272735}input{flex:1}.objects{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.objects button{background:#2a7775;color:white}.panel{border-left:5px solid #cf5c4f;padding:8px 14px;background:#353545}.sources a{color:#f2cb68}.reduced canvas{display:none}@media(prefers-reduced-motion:reduce){canvas{display:none}}</style></head><body><main class="wrap"><h1>Maps, Trust, and Pledges</h1><canvas id="c" width="960" height="540" aria-label="Animated cut-paper causal scene"></canvas><div class="controls"><button id="play">Pause</button><button id="back">Step back</button><button id="next">Step forward</button><button id="replay">Replay</button><input id="scrub" type="range" min="0" max="180" step="0.04" value="0"><button id="motion">Reduced motion</button></div><div class="objects" id="objects"></div><article class="panel"><h2 id="title"></h2><p id="beat"></p><p id="fact"></p><div class="sources" id="sources"></div></article></main><script>const DATA={"title": "Maps, Trust, and Pledges", "subtitle": "History Investigation — 28 September 2026, 18:56 Réunion", "palette": {"ink": "#272735", "paper": "#f3e6c8", "teal": "#2a7775", "coral": "#cf5c4f", "gold": "#e0a83e", "blue": "#4b78a3", "green": "#6e8b67"}, "chapter_seconds": 30, "fps": 25, "cards": [{"id": "snow-evidence-bundle", "title": "Snow’s map was not solitary proof", "question": "Did one map stop cholera?", "body": "**Documented fact.** Cholera struck Soho during 1854. John Snow suspected contaminated water. He interviewed affected households. He compared water suppliers. He examined unusual exceptions. A workhouse had few deaths. It used separate water. A brewery also fared better. Snow linked cases to Broad Street. A map displayed their clustering. Local guardians removed the pump handle. Henry Whitehead investigated locally. Later inquiry found well contamination. **Scholarly interpretation.** Snow built converging evidence. Geography mattered. Interviews mattered equally. Natural comparisons strengthened inference. Whitehead’s local knowledge also mattered. The famous map became memorable. It simplified a collaborative process. **Counterevidence and limits.** The outbreak was already declining. Many residents had fled. Handle removal therefore proves little alone. Snow did not discover bacteria. Filippo Pacini described the organism independently. Snow’s map may not have generated his hypothesis. Officials remained unconvinced. Miasma reforms still improved sanitation. The evidence supports waterborne transmission. It does not support a lone-map miracle.", "summary": "The map showed clustering. Interviews and comparisons carried inference.", "sources": [["John Snow’s Cholera Map — Duke Libraries", "https://library.duke.edu/exhibits/hubbard-may_2025"], ["John Snow and the Broad Street Pump", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7150208/"], ["Our Sense of Snow — PubMed", "https://pubmed.ncbi.nlm.nih.gov/10714917/"], ["Snow and Whitehead — PubMed", "https://pubmed.ncbi.nlm.nih.gov/16891036/"]], "beats": ["Deaths cluster near water.", "Households reveal pump use.", "Exceptions strengthen comparison.", "Guardians close the pump.", "Later evidence confirms contamination."], "setting": "Soho streets around Broad Street pump", "objects": [{"kind": "newspaper", "label": "case map", "track": [[70, 105], [155, 110], [250, 120], [330, 135], [330, 135], [330, 135]], "from": 0}, {"kind": "fallenperson", "label": "cholera cases", "track": [[90, 230], [175, 220], [265, 205], [335, 190], [335, 190], [335, 190]], "from": 0}, {"kind": "water", "label": "pump water", "track": [[535, 220], [470, 215], [405, 205], [350, 195], [350, 195], [350, 195]], "from": 1}, {"kind": "house", "label": "workhouse exception", "track": [[565, 125], [565, 125], [500, 135], [445, 145], [445, 145], [445, 145]], "from": 2}, {"kind": "watervalve", "label": "removed handle", "track": [[585, 260], [585, 260], [585, 260], [500, 240], [410, 215], [410, 215]], "from": 3}, {"kind": "magnifier", "label": "later inquiry", "track": [[575, 80], [575, 80], [575, 80], [575, 80], [500, 90], [420, 105]], "from": 4}], "word_count": 151}, {"id": "radium-girls", "title": "Radium evidence entered through workers", "question": "How did exposure become proof?", "body": "**Documented fact.** Dial painters used luminous radium paint. Many shaped brushes orally. Radium then entered their bodies. Young women developed jaw injuries. Bone disease followed. Cancers appeared later. Company-linked experts disputed causation. Independent examinations found injury. Workers sued during the 1920s. New Jersey claimants gained settlements. Illinois litigation continued later. Scientific follow-up tracked exposures. Their cases helped quantify internal radiation risks. Publicity changed workplace practice. Brush pointing by mouth declined. **Scholarly interpretation.** The workers became evidence producers. Their bodies challenged controlled research. Litigation opened records. Compensation also recognized occupational disease. The episode connected labor law with radiation science. **Counterevidence and limits.** Early radiation knowledge was incomplete. Latency complicated proof. Exposure levels varied. Different firms behaved differently. Settlement established no universal precedent. Later standards had many causes. Researchers also learned from medical exposures. The women were not merely passive victims. Yet later studies sometimes treated them instrumentally. The record supports preventable workplace harm. It cannot assign identical knowledge to every manager.", "summary": "Workers’ injuries forced exposure evidence into law and science.", "sources": [["National Bureau of Standards and Dial Painters", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10046820/"], ["Radium Dial Workers: Back to the Future", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10563809/"], ["Short History of Occupational Disease", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7907902/"], ["Bone Cancer Among Dial Workers", "https://pubmed.ncbi.nlm.nih.gov/628024/"]], "beats": ["Luminous paint reaches brushes.", "Brushes reach workers’ mouths.", "Radium settles in bone.", "Lawsuits force independent evidence.", "Standards follow accumulated harm."], "setting": "Watch-dial factory and examination room", "objects": [{"kind": "factoryline", "label": "dial factory", "track": [[70, 225], [70, 225], [70, 225], [70, 225], [70, 225], [70, 225]], "from": 0}, {"kind": "drop", "label": "radium paint", "track": [[135, 115], [215, 130], [285, 155], [335, 180], [335, 180], [335, 180]], "from": 0}, {"kind": "workers", "label": "dial painters", "track": [[330, 225], [330, 225], [330, 215], [330, 205], [330, 205], [330, 205]], "from": 0}, {"kind": "gauge", "label": "internal dose", "track": [[565, 120], [565, 120], [500, 130], [430, 145], [390, 160], [390, 160]], "from": 2}, {"kind": "gavel", "label": "worker lawsuits", "track": [[575, 230], [575, 230], [575, 230], [505, 215], [430, 200], [430, 200]], "from": 3}, {"kind": "lawbook", "label": "safety standards", "track": [[575, 80], [575, 80], [575, 80], [575, 80], [500, 90], [430, 110]], "from": 4}], "word_count": 160}, {"id": "tuskegee-deception", "title": "Tuskegee studied withheld care", "question": "What made the study unethical?", "body": "**Documented fact.** Federal researchers began during 1932. Tuskegee Institute cooperated. The study enrolled 600 Black men. Three hundred ninety-nine had syphilis. Two hundred one did not. Researchers sought natural-history data. Participants lacked informed consent. Staff described special treatment. They instead observed disease. Penicillin became standard later. Researchers still withheld effective treatment. They also discouraged outside treatment. A press report exposed the study during 1972. The project then ended. A federal settlement followed. New review protections developed afterward. **Scholarly interpretation.** Deception sustained participation. Racism shaped vulnerability. Clinical authority made refusal harder. Scientific goals displaced patient duties. The study damaged public trust. **Counterevidence and limits.** Researchers did not infect participants. Not every enrollee had syphilis. Those corrections matter. They do not excuse deception. Early therapies were hazardous. That explains initial uncertainty. It cannot justify post-penicillin continuation. Ethical reforms had other roots. Tuskegee nevertheless accelerated them. Later distrust has multiple causes. The study’s precise effect varies across populations.", "summary": "Researchers observed disease after effective treatment existed.", "sources": [["About the Tuskegee Study — CDC", "https://www.cdc.gov/tuskegee/about/index.html"], ["Tuskegee Study Timeline — CDC", "https://www.cdc.gov/tuskegee/about/timeline.html"], ["Fiftieth Anniversary Review", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9872801/"], ["Tuskegee Study Collection — National Archives", "https://catalog.archives.gov/id/281642"]], "beats": ["Researchers enroll 600 men.", "Deception preserves participation.", "Penicillin becomes standard care.", "Treatment remains withheld.", "Exposure triggers ethical reform."], "setting": "Rural clinic, treatment cabinet, and review board", "objects": [{"kind": "clinic", "label": "study clinic", "track": [[70, 225], [70, 225], [70, 225], [70, 225], [70, 225], [70, 225]], "from": 0}, {"kind": "patient", "label": "participants", "track": [[150, 225], [225, 215], [300, 205], [345, 200], [345, 200], [345, 200]], "from": 0}, {"kind": "script", "label": "promised care", "track": [[255, 110], [300, 120], [350, 135], [390, 150], [390, 150], [390, 150]], "from": 1}, {"kind": "vials", "label": "penicillin", "track": [[560, 115], [560, 115], [500, 125], [440, 140], [390, 155], [390, 155]], "from": 2}, {"kind": "closuregate", "label": "withholding", "track": [[425, 110], [425, 110], [425, 125], [425, 145], [425, 165], [425, 165]], "from": 2}, {"kind": "newspaper", "label": "1972 exposure", "track": [[575, 245], [575, 245], [575, 245], [500, 225], [430, 205], [430, 205]], "from": 4}, {"kind": "lawbook", "label": "review protections", "track": [[575, 80], [575, 80], [575, 80], [575, 80], [505, 90], [440, 110]], "from": 4}], "word_count": 155}, {"id": "bay-of-pigs-assumptions", "title": "Deniability weakened the invasion", "question": "Which assumptions failed?", "body": "**Documented fact.** The CIA trained Cuban exiles. Brigade 2506 landed during April 1961. Planners expected local support. They expected Castro’s forces to fracture. Air strikes targeted Cuban aircraft. Kennedy limited visible American involvement. Planned air coverage was reduced. Surviving Cuban aircraft attacked ships. Supplies sank offshore. Castro’s forces contained the beachhead. The brigade surrendered quickly. **Scholarly interpretation.** Covert design created contradictions. Success required military force. Deniability restricted that force. Compartmentalization narrowed criticism. Planners discounted contrary evidence. Kennedy inherited the project. He also approved it. Responsibility therefore crossed institutions. **Counterevidence and limits.** No single canceled strike explains defeat. Landing geography mattered. Intelligence errors mattered. Brigade tactics mattered. Castro had prepared defenses. American intervention could have escalated dangerously. Restraint therefore had reasons. Claims of deliberate sabotage lack evidence. CIA reviews criticized planning. Other reviews emphasized presidential decisions. The strongest finding is systemic mismatch. Political constraints and military needs diverged.", "summary": "A covert plan needed overt force. Deniability restricted it.", "sources": [["Bay of Pigs — Office of the Historian", "https://history.state.gov/milestones/1961-1968/bay-of-pigs"], ["Bay of Pigs — CIA History", "https://www.cia.gov/stories/story/the-bay-of-pigs-invasion/"], ["Bay of Pigs Documents — National Security Archive", "https://nsarchive.gwu.edu/events/bay-pigs-1961"], ["CIA Inspector General Analysis", "https://nsarchive.gwu.edu/briefing-book/cuba-cuban-missile-crisis/2026-04-16/cuba-bay-pigs-invasion-65-years-later"]], "beats": ["Exiles approach Cuba secretly.", "Air strikes leave aircraft.", "Ships lose vital supplies.", "Expected uprising never arrives.", "The beachhead collapses."], "setting": "Caribbean beachhead with ships and aircraft", "objects": [{"kind": "ship", "label": "brigade ships", "track": [[80, 235], [175, 225], [270, 215], [350, 210], [350, 210], [350, 210]], "from": 0}, {"kind": "paradecrowd", "label": "Brigade 2506", "track": [[135, 250], [220, 235], [305, 220], [375, 210], [375, 210], [375, 210]], "from": 0}, {"kind": "plane", "label": "Cuban aircraft", "track": [[570, 90], [500, 105], [430, 125], [360, 150], [310, 170], [310, 170]], "from": 1}, {"kind": "closuregate", "label": "limited air cover", "track": [[420, 95], [420, 95], [420, 115], [420, 145], [420, 170], [420, 170]], "from": 1}, {"kind": "goods", "label": "sunk supplies", "track": [[540, 235], [500, 230], [450, 225], [390, 220], [330, 225], [330, 225]], "from": 2}, {"kind": "crowd", "label": "expected uprising", "track": [[575, 260], [575, 260], [575, 260], [520, 255], [470, 250], [470, 250]], "from": 3}, {"kind": "failureflag", "label": "collapsed beachhead", "track": [[575, 130], [575, 130], [575, 130], [575, 130], [480, 145], [390, 170]], "from": 4}], "word_count": 147}, {"id": "helsinki-pledges", "title": "Helsinki promises became activist tools", "question": "How did a nonbinding act matter?", "body": "**Documented fact.** Thirty-five states signed during 1975. The Helsinki Final Act addressed security. It affirmed existing frontiers. It promoted economic exchange. It also named human rights. Movement and information appeared. Soviet leaders valued border recognition. Western critics feared concession. The document was politically binding. It was not a treaty. Activists then formed monitoring groups. They recorded violations. They cited signed commitments. Governments raised those reports diplomatically. Authorities also repressed monitors. **Scholarly interpretation.** The agreement created vocabulary. Dissidents converted diplomacy into accountability. Public commitments raised reputational costs. Transnational networks carried evidence outward. An elite bargain gained pressure from below. That consequence exceeded many expectations. **Counterevidence and limits.** The Act stopped no repression immediately. Enforcement remained weak. Signatories violated provisions. Détente had many objectives. Monitoring groups were not protected. Several members were imprisoned. The Soviet bloc ended for many reasons. Economic weakness mattered. National movements mattered. Leadership choices mattered. Helsinki was no secret blueprint. Its contribution lay in usable commitments. Their causal weight remains debated.", "summary": "A diplomatic promise became evidence for dissident monitoring.", "sources": [["Helsinki Final Act — OSCE", "https://www.osce.org/helsinki-final-act"], ["Helsinki Final Act, 1975 — State Department", "https://history.state.gov/milestones/1969-1976/helsinki"], ["Helsinki Monitoring Groups — FRUS", "https://history.state.gov/historicaldocuments/frus1977-80v02/d80"], ["Helsinki Network — Wilson Center", "https://www.wilsoncenter.org/event/human-rights-activism-and-end-the-cold-war-transnational-history-the-helsinki-network"]], "beats": ["States trade security commitments.", "Human-rights language enters text.", "Activists copy the promises.", "Monitors document violations.", "Reports raise reputational costs."], "setting": "Helsinki conference table and monitoring network", "objects": [{"kind": "crowd", "label": "35 signatories", "track": [[75, 225], [160, 220], [250, 215], [320, 210], [320, 210], [320, 210]], "from": 0}, {"kind": "treaty", "label": "Final Act", "track": [[320, 110], [320, 120], [320, 145], [320, 170], [320, 180], [320, 180]], "from": 0}, {"kind": "gate", "label": "recognized frontiers", "track": [[535, 230], [535, 230], [485, 220], [430, 210], [430, 210], [430, 210]], "from": 0}, {"kind": "lawbook", "label": "human rights", "track": [[560, 105], [500, 115], [440, 130], [380, 150], [350, 170], [350, 170]], "from": 1}, {"kind": "observer", "label": "monitoring groups", "track": [[80, 110], [165, 120], [250, 135], [335, 150], [400, 165], [400, 165]], "from": 2}, {"kind": "file", "label": "violation reports", "track": [[575, 160], [575, 160], [575, 160], [505, 165], [430, 175], [380, 185]], "from": 3}, {"kind": "newspaper", "label": "international pressure", "track": [[575, 80], [575, 80], [575, 80], [575, 80], [500, 90], [420, 105]], "from": 4}], "word_count": 163}, {"id": "primitive-firelight", "title": "Primitive Echo: stories after dark", "question": "Why does nighttime invite stories?", "body": "**Documented evidence.** Anthropologist Polly Wiessner studied Ju/’hoansi talk. Her dataset compared 174 conversations. Sixty-eight translated texts supplemented them. Daytime talk focused on work. Resources also dominated. Night talk changed. Stories became common. Mythic characters appeared. Distant networks appeared. Songs and dances also grew. Fire extended social time. **Scholarly interpretation.** Daylight favors subsistence. Darkness restricts practical work. Fire creates a safe focus. Stories can transmit norms. They can preserve relationships. They can imagine distant people. Shared emotion may build trust. Modern bedtime stories echo this setting. Podcasts may reproduce attention conditions. **Counterevidence and limits.** One population proves no universal past. The study was observational. Conversation categories require judgment. Electric light changes behavior. Modern media differ profoundly. Fire itself may not cause storytelling. Work schedules may explain timing. Cultural traditions also matter. Archaeology cannot recover ancient conversations. Evolutionary claims therefore remain hypotheses. The evidence supports time-structured talk. It does not prove every story began around fires.", "summary": "Day talk solved work. Firelight talk expanded social worlds.", "sources": [["Embers of Society — PNAS", "https://www.pnas.org/doi/10.1073/pnas.1404212111"], ["Firelight Talk — PubMed", "https://pubmed.ncbi.nlm.nih.gov/25246574/"], ["Embers of Society — PNAS PDF", "https://www.pnas.org/doi/pdf/10.1073/pnas.1404212111"], ["PNAS Study Abstract — Harvard ADS", "https://ui.adsabs.harvard.edu/abs/2014PNAS..11114027W/abstract"]], "beats": ["Day talk manages resources.", "Darkness pauses practical work.", "Fire gathers listeners.", "Stories expand distant worlds.", "Shared memory strengthens ties."], "setting": "Ju/’hoansi camp from daylight into firelight", "objects": [{"kind": "food", "label": "day resources", "track": [[85, 225], [170, 215], [250, 205], [300, 195], [300, 195], [300, 195]], "from": 0}, {"kind": "crowd", "label": "listeners", "track": [[560, 235], [500, 225], [430, 215], [365, 205], [330, 200], [330, 200]], "from": 1}, {"kind": "flames", "label": "firelight", "track": [[320, 265], [320, 250], [320, 230], [320, 210], [320, 195], [320, 195]], "from": 2}, {"kind": "namedhelper", "label": "storyteller", "track": [[90, 120], [160, 130], [235, 145], [300, 165], [330, 180], [330, 180]], "from": 2}, {"kind": "token", "label": "distant stories", "track": [[560, 105], [500, 115], [440, 130], [380, 150], [335, 175], [335, 175]], "from": 3}, {"kind": "network", "label": "shared memory", "track": [[575, 170], [575, 170], [575, 170], [520, 175], [455, 180], [390, 190]], "from": 4}], "word_count": 155}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function draw(o,p){let[a,b]=interp(o.track,p),k=o.kind;x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(['coin','drop','food','token'].includes(k)){x.beginPath();x.arc(0,0,k==='drop'?12:20,0,7);x.fill();x.stroke()}else if(['doctor','patient','runner','family','kin','stranger'].includes(k)){x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,k==='runner'?P.coral:P.blue)}else if(k==='dna'){x.strokeStyle=P.coral;for(let i=-35;i<35;i+=8){x.beginPath();x.moveTo(-18,i);x.lineTo(18,i+8);x.stroke()}}else{paper(-34,-27,68,54,['factory','pillfactory','pharmacy','foundation','who','network','trust'].includes(k)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,54);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2? '#ded8cf':'#dce5d8';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>{let o=c.objects[+b.dataset.i];document.querySelector('#fact').textContent=o.label+' participates here. Open sources for evidence.'});scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
