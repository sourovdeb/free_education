<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson viewer</title><style>body{margin:0;background:#272735;color:#f3e6c8;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}canvas{width:100%;background:#f3e6c8;border:3px solid #f3e6c8}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:9px 13px;border:0;background:#e0a83e;color:#272735}input{flex:1}.objects{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.objects button{background:#2a7775;color:white}.panel{border-left:5px solid #cf5c4f;padding:8px 14px;background:#353545}.sources a{color:#f2cb68}.reduced canvas{display:none}@media(prefers-reduced-motion:reduce){canvas{display:none}}</style></head><body><main class="wrap"><h1>Industrial Systems and Cascades</h1><canvas id="c" width="960" height="540" aria-label="Animated cut-paper causal scene"></canvas><div class="controls"><button id="play">Pause</button><button id="back">Step back</button><button id="next">Step forward</button><button id="replay">Replay</button><input id="scrub" type="range" min="0" max="180" step="0.04" value="0"><button id="motion">Reduced motion</button></div><div class="objects" id="objects"></div><article class="panel"><h2 id="title"></h2><p id="beat"></p><p id="fact"></p><div class="sources" id="sources"></div></article></main><script>const DATA={"title": "Industrial Systems and Cascades", "subtitle": "History Investigation — 28 September 2026, 12:00 Réunion", "palette": {"ink": "#272735", "paper": "#f3e6c8", "teal": "#2a7775", "coral": "#cf5c4f", "gold": "#e0a83e", "blue": "#4b78a3", "green": "#6e8b67"}, "chapter_seconds": 30, "fps": 25, "cards": [{"id": "nixon-gold-window", "title": "The gold window jammed", "question": "Why did Nixon suspend convertibility?", "body": "**Documented fact.** Dollar claims exceeded American gold. Inflation was rising. Foreign holders sought conversion. On 15 August 1971, Nixon suspended dollar convertibility. He also froze wages. Prices were frozen too. A ten-percent import surcharge followed. Foreign-policy officials had limited warning. December's Smithsonian Agreement reset parities. It did not restore durability. Major currencies floated by March 1973. **Scholarly interpretation.** Domestic politics met reserve pressure. Suspension protected American policy autonomy. The surcharge pushed allies toward negotiation. Bretton Woods ended through steps. One televised speech was pivotal. It was not instantaneous. **Counterevidence and limits.** Convertibility had earlier strains. European governments also resisted adjustment. Speculation was not the sole cause. American fiscal and monetary choices mattered. The Vietnam War mattered indirectly. Great Society spending also mattered. Economists dispute relative weights. Wage controls briefly reduced measured inflation. They later distorted prices. Floating rates did not cure inflation. The archives document decisions. They cannot isolate one motive. Nor did August alone create modern finance.", "summary": "Gold pressure met domestic politics. Temporary controls became systemic change.", "sources": [["Nixon Ends Dollar Convertibility", "https://www.federalreservehistory.org/essays/gold-convertibility-ends"], ["Bretton Woods Launched", "https://www.federalreservehistory.org/essays/bretton-woods-launched"], ["Smithsonian Agreement", "https://www.federalreservehistory.org/essays/smithsonian-agreement"], ["Camp David Decisions", "https://history.state.gov/historicaldocuments/frus1969-76v03/d168"]], "beats": ["Dollar claims reach gold.", "Conversion drains reserves.", "The window closes.", "The surcharge pressures allies.", "Currencies begin floating."], "setting": "Treasury gold window and exchange desk", "objects": [{"kind": "dollarstack", "label": "dollar claims", "track": [[75, 220], [135, 210], [205, 195], [250, 180], [250, 180], [250, 180]], "from": 0}, {"kind": "goldbar", "label": "gold reserves", "track": [[300, 220], [300, 220], [280, 220], [250, 220], [220, 230], [200, 235]], "from": 0}, {"kind": "goldwindow", "label": "gold window", "track": [[365, 185], [365, 185], [365, 185], [365, 185], [365, 185], [365, 185]], "from": 1}, {"kind": "shutter", "label": "suspension", "track": [[365, 105], [365, 115], [365, 135], [365, 165], [365, 185], [365, 185]], "from": 2}, {"kind": "surcharge", "label": "import surcharge", "track": [[560, 100], [560, 100], [525, 125], [480, 155], [440, 180], [440, 180]], "from": 3}, {"kind": "currency", "label": "floating currencies", "track": [[520, 245], [520, 245], [520, 245], [520, 235], [500, 210], [470, 190]], "from": 4}], "word_count": 159}, {"id": "panama-canal-systems", "title": "Mosquitoes shaped the canal", "question": "What made excavation possible?", "body": "**Documented fact.** French construction had failed earlier. Disease killed many workers. American builders resumed in 1904. Medical teams targeted mosquitoes. They drained standing water. They oiled breeding sites. Buildings received screens. Fumigation also expanded. Yellow fever disappeared locally. Malaria mortality fell sharply. Excavation then accelerated. Railways removed spoil. Locks lifted ships. Caribbean workers supplied much labor. Payroll categories enforced segregation. White Americans often received gold pay. Many Black workers received silver pay. Housing and services also differed. **Scholarly interpretation.** The canal was a system. Medicine enabled engineering. Logistics enabled excavation. Imperial labor hierarchies reduced costs. They also allocated danger unequally. **Counterevidence and limits.** Mosquito control was not solitary. Better sanitation also helped. Hospital care improved survival. Mechanical innovations mattered greatly. Wage categories changed over time. Not every worker fit them. Records undercount some migrants. The canal shortened routes. It also transformed watersheds. Health gains were substantial. Segregation was substantial too. Neither cancels the other. Evidence supports interacting causes.", "summary": "Vector control enabled excavation. Segregated labor carried unequal costs.", "sources": [["Special Wonders: Mosquito Control", "https://wwwnc.cdc.gov/eid/article/27/8/ac-2708_article"], ["Yellow Fever and Panama", "https://wwwnc.cdc.gov/eid/article/24/5/17-1609_article"], ["1908 Labor Commission Report", "https://library.si.edu/digital-library/book/mes00unit"], ["Connecting the Oceans", "https://siarchives.si.edu/blog/connecting-oceans-100th-anniversary-panama-canal"]], "beats": ["Mosquitoes spread disease.", "Crews drain breeding water.", "Railways clear excavation.", "Workers face segregated systems.", "Locks move ships."], "setting": "Canal cut, mosquito ditch, and lock", "objects": [{"kind": "mosquito", "label": "mosquito", "track": [[90, 115], [145, 135], [205, 155], [250, 175], [250, 175], [250, 175]], "from": 0}, {"kind": "ditch", "label": "standing water", "track": [[150, 245], [150, 245], [150, 245], [150, 245], [150, 245], [150, 245]], "from": 0}, {"kind": "draincrew", "label": "drainage crew", "track": [[80, 230], [125, 220], [180, 215], [220, 210], [220, 210], [220, 210]], "from": 1}, {"kind": "spoiltrain", "label": "spoil railway", "track": [[300, 245], [330, 235], [380, 220], [430, 205], [470, 195], [470, 195]], "from": 2}, {"kind": "silverworker", "label": "silver-roll worker", "track": [[500, 250], [500, 250], [475, 240], [450, 225], [430, 210], [430, 210]], "from": 3}, {"kind": "canallock", "label": "lock gates", "track": [[550, 195], [550, 195], [550, 195], [550, 195], [550, 195], [550, 195]], "from": 3}, {"kind": "ship", "label": "ocean ship", "track": [[390, 260], [390, 260], [390, 260], [430, 245], [500, 220], [565, 190]], "from": 4}], "word_count": 158}, {"id": "haber-bosch-ammonia", "title": "Air became fertilizer", "question": "How did ammonia change history?", "body": "**Documented fact.** Fritz Haber demonstrated ammonia synthesis. Carl Bosch industrialized it. Nitrogen and hydrogen reacted. High pressure was essential. Heat and catalysts also mattered. BASF built large plants. Synthetic ammonia supplied fertilizer. Crop yields rose dramatically. Modern food systems followed. The process also supplied nitrates. Germany used them for explosives. Wartime blockade pressure increased importance. Today, synthetic fertilizer supports roughly half humanity's food. Ammonia production also uses substantial energy. Reactive nitrogen escapes farms. Rivers receive runoff. Coastal dead zones can grow. Nitrous oxide warms climate. **Scholarly interpretation.** Haber–Bosch broke a natural limit. Industrial chemistry expanded carrying capacity. The same infrastructure served war. Benefits and harms were coupled. Scale transformed both. **Counterevidence and limits.** Fertilizer alone raised no crop. Seeds and water mattered. Distribution mattered too. The exact population share is modeled. It is not directly counted. Explosives predated synthetic ammonia. Germany had other sources. Current emissions depend on fuel. Cleaner hydrogen could reduce them. Nitrogen leakage still remains. The legacy is neither singular progress nor singular harm.", "summary": "Pressure fixed atmospheric nitrogen. Food expanded while pollution accumulated.", "sources": [["Carl Bosch — Nobel Facts", "https://www.nobelprize.org/prizes/chemistry/1931/bosch/facts/"], ["Fritz Haber — Nobel Biography", "https://www.nobelprize.org/prizes/chemistry/1918/haber/biographical/"], ["How Many People Does Nitrogen Feed?", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3666697/"], ["Nitrogen Fixation and Sustainability", "https://doi.org/10.1073/pnas.1706371114"]], "beats": ["Air enters compressors.", "Pressure drives synthesis.", "Ammonia feeds crops.", "Nitrates fill shells.", "Runoff changes waters."], "setting": "Ammonia plant, farm, and river", "objects": [{"kind": "airmolecules", "label": "nitrogen and hydrogen", "track": [[70, 100], [130, 120], [190, 145], [230, 170], [230, 170], [230, 170]], "from": 0}, {"kind": "compressor", "label": "compressor", "track": [[275, 190], [275, 190], [275, 190], [275, 190], [275, 190], [275, 190]], "from": 0}, {"kind": "reactorvessel", "label": "high-pressure reactor", "track": [[360, 185], [360, 185], [360, 185], [360, 185], [360, 185], [360, 185]], "from": 1}, {"kind": "ammoniatank", "label": "ammonia", "track": [[445, 190], [445, 190], [425, 195], [405, 200], [405, 200], [405, 200]], "from": 2}, {"kind": "cropfield", "label": "fertilized field", "track": [[520, 240], [520, 240], [500, 230], [475, 220], [455, 210], [455, 210]], "from": 2}, {"kind": "shell", "label": "nitrate shell", "track": [[535, 100], [535, 100], [535, 100], [500, 125], [465, 150], [465, 150]], "from": 3}, {"kind": "runoff", "label": "nitrogen runoff", "track": [[470, 245], [470, 245], [470, 245], [500, 250], [540, 255], [580, 265]], "from": 4}], "word_count": 169}, {"id": "bhopal-safety-layers", "title": "Bhopal lost safety layers", "question": "How did one leak become catastrophic?", "body": "**Documented fact.** Union Carbide India stored methyl isocyanate. Water entered a tank. A runaway reaction followed. Pressure rose rapidly. Toxic gas escaped overnight. Nearby settlements received little warning. At least 3,800 people died immediately. Later death estimates are higher. Hundreds of thousands reported exposure. Multiple protections were degraded. Refrigeration was shut down. The scrubber was ineffective. The flare system was unavailable. Staffing and training had declined. Emergency information was inadequate. **Scholarly interpretation.** Catastrophe required interacting failures. Hazardous inventory met weak barriers. Cost pressure shaped maintenance. Siting magnified exposure. Institutional responsibility crossed borders. **Counterevidence and limits.** Exact water entry remains disputed. Sabotage was alleged. Investigations emphasized broader vulnerabilities. One trigger cannot explain consequences. Long-term health estimates also vary. Exposure records were incomplete. Diagnostic capacity was limited. Corporate, subsidiary, and regulatory duties differed. Courts allocated liability imperfectly. The settlement funded relief. Many survivors found it insufficient. Research documents lasting illness. It cannot precisely attribute every condition. The strongest evidence concerns failed layers.", "summary": "A tank reaction crossed degraded barriers. Dense settlement magnified harm.", "sources": [["Bhopal Disaster Review", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1142333/"], ["Risk Concealment at Bhopal", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7175960/"], ["In-Utero Exposure Effects", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10335451/"], ["WHO Chemical Incident Report", "https://iris.who.int/bitstream/handle/10665/70570/WHO_SDE_OEH_01.3_eng.pdf"]], "beats": ["Water reaches MIC.", "Tank pressure rises.", "Safety barriers fail.", "Gas crosses the fence.", "Health damage persists."], "setting": "Pesticide plant and neighboring settlement", "objects": [{"kind": "watervalve", "label": "water entry", "track": [[90, 105], [150, 125], [205, 150], [250, 175], [250, 175], [250, 175]], "from": 0}, {"kind": "mictank", "label": "MIC tank", "track": [[300, 205], [300, 205], [300, 205], [300, 205], [300, 205], [300, 205]], "from": 0}, {"kind": "gauge", "label": "rising pressure", "track": [[350, 120], [350, 120], [350, 120], [350, 120], [350, 120], [350, 120]], "from": 1}, {"kind": "scrubberoff", "label": "inactive scrubber", "track": [[430, 190], [430, 190], [430, 190], [430, 190], [430, 190], [430, 190]], "from": 2}, {"kind": "flareoff", "label": "unavailable flare", "track": [[500, 120], [500, 120], [500, 120], [500, 120], [500, 120], [500, 120]], "from": 2}, {"kind": "gascloud", "label": "toxic cloud", "track": [[330, 175], [330, 175], [360, 185], [420, 205], [500, 225], [565, 245]], "from": 3}, {"kind": "settlement", "label": "nearby settlement", "track": [[555, 245], [555, 245], [555, 245], [555, 245], [555, 245], [555, 245]], "from": 0}], "word_count": 161}, {"id": "chernobyl-reactor-system", "title": "Chernobyl combined failures", "question": "Why did the reactor surge?", "body": "**Documented fact.** Operators prepared a turbine test. Reactor power fell too low. They restored partial power. Many control rods were withdrawn. Safety systems were bypassed. The RBMK had dangerous characteristics. Steam formation could increase reactivity. Control-rod design could initially add reactivity. During shutdown, power surged. Explosions destroyed Unit Four. Fire spread radionuclides widely. Two workers died immediately. Acute radiation syndrome killed others. Childhood thyroid cancers later increased. Evacuation and cleanup displaced communities. **Scholarly interpretation.** Later reviews shifted emphasis. Operator violations mattered. So did design defects. Weak safety culture connected them. Secrecy delayed protective action. The accident was systemic. **Counterevidence and limits.** Early Soviet accounts blamed operators heavily. INSAG-7 revised that balance. Radiation effects differ by dose. Thyroid harm is well established. Broader cancer estimates remain uncertain. Screening changed detection. Psychological and social harms were large. They were not radiation injuries. Wildlife recovery proves no safety. It partly reflects human absence. Exact long-term totals depend on models. Evidence supports differentiated impacts, not one number.", "summary": "A risky test met unstable design. Secrecy amplified consequences.", "sources": [["INSAG-7: The Chernobyl Accident", "https://www-pub.iaea.org/MTCD/publications/PDF/Pub913e_web.pdf"], ["UNSCEAR: The Chornobyl Accident", "https://www.unscear.org/unscear/en/chernobyl.html"], ["UNSCEAR 2008 Annex D", "https://www.unscear.org/unscear/uploads/documents/publications/UNSCEAR_2008_Annex-D-CORR.pdf"], ["WHO Chernobyl Q&A", "https://www.who.int/news-room/questions-and-answers/item/health-effects-of-the-chernobyl-accident"]], "beats": ["Test power falls.", "Rods withdraw.", "Steam raises reactivity.", "Shutdown triggers a surge.", "Contamination drives evacuation."], "setting": "RBMK control room and Pripyat", "objects": [{"kind": "controlconsole", "label": "test controls", "track": [[90, 215], [90, 215], [90, 215], [90, 215], [90, 215], [90, 215]], "from": 0}, {"kind": "turbine", "label": "turbine test", "track": [[200, 210], [200, 210], [200, 210], [200, 210], [200, 210], [200, 210]], "from": 0}, {"kind": "controlrods", "label": "withdrawn rods", "track": [[300, 230], [300, 210], [300, 185], [300, 155], [300, 130], [300, 130]], "from": 1}, {"kind": "steamvoids", "label": "steam voids", "track": [[355, 245], [355, 245], [355, 230], [360, 195], [365, 160], [370, 135]], "from": 2}, {"kind": "az5", "label": "AZ-5 shutdown", "track": [[430, 105], [430, 105], [430, 105], [410, 130], [390, 155], [390, 155]], "from": 3}, {"kind": "reactorburst", "label": "power surge", "track": [[400, 220], [400, 220], [400, 220], [420, 200], [455, 175], [480, 150]], "from": 3}, {"kind": "evacbus", "label": "evacuation buses", "track": [[580, 245], [580, 245], [580, 245], [580, 245], [540, 235], [485, 225]], "from": 4}], "word_count": 163}, {"id": "primitive-sunk-cost", "title": "Primitive Echo: sunk costs", "question": "Why keep funding failure?", "body": "**Documented evidence.** People often persist after investment. Money can create this effect. Time can do so. Effort can too. Classic experiments demonstrated it. Later meta-analysis found variation. Framing and responsibility matter. Mice and rats also persist. Comparable foraging tasks show sensitivity. That weakens purely cultural explanations. It does not prove irrationality. Waiting can reveal information. Switching can carry costs. **Scholarly interpretation.** Persistence may reuse older mechanisms. Foragers must avoid abandoning rewards prematurely. Commitment can also protect cooperation. Public consistency may preserve reputation. Modern projects exploit these tendencies. Past spending then feels predictive. It is not. Only future costs matter. **Counterevidence and limits.** Cross-species results remain inconsistent. Tasks may measure patience instead. Human vignettes show low reliability. Reputation explanations also face counterevidence. A 2026 political study found consistency cues mattered more than sunk costs. No fossil records reveal decision rules. Evolutionary claims are hypotheses. Culture, accounting, and blame shape escalation. Persistence is sometimes rational. The practical test is prospective. Ask what the next unit buys. Ignore unrecoverable expenditure.", "summary": "Persistence can protect rewards. Modern projects turn it into escalation.", "sources": [["The Psychology of Sunk Cost", "https://www.sciencedirect.com/science/article/pii/0749597885900494"], ["Sunk Costs Across Species", "https://pubmed.ncbi.nlm.nih.gov/27151560/"], ["Mice, Rats, and Humans", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6377599/"], ["Low Reliability of Sunk-Cost Vignettes", "https://pmc.ncbi.nlm.nih.gov/articles/PMC12384923/"]], "beats": ["A project receives resources.", "Failure signals appear.", "Past effort blocks exit.", "New funds follow old.", "Prospective review reopens choice."], "setting": "Foraging patch and project room", "objects": [{"kind": "projectframe", "label": "ongoing project", "track": [[100, 210], [100, 210], [100, 210], [100, 210], [100, 210], [100, 210]], "from": 0}, {"kind": "investmenttokens", "label": "past investment", "track": [[65, 105], [120, 130], [170, 155], [205, 180], [205, 180], [205, 180]], "from": 0}, {"kind": "failureflag", "label": "failure signal", "track": [[280, 110], [280, 110], [260, 135], [240, 165], [240, 165], [240, 165]], "from": 1}, {"kind": "exitdoor", "label": "exit option", "track": [[370, 210], [370, 210], [370, 210], [370, 210], [370, 210], [370, 210]], "from": 1}, {"kind": "commitrope", "label": "commitment pull", "track": [[300, 205], [300, 205], [315, 205], [330, 205], [345, 205], [345, 205]], "from": 2}, {"kind": "newfunds", "label": "new resources", "track": [[540, 105], [505, 125], [470, 150], [430, 175], [390, 195], [350, 205]], "from": 3}, {"kind": "prospectivepath", "label": "future-value test", "track": [[540, 250], [540, 250], [540, 250], [520, 240], [485, 225], [445, 210]], "from": 4}], "word_count": 167}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function draw(o,p){let[a,b]=interp(o.track,p),k=o.kind;x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(['coin','drop','food','token'].includes(k)){x.beginPath();x.arc(0,0,k==='drop'?12:20,0,7);x.fill();x.stroke()}else if(['doctor','patient','runner','family','kin','stranger'].includes(k)){x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,k==='runner'?P.coral:P.blue)}else if(k==='dna'){x.strokeStyle=P.coral;for(let i=-35;i<35;i+=8){x.beginPath();x.moveTo(-18,i);x.lineTo(18,i+8);x.stroke()}}else{paper(-34,-27,68,54,['factory','pillfactory','pharmacy','foundation','who','network','trust'].includes(k)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,54);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2? '#ded8cf':'#dce5d8';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>{let o=c.objects[+b.dataset.i];document.querySelector('#fact').textContent=o.label+' participates here. Open sources for evidence.'});scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
