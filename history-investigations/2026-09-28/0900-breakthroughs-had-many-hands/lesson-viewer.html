mpson received one. The first injection disappointed. Collip’s improved extract worked. That happened during January 1922. Banting, Best, and Collip patented production. Each assigned rights cheaply. Toronto received those rights. The university licensed manufacturers. Eli Lilly helped scale production. The 1923 Nobel recognized Banting. It also recognized Macleod. Both shared prize money. Their choices acknowledged colleagues. **Scholarly interpretation.** Insulin emerged through collaboration. Laboratory access mattered greatly. Purification made treatment practical. Manufacturing spread its benefits. **Benefits.** Insulin transformed fatal diabetes. Licensing enabled wider supply. **Conflicts and harms.** Credit disputes damaged relationships. Early supply stayed scarce. Production remained technically difficult. **Counterevidence and limits.** Banting’s idea mattered greatly. Macleod did not originate it. Yet solo-inventor stories fail. Modern insulin prices differ. They cannot be blamed solely. The 1923 licensing system changed. Later analogues added patents.", "summary": "Facilities, purification, and scale converged.", "sources": [["Toronto Insulin Archive", "https://collections.library.utoronto.ca/explore/heritage/exhibits/insulin"], ["Insulin Patent and Manufacture", "https://fisherdigitus.library.utoronto.ca/exhibits/show/insulin100/manufacture-of-insulin"], ["Nobel Insulin History", "https://www.nobelprize.org/prizes/themes/august-krogh-and-the-nobel-prize-to-banting-and-macleod/"], ["Insulin Discovery Revisited", "https://deptmedicine.utoronto.ca/sites/default/files/insulin_discovery_jci_4th_jan_2021.pdf"]], "beats": ["Banting brings an idea.", "Macleod opens a laboratory.", "Best tests pancreatic extracts.", "Collip purifies the treatment.", "Licenses expand production."], "setting": "Toronto laboratory and factory", "objects": [{"kind": "scientist", "label": "Banting", "fact": "Banting proposed pancreatic experiments.", "track": [[80, 225], [115, 218], [150, 210], [185, 202], [220, 195], [245, 188]], "from": 0}, {"kind": "lab", "label": "Macleod’s lab", "fact": "Macleod supplied facilities and animals.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "dog", "label": "test animals", "fact": "Animal experiments preceded treatment.", "track": [[540, 115], [490, 125], [440, 138], [390, 152], [340, 168], [300, 184]], "from": 2}, {"kind": "flask", "label": "Collip’s extract", "fact": "Collip improved purification.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "vials", "label": "insulin vials", "fact": "Manufacturers expanded supply.", "track": [[565, 118], [520, 128], [475, 140], [430, 153], [385, 168], [350, 184]], "from": 4}, {"kind": "factory", "label": "licensed factory", "fact": "Toronto licensed outside production.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 155}, {"id": "penicillin-development-network", "title": "Penicillin needed development", "question": "Was Fleming sufficient?", "body": "**Documented fact.** Alexander Fleming observed inhibition. That happened during 1928. His mold produced penicillin. He published during 1929. Stable production remained elusive. Oxford researchers returned later. Howard Florey led them. Ernst Chain investigated chemistry. Norman Heatley built apparatus. Their team tested mice. Human treatment followed during 1941. Supplies initially ran short. Florey and Heatley sought Americans. Federal laboratories assisted fermentation. Pharmaceutical companies increased yields. War contracts accelerated scale. Fleming, Chain, and Florey shared Nobel recognition. **Scholarly interpretation.** Observation began the pathway. Translation required organized development. Fermentation converted promise into medicine. **Benefits.** Penicillin treated lethal infections. Wartime production built capacity. **Conflicts and harms.** Public storytelling favored Fleming. Heatley received delayed recognition. Antibiotic success encouraged overuse. Resistance then expanded. **Counterevidence and limits.** Fleming clearly discovered activity. Oxford’s team did not invent mold. Companies also took financial risks. Wartime urgency helped coordination. No single laboratory sufficed. Exact credit boundaries remain debatable.", "summary": "Observation needed translation and factories.", "sources": [["Discovery and Development of Penicillin", "https://www.acs.org/education/whatischemistry/landmarks/flemingpenicillin.html"], ["1945 Nobel Prize", "https://www.nobelprize.org/prizes/medicine/1945/summary/"], ["Penicillin Production", "https://cen.acs.org/articles/86/i36/Penicillin-Production.html"]], "beats": ["Fleming notices a clear zone.", "Oxford revives the finding.", "Heatley builds extraction tools.", "Mice and patients improve.", "Factories ferment at scale."], "setting": "London bench, Oxford lab, factories", "objects": [{"kind": "petri", "label": "mold plate", "fact": "Fleming observed bacterial inhibition.", "track": [[95, 225], [125, 218], [155, 210], [185, 202], [215, 195], [240, 188]], "from": 0}, {"kind": "group", "label": "Oxford team", "fact": "Florey led multidisciplinary development.", "track": [[550, 225], [515, 218], [480, 210], [445, 202], [410, 195], [375, 188]], "from": 1}, {"kind": "vessel", "label": "Heatley vessel", "fact": "Heatley improvised extraction equipment.", "track": [[520, 115], [470, 125], [420, 138], [370, 152], [320, 168], [280, 184]], "from": 2}, {"kind": "mouse", "label": "mouse test", "fact": "Oxford demonstrated in-vivo activity.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "patient", "label": "first patients", "fact": "Human treatment exposed scarcity.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "factory", "label": "fermentation vats", "fact": "Public and corporate capacity scaled supply.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 148}, {"id": "anesthesia-priority-conflict", "title": "Anesthesia had rival pioneers", "question": "Who made surgery painless?", "body": "**Documented fact.** Crawford Long used ether. His surgery occurred during 1842. He published much later. Horace Wells used nitrous oxide. His public demonstration failed. William Morton demonstrated ether publicly. That happened October 16, 1846. John Warren removed a tumor. Patient Edward Abbott reported little pain. Charles Jackson had advised Morton. Morton sought proprietary control. He called ether Letheon. The recipe soon emerged. Priority disputes then intensified. **Scholarly interpretation.** Long showed earlier use. Morton showed public reproducibility. Wells advanced dental anesthesia. Jackson supplied chemical advice. These roles differ. Dissemination depended upon demonstration. **Benefits.** Surgery became less agonizing. Longer operations became possible. **Conflicts and harms.** Rivalry consumed several careers. Proprietary claims impeded trust. Early anesthesia remained dangerous. Dosing lacked reliable instruments. **Counterevidence and limits.** Earlier pain-control practices existed. Ether use was not novel. Surgical anesthesia required acceptance. One demonstration cannot explain everything. Specific credit can be divided. Broader discovery remains collective.", "summary": "Earlier use differed from dissemination.", "sources": [["Ether Dome", "https://www.massgeneral.org/museum/exhibits/ether-dome"], ["Discovery of Modern Anesthesia", "https://pubmed.ncbi.nlm.nih.gov/26742335/"], ["Morton’s First Identified Patient", "https://pubmed.ncbi.nlm.nih.gov/22728779/"]], "beats": ["Long uses ether earlier.", "Wells tests nitrous oxide.", "Morton enters the theater.", "Abbott remains largely painless.", "Credit claims collide."], "setting": "Nineteenth-century operating theater", "objects": [{"kind": "doctor", "label": "Crawford Long", "fact": "Long used ether during 1842.", "track": [[85, 225], [120, 218], [155, 210], [190, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "mask", "label": "nitrous mask", "fact": "Wells advanced dental anesthesia.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "inhaler", "label": "Morton’s inhaler", "fact": "Morton staged public demonstration.", "track": [[540, 115], [490, 125], [440, 138], [390, 152], [340, 168], [300, 184]], "from": 2}, {"kind": "patient", "label": "Edward Abbott", "fact": "Abbott reported little pain.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "theater", "label": "Ether Dome", "fact": "Public witnessing enabled dissemination.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "gavel", "label": "priority dispute", "fact": "Proprietary and credit claims collided.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 149}, {"id": "oral-rehydration-field-network", "title": "Oral rehydration crossed settings", "question": "Who invented the solution?", "body": "**Documented fact.** Intestinal transport research came first. Glucose improved sodium absorption. Dhaka researchers tested therapy. David Nalin participated. Richard Cash participated too. Their 1968 trial involved cholera. Oral solution reduced intravenous needs. War displaced Bangladeshis during 1971. Refugee camps faced cholera. Intravenous supplies became scarce. Dilip Mahalanabis used oral therapy. Families helped administer it. Reported mortality stayed far lower. WHO later promoted standardized salts. UNICEF supported global distribution. **Scholarly interpretation.** Physiology enabled the formula. Clinical trials established efficacy. Field improvisation proved scalability. Public systems enabled reach. **Benefits.** Treatment became cheap. Caregivers could provide it. Millions avoided fatal dehydration. **Conflicts and harms.** Simplified stories crown individuals. Incorrect mixing can injure. Severe dehydration still needs intravenous care. Implementation required repeated community teaching. **Counterevidence and limits.** Camp evidence lacked randomization. Crisis comparisons were imperfect. Earlier work also mattered. No single inventor suffices. Collective credit better fits records.", "summary": "Physiology, trials, and field delivery aligned.", "sources": [["Oral Fluid Therapy, 1973", "https://pmc.ncbi.nlm.nih.gov/articles/PMC2566420/"], ["Magic Bullet: ORT History", "https://pmc.ncbi.nlm.nih.gov/articles/PMC1036912/"], ["WHO Oral Rehydration Salts", "https://www.who.int/publications/i/item/WHO-FCH-CAH-06.1"], ["Cholera Treatment", "https://www.who.int/news-room/fact-sheets/detail/cholera"]], "beats": ["Physiology reveals coupled absorption.", "Dhaka trials test mixtures.", "War empties intravenous stores.", "Families deliver oral solution.", "Standard packets spread globally."], "setting": "Dhaka clinic and refugee camp", "objects": [{"kind": "gut", "label": "intestinal transport", "fact": "Glucose supports sodium absorption.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "clinic", "label": "Dhaka trial", "fact": "Trials reduced intravenous requirements.", "track": [[555, 225], [520, 218], [485, 210], [450, 202], [415, 195], [380, 188]], "from": 1}, {"kind": "emptyrack", "label": "empty IV rack", "fact": "Refugee camps lacked intravenous fluid.", "track": [[540, 115], [490, 125], [440, 138], [390, 152], [340, 168], [300, 184]], "from": 2}, {"kind": "cup", "label": "salt-sugar drink", "fact": "Families administered oral therapy.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "family", "label": "caregivers", "fact": "Simple delivery expanded capacity.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "packet", "label": "standard ORS", "fact": "WHO and UNICEF standardized salts.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 144}, {"id": "mrna-platform-network", "title": "mRNA vaccines combined platforms", "question": "Did one discovery suffice?", "body": "**Documented fact.** Scientists pursued messenger RNA for decades. Delivery remained difficult. Unmodified RNA triggered inflammation. Katalin Karikó persisted. Drew Weissman collaborated. Their modified nucleosides reduced responses. Protein production also improved. They published key results. Lipid carriers developed separately. Those particles protect fragile RNA. They support cellular entry. Companies then optimized formulations. Researchers selected coronavirus targets. Clinical trials tested vaccines. Regulators reviewed evidence. Manufacturers scaled production rapidly. The 2023 Nobel recognized Karikó. It also recognized Weissman. **Scholarly interpretation.** Their discovery removed one barrier. Lipid nanoparticles removed another. Genomics accelerated target design. Public investment supported readiness. **Benefits.** Vaccines arrived unusually quickly. Trials showed strong protection. Platforms enabled rapid redesign. **Conflicts and harms.** Access remained globally unequal. Cold chains constrained delivery. Rare adverse events required monitoring. **Counterevidence and limits.** Speed did not mean novelty. Decades of work preceded 2020. Nobel scope was specific. It did not rank every contributor. Platform success remains collective.", "summary": "Modified RNA needed protected delivery.", "sources": [["2023 Nobel Press Release", "https://www.nobelprize.org/prizes/medicine/2023/press-release/"], ["Nobel Scientific Background", "https://www.nobelprize.org/prizes/medicine/2023/advanced-information/"], ["mRNA Delivery Using Lipid Nanoparticles", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5439223/"], ["mRNA Vaccine Revolution", "https://pmc.ncbi.nlm.nih.gov/articles/PMC8483746/"]], "beats": ["Unmodified RNA triggers alarms.", "Modified nucleosides reduce inflammation.", "Lipid particles shield cargo.", "Cells receive genetic instructions.", "Trials and factories scale."], "setting": "RNA laboratory and vaccine line", "objects": [{"kind": "rna", "label": "messenger RNA", "fact": "Early RNA triggered innate responses.", "track": [[90, 225], [125, 218], [160, 210], [195, 202], [225, 195], [250, 188]], "from": 0}, {"kind": "scientist", "label": "Karikó and Weissman", "fact": "Modified nucleosides changed immune recognition.", "track": [[550, 225], [515, 218], [480, 210], [445, 202], [410, 195], [375, 188]], "from": 1}, {"kind": "lipid", "label": "lipid particle", "fact": "Lipid nanoparticles protect RNA.", "track": [[520, 115], [470, 125], [420, 138], [370, 152], [320, 168], [280, 184]], "from": 2}, {"kind": "cell", "label": "human cell", "fact": "Particles support cellular delivery.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "syringe", "label": "vaccine dose", "fact": "Trials tested complete products.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 4}, {"kind": "factory", "label": "production line", "fact": "Manufacturing made deployment possible.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 150}, {"id": "primitive-echo-negativity", "title": "Primitive Echo: danger sticks", "question": "Why keep scrolling threats?", "body": "**Documented evidence.** Negative information often weighs more. Adults show this pattern. Children show it too. Threat cues capture attention. Context changes the effect. Anxiety can strengthen it. Online systems measure engagement. Out-group hostility predicts sharing. Moral emotion also spreads. These findings differ importantly. Attention is not sharing. Sharing is not belief. **Evolutionary interpretation.** Missing danger could prove costly. Detecting false danger costs less. Selection may favor caution. Social warnings might protect groups. This remains an inference. Experiments cannot observe ancestral minds. **Current echo.** People keep scanning crises. Threatening posts feel urgent. Repetition prolongs attention. Platforms can amplify exposure. **Benefits.** Vigilance can prevent harm. Warnings coordinate fast responses. **Harms.** Continuous scanning increases distress. False alarms consume attention. Hostile content can polarize. **Counterevidence and limits.** Negativity is not universal. Positive information also spreads. Culture shapes media habits. Algorithms shape exposure strongly. Evolution cannot excuse design choices. Doomscrolling has multiple causes.", "summary": "Threat attention meets engagement systems.", "sources": [["Negativity Across Development", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3652533/"], ["Human Threat Management", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3024471/"], ["Out-group Animosity Online", "https://www.pnas.org/doi/10.1073/pnas.2024292118"], ["Threat Information Signals Competence", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4464524/"]], "beats": ["A warning captures attention.", "The watcher checks again.", "Sharing broadcasts the threat.", "Engagement rewards repetition.", "Uncertainty remains visible."], "setting": "Campfire warning and phone feed", "objects": [{"kind": "warning", "label": "danger cue", "fact": "Threat cues can capture attention.", "track": [[95, 225], [125, 218], [155, 210], [185, 202], [215, 195], [240, 188]], "from": 0}, {"kind": "watcher", "label": "watcher", "fact": "Repeated scanning may follow uncertainty.", "track": [[550, 225], [515, 218], [480, 210], [445, 202], [410, 195], [375, 188]], "from": 1}, {"kind": "signal", "label": "shared warning", "fact": "Danger reports can appear competent.", "track": [[520, 115], [470, 125], [420, 138], [370, 152], [320, 168], [280, 184]], "from": 2}, {"kind": "phone", "label": "social feed", "fact": "Engagement systems amplify exposure.", "track": [[105, 120], [160, 130], [215, 142], [270, 155], [325, 170], [365, 185]], "from": 3}, {"kind": "group", "label": "online group", "fact": "Out-group hostility predicts sharing.", "track": [[565, 120], [520, 130], [475, 142], [430, 155], [385, 170], [350, 185]], "from": 3}, {"kind": "question", "label": "evidence limit", "fact": "Evolutionary origins remain inferred.", "track": [[585, 145], [585, 145], [585, 145], [540, 150], [495, 165], [450, 182]], "from": 4}], "word_count": 148}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function person(){x.fillStyle=P.gold;x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,P.blue)}function draw(o,p){let[a,b]=interp(o.track,p);x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(o.kind==='ship'){x.fillStyle=P.coral;x.beginPath();x.moveTo(-55,0);x.lineTo(55,0);x.lineTo(38,28);x.lineTo(-38,28);x.closePath();x.fill();x.stroke();paper(-24,-34,48,34,P.paper);x.beginPath();x.moveTo(2,-65);x.lineTo(38,-42);x.lineTo(2,-25);x.closePath();x.fillStyle=P.gold;x.fill();x.stroke()}else if(o.kind==='missile'){x.beginPath();x.moveTo(0,-55);x.lineTo(16,-24);x.lineTo(16,34);x.lineTo(0,52);x.lineTo(-16,34);x.lineTo(-16,-24);x.closePath();x.fillStyle=P.coral;x.fill();x.stroke()}else if(o.kind==='rubber'){paper(-38,-18,76,44,P.gold);for(let i=-1;i<2;i++){x.beginPath();x.arc(i*22,-23,9,0,7);x.fillStyle=P.blue;x.fill();x.stroke()}}else if(o.kind==='group'){x.save();x.translate(-24,0);person();x.restore();x.save();x.translate(24,0);person();x.restore()}else if(['coin','seed','gift','return'].includes(o.kind)){x.beginPath();x.arc(0,0,20,0,7);x.fill();x.stroke()}else if(['portrait','scientist','worker','child','giver','receiver','patient'].includes(o.kind)){person()}else{paper(-34,-27,68,54,['foundation','company','factory','bank','agency','trust'].includes(o.kind)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,56);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2?'#e4dccf':'#dce6dd';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#body').textContent=reduced?c.body.replaceAll('**',''):'';document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>document.querySelector('#fact').textContent=c.objects[+b.dataset.i].fact);scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced;render()};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
