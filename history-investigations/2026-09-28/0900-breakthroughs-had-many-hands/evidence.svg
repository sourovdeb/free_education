<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Breakthroughs had many hands evidence ladder</title>
<desc id="desc">Six rows connect a breakthrough, its network mechanism, evidence, and limits. Each case links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c45d4d"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#25333a}.white{fill:#f2e8cf}.small{font-size:16px}.arrow{stroke:#c45d4d;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f2e8cf"/><text x="40" y="64" style="font-size:42px">Breakthroughs Had Many Hands</text><text x="40" y="100" style="font-size:20px;font-weight:400">Breakthrough → mechanism → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#25333a" stroke-width="2"/>
    <a href="https://collections.library.utoronto.ca/explore/heritage/exhibits/insulin"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">Insulin</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Team plus licensing</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Archives and Nobel</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Prices evolved</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#25333a" stroke-width="2"/>
    <a href="https://www.acs.org/education/whatischemistry/landmarks/flemingpenicillin.html"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">Penicillin</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Finding plus scale</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Lab and factory</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Credit divides</text>
  </g>
  <g transform="translate(0,385)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#25333a" stroke-width="2"/>
    <a href="https://www.massgeneral.org/museum/exhibits/ether-dome"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">Anesthesia</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Use plus diffusion</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Records and review</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Priority splits</text>
  </g>
  <g transform="translate(0,485)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#25333a" stroke-width="2"/>
    <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2566420/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">Rehydration</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Trials plus delivery</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Trial and WHO</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Camp data limited</text>
  </g>
  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#25333a" stroke-width="2"/>
    <a href="https://www.nobelprize.org/prizes/medicine/2023/press-release/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">mRNA</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Payload plus carrier</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Nobel and reviews</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Many contributors</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#25333a" stroke-width="2"/>
    <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3652533/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#2f7772"/><text x="155" y="7" text-anchor="middle" class="white">Threat</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d5a23e" stroke="#25333a"/><text x="455" y="7" text-anchor="middle">Vigilance plus feeds</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#527fa4"/><text x="755" y="7" text-anchor="middle" class="white">Behavioral studies</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c45d4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Origins inferred</text>
  </g>
</svg>