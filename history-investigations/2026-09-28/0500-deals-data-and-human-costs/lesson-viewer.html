s. Villages faced rubber quotas. Armed agents enforced them. Hostages secured village compliance. Casement recorded systematic abuses. Official inquiries confirmed abuses. Rubber demand rewarded extraction. **Benefits claimed.** Officials promised regional development. Railways expanded export capacity. Revenue funded state administration. **Scholarly interpretation.** Concession incentives linked violence. Output outranked human welfare. Corporate authority weakened accountability. Later research finds persistence. Former concession zones lagged. **Counterevidence and limits.** Disease caused many deaths. Exact death totals remain disputed. Some infrastructure survived afterward. Officials behaved with variation. Missionaries supplied important testimony. Their accounts had viewpoints. Yet archives corroborate coercion. Ownership alone proves nothing. Quotas supplied stronger evidence. Armed enforcement supplied evidence. The regime ended during 1908. Belgium then annexed Congo. Coercive labor continued afterward. Long effects remain debated. Regional studies cannot explain everything.", "summary": "Concessions linked quotas, force, and rubber profits.", "sources": [["Casement Report, 1904", "https://www.gutenberg.org/ebooks/50573"], ["Congo Inquiry Summary, 1905", "https://history.state.gov/historicaldocuments/frus1905/d116"], ["Concessions, Violence, and Indirect Rule", "https://www.nber.org/system/files/working_papers/w27893/w27893.pdf"]], "beats": ["Concessions divide forests.", "Quotas enter villages.", "Force extracts rubber.", "Rubber becomes revenue.", "Reports expose coercion."], "setting": "Congo forest and concession post", "objects": [{"kind": "agency", "label": "Free State", "fact": "Leopold controlled the state.", "track": [[70, 225], [70, 225], [70, 225], [70, 225], [70, 225], [70, 225]], "from": 0}, {"kind": "contract", "label": "concession", "fact": "Companies received extraction zones.", "track": [[105, 125], [205, 135], [285, 150], [285, 150], [2 5, 105], [455, 120]], "from": 4}], "word_count": 153}, {"id": "unit-731-immunity", "title": "War-crimes data shaped immunity", "question": "What displaced accountability?", "body": "**Documented fact.** Unit 731 operated in China. Imperial Japan sponsored it. Prisoners faced lethal experiments. Biological weapons were tested. Japanese records were destroyed. American investigators sought surviving data. Occupation memoranda discussed immunity. Leading personnel avoided prosecution. Information reached American programs. Soviet trials exposed some evidence. American records stayed secret longer. **Benefits claimed.** Officials expected unique data. They feared Soviet access. They cited national security. **Scholarly interpretation.** Strategic utility displaced accountability. Secrecy protected research access. Different tribunals produced unequal justice. Ethical safeguards then remained weak. **Harms.** Victims received little recognition. Perpetrators resumed professional lives. Concealment obstructed historical accounting. **Counterevidence and limits.** Data quality remains disputed. Some researchers call it crude. Destroyed records create uncertainty. Victim totals remain estimates. Immunity arrangements were administrative. They were not one treaty. Not every participant escaped scrutiny. Soviet proceedings had propaganda aims. Those limits matter. Declassified American records still support concealment. They support bargaining for data. They cannot reconstruct every experiment.", "summary": "Occupation officials traded accountability for biological-warfare information.", "sources": [["National Archives: Japanese War Crimes", "https://www.archives.gov/iwg/japanese-war-crimes"], ["Selected Japanese War-Crimes Documents", "https://www.archives.gov/files/iwg/japanese-war-crimes/select-documents.pdf"], ["U.S. Responses to Wartime Experimentation", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4487829/"]], "beats": ["Prisoners become subjects.", "Experiments create records.", "Investigators seek data.", "Immunity blocks prosecution.", "Archives reveal bargaining."], "setting": "Harbin laboratory and occupation office", "objects": [{"kind": "lab", "label": "Unit 731", "fact": "The unit conducted lethal experiments.", "track": [[75, 220], [75, 220], [75, 220], [75, 220], [75, 220], [75, 220]], "from": 0}, {"kind": "patient", "label": "prisoners", "fact": "Prisoners lacked consent.", "track": [[165, 235], [205, 225], [255, 215], [300, 205], [300, 205], [300, 205]], "from": 0}, {"kind": "vials", "label": "experiment data", "fact": "Investigators pursued surviving data.", "track": [[295, 140], [350, 145], [410, 155], [465, 165], [465, 165], [465, 165]], "from": 1}, {"kind": "agency", "label": "occupation", "fact": "American officials valued access.", "track": [[575, 225], [575, 225], [540, 215], [510, 205], [480, 195], [480, 195]], "from": 2}, {"kind": "lock", "label": "immunity", "fact": "Leading personnel avoided prosecution.", "track": [[575, 105], [575, 105], [575, 105], [535, 120], [490, 145], [455, 165]], "from": 3}, {"kind": "file", "label": "declassified files", "fact": "Later records documented bargaining.", "track": [[310, 90], [310, 90], [310, 90], [310, 90], [385, 105], [445, 125]], "from": 4}], "word_count": 155}, {"id": "cuban-missile-endgame", "title": "The missile bargain stayed private", "question": "What ended the crisis?", "body": "**Documented fact.** Soviet missiles reached Cuba. American surveillance detected sites. Kennedy announced a quarantine. Nuclear forces prepared escalation. Khrushchev demanded Turkish missile removal. Public messages emphasized Cuba. Moscow removed Cuban missiles. Washington pledged against invasion. A private assurance also mattered. American Jupiters would leave Turkey. They were removed afterward. Italian Jupiters also departed. The link stayed secret. **Benefits claimed.** Privacy protected allied confidence. It gave both leaders space. Public humiliation became avoidable. **Scholarly interpretation.** Face-saving enabled compromise. Reciprocal concessions supported withdrawal. Public memory later simplified events. It portrayed unilateral Soviet retreat. **Counterevidence and limits.** Jupiters were becoming obsolete. Withdrawal planning already existed. Kennedy avoided a formal trade. Cuba’s removal happened faster. Turkey resisted American pressure. Several dangers shaped decisions. Submarines also approached escalation. A U-2 was downed. The noninvasion pledge mattered. Therefore, Turkey was consequential. It was not sufficient alone. Archives clarify the bargain. They cannot isolate every motive. Leader memories also diverged.", "summary": "A private Turkish-missile assurance supported public settlement.", "sources": [["U.S. Office of the Historian: Cuban Missile Crisis", "https://history.state.gov/milestones/1961-1968/cuban-missile-crisis"], ["National Security Archive: Jupiter Endgame", "https://nsarchive.gwu.edu/briefing-book/cuban-missile-crisis-nuclear-vault/2023-02-16/jupiter-missiles-and-endgame-cuban"], ["National Security Archive: Sealing the Deal", "https://nsarchive.gwu.edu/briefing-book/cuban-missile-crisis-nuclear-vault/2023-04-20/jupiter-missiles-and-cuban-missile"]], "beats": ["Missiles face missiles.", "Ships tighten quarantine.", "Private terms cross rooms.", "Both arsenals withdraw.", "Public memory simplifies."], "setting": "Caribbean sea and diplomatic rooms", "objects": [{"kind": "missile", "label": "Cuban missiles", "fact": "Soviet missiles reached Cuba.", "track": [[90, 225], [145, 215], [215, 205], [265, 195], [265, 195], [265, 195]], "from": 0}, {"kind": "ship", "label": "quarantine", "fact": "American ships enforced quarantine.", "track": [[575, 245], [510, 235], [445, 225], [390, 215], [390, 215], [390, 215]], "from": 1}, {"kind": "document", "label": "private terms", "fact": "Kennedy privately assured withdrawal.", "track": [[570, 105], [570, 105], [520, 120], [470, 140], [420, 160], [420, 160]], "from": 2}, {"k ted evidence.** Foraging returns vary sharply. Large catches create surpluses. Storage was often limited. Field studies document food sharing. Hadza camps share large game. Children also exchange food. Networks link several households. Models test those networks. Modular sharing reduces starvation risk. Redundant ties improve food security. **Evolutionary interpretation.** Sharing can pool uncertainty. Today’s giver may fail tomorrow. Partners can then reciprocate. Kinship often guides transfers. Need also guides transfers. Reputation may guide transfers. Norms govern acceptable claims. Such systems support cooperation. **Current echo.** Families share emergency money. Neighbors exchange childcare. Mutual aid follows disasters. Insurance formalizes similar pooling. **Benefits.** Variance becomes less damaging. Specialists gain survival buffers. Groups withstand failed harvests. **Harms.** Obligations can become coercive. Free-rider suspicion creates conflict. Unequal power distorts sharing. **Counterevidence and limits.** No single mechanism explains sharing. Experiments show camp effects. Fixed generosity matters less sometimes. Modern welfare has institutions. Ancestral analogies remain interpretations. Models are not prehistory. Sharing evidence supports risk-pooling. It proves no universal adaptation.", "summary": "Sharing networks spread losses across households and time.", "sources": [["Food Sharing Among Hadza Children", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4494808/"], ["Social Networks and Cooperation", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3340565/"], ["Food-Sharing Networks Minimise Risk", "https://journals.plos.org/plosone/article?id=10.1371%2Fjournal.pone.0272733"], ["Networks Reveal Risk Buffering", "https://www.sciencedirect.com/science/article/pii/S0960982216305644"]], "beats": ["One hunter gains surplus.", "Food enters a network.", "Partners receive portions.", "Tomorrow reverses fortune.", "Norms limit exploitation."], "setting": "Forager c p(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>document.querySelector('#fact').textContent=c.objects[+b.dataset.i].fact);scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced;render()};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
