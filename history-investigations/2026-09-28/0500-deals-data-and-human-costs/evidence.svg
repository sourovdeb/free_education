<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Deals, data, and human costs evidence ladder</title>
<desc id="desc">Six rows connect historical mechanisms, decisive evidence, and limits. Each first label links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c55d4d"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#26343a}.white{fill:#f5ead0}.small{font-size:16px}.arrow{stroke:#c55d4d;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f5ead0"/><text x="40" y="64" style="font-size:42px">Deals, Data, and Human Costs</text><text x="40" y="100" style="font-size:20px;font-weight:400">Event → mechanism → evidence → limit</text>
