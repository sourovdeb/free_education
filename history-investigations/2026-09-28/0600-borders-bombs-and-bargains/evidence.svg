    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d8a53b" stroke="#24343a"/><text x="455" y="7" text-anchor="middle">Allied tolerance</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#547fa5"/><text x="755" y="7" text-anchor="middle" class="white">Meeting minutes</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c85e4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Agency layered</text>
