  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#24343a" stroke-width="2"/>
    <a href="https://www.who.int/news-room/spotlight/history-of-vaccination/history-of-smallpox-vaccination"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#287c78"/><text x="155" y="7" text-anchor="middle" class="white">Smallpox</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d8a53b" stroke="#24343a"/><text x="455" y="7" text-anchor="middle">Ring strategy</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#547fa5"/><text x="755" y="7" text-anchor="middle" class="white">WHO records</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c85e4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Biology differs</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#24343a" stroke-width="2"/>
    <a href="https://pubmed.ncbi.nlm.nih.gov/16794075/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#287c78"/><text x="155" y="7" text-anchor="middle" class="white">Punishment</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d8a53b" stroke="#24343a"/><text x="455" y="7" text-anchor="middle">Costly sanctions</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#547fa5"/><text x="755" y="7" text-anchor="middle" class="white">Cross-cultural trials</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c85e4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Can turn antisocial</text>
