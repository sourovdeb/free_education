    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d8a53b" stroke="#24343a"/><text x="455" y="7" text-anchor="middle">Yield error</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#547fa5"/><text x="755" y="7" text-anchor="middle" class="white">Fallout records</text>
