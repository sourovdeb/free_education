<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Borders, bombs, and bargains evidence ladder</title>
<desc id="desc">Six rows connect mechanisms, decisive evidence, and limits. Each case label links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c85e4d"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#24343a}.white{fill:#f4e7c9}.small{font-size:16px}.arrow{stroke:#c85e4d;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f4e7c9"/><text x="40" y="64" style="font-size:42px">Borders, Bombs, and Bargains</text><text x="40" y="100" style="font-size:20px;font-weight:400">Event → mechanism → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#24343a" stroke-width="2"/>
    <a href="https://history.state.gov/historicaldocuments/frus1951-54IranEd2/d216"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#287c78"/><text x="155" y="7" text-anchor="middle" class="white">Iran</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d8a53b" stroke="#24343a"/><text x="455" y="7" text-anchor="middle">Covert pressure</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#547fa5"/><text x="755" y="7" text-anchor="middle" class="white">TPAJAX records</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c85e4d"/><text x="1040" y="7" text-anchor="middle" class="white small">Motives layered</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#24343a" stroke-width="2"/>
