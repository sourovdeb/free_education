body{margin:0;background:#27343a;color:#f3e5c7;font:16px Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}canvas{width:100%;background:#f3e5c7;border:3px solid #f3e5c7}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}button{padding:9px 13px;border:0;background:#d6a13a;color:#27343a}input{flex:1}.objects{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.objects button{background:#237a78;color:white}.panel{border-left:5px solid #c95e4b;padding:8px 14px;background:#314048}.sources a{color:#f3cc70}.reduced canvas{display:none}.reduced .panel{font-size:18px}@media(prefers-reduced-motion:reduce){canvas{display:none}}</style></head><body><main class="wrap"><h1>Warnings, Waste, and Response</h1><canvas id="c" width="960" height="540" aria-label="Animated cut-paper causal scenes"></canvas><div class="controls"><button id="play">Pause</button><button id="back">Step back</button><button id="next">Step forward</button><button id="replay">Replay</button><input id="scrub" aria-label="Scene scrubber" type="range" min="0" max="180" step="0.04" value="0"><button id="motion">Reduced motion</button></div><div class="objects" id="objects"></div><article class="panel"><h2 id="title"></h2><p id="beat"></p><p id="fact"></p><p id="body"></p><div class="sources" id="sources"></div></article></main><script>const DATA={"title": "Warnings, Waste, and Response", "subtitle": "History Investigation — 28 September 2026, 07:00 Réunion", "palette": {"ink": "#27343a", "paper": "#f3e5c7", "teal": "#237a78", "coral": "#c95e4b", "gold": "#d6a13a", "blue": "#557fa1", "green": "#6f8959"}, "chapter_seconds": 30, "fps": 25, "cards": [{"id": "minamata-mercury", "title": "Minamata connected factory to fish", "question": "Why did proof lag?", "body": "**Documented fact.** Minamata disease surfaced during 1956. Fishing families developed neurological illness. Kumamoto researchers implicated seafood quickly. Cats reproduced similar symptoms. Organic mercury emerged during 1959. Chisso produced acetaldehyde nearby. Its process created methylmercury. Effluent entered Minamata Bay. Fish concentrated that pollutant. Residents then ate those fish. Chisso continued discharging wastewater. Production stopped during 1968. Government recognition followed that year. **Benefits claimed.** Acetaldehyde supported industrial growth. Chisso sustained local employment. Better testing required time. **Scholarly interpretation.** Uncertainty became institutional delay. Economic dependence narrowed official action. Company opposition slowed acceptance. Food-chain evidence changed toxicology. **Counterevidence and limits.** Early instruments had limits. Several toxins appeared possible. Researchers still identified seafood early. Fishing restrictions could reduce exposure. Exact victim totals remain contested. Certification rules exclude some claimants. Later recognition cannot erase uncertainty. It does establish causation. The pathway remains documented. Public trust collapsed.", "summary": "Effluent became food-chain poison.", "sources": [["Determination of the Cause", "https://nimd.env.go.jp/archives/english/minamata_disease_in_depth/cause_investigation/"], ["Minamata Disease: History and Measures", "https://www.env.go.jp/en/chemi/hs/minamata2002/ch2.html"], ["Minamata Disease: Summary", "https://www.env.go.jp/en/chemi/hs/minamata2002/summary.html"], ["Minamata Disease Review", "https://pubmed.ncbi.nlm.nih.gov/7734058/"]], "beats": ["Factory wastewater enters water.", "Fish concentrate methylmercury.", "Families eat contaminated fish.", "Research identifies the pathway.", "Recognition arrives after exposure."], "setting": "Minamata factory and bay", "objects": [{"kind": "factory", "label": "Chisso plant", "fact": "Acetaldehyde production created methylmercury.", "track": [[82, 205], [82, 205], [82, 205], [82, 205], [82, 205], [82, 205]], "from": 0}, {"kind": "drop", "label": "wastewater", "fact": "Factory effluent entered Minamata Bay.", "track": [[145, 192], [190, 205], [235, 218], [280, 230], [315, 235], [315, 235]], "from": 0}, {"kind": "fish", "label": "contaminated fish", "fact": "Fish concentrated methylmercury.", "track": [[315, 245], [350, 240], [390, 232], [430, 222], [470, 212], [490, 205]], "from": 1}, {"kind": "family", "label": "fishing family", "fact": "Residents ate contaminated seafood.", "track": [[565, 230], [540, 222], [515, 214], [490, 205], [455, 198], [430, 194]], "from": 2}, {"kind": "magnifier", "label": "research team", "fact": "Researchers traced the pathway.", "track": [[570, 100], [520, 110], [470, 122], [420, 138], [370, 155], [340, 175]], "from": 3}, {"kind": "warning", "label": "1968 recognition", "fact": "Government recognition came during 1968.", "track": [[585, 135], [585, 135], [585, 135], [540, 145], [495, 158], [450, 174]], "from": 4}], "word_count": 140}, {"id": "thalidomide-regulatory-barrier", "title": "Thalidomide met one regulatory barrier", "question": "What prevented wider harm?", "body": "**Documented fact.** Thalidomide spread during the 1950s. Many countries approved its sale. Pregnant patients received it. Severe birth defects followed. Thousands of children were affected. Merrell sought American approval. FDA reviewer Frances Kelsey objected. Safety evidence remained inadequate. Neuropathy reports increased concern. Kelsey requested stronger data. Approval never arrived. Yet investigational distribution still occurred. Some American pregnancies were exposed. Congress strengthened drug regulation afterward. **Benefits claimed.** Manufacturers promoted effective sedation. Nausea treatment promised relief. Later uses proved medically valuable. Thalidomide treats multiple myeloma. It also treats leprosy complications. **Scholarly interpretation.** Regulatory doubt prevented wider exposure. International tragedy changed evidence rules. Kelsey became its symbol. **Counterevidence and limits.** Kelsey never acted alone. FDA colleagues supported continued review. Existing law enabled repeated delays. European clinicians detected fetal harm. American exposure was not zero. Animal testing then remained limited. Modern surveillance still matters. The drug itself has benefits. Risk depends upon pregnancy. Strong controls remain essential.", "summary": "Skepticism blocked wider exposure.", "sources": [["Frances Oldham Kelsey", "https://www.fda.gov/about-fda/fda-history-exhibits/frances-oldham-kelsey-medical-reviewer-famous-averting-public-health-tragedy"], ["Thalidomide: Tragedy and Treatment", "https://pubmed.ncbi.nlm.nih.gov/21507989/"], ["The Rise, Fall, and Triumph", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3573415/"]], "beats": ["A sedative reaches patients.", "Pregnancy exposure causes harm.", "Kelsey demands stronger evidence.", "Approval stays blocked.", "Law strengthens after tragedy."], "setting": "Drug company and FDA desk", "objects": [{"kind": "pillfactory", "label": "manufacturer", "fact": "Merrell sought American approval.", "track": [[78, 210], [78, 210], [78, 210], [78, 210], [78, 210], [78, 210]], "from": 0}, {"kind": "prescription", "label": "thalidomide", "fact": "The drug reached pregnant patients abroad.", "track": [[145, 185], [205, 190], [265, 196], [325, 202], [385, 208], [430, 210]], "from": 0}, {"kind": "pregnant", "label": "pregnancy", "fact": "Prenatal exposure caused birth defects.", "track": [[535, 225], [515, 220], [490, 214], [465, 208], [440, 202], [420, 198]], "from": 1}, {"kind": "scientist", "label": "Kelsey", "fact": "Kelsey requested stronger safety data.", "track": [[565, 105], [520, 112], [475, 123], [430, 138], [385, 155], [350, 175]], "from": 2}, {"kind": "gate", "label": "approval barrier", "fact": "American approval never arrived.", "track": [[320, 265], [320, 240], [320, 215], [320, 190], [320, 165], [320, 150]], "from": 3}, {"kind": "gavel", "label": "stronger law", "fact": "Congress strengthened drug regulation.", "track": [[585, 120], [585, 120], [585, 120], [540, 130], [495, 145], [450, 165]], "from": 4}], "word_count": 153}, {"id": "great-smog-1952", "title": "Weather trapped London’s coal smoke", "question": "Was weather the cause?", "body": "**Documented fact.** London turned cold during 1952. Homes burned more coal. Factories also emitted pollution. An anticyclone created inversion. Warm air capped colder air. Smoke could not disperse. Fog droplets captured particles. Sulphur chemistry worsened toxicity. Visibility collapsed across London. Transport also stopped. Death registrations rose sharply. Officials counted roughly four thousand. Later estimates were higher. Exact totals remain uncertain. Parliament passed cleaner-air laws. The first arrived during 1956. Another followed during 1968. **Benefits claimed.** Coal supplied affordable warmth. Industry powered postwar recovery. Officials allowed adaptation time. **Scholarly interpretation.** Weather triggered the episode. Emissions supplied its lethal material. Policy converted disaster into prevention. **Counterevidence and limits.** Inversions are natural events. Continental pollution also contributed. Domestic smoke was not alone. Later death estimates use models. Causation therefore carries ranges. Cleaner heating also mattered. Legislation cannot claim everything. Yet later smogs stayed smaller. Meteorology explains the trap. It does not absolve emissions.", "summary": "Inversion converted smoke into crisis.", "sources": [["The Great Smog of 1952", "https://weather.metoffice.gov.uk/learn-about/weather/case-studies/great-smog"], ["Clean Air Bill: Policy Background", "https://publications.parliament.uk/pa/bills/lbill/58-03/005/5803005en03.htm"], ["State of the Environment: Air Quality", "https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/729820/State_of_the_environment_air_quality_report.pdf"]], "beats": ["London burns more coal.", "Warm air caps pollution.", "Smoke thickens the fog.", "Deaths reveal hidden exposure.", "Clean-air laws change fuel."], "setting": "London beneath inversion", "objects": [{"kind": "house", "label": "coal homes", "fact": "Homes burned more coal.", "track": [[80, 230], [105, 225], [130, 220], [155, 215], [180, 210], [200, 205]], "from": 0}, {"kind": "factory", "label": "factory smoke", "fact": "Factories added pollution.", "track": [[560, 225], [525, 220], [490, 215], [455, 210], [420, 205], [390, 200]], "from": 0}, {"kind": "ceiling", "label": "warm-air cap", "fact": "An inversion trapped colder air.", "track": [[320, 85], [320, 100], [320, 115], [320, 130], [320, 145], [320, 150]], "from": 1}, {"kind": "fumes", "label": "toxic smog", "fact": "Smoke and fog combined.", "track": [[115, 160], [190, 165], [265, 170], [340, 175], [415, 180], [500, 185]], "from": 2}, {"kind": "hospital", "label": "excess deaths", "fact": "Deaths rose during the episode.", "track": [[570, 105], [525, 115], [480, 130], [435, 145], [390, 160], [350, 175]], "from": 3}, {"kind": "document", "label": "Clean Air Act", "fact": "Parliament acted during 1956.", "track": [[580, 120], [580, 120], [580, 120], [535, 130], [490, 145], [445, 165]], "from": 4}], "word_count": 150}, {"id": "aberfan-tip-disaster", "title": "Aberfan exposed managed danger", "question": "What moved the mountain?", "body": "**Documented fact.** Coal waste accumulated above Aberfan. Seven tips covered the hillside. Tip Seven crossed known springs. Heavy rain saturated its spoil. The mass liquefied suddenly. It descended during October 1966. Pantglas school stood below. The slide killed 144 people. Children numbered 116 victims. Residents had raised concerns. Local knowledge identified water. Board systems failed upward. The official tribunal investigated. It blamed the Coal Board. The report called events preventable. **Benefits claimed.** Hillside tipping reduced transport. Mining supported regional livelihoods. Managers treated movement as manageable. **Scholarly interpretation.** Fragmented knowledge became negligence. Hierarchy separated warnings from power. Technical danger became institutional danger. **Counterevidence and limits.** Rain provided the trigger. Coal waste created exposure. Springs shaped the failure. No single employee designed everything. Responsibility remained organizational. Rescue conditions also mattered. Later memory emphasizes children. Adult victims also deserve notice. Geological explanation supports accountability. It does not replace it. The slide was physical. The disaster was governed.", "summary": "Saturated waste met ignored knowledge.", "sources": [["Aberfan Tribunal Report", "https://mineaccidents.com.au/uploads/aberfan-report-original.pdf"], ["Aberfan Landslide Case Study", "https://www.bgs.ac.uk/case-studies/aberfan-1966-landslide-case-study/"], ["National Archives: Aberfan", "https://www.nationalarchives.gov.uk/education/resources/sixties-britain/aberfan-disaster/"], ["National Library of Wales Records", "https://archives.library.wales/index.php/aberfan-parents-and-residents-association-records-2?sf_culture=en"]], "beats": ["Waste piles over springs.", "Rain saturates the tip.", "Spoil rushes downhill.", "School meets the slide.", "Inquiry assigns responsibility."], "setting": "Aberfan hillside and school", "objects": [{"kind": "tip", "label": "coal tip", "fact": "Tip Seven covered water-bearing ground.", "track": [[105, 155], [135, 165], [175, 180], [220, 198], [270, 215], [315, 230]], "from": 0}, {"kind": "water", "label": "hidden springs", "fact": "Water saturated the spoil.", "track": [[125, 105], [160, 125], [195, 145], [230, 165], [265, 185], [295, 210]], "from": 1}, {"kind": "slide", "label": "moving spoil", "fact": "Saturated spoil rushed downhill.", "track": [[160, 140], [220, 160], [285, 182], [350, 205], [415, 228], [470, 245]], "from": 2}, {"kind": "school", "label": "Pantglas school", "fact": "The school stood below.", "track": [[525, 235], [525, 235], [525, 235], [525, 235], [525, 235], [525, 235]], "from": 0}, {"kind": "group", "label": "resident warnings", "fact": "Residents had raised concerns.", "track": [[580, 105], [535, 115], [490, 130], [445, 145], [400, 160], [360, 175]], "from": 3}, {"kind": "gavel", "label": "tribunal finding", "fact": "The tribunal blamed the Coal Board.", "track": [[585, 135], [585, 135], [585, 135], [540, 145], [495, 160], [450, 180]], "from": 4}], "word_count": 154}, {"id": "love-canal-superfund", "title": "Love Canal changed waste law", "question": "What did residents prove?", "body": "**Documented fact.** Hooker buried chemical waste. Disposal ran through 1953. The company covered the canal. It sold land cheaply. Homes then surrounded the site. A school also opened. Heavy rain raised groundwater. Chemicals reached yards and basements. Residents documented odors and illness. Lois Gibbs organized neighbors. State action began during 1978. Federal emergencies followed twice. Roughly 950 families relocated. Congress created Superfund during 1980. Cleanup then contained the landfill. **Benefits claimed.** Burial matched earlier practice. Land transfer enabled public construction. Officials promised targeted relocation. **Scholarly interpretation.** Resident evidence shifted governance. Visible leakage made risk legible. Love Canal nationalized waste policy. **Counterevidence and limits.** Contamination itself is established. Individual disease attribution differs. Early health studies faced criticism. Sample sizes stayed limited. Comparison groups caused disputes. Some nearby areas became livable. Later studies found mixed results. Precaution still had justification. Exposure pathways were credible. Waiting demanded stronger proof. Residents bore that risk.", "summary": "Resident evidence changed waste governance.", "sources": [["The Love Canal Tragedy", "https://www.epa.gov/archive/epa/aboutepa/love-canal-tragedy.html"], ["Environmental Monitoring Review", "https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9100WNYH.TXT"], ["Love Canal Superfund Profile", "https://cumulis.epa.gov/supercpad/SiteProfiles/index.cfm?fuseaction=second.cleanup&id=0201290"], ["Health Near Waste Landfills", "https://www.epa.gov/sites/default/files/2014-03/documents/health_effects_of_residence_near_hazardous_waste_landfill_sites_3v.pdf"]], "beats": ["Barrels fill the canal.", "Homes cover buried waste.", "Rain carries chemicals outward.", "Residents organize evidence.", "Superfund changes responsibility."], "setting": "Love Canal neighborhood", "objects": [{"kind": "barrel", "label": "chemical waste", "fact": "Hooker buried chemical waste.", "track": [[85, 235], [135, 232], [185, 228], [235, 224], [285, 220], [315, 218]], "from": 0}, {"kind": "land", "label": "covered canal", "fact": "The landfill was covered.", "track": [[315, 245], [315, 235], [315, 225], [315, 215], [315, 205], [315, 195]], "from": 0}, {"kind": "house", "label": "new homes", "fact": "Homes surrounded the site.", "track": [[560, 230], [520, 225], [480, 220], [440, 215], [400, 210], [365, 205]], "from": 1}, {"kind": "drop", "label": "leaching chemicals", "fact": "Groundwater moved chemicals outward.", "track": [[320, 135], [350, 150], [385, 168], [420, 185], [455, 205], [485, 225]], "from": 2}, {"kind": "group", "label": "resident group", "fact": "Residents organized neighborhood evidence.", "track": [[585, 110], [535, 120], [485, 135], [435, 150], [385, 165], [350, 180]], "from": 3}, {"kind": "document", "label": "Superfund law", "fact": "Congress created Superfund.", "track": [[585, 130], [585, 130], [585, 130], [540, 140], [495, 155], [450, 175]], "from": 4}], "word_count": 150}, {"id": "primitive-echo-ostracism", "title": "Primitive Echo: exclusion pressure", "question": "Why does exclusion sting?", "body": "**Documented evidence.** Ostracism threatens basic social needs. Experiments show rapid distress. Brief exclusion can suffice. People report reduced belonging. Control also feels weaker. Self-esteem can fall. Meaning can feel threatened. Everyday studies show varied responses. Mild threats encourage reconnection. Severe threats encourage withdrawal. Antisocial intentions can also rise. Behavior depends upon context. **Evolutionary interpretation.** Ancestral groups supplied protection. Groups also shared food. Exclusion could threaten survival. Sensitivity may therefore persist. This remains an inference. Experiments cannot observe ancestry. **Current echo.** Group chats reproduce exclusion. Workplaces use silent avoidance. Online metrics expose rejection. People may conform afterward. Others may attack instead. **Benefits.** Sensitivity can repair bonds. It can reinforce cooperation. **Harms.** Manipulators can exploit belonging. Groups can silence dissent. Rejected people may disengage. **Counterevidence and limits.** Laboratory games are artificial. Cultural norms alter responses. Personality also changes reactions. Distress proves no adaptation. Evolution explains possibilities. It does not excuse cruelty.", "summary": "Exclusion can trigger repair.", "sources": [["Ostracism Across Contexts", "https://www.nature.com/articles/s44159-024-00393-y"], ["Ostracism in Everyday Life", "https://pubmed.ncbi.nlm.nih.gov/39172433/"], ["Evolution of Social Exclusion", "https://pmc.ncbi.nlm.nih.gov/articles/PMC3574310/"], ["Ostracism and Social Isolation", "https://pubmed.ncbi.nlm.nih.gov/35662059/"]], "beats": ["A group shares resources.", "One member gets excluded.", "Belonging needs activate.", "Repair or aggression follows.", "Context changes the response."], "setting": "Shared circle and closed gate", "objects": [{"kind": "group", "label": "social group", "fact": "Groups provide belonging.", "track": [[135, 220], [175, 215], [215, 210], [250, 205], [275, 202], [290, 200]], "from": 0}, {"kind": "stranger", "label": "excluded member", "fact": "Brief exclusion can cause distress.", "track": [[520, 225], [500, 220], [480, 215], [460, 210], [440, 205], [425, 200]], "from": 1}, {"kind": "gate", "label": "closed access", "fact": "Exclusion threatens belonging.", "track": [[320, 260], [320, 235], [320, 210], [320, 185], [320, 160], [320, 145]], "from": 1}, {"kind": "return", "label": "reconnection", "fact": "Mild threat can encourage repair.", "track": [[565, 105], [520, 115], [475, 128], [430, 142], [385, 160], [350, 178]], "from": 2}, {"kind": "warning", "label": "aggression risk", "fact": "Severe threat can increase hostility.", "track": [[575, 130], [575, 130], [575, 130], [530, 140], [485, 155], [440, 175]], "from": 3}, {"kind": "balance", "label": "context", "fact": "Context changes the response.", "track": [[320, 90], [320, 90], [320, 90], [360, 100], [405, 115], [450, 135]], "from": 4}], "word_count": 149}]};const C=document.querySelector('#c'),x=C.getContext('2d'),scrub=document.querySelector('#scrub');let t=0,playing=true,last=performance.now(),reduced=false;const P=DATA.palette;function ease(v){return v*v*(3-2*v)}function interp(track,p){let k=Math.min(4,Math.floor(p*5)),q=ease(p*5-k),a=track[k],b=track[k+1];return[a[0]+(b[0]-a[0])*q,a[1]+(b[1]-a[1])*q]}function paper(px,py,w,h,col){x.fillStyle='#9f927b';x.fillRect(px+7,py+8,w,h);x.fillStyle=col;x.strokeStyle=P.ink;x.lineWidth=3;x.fillRect(px,py,w,h);x.strokeRect(px,py,w,h)}function person(){x.fillStyle=P.gold;x.beginPath();x.arc(0,-28,16,0,7);x.fill();x.stroke();paper(-18,-8,36,50,P.blue)}function draw(o,p){let[a,b]=interp(o.track,p);x.save();x.translate(a*1.5,b*1.5);x.fillStyle=P.gold;x.strokeStyle=P.ink;x.lineWidth=3;if(o.kind==='ship'){x.fillStyle=P.coral;x.beginPath();x.moveTo(-55,0);x.lineTo(55,0);x.lineTo(38,28);x.lineTo(-38,28);x.closePath();x.fill();x.stroke();paper(-24,-34,48,34,P.paper);x.beginPath();x.moveTo(2,-65);x.lineTo(38,-42);x.lineTo(2,-25);x.closePath();x.fillStyle=P.gold;x.fill();x.stroke()}else if(o.kind==='missile'){x.beginPath();x.moveTo(0,-55);x.lineTo(16,-24);x.lineTo(16,34);x.lineTo(0,52);x.lineTo(-16,34);x.lineTo(-16,-24);x.closePath();x.fillStyle=P.coral;x.fill();x.stroke()}else if(o.kind==='rubber'){paper(-38,-18,76,44,P.gold);for(let i=-1;i<2;i++){x.beginPath();x.arc(i*22,-23,9,0,7);x.fillStyle=P.blue;x.fill();x.stroke()}}else if(o.kind==='group'){x.save();x.translate(-24,0);person();x.restore();x.save();x.translate(24,0);person();x.restore()}else if(['coin','seed','gift','return'].includes(o.kind)){x.beginPath();x.arc(0,0,20,0,7);x.fill();x.stroke()}else if(['portrait','scientist','worker','child','giver','receiver','patient'].includes(o.kind)){person()}else{paper(-34,-27,68,54,['foundation','company','factory','bank','agency','trust'].includes(o.kind)?P.teal:P.paper)}x.fillStyle=P.ink;x.font='bold 14px Arial';x.textAlign='center';x.fillText(o.label,0,56);x.restore()}function render(){let ci=Math.min(5,Math.floor(t/30)),local=t-ci*30,p=local/30,c=DATA.cards[ci];x.fillStyle=P.paper;x.fillRect(0,0,C.width,C.height);x.fillStyle=ci%2?'#e4dccf':'#dce6dd';x.fillRect(0,76,C.width,390);x.fillStyle=P.ink;x.fillRect(0,0,C.width,72);x.fillRect(0,468,C.width,72);x.fillStyle=P.paper;x.font='bold 26px Arial';x.textAlign='left';x.fillText((ci+1).toString().padStart(2,'0')+'  '+c.title.toUpperCase(),26,45);for(const o of c.objects)if(local>=o.from*6)draw(o,p);let beat=Math.min(4,Math.floor(local/6));x.fillStyle=P.paper;x.font='bold 28px Arial';x.fillText(c.beats[beat],26,512);document.querySelector('#title').textContent=c.title;document.querySelector('#beat').textContent=c.beats[beat];document.querySelector('#fact').textContent=c.summary;document.querySelector('#body').textContent=reduced?c.body.replaceAll('**',''):'';document.querySelector('#sources').innerHTML=c.sources.map(s=>`<a href="${s[1]}">${s[0]}</a>`).join(' · ');document.querySelector('#objects').innerHTML=c.objects.map((o,i)=>`<button data-i="${i}">${o.label}</button>`).join('');document.querySelectorAll('#objects button').forEach(b=>b.onclick=()=>document.querySelector('#fact').textContent=c.objects[+b.dataset.i].fact);scrub.value=t}function loop(now){if(playing&&!reduced)t=(t+(now-last)/1000)%180;last=now;render();requestAnimationFrame(loop)}document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};document.querySelector('#back').onclick=()=>{playing=false;t=Math.max(0,t-1);render()};document.querySelector('#next').onclick=()=>{playing=false;t=Math.min(179.96,t+1);render()};document.querySelector('#replay').onclick=()=>{t=Math.floor(t/30)*30;playing=true};document.querySelector('#motion').onclick=()=>{reduced=!reduced;document.body.classList.toggle('reduced',reduced);playing=!reduced;render()};scrub.oninput=e=>{playing=false;t=+e.target.value;render()};requestAnimationFrame(loop)</script></body></html>
