<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Warnings, waste, and response evidence ladder</title>
<desc id="desc">Six rows connect hazards, decisive evidence, and limits. Each case label links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c95e4b"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#27343a}.white{fill:#f3e5c7}.small{font-size:16px}.arrow{stroke:#c95e4b;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f3e5c7"/><text x="40" y="64" style="font-size:42px">Warnings, Waste, and Response</text><text x="40" y="100" style="font-size:20px;font-weight:400">Hazard → mechanism → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27343a" stroke-width="2"/>
    <a href="https://nimd.env.go.jp/archives/english/minamata_disease_in_depth/cause_investigation/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Minamata</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Food-chain poison</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Fish and effluent</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Counts disputed</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27343a" stroke-width="2"/>
    <a href="https://www.fda.gov/about-fda/fda-history-exhibits/frances-oldham-kelsey-medical-reviewer-famous-averting-public-health-tragedy"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Thalidomide</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Approval barrier</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Safety dossier</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Exposure not zero</text>
  </g>
  <g transform="translate(0,385)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27343a" stroke-width="2"/>
    <a href="https://weather.metoffice.gov.uk/learn-about/weather/case-studies/great-smog"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Great Smog</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Inversion trap</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Deaths and emissions</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Totals modeled</text>
  </g>
  <g transform="translate(0,485)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27343a" stroke-width="2"/>
    <a href="https://mineaccidents.com.au/uploads/aberfan-report-original.pdf"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Aberfan</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Saturated spoil</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Tribunal record</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Triggers layered</text>
  </g>
  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#27343a" stroke-width="2"/>
    <a href="https://www.epa.gov/archive/epa/aboutepa/love-canal-tragedy.html"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Love Canal</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Chemical migration</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Monitoring record</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Health data mixed</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#27343a" stroke-width="2"/>
    <a href="https://www.nature.com/articles/s44159-024-00393-y"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#237a78"/><text x="155" y="7" text-anchor="middle" class="white">Exclusion</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d6a13a" stroke="#27343a"/><text x="455" y="7" text-anchor="middle">Belonging threat</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#557fa1"/><text x="755" y="7" text-anchor="middle" class="white">Behavior studies</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c95e4b"/><text x="1040" y="7" text-anchor="middle" class="white small">Evolution inferred</text>
  </g>
</svg>