ce replaced founder control. **Harms and risks.** Selection concentrated large resources. Unsuccessful papers also increased. Early governance drew tax questions. **Counterevidence and limits.** Records show legitimate research. Courts upheld charitable status. Aircraft was later separated. No defense steering appears. The comparison lacked random assignment. Selected scientists were exceptional. Statistical matching cannot remove everything. HHMI caused no discovery alone. Its incentives changed risk-taking.", "summary": "Aircraft proceeds enlarged HHMI. Flexible funding changed risk-taking.", "sources": [["HHMI: Purnell Choppin Memorial", "https://www.hhmi.org/news/memoriam-purnell-w-choppin-former-president-hhmi"], ["Incentives and Creativity", "https://onlinelibrary.wiley.com/doi/10.1111/j.1756-2171.2011.00140.x"], ["Hughes Investigation Records", "https://www.archives.gov/research/investigations/watergate/hughes-investigation.html"], ["Wier v. HHMI", "https://openjurist.org/407/a2d/1051/wier-v-howard-hughes-medical-institute-1911266"]], "beats": ["Aircraft funds sit enclosed.", "Trustees sell the company.", "Endowment reaches researchers.", "Flexible support permits failure.", "Breakthroughs and misses increase."], "setting": "Aircraft hangar and laboratory", "objects": [{"kind": "factory", "label": "Hughes Aircraft", "fact": "HHMI owned Hughes Aircraft.", "track": [[72, 220], [72, 220], [72, 220], [72, 220], [72, 220], [72, 220]], "from": 0}, {"kind": "lock", "label": "old structure", "fact": "Tax scrutiny followed ownership.", "track": [[155, 195], [155, 195], [155, 195], [155, 195], [155, 195], [155, 195]], "from": 0}, {"kind": "coin", "label": "sale proceeds", "fact": "The 1985 sale transformed funding.", "track": [[110, 120], [215, 125], [300, 145], [300, 145], [300, 145], [300, 145]], "from": 1}, {"kind": "scientist", "label": "investigator", "fact": "HHMI funded selected scientists.", "track": [[340, 230], [340, 230], [405, 215], [455, 200], [455, 200],  fact.** Roche sponsored oseltamivir trials. Governments later stockpiled Tamiflu. Published reports remained incomplete. Published summaries guided policy. Reviewers requested full reports. Access took several years. Cochrane examined regulatory files. Their review covered twenty trials. Oseltamivir shortened symptoms modestly. Hospitalizations did not decrease. Complication reporting remained unreliable. Several harms appeared increased. EMA still judged benefits favorable. It maintains authorization today. **Benefits.** Tamiflu treats influenza symptoms. Prophylaxis reduced symptomatic influenza. Full reports enabled stronger review. The campaign improved transparency. **Scholarly interpretation.** Data availability changed confidence. Publication summaries hid methodological detail. Stockpiling exceeded proven outcomes. **Harms and risks.** Governments spent billions globally. Harms were underreported initially. **Counterevidence and limits.** Regulators had confidential data. Later meta-analysis found benefits. Epidemic decisions used uncertainty. Trials rarely measured severe outcomes. No review proves uselessness. Evidence supports modest symptom relief. It weakens broader claims. Transparency changed interpretation most.", "summary": "Full reports showed modest benefits. Broader claims weakened.", "sources": [["Cochrane Regulatory Review", "https://www.cochrane.org/evidence/CD008965_regulatory-information-trials-oseltamivir-tamiflu-and-zanamivir-relenza-influenza-adults-and"], ["BMJ Oseltamivir Review", "https://www.bmj.com/content/348/bmj.g2545"], ["EMA Tamiflu Assessment", "https://www.ema.europa.eu/en/medicines/human/EPAR/tamiflu"], ["Roche Data Sharing", "https://www.roche.com/innovation/clinical-trials/data-sharing"]], "beats": ["Roche runs influenza trials.", "Governments build drug stockpiles.", "Reviewers seek full reports.", "Hidden detail changes estimates.", "Modest benefits remain."], "setting": "Drug warehouse and review desk", "objects": [{"kin e changes recognition rules. Some grand gestures backfire. Observers may suspect strategy. Costly signaling predicts incentives. It proves no conscious motive. Governance determines public benefit.", "summary": "Visible generosity signals resources. Governance shapes resulting benefits.", "sources": [["Cooperation for Reputation", "https://journals.sagepub.com/doi/10.1177/1368430209342258"], ["Does Observability Affect Prosociality?", "https://pmc.ncbi.nlm.nih.gov/articles/PMC5897647/"], ["The Social Significance of Subtle Signals", "https://pubmed.ncbi.nlm.nih.gov/31097793/"], ["When Tainted Money Funds Public Goods", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10531110/"]], "beats": ["A donor offers resources.", "An audience sees sacrifice.", "Prestige follows the gift.", "Institutions preserve the name.", "Governance tests public value."], "setting": "Public ceremony and institute", "objects": [{"kind": "giver", "label": "donor", "fact": "Giving can signal resources.", "track": [[82, 220], [82, 220], [82, 220], [82, 220], [82, 220], [82, 220]], "from": 0}, {"kind": "gift", "label": "public gift", "fact": "Visible gifts gain attention.", "track": [[125, 175], [220, 170], [300, 175], [300, 175], [300, 175], [300, 175]], "from": 0}, {"kind": "receiver", "label": "institution", "fact": "Institutions receive resources.", "track": [[325, 225], [325, 225], [325, 225], [325, 225], [325, 225], [325, 225]], "from": 0}, {"kind": "portrait", "label": "audience", "fact": "Observers update reputation.", "track": [[575, 235], [540, 225], [500, 215], [465, 205], [465, 205], [465, 205]], "from": 1}, {"kind": "trust", "label": "prestige", "fact": "Prestige can reward cooperation.", "track": [[575, 105], [575, 105], [535, 120], [495, 140], [455, 160], [455, 160]], "from": 2}, {"kind": "university", "label": "named institute", "fact": "Names preserve donor identity.", "track": [[580, 245], [580, 245], [580, 245], [545, 225], [505, 210], [470, 200]], "from": 3}, {"kind": "magnifier", "
