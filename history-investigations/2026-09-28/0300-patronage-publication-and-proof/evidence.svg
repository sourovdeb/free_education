<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Funding pathways and evidence checks</title><desc id="desc">Six clickable rows connect patrons or companies to institutions, research mechanisms, and evidence limits.</desc><rect width="900" height="640" fill="#f4ead2"/><style>text{font-family:Arial,sans-serif;fill:#25323a}.head{font-weight:700;font-size:34px}.label{font-weight:700;font-size:18px;fill:white}.small{font-size:16px}path{stroke:#25323a;stroke-width:5;fill:none}rect{stroke:#25323a;stroke-width:2}a:focus g{outline:4px solid #c95f4a}</style><text x="45" y="58" class="head">Follow money through mechanisms</text><text x="45" y="88" class="small">Select any row. Open its source.</text><a href="https://www.solvay.com/en/history/1885-1914" target="_blank"><g tabindex="0"><rect x="45" y="112" width="210" height="50" rx="3" fill="#2d6f73"/><text x="60" y="144" class="label">Tata → IISc</text><path d="M270 137 H430"/><circle cx="455" cy="137" r="16" fill="#2d6f73"/><path d="M475 137 H620"/><rect x="635" y="112" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="143" class="small">endowment + state</text></g></a><a href="https://www.hhmi.org/news/memoriam-purnell-w-choppin-former-president-hhmi" target="_blank"><g tabindex="0"><rect x="45" y="190" width="210" height="50" rx="3" fill="#70875b"/><text x="60" y="222" class="label">Ford → crops</text><path d="M270 215 H430"/><circle cx="455" cy="215" r="16" fill="#70875b"/><path d="M475 215 H620"/><rect x="635" y="190" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="221" class="small">grants + policy</text></g></a><a href="https://www.bmj.com/content/351/bmj.h4320" target="_blank"><g tabindex="0"><rect x="45" y="268" width="210" height="50" rx="3" fill="#d8a33b"/><text x="60" y="300" class="label">Mellon → contracts</text><path d="M270 293 H430"/><circle cx="455" cy="293" r="16" fill="#d8a33b"/><path d="M475 293 H620"/><rect x="635" y="268" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="299" class="small">sponsor ownership</text></g></a><a href="https://www.cochrane.org/evidence/CD008965_regulatory-information-trials-oseltamivir-tamiflu-and-zanamivir-relenza-influenza-adults-and" target="_blank"><g tabindex="0"><rect x="45" y="346" width="210" height="50" rx="3" fill="#517b9f"/><text x="60" y="378" class="label">Lead → thresholds</text><path d="M270 371 H430"/><circle cx="455" cy="371" r="16" fill="#517b9f"/><path d="M475 371 H620"/><rect x="635" y="346" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="377" class="small">funding + proof burden</text></g></a><a href="https://www.nejm.org/doi/full/10.1056/NEJMsa0906126" target="_blank"><g tabindex="0"><rect x="45" y="424" width="210" height="50" rx="3" fill="#c95f4a"/><text x="60" y="456" class="label">Atrazine → conclusions</text><path d="M270 449 H430"/><circle cx="455" cy="449" r="16" fill="#c95f4a"/><path d="M475 449 H620"/><rect x="635" y="424" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="455" class="small">design + interpretation</text></g></a><a href="https://journals.sagepub.com/doi/10.1177/1368430209342258" target="_blank"><g tabindex="0"><rect x="45" y="502" width="210" height="50" rx="3" fill="#2d6f73"/><text x="60" y="534" class="label">Gifts → reciprocity</text><path d="M270 527 H430"/><circle cx="455" cy="527" r="16" fill="#2d6f73"/><path d="M475 527 H620"/><rect x="635" y="502" width="220" height="50" rx="3" fill="#f4ead2"/><text x="650" y="533" class="small">favor + obligation</text></g></a><text x="45" y="610" class="small">Arrows show pathways. They do not prove causation.</text></svg>