    <a href="https://patents.google.com/patent/US2292387A/en"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Lamarr</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Synchronized hopping</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Patent record</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Lineage disputed</text>
  </g>
  <g transform="translate(0,585)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28333c" stroke-width="2"/>
    <a href="https://www.kcl.ac.uk/the-story-behind-photograph-51"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Franklin</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Diffraction plus model</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Three papers</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">One image insufficient</text>
  </g>
  <g transform="translate(0,685)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#28333c" stroke-width="2"/>
    <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4633846/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Leadership</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Focal coordination</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Field studies</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Adaptation unproven</text>
