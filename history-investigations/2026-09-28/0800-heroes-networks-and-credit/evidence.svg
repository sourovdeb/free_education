<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Heroes, networks, and credit evidence ladder</title>
<desc id="desc">Six rows connect visible people, shared mechanisms, evidence, and limits. Each case links to a direct source.</desc>
<defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c5604f"/></marker><filter id="shadow"><feDropShadow dx="4" dy="5" stdDeviation="1" flood-color="#8f836d" flood-opacity=".5"/></filter></defs>
<style>text{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#28333c}.white{fill:#f2e8cf}.small{font-size:16px}.arrow{stroke:#c5604f;stroke-width:5;marker-end:url(#tip)}rect{filter:url(#shadow)}</style>
<rect width="1200" height="840" fill="#f2e8cf"/><text x="40" y="64" style="font-size:42px">Heroes, Networks, and Credit</text><text x="40" y="100" style="font-size:20px;font-weight:400">Person → network → evidence → limit</text>
<text x="155" y="142" text-anchor="middle" class="small">CASE</text><text x="455" y="142" text-anchor="middle" class="small">MECHANISM</text><text x="755" y="142" text-anchor="middle" class="small">DECISIVE EVIDENCE</text><text x="1040" y="142" text-anchor="middle" class="small">LIMIT</text>

  <g transform="translate(0,185)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28333c" stroke-width="2"/>
    <a href="https://www.nps.gov/articles/000/places-of-rosa-parks.htm"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Parks</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Prepared network</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Archives and law</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">No staged arrest</text>
  </g>
  <g transform="translate(0,285)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#e5ddd0" stroke="#28333c" stroke-width="2"/>
    <a href="https://ahf.nuclearmuseum.org/ahf/key-documents/einstein-szilard-letter/"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Einstein</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Authority signal</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Letter and program</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">Not sufficient</text>
  </g>
  <g transform="translate(0,385)">
    <rect x="40" y="-38" width="1120" height="78" rx="4" fill="#dce6dd" stroke="#28333c" stroke-width="2"/>
    <a href="https://www.sciencemuseum.org.uk/objects-and-stories/women-computing"><rect x="60" y="-24" width="190" height="50" rx="3" fill="#327c78"/><text x="155" y="7" text-anchor="middle" class="white">Lovelace</text></a>
    <path d="M260 1 H350" class="arrow"/><rect x="360" y="-24" width="190" height="50" rx="3" fill="#d3a13d" stroke="#28333c"/><text x="455" y="7" text-anchor="middle">Published sequence</text>
    <path d="M560 1 H650" class="arrow"/><rect x="660" y="-24" width="190" height="50" rx="3" fill="#567da0"/><text x="755" y="7" text-anchor="middle" class="white">Notes and engine</text>
    <path d="M860 1 H930" class="arrow"/><rect x="940" y="-24" width="200" height="50" rx="3" fill="#c5604f"/><text x="1040" y="7" text-anchor="middle" class="white small">First is defined</text>
  </g>
  <g transform="translate(0,485)">
