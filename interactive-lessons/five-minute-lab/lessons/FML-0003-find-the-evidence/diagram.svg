<text x="120" y="100" font-size="21" font-weight="700">QUESTION</text><text x="120" y="278" font-size="18">Where should you wait?</text>
<text x="340" y="100" font-size="21" font-weight="700">SCAN</text><text x="340" y="278" font-size="18">look for gate</text>
<text x="558" y="100" font-size="21" font-weight="700">EVIDENCE</text><text x="558" y="278" font-size="18">Gate B, not Gate A</text>
<text x="778" y="100" font-size="21" font-weight="700">ANSWER</text><text x="778" y="278" font-size="18">Gate B</text>
<text x="450" y="345" font-size="22">Copy the smallest complete line that proves the answer.</text>
