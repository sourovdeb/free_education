<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FML-0027 scene visualizer</title><style>*{box-sizing:border-box}body{margin:0;background:#FFF7E8;color:#12263A;font:18px/1.5 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:20px}#stage{position:relative;aspect-ratio:16/9;border:4px solid #12263A;overflow:hidden;background:white}#stage img{width:100%;height:100%;object-fit:cover}#caption{position:absolute;left:3%;right:3%;bottom:4%;padding:12px 18px;background:#12263A;color:#FFF7E8;font-weight:800}button{min-height:48px;padding:10px 18px;border:3px solid #12263A;background:white;font:inherit;font-weight:800}button:focus-visible{outline:5px solid #E9C46A}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.motion #stage img{animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px) rotate(.3deg)}}@media(prefers-reduced-motion:reduce){.motion #stage img{animation:none}}</style></head><body><main><h1>Which Platform Changed?</h1><p>Offline scene visualizer.</p><div id="stage"><img id="image" src="scene-1.png" alt="Scene one"><div id="caption"></div></div><div class="controls"><button id="prev">Previous</button><button id="play">Play</button><button id="next">Next</button><button id="replay">Replay</button><button id="motion">Reduced motion</button></div><p id="cue"></p><script>const scenes=[{"id": 1, "caption": "Match destination and train.", "motion": "The destination card slides into the station board. The train arrives beside it."}, {"id": 2, "caption": "Find today's exception.", "motion": "Platform 2 folds away. A today-only strip reveals platform 5."}, {"id": 3, "caption": "Separate platform from time.", "motion": "The platform sign moves left. Two clocks move onto boarding and departure tracks."}, {"id": 4, "caption": "State the current details.", "motion": "The train moves toward platform 5. A summary ticket unfolds with both times."}];let i=0,t=null,moving=true;const image=document.getElementById('image'),caption=document.getElementById('caption'),cue=document.getElementById('cue');function show(n){i=(n+scenes.length)%scenes.length;image.src='scene-'+(i+1)+'.png';image.alt='Scene '+(i+1)+': '+scenes[i].caption;caption.textContent=scenes[i].caption;cue.textContent='Motion cue: '+scenes[i].motion;}function stop(){clearInterval(t);t=null;document.getElementById('play').textContent='Play'}function play(){if(t){stop();return};document.getElementById('play').textContent='Pause';t=setInterval(()=>show(i+1),2500)}document.getElementById('prev').onclick=()=>{stop();show(i-1)};document.getElementById('next').onclick=()=>{stop();show(i+1)};document.getElementById('play').onclick=play;document.getElementById('replay').onclick=()=>{stop();show(0)};document.getElementById('motion').onclick=()=>{moving=!moving;document.body.classList.toggle('motion',moving);document.getElementById('motion').textContent=moving?'Reduced motion':'Enable motion'};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')document.getElementById('prev').click();if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key===' '){e.preventDefault();play()}});document.body.classList.add('motion');show(0);</script></main></body></html>
