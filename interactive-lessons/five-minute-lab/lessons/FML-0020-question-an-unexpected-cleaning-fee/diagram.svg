<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" role="img" aria-label="A colourful layered papercut evidence path. A booking confirmation says cleaning included and €210. A checkout bill adds a €35 cleaning fee and totals €245. Arrows lead to ask why, request a check, remove the fee if included, and confirm €210."><defs><filter id="s"><feDropShadow dx="7" dy="7" stdDeviation="1" flood-color="#A39272"/></filter><pattern id="p" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M2 4h6M9 12h5" stroke="#E5D2A6"/></pattern></defs><rect width="780" height="310" fill="#FFF3D9"/><rect width="780" height="310" fill="url(#p)" opacity=".3"/><g font-family="system-ui,sans-serif" font-size="18" fill="#21304A"><g filter="url(#s)"><rect x="28" y="90" width="165" height="150" rx="12" fill="#F2BD4B" stroke="#18324A" stroke-width="3"/><text x="44" y="130" font-weight="800">1  TERM</text><text x="44" y="175">cleaning included</text></g><path d="M193 165h25" stroke="#18324A" stroke-width="7"/><path d="m213 153 14 12-14 12" fill="#18324A"/><g filter="url(#s)"><rect x="218" y="90" width="165" height="150" rx="12" fill="#E96B67" stroke="#18324A" stroke-width="3"/><text x="234" y="130" font-weight="800">2  FEE</text><text x="234" y="175">€35 added</text></g><path d="M383 165h25" stroke="#18324A" stroke-width="7"/><path d="m403 153 14 12-14 12" fill="#18324A"/><g filter="url(#s)"><rect x="408" y="90" width="165" height="150" rx="12" fill="#9A86D7" stroke="#18324A" stroke-width="3"/><text x="424" y="130" font-weight="800">3  ASK</text><text x="424" y="175">why + check</text></g><path d="M573 165h25" stroke="#18324A" stroke-width="7"/><path d="m593 153 14 12-14 12" fill="#18324A"/><g filter="url(#s)"><rect x="598" y="90" width="165" height="150" rx="12" fill="#37A6A0" stroke="#18324A" stroke-width="3"/><text x="614" y="130" font-weight="800">4  CONFIRM</text><text x="614" y="175">new total €210</text></g><text x="28" y="48" font-size="28" font-weight="800">TERM. FEE. 