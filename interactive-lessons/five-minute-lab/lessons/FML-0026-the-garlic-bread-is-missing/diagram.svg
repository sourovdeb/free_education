<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">Four-step missing item report</title><desc id="desc">Four layered paper cards connect receipt evidence to a missing garlic bread label, then branch toward replacement or refund, and finish at confirmation.</desc><defs><pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#12263A" opacity=".08"/><circle cx="13" cy="11" r=".8" fill="#12263A" opacity=".07"/></pattern><style>.label{font:700 30px system-ui,sans-serif;fill:#FFF7E8}.sub{font:700 19px system-ui,sans-serif;fill:#FFF7E8}.num{font:700 24px system-ui,sans-serif;fill:#12263A}</style></defs><rect width="1280" height="440" fill="#FFF7E8"/><rect width="1280" height="440" fill="url(#grain)"/><text x="45" y="62" style="font:700 34px system-ui,sans-serif;fill:#12263A">Resolve a missing item</text><g><rect x="54" y="119" width="245" height="210" rx="24" fill="#12263A" opacity=".22"/><rect x="45" y="110" width="245" height="210" rx="24" fill="#E76F51" stroke="#12263A" stroke-width="5"/><circle cx="93" cy="158" r="25" fill="#FFF7E8"/><text x="93" y="168" text-anchor="middle" class="num">1</text><text x="167" y="235" text-anchor="middle" class="label">CHECK</text><text x="167" y="277" text-anchor="middle" class="sub">EVIDENCE</text></g><path d="M 299 215 H 331" stroke="#12263A" stroke-width="9" stroke-linecap="round"/><path d="M 321 202 L 335 215 L 321 228" fill="none" stroke="#12263A" stroke-width="7"/><g><rect x="349" y="119" width="245" height="210" rx="24" fill="#12263A" opacity=".22"/><rect x="340" y="110" width="245" height="210" rx="24" fill="#2A9D8F" stroke="#12263A" stroke-width="5"/><circle cx="388" cy="158" r="25" fill="#FFF7E8"/><text x="388" y="168" text-anchor="middle" class="num">2</text><text x="462" y="235" text-anchor="middle" class="label">NAME</text><text x="462" y="277" text-anchor="middle" class="sub">MISSING ITEM</text></g><path d="M 594 215 H 626" stroke="#12263A" stroke-width="9" stroke-linecap="round"/><path d="M 616 202 L 630 215 L 616 228" fill="none" stroke="#12263A" stroke-width="7"/><g><rect x="644" y="119" width="245" height="210" rx="24" fill="#12263A" opacity=".22"/><rect x="635" y="110" width="245" height="210" rx="24" fill="#E9C46A" stroke="#12263A" stroke-width="5"/><circle cx="683" cy="158" r="25" fill="#FFF7E8"/><text x="683" y="168" text-anchor="middle" class="num">3</text><text x="757" y="235" text-anchor="middle" class="label">CHOOSE</text><text x="757" y="277" text-anchor="middle" class="sub">OUTCOME</text></g><path d="M 889 215 H 921" stroke="#12263A" stroke-width="9" stroke-linecap="round"/><path d="M 911 202 L 925 215 L 911 228" fill="none" stroke="#12263A" stroke-width="7"/><g><rect x="939" y="119" width="245" height="210" rx="24" fill="#12263A" opacity=".22"/><rect x="930" y="110" width="245" height="210" rx="24" fill="#6D5BD0" stroke="#12263A" stroke-width="5"/><circle cx="978" cy="158" r="25" fill="#FFF7E8"/><text x="978" y="168" text-anchor="middle" class="num">4</text><text x="1052" y="235" text-anchor="middle" class="label">CONFIRM</text><text x="1052" y="277" text-anchor="middle" class="sub">DETAILS</text></g></svg>
