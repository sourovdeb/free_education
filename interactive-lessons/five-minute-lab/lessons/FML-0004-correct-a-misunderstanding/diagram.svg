<path d="M75 147h92v70H75zM75 166h92M103 137v20m36-20v20"/><path d="M285 155h106v55H285zM298 174h80m-80 18h52"/>
<path d="M507 156h104v55H507zM522 175h75m-75 18h58"/><path d="M720 156h112v55H720zM735 175h82m-82 18h62"/>
