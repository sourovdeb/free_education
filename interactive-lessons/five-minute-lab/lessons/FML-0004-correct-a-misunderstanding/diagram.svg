<g fill="#111" font-family="system-ui,sans-serif" text-anchor="middle">
<text x="450" y="52" font-size="30" font-weight="700">FROM MISMATCH TO SHARED DETAIL</text>
<text x="120" y="100" font-size="21" font-weight="700">HEAR</text><text x="120" y="278" font-size="18">Thursday, 7:30</text>
<text x="340" y="100" font-size="21" font-weight="700">SPOT</text><text x="340" y="278" font-size="18">booking: Tuesday</text>
<text x="558" y="100" font-size="21" font-weight="700">CORRECT</text><text x="558" y="278" font-size="18">Tuesday, not Thursday</text>
<text x="778" y="100" font-size="21" font-weight="700">CONFIRM</text><text x="778" y="278" font-size="18">Tuesday, 7:30?</text>
<text x="450" y="345" font-size="22">Repair only the detail that conflicts with the evidence.</text>
</g></svg>