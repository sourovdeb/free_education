<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="A four-step path: hear Thursday at 7:30, spot that Thursday conflicts with the Tuesday booking, correct Tuesday not Thursday, then confirm Tuesday at 7:30.">
