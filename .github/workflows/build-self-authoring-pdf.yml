name: Build self-authoring PDF

on:
  push:
    branches: [main]
    paths:
      - self-authoring/Self_Authoring_Personal_Workbook.md
      - scripts/build_self_authoring_pdf.py
      - .github/workflows/build-self-authoring-pdf.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - run: python scripts/build_self_authoring_pdf.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add self-authoring/Self_Authoring_Personal_Workbook.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build self-authoring PDF [skip ci]"
          git push